/* What a teacher reaches for WHILE TEACHING, and nothing else.
 *
 * Your classes, the register, work to review and what the class is asking have
 * moved to the teacher dashboard on craxle.com, where they are now actually
 * built — with roll numbers, search, per-row editing, and attendance and fees
 * around them, none of which these tiles ever had. Two places to type a
 * register is one too many: the one you are not standing at goes stale, and a
 * teacher in front of thirty children should not be working out which screen
 * is the real one.
 *
 * Pulling things up stays. Material is here because reaching for a chapter
 * mid-lesson is teaching, and sources are here because "where did that come
 * from" is asked during the lesson, not afterwards.
 *
 * The pages themselves are untouched and still routable — a bookmark from last
 * term keeps working. Only the tiles come off the home screen, which is the
 * difference between moving a door and bricking up a room.
 */
var TEACHER_TILES = [
  { page:"materials", ic:"📎", name:"Study material",
    sub:"Chapters, slides and links — pull one up mid-lesson." },
  { page:"sources",  ic:"📚", name:"Where answers come from",
    sub:"Every source we teach from, with its licence." }
];

function tile(t){
  return '<button class="tile" data-go="' + t.page + '">' +
    '<span class="ic">' + t.ic + "</span>" +
    "<b>" + esc(t.name) + "</b><span>" + esc(t.sub) + "</span></button>";
}

/* Work, on whichever login is looking.
 *
 * The same assignment, two views, both filled from the server on the way in
 * rather than by anybody pressing publish. A teacher sets it from the board
 * and it is on the students' home screen; a student hands it in and it is in
 * the teacher's inbox. Nothing in between is a state somebody has to
 * remember to move it out of, because the state somebody forgets is the one
 * that loses a term's homework.
 */
function workBlock(){
  if(isTeacher()){
    var n = (ME.inbox || {}).total || 0;
    return '<div class="eyebrow">To review</div>' +
      '<button class="card" data-go="inbox" style="width:100%;text-align:left;' +
      'cursor:pointer;border-color:' + (n ? "var(--accent)" : "var(--line)") + '">' +
        '<span class="big">' + n + "</span> " +
        '<span class="muted">' +
          (n ? "piece" + (n === 1 ? "" : "s") + " of work waiting for you"
             : "nothing waiting — you are up to date") +
        "</span></button>";
  }
  var due = (ME.assignments || []);
  if(!due.length) return "";
  return '<div class="eyebrow">Your work</div>' +
    due.map(function(a){
      var state = a.reviewed ? "✓ marked"
                : a.done     ? "handed in"
                             : "to do";
      return '<button class="card" data-asg="' + a.id + '" ' +
        'style="width:100%;text-align:left;cursor:pointer;border-color:' +
        (a.done ? "var(--line)" : "var(--accent)") + '">' +
        "<b>" + esc(a.title) + "</b><br>" +
        '<span class="muted">' + esc(a.class_name) +
          (a.subject ? " · " + esc(a.subject) : "") +
          (a.due_date ? " · due " + esc(a.due_date) : "") +
          " · " + state + "</span></button>";
    }).join("");
}

function isTeacher(){
  return ME.role === "head" || ME.role === "teacher" || ME.role === "admin";
}

function money(paise, cur){
  var n = (paise || 0) / 100;
  return (cur === "INR" ? "\u20b9" : (cur || "") + " ") +
    n.toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0 });
}

/* What a learner needs to know about themselves that is not schoolwork.
   Attendance, what is owed, what to buy, and whatever the office has put
   up — one glance, because a student checking four screens to find out
   whether they are in trouble checks none of them. Nothing here is
   editable from this app by anybody: it is the school office's to change. */
function standingBlock(){
  var st = ME.standing;
  if(!st) return "";
  var h = "";

  var urgent = (st.notices || []).filter(function(n){ return n.urgent; });
  var rest   = (st.notices || []).filter(function(n){ return !n.urgent; });
  if(urgent.length){
    h += urgent.map(function(n){
      return '<div class="note bad"><b>' + esc(n.title) + "</b>" +
        (n.body ? "<br>" + esc(n.body) : "") + "</div>";
    }).join("");
  }

  var bits = [];
  if(st.attendance_pct !== null && st.attendance_pct !== undefined){
    bits.push('<div class="card" style="flex:1 1 11rem"><div class="muted">Attendance</div>' +
      '<span class="big">' + st.attendance_pct + "%</span>" +
      '<div class="muted">' + st.days_present + " of " + st.days_recorded +
      " days</div></div>");
  }
  if(st.owed > 0){
    bits.push('<div class="card" style="flex:1 1 11rem;border-color:var(--accent)">' +
      '<div class="muted">Still to pay</div>' +
      '<span class="big">' + money(st.owed, st.currency) + "</span>" +
      '<div class="muted">' + ((st.fees || []).filter(function(f){ return !f.settled; }).length) +
      " item(s)</div></div>");
  }
  if(bits.length){
    h += '<div class="eyebrow">You</div>' +
      '<div style="display:flex;gap:1rem;flex-wrap:wrap">' + bits.join("") + "</div>";
  }

  var owing = (st.fees || []).concat(st.to_buy || [])
    .filter(function(f){ return !f.settled; });
  if(owing.length){
    h += '<div class="card">' + owing.map(function(f){
      return "<div style=\"display:flex;gap:.6rem;justify-content:space-between;" +
        "padding:.3rem 0;flex-wrap:wrap\"><span>" + esc(f.title) +
        (f.kind === "buy" ? ' <span class="muted">· to buy</span>' : "") +
        (f.due_on ? ' <span class="muted">· by ' + esc(f.due_on) + "</span>" : "") +
        "</span><b>" + money(f.outstanding, f.currency) + "</b></div>";
    }).join("") + "</div>";
  }

  if(rest.length){
    h += '<div class="eyebrow">From the school office</div>' +
      rest.map(function(n){
        return '<div class="card"><b>' + esc(n.title) + "</b>" +
          (n.body ? '<div class="muted" style="margin-top:.35rem">' +
            esc(n.body) + "</div>" : "") + "</div>";
      }).join("");
  }
  return h;
}

function home(){
  var teacher = isTeacher();

  /* Where you are, on one line.
   *
   * This screen opened with three stacked cards before anything you could
   * teach with: work to review, an Institution card repeating the school
   * name already in the header, and the classrooms you teach. On a
   * television at the front of a room that is the whole screen — a teacher
   * had to scroll past a dashboard to reach the board.
   *
   * A board is not a dashboard. The context is one bar, the tools come
   * first, and everything else goes underneath. */
  var h = "";
  var where = [];
  if(ME.institution) where.push(esc(ME.institution.name));
  var mine = (ME.classes || []).filter(function(c){
    return teacher ? c.mine : true; });
  if(mine.length){
    where.push(mine.map(function(c){ return esc(c.name); }).join(" · "));
  }
  if(ROOM && ROOM.subject) where.push(esc(ROOM.subject));
  if(where.length){
    h += '<div class="note" style="margin:0 0 .8rem;display:flex;gap:.6rem;' +
         'align-items:center;flex-wrap:wrap">' +
         '<b>' + where.join('</b><span class="muted"> · </span><b>') + "</b>" +
         '<span class="grow"></span>' +
         '<span class="muted">Anything you keep goes here.</span>' +
         "</div>";
  }
  /* Remote stays on an open board even though it needs an account: it is
     where "use your phone" lives, and a teacher looking for it must find
     the answer rather than find nothing. */
  /* The practice surfaces are a pupil's, not a teacher's.
   *
   * A board at the front of a room is operated mid-sentence, and twelve
   * tiles on it is a menu somebody has to read while thirty people wait.
   * Four of them are places to PRACTISE — work through the course, type
   * queries, send packets, run reactions — and practising is what a student
   * does at their own desk, at their own pace. A teacher standing at the
   * board is teaching, and the tiles they reach for are the ones that put
   * something in front of the room.
   *
   * So staff get the teaching surfaces and students get everything. The
   * pages themselves stay routable: a bookmark from last term still opens,
   * and a teacher who wants to demonstrate the SQL board can still reach it.
   * Only the home screen is shortened, which is the difference between
   * moving a door and bricking up a room. */
  var PRACTICE_TILES = ["tracks", "net", "lab", "sqlboard"];
  /* An open board holding a subject code is not the same as an open board.
     It cannot read a register or a mark and it is still nobody's account,
     but it names one class and one subject, and bringing a document into
     THAT is exactly what the code is for. So the document tile is offered
     alongside the two that need no server. */
  var offer = OPEN
    ? TILES.filter(function(t){
        return OPEN_TOOLS.indexOf(t.page) >= 0 || t.page === "remote" ||
               (t.page === "bring" && boarded()); })
    : TILES.filter(function(t){
        return !(teacher && PRACTICE_TILES.indexOf(t.page) >= 0); });
  h += '<div class="eyebrow">Teaching</div><div class="tiles">' +
       offer.map(tile).join("") + "</div>";
  /* And what has already been kept for this subject, on the home screen
     rather than two taps into a tool. A lesson taught last week is opened
     again far more often than a new one is written, and the teacher wanting
     it is standing in front of the class, mid-sentence. */
  if(boarded()) h += '<div id="homeSaved"></div>';

  /* A student has one classroom, and that classroom has several subjects
     with a different teacher in front of each. Naming the room alone left a
     learner unable to answer the only two questions they ever ask about it:
     what am I taught here, and who do I ask. */
  var rooms = (ME.classes || []).filter(function(c){
    return teacher ? c.mine : true; });
  if(rooms.length){
    h += '<div class="eyebrow">' +
      (teacher ? "The classrooms you teach" : "Your classroom") + "</div>";
    h += rooms.map(function(c){
      var subs = c.subjects || [];
      return '<div class="card"><b>' + esc(c.name) + "</b>" +
        (c.school ? '<span class="muted"> · ' + esc(c.school) + "</span>" : "") +
        (subs.length
          ? '<div class="subjects">' + subs.map(function(x){
              return '<div class="subject' + (x.mine ? " mine" : "") + '">' +
                "<b>" + esc(x.name) + "</b>" +
                '<span class="muted">' +
                  (x.mine ? "you teach this"
                          : (x.teacher ? esc(x.teacher)
                                       : "no teacher yet")) +
                "</span></div>";
            }).join("") + "</div>"
          : '<div class="muted" style="margin-top:.4rem">' +
            (teacher
              ? "No subjects in this class yet. The school admin creates them."
              : "Your school has not listed this class's subjects yet.") +
            "</div>") +
        "</div>";
    }).join("");
  }
  if(OPEN){
    h += signInPrompt("keep what you teach on a class page");
  }
  if(!teacher && (ME.classes || []).length){
    h += '<div class="eyebrow">From your teacher</div><div class="tiles">' +
      tile({ page:"materials", ic:"📎", name:"Study material",
             sub:"Links, PDFs and slides your teacher has put here." }) +
      "</div>";
  }
  if(teacher){
    h += '<div class="eyebrow">Your class</div><div class="tiles">' +
         TEACHER_TILES.map(tile).join("") + "</div>";
  }
  /* Work waiting, and how a learner is doing, BELOW the tools rather than
     above them. A student still needs to see what is due — dropping it to
     shorten the screen would have removed the thing they open this for —
     but a teacher reaching for the board should not scroll past a dashboard
     to find it. */
  h += standingBlock() + workBlock();

  h += '<div class="eyebrow">This app</div>' +
       '<div class="note">' +
       "<b>Craxlearn is the teaching half of Craxle.</b> " +
       (ME.message ? esc(ME.message) + " " : "") +
       "What your learners search and ask is stored inside your institution " +
       "and is never used to answer anybody else's question. " +
       '<a href="/api/craxlearn/sources">Every source we teach from</a> is ' +
       "open, and listed with its licence." +
       "</div>";
  main().innerHTML = h;
  if(boarded()) homeSaved();
}

/* The saved explanations, on the home screen of a board that knows its
   subject. Not awaited by home(): the tiles must be on the screen the
   instant the board opens, and a list of last term's lessons arriving a
   moment later is fine. It writes into a box home() already put there, so a
   slow answer landing after somebody has moved on writes into nothing
   rather than over whatever is now on the screen. */
async function homeSaved(){
  var host = el("homeSaved");
  if(!host) return;
  var d;
  try{
    d = await window.bapi.get("/api/craxlearn/board/materials" +
      "?class_id=" + (ROOM.class_id || 0) +
      "&subject=" + encodeURIComponent(ROOM.subject || ""));
  }catch(e){ return; }
  var mats = (d.materials || []).slice(0, 6);
  host = el("homeSaved");
  if(!host) return;
  if(!mats.length){
    host.innerHTML = '<div class="eyebrow">Saved on this subject</div>' +
      '<div class="muted">Nothing kept here yet. Teach something, or bring ' +
      "in a document, and it will be on this list.</div>";
    return;
  }
  host.innerHTML = '<div class="eyebrow">Saved on this subject</div>' +
    mats.map(function(x){
      var what = x.kind === "lesson" ? "a lesson"
               : x.kind === "link"   ? "a link"
                                     : (x.file_name || "a document");
      return '<div class="card" style="display:flex;gap:.6rem;' +
        'align-items:center;flex-wrap:wrap">' +
        '<div style="flex:1 1 14rem"><b>' + esc(x.title) + "</b>" +
        '<div class="muted">' + esc(what) +
        (x.at ? " · " + esc(String(x.at).slice(0, 10)) : "") + "</div></div>" +
        '<button class="btn" data-homeput="' + x.id + '">Put it up</button>' +
        "</div>";
    }).join("");
  Array.prototype.forEach.call(
    host.querySelectorAll("[data-homeput]"), function(b){
      b.onclick = function(){ go("bring", { put: b.dataset.homeput }); };
    });
}

/* ---------- a surface to write on ----------
 *
 * The thing a smart board is for. Everything else here is the platform
 * teaching; this is the teacher teaching, and a classroom display without
 * somewhere to write by hand is a television.
 *
 * Pointer events rather than mouse or touch, because a board is used with a
 * finger, a stylus and sometimes a mouse in the same lesson, and three
 * separate handlers is three chances for one of them to be the broken one.
 * Coalesced events are read where the browser offers them: a stylus reports
 * far faster than the screen repaints, and dropping those samples is what
 * makes handwriting look like a polygon.
 */
var PENS = [
  { name:"White", colour:"#e8eef6" }, { name:"Amber", colour:"#ff9933" },
  { name:"Green", colour:"#3fae6a" }, { name:"Red", colour:"#e05a5a" },
  { name:"Blue",  colour:"#5aa9e0" }
];

/* The board has no edges.
 *
 * It used to be a fixed rectangle that fitted itself into the pane, on the
 * reasoning that a surface which stretched would turn a circle into an
 * ellipse and nothing would ever be out of reach. Both of those are true and
 * neither was the problem. The problem is that a lesson is longer than a
 * screen. A teacher working through a derivation filled the board, and then
 * had to rub out the beginning of the working to write the end of it — which
 * is the one moment a child looks up and needs to see the beginning.
 *
 * So the surface is now a plane you move over. Strokes are stored in WORLD
 * coordinates with no bounds at all, and what is on the screen is a window
 * onto that plane: an offset and a scale. Nothing stretches, because zoom is
 * uniform; nothing is out of reach, because you can always get back — Fit
 * puts every mark you have made on the screen at once, however far you have
 * wandered.
 *
 * The cost of an endless surface is not knowing where you are. Two things
 * answer that and both are deliberate: a grid that scales with the zoom, so
 * panning has something to move against instead of looking like a board that
 * has stopped responding, and Fit, one press away, always.
 */
var BOARD_UNIT = 1600;   // the width the OLD fixed board had; now just a scale

/* What is on the board outlives the element it is drawn on. Splitting the
   screen rebuilds every space, and a teacher who added a second space
   halfway through an explanation should not come back to a blank board —
   nor to a different part of the canvas than the one they were looking at,
   so the window travels with the ink. */
var BOARD_INK = { strokes: [], undone: [], view: null };

/* Straight things, drawn as strokes.
 *
 * A shape here is not a new kind of object: it is a stroke whose points
 * happen to lie on a line, a box or a circle. That is the whole design.
 * Undo, redo, the export, the save to a class and the redraw at any size all
 * work on strokes and none of them need to know these exist — a shape that
 * was its own type would have needed every one of them taught about it, and
 * one of them would have been missed.
 *
 * Declared out here rather than inside write(), because write() names it in
 * the markup it builds on its first line. `var` inside the function hoisted
 * the NAME and not the value, so the toolbar threw before it was drawn and
 * the writing space came up empty. It parsed, so nothing caught it.
 */
var SHAPES = [
  { k: "line",  ic: "╱", name: "Straight line" },
  { k: "arrow", ic: "→", name: "Arrow" },
  { k: "rect",  ic: "▭", name: "Rectangle" },
  { k: "oval",  ic: "◯", name: "Circle" }
];

function shapePoints(kind, a, b){
  var x0 = a[0], y0 = a[1], x1 = b[0], y1 = b[1], out = [], i;
  function P(x, y){ return [x, y, 0.5]; }
  if(kind === "line"){ return [P(x0, y0), P(x1, y1)]; }
  if(kind === "arrow"){
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    var head = Math.min(28, len * 0.28);      /* never longer than the shaft */
    var lx = x1 - ux * head, ly = y1 - uy * head;
    var px = -uy * head * 0.45, py = ux * head * 0.45;
    return [P(x0, y0), P(x1, y1),
            P(lx + px, ly + py), P(x1, y1),
            P(lx - px, ly - py), P(x1, y1)];
  }
  if(kind === "rect"){
    return [P(x0, y0), P(x1, y0), P(x1, y1), P(x0, y1), P(x0, y0)];
  }
  /* An ellipse in the dragged box, so a circle is a drag held square. */
  var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  var rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
  for(i = 0; i <= 48; i++){
    var t = (i / 48) * Math.PI * 2;
    out.push(P(cx + Math.cos(t) * rx, cy + Math.sin(t) * ry));
  }
  return out;
}

function write(){
  var host = main();
  /* The space stops scrolling and becomes a column: surface, then toolbar. */
  host.classList.add("noscroll");
  host.innerHTML =
    '<div class="wboard">' +
      '<div class="wsurf" id="wSurf">' +
        '<canvas id="wCanvas"></canvas>' +
        '<div class="whint" id="wHint">' +
          "Write with a finger, a stylus or a mouse. Two fingers, or the " +
          "space bar, to move around — the board does not end." +
        "</div>" +
        '<div class="wwhere" id="wWhere"></div>' +
      "</div>" +
      /* The bar sits UNDER the surface, one rectangle, always there. A
         teacher at a board reaches down, not up: the top of a wall-mounted
         screen is above head height, and a control a person has to stretch
         for is a control they stop using by the second week. */
      '<div id="wTools" class="wtools">' +
        PENS.map(function(p, i){
          return '<button class="iconbtn" data-pen="' + i + '" title="' + p.name + '" ' +
            'style="background:' + p.colour + ';border-color:' + p.colour +
            ';width:2rem"></button>';
        }).join("") +
        '<button class="iconbtn" data-pen="erase" title="Rub out">⌫</button>' +
        '<span class="sep"></span>' +
        SHAPES.map(function(sh){
          return '<button class="iconbtn" data-shape="' + sh.k +
            '" title="' + sh.name + '">' + sh.ic + "</button>"; }).join("") +
        '<input type="range" id="wSize" min="2" max="28" value="5" ' +
          'title="Thickness" style="width:5rem">' +
        '<span class="sep"></span>' +
        /* Moving around is a TOOL, not only a gesture. A stylus has one
           contact point and a wall-mounted screen often has no keyboard, so
           two-finger pan and the space bar are both unavailable exactly
           where this matters most. */
        '<button class="iconbtn" id="wHand" title="Move around the board">✋</button>' +
        '<button class="iconbtn" id="wOut" title="Zoom out">−</button>' +
        '<button class="iconbtn" id="wIn" title="Zoom in">+</button>' +
        '<button class="btn ghost" id="wFit" title="Bring everything on ' +
          'the board into view">Fit</button>' +
        '<span class="sep"></span>' +
        '<button class="iconbtn" id="wUndo" title="Undo">↶</button>' +
        '<button class="iconbtn" id="wRedo" title="Redo">↷</button>' +
        '<span class="grow"></span>' +
        '<button class="btn ghost" id="wAsk" title="Ask Axle to teach this">' +
          "⚡ Ask Axle</button>" +
        '<button class="btn ghost" id="wClear">Clear</button>' +
        '<button class="btn" id="wKeep" title="Keep this on the class page">' +
          "Save to the class</button>" +
        '<button class="btn ghost" id="wShot" title="Download it as a picture">' +
          "Download</button>" +
      "</div>" +
    "</div>";
  /* No sign-in card in here.
     The pane does not scroll — it cannot, or writing on it would scroll the
     page — so anything below the board competes with the board for height,
     and on a short pane the card won that fight and squeezed the surface to
     nothing. The prompt is on the home screen, where there is room for it,
     and Save to the class says exactly the same thing at the exact moment
     it matters. */

  var shape = "";          /* "" is the pen */

  /* Found INSIDE this pane, never by id alone.
     `el()` is getElementById, and the board can show the writing space in
     two spaces at once — both then carried a #wCanvas, both closures looked
     up the FIRST one, and every stroke was recorded twice while the second
     board sat dead. Ids are unique per pane, not per document. */
  /* Named wq, not w: `redraw` already uses `w` for the canvas width,
     and a helper shadowed by a number is a TypeError at the moment
     somebody draws. */
  function wq(id){ return host.querySelector("#" + id); }

  var cv = wq("wCanvas"), surf = wq("wSurf");
  var ctx = cv.getContext("2d");
  var pen = PENS[0].colour, size = 5, erasing = false;

  /* What is on the board, kept as points rather than pixels.
     A stroke is { c: colour, e: true when it rubs out, w: thickness,
     p: [[x, y, pressure], ...] } with x and y in board units. Because it is
     points, the board can be drawn again at any size — which is what makes
     dragging a pane bigger keep the writing instead of cropping it, and what
     makes the exported picture sharp even when the pane was a quarter of a
     phone screen. */
  var strokes = BOARD_INK.strokes, undone = BOARD_INK.undone, live = null;

  /* The window onto the plane.
   *
   * `k` is device pixels per world unit and `x`/`y` are the world point
   * sitting at the top-left of the canvas. Everything else — drawing, the
   * grid, hit testing, the export — goes through these three numbers, which
   * is the whole reason an endless surface is not a rewrite of the board:
   * `world → screen` is one function and it used to be a constant.
   *
   * Held on BOARD_INK so that splitting the screen brings a teacher back to
   * the part of the board they were looking at, not to the origin. */
  var DPR = 1;
  var VIEW = BOARD_INK.view;

  function measure(){
    var r = surf.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(r.width * DPR));
    var h = Math.max(1, Math.round(r.height * DPR));
    if(cv.width !== w) cv.width = w;
    if(cv.height !== h) cv.height = h;
    /* First time in: one screen-width is one board-width, and the origin is
       the top-left of what you can see. So a teacher who never pans has
       exactly the board they had before, and never learns any of this. */
    if(!VIEW){
      VIEW = { k: w / BOARD_UNIT, x: 0, y: 0 };
      BOARD_INK.view = VIEW;
    }
  }

  function sx(wx){ return (wx - VIEW.x) * VIEW.k; }
  function sy(wy){ return (wy - VIEW.y) * VIEW.k; }

  /* Zoom about a point on the screen, so pinching and the +/− buttons both
     keep whatever is under the fingers under the fingers. */
  function zoomAt(px, py, factor){
    var k0 = VIEW.k;
    var k1 = Math.max(k0 * 0.02, Math.min(k0 * 50, VIEW.k * factor));
    /* Bounded against the FIRST scale rather than absolutely: a board on a
       phone and a board on a wall start at very different k, and a fixed
       limit would be wrong on one of them. */
    var lo = (cv.width / BOARD_UNIT) / 40, hi = (cv.width / BOARD_UNIT) * 40;
    k1 = Math.max(lo, Math.min(hi, k1));
    VIEW.x += px / VIEW.k - px / k1;
    VIEW.y += py / VIEW.k - py / k1;
    VIEW.k = k1;
  }

  function penWidth(s, pressure){
    return Math.max(0.5, (s.e ? s.w * 3 : s.w) * VIEW.k
                         * (0.6 + pressure * 0.8));
  }

  /* One stroke, in whatever size the board currently is. Segment by segment
     so a stylus's pressure still varies along it. */
  function drawStroke(c, s, scale, ox, oy){
    c.globalCompositeOperation = s.e ? "destination-out" : "source-over";
    c.strokeStyle = s.c;
    c.lineCap = "round";
    c.lineJoin = "round";
    var pts = s.p;
    for(var i = 1; i < pts.length; i++){
      c.lineWidth = Math.max(0.5, (s.e ? s.w * 3 : s.w) * scale
                                  * (0.6 + pts[i][2] * 0.8));
      c.beginPath();
      c.moveTo(ox + pts[i - 1][0] * scale, oy + pts[i - 1][1] * scale);
      c.lineTo(ox + pts[i][0] * scale, oy + pts[i][1] * scale);
      c.stroke();
    }
  }

  /* The whole board, onto any context. The screen and the exported picture
     go through the same function at different sizes, so what is saved is
     exactly what is shown. */
  var BOARD_BG = "#131c28";

  /* The grid exists so that panning an empty part of the board looks like
     moving rather than like a board that has stopped responding. It steps by
     powers of ten in WORLD units, so zooming out does not turn it into a
     solid block — the spacing on screen always stays in the same range. */
  function paintGrid(c, w, h){
    /* Both loops below multiply until the spacing looks right, and a scale
       of zero — or NaN, or infinity — makes that a loop with no way out. It
       is not hypothetical: Fit computes a scale from the size of what is on
       the board, and a pane dragged narrower than the margin, or a single
       dot with no width, produces exactly those numbers. The renderer hangs
       and the board is gone mid-lesson, so the guard is here rather than
       only at the two call sites that can currently do it. */
    if(!(VIEW.k > 0) || !isFinite(VIEW.k)) return;
    var step = 100, n = 0;                // world units
    while(step * VIEW.k < 34 && n++ < 40) step *= 5;
    n = 0;
    while(step * VIEW.k > 220 && n++ < 40) step /= 5;
    if(!(step > 0) || !isFinite(step)) return;
    var x0 = Math.floor(VIEW.x / step) * step;
    var y0 = Math.floor(VIEW.y / step) * step;
    c.save();
    c.lineWidth = 1;
    for(var wx = x0; sx(wx) <= w; wx += step){
      /* Every fifth line a little stronger, which is what makes a grid
         readable as distance rather than as texture. */
      var major = Math.abs(Math.round(wx / step) % 5) === 0;
      c.strokeStyle = major ? "rgba(255,255,255,.075)"
                            : "rgba(255,255,255,.032)";
      c.beginPath();
      c.moveTo(Math.round(sx(wx)) + 0.5, 0);
      c.lineTo(Math.round(sx(wx)) + 0.5, h);
      c.stroke();
    }
    for(var wy = y0; sy(wy) <= h; wy += step){
      var majy = Math.abs(Math.round(wy / step) % 5) === 0;
      c.strokeStyle = majy ? "rgba(255,255,255,.075)"
                           : "rgba(255,255,255,.032)";
      c.beginPath();
      c.moveTo(0, Math.round(sy(wy)) + 0.5);
      c.lineTo(w, Math.round(sy(wy)) + 0.5);
      c.stroke();
    }
    c.restore();
  }

  /* Ink goes on its own layer, and that is not a refinement.
     Rubbing out is `destination-out`, which removes whatever is underneath
     it — on a single layer that is the background and the grid as well, so
     the eraser would cut holes through the board. Strokes are drawn to their
     own transparent canvas and composited on top, so the eraser can only
     ever reach ink. */
  var inkc = document.createElement("canvas");
  var ink = inkc.getContext("2d");

  function paintInk(c, list, scale, ox, oy, w, h){
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, w, h);
    for(var i = 0; i < list.length; i++) drawStroke(c, list[i], scale, ox, oy);
    c.globalCompositeOperation = "source-over";
  }

  function redraw(){
    measure();
    var w = cv.width, h = cv.height;
    if(inkc.width !== w) inkc.width = w;
    if(inkc.height !== h) inkc.height = h;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = BOARD_BG;
    ctx.fillRect(0, 0, w, h);
    paintGrid(ctx, w, h);
    paintInk(ink, strokes.concat(live ? [live] : []),
             VIEW.k, -VIEW.x * VIEW.k, -VIEW.y * VIEW.k, w, h);
    ctx.drawImage(inkc, 0, 0);
    var hint = wq("wHint");
    if(hint) hint.hidden = strokes.length > 0 || !!live;
    var where = wq("wWhere");
    if(where){
      where.textContent = Math.round(VIEW.k / (w / BOARD_UNIT) * 100) + "%"
        + (strokes.length ? "  ·  " + strokes.length + " mark"
                            + (strokes.length === 1 ? "" : "s") : "");
    }
  }

  /* Everything on the board, on the screen at once. The way back from
     anywhere, which is what makes a surface with no edges safe to give
     somebody mid-lesson. */
  function bounds(){
    var b = null;
    strokes.forEach(function(s){
      s.p.forEach(function(p){
        if(!b) b = [p[0], p[1], p[0], p[1]];
        else{
          if(p[0] < b[0]) b[0] = p[0];
          if(p[1] < b[1]) b[1] = p[1];
          if(p[0] > b[2]) b[2] = p[0];
          if(p[1] > b[3]) b[3] = p[1];
        }
      });
    });
    return b;
  }

  function fit(){
    measure();
    var b = bounds();
    if(!b){                     /* nothing written: back to where it started */
      VIEW.k = cv.width / BOARD_UNIT;
      VIEW.x = 0;
      VIEW.y = 0;
      redraw();
      return;
    }
    var pad = 40;
    var bw = Math.max(1, b[2] - b[0]), bh = Math.max(1, b[3] - b[1]);
    var base = cv.width / BOARD_UNIT;
    var k = Math.min(Math.max(1, cv.width - pad * 2) / bw,
                     Math.max(1, cv.height - pad * 2) / bh);
    k = Math.min(k, base * 4);            // do not magnify a single dot
    /* A pane narrower than the margin, or a mark with no width, produces
       zero or infinity here — and every one of those reaches the grid, which
       loops until the spacing looks right and would never stop. */
    if(!(k > 0) || !isFinite(k)) k = base;
    VIEW.k = k;
    VIEW.x = b[0] - (cv.width / VIEW.k - bw) / 2;
    VIEW.y = b[1] - (cv.height / VIEW.k - bh) / 2;
    redraw();
  }

  /* The pane is dragged, the board is rotated, the browser zooms: all of
     them arrive here, and all of them are answered by drawing again rather
     than by stretching a bitmap. */
  if(window.ResizeObserver){
    new ResizeObserver(function(){ redraw(); }).observe(surf);
  }else{
    window.addEventListener("resize", redraw);
  }
  redraw();

  /* Screen position to world units. NOT clamped any more — that clamp was
     the edge of the board, and there is no edge. A stroke that runs off the
     right of the screen is simply a stroke to the right of the screen, and
     Fit brings it back. */
  function at(e){
    var r = cv.getBoundingClientRect();
    var p = (e.pressure && e.pointerType === "pen") ? e.pressure : 0.5;
    return [VIEW.x + (e.clientX - r.left) * DPR / VIEW.k,
            VIEW.y + (e.clientY - r.top) * DPR / VIEW.k, p];
  }

  /* Canvas pixels, for zooming about a point and for panning. */
  function px(e){
    var r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * DPR, (e.clientY - r.top) * DPR];
  }

  /* Drawing paints only the new segment — redrawing every stroke on every
     pointer sample is what makes a board feel like it is lagging behind
     the pen. */
  function extend(pt){
    var pts = live.p;
    pts.push(pt);
    if(pts.length < 2) return;
    var a = pts[pts.length - 2], b = pt;
    /* Onto the ink layer, then one composite. Redrawing every stroke on
       every pointer sample is what makes a board feel like it is lagging
       behind the pen; compositing a whole canvas is a single blit. */
    ink.globalCompositeOperation = live.e ? "destination-out" : "source-over";
    ink.strokeStyle = live.c;
    ink.lineCap = "round";
    ink.lineJoin = "round";
    ink.lineWidth = penWidth(live, b[2]);
    ink.beginPath();
    ink.moveTo(sx(a[0]), sy(a[1]));
    ink.lineTo(sx(b[0]), sy(b[1]));
    ink.stroke();
    ink.globalCompositeOperation = "source-over";
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = BOARD_BG;
    ctx.fillRect(0, 0, cv.width, cv.height);
    paintGrid(ctx, cv.width, cv.height);
    ctx.drawImage(inkc, 0, 0);
  }

  /* Moving over the plane. Three ways in, because the three devices this
     runs on each have only one of them: a mouse has a wheel, a trackpad and
     a touchscreen have two fingers, and a wall-mounted board with a stylus
     has neither — which is why ✋ is a tool in the bar and not only a
     gesture. */
  var handing = false;          // the ✋ tool is held down
  var panning = null;           // an active drag: [px, py]
  var touches = {};             // live pointer ids, for the two-finger case
  var pinch = null;

  cv.addEventListener("pointerdown", function(e){
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    touches[e.pointerId] = px(e);
    var ids = Object.keys(touches);

    /* Two fingers down: that is the room saying "move", not "write". The
       mark the first finger started is taken back, because a teacher who
       meant to pan should not be left with a comma on the board. */
    if(ids.length === 2){
      if(live){ live = null; redraw(); }
      var a = touches[ids[0]], b = touches[ids[1]];
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]),
                c: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] };
      panning = null;
      return;
    }

    if(handing || e.button === 1 || SPACE){
      panning = px(e);
      return;
    }
    var hint = wq("wHint");
    if(hint) hint.hidden = true;
    live = { c: pen, e: erasing, w: size, p: [] };
    var p0 = at(e);
    live.p.push(p0);
    if(shape){ live.from = p0; return; }    /* a shape grows from here */
    extend([p0[0] + 0.01, p0[1], p0[2]]);   // a dot is a mark too
  });

  cv.addEventListener("pointermove", function(e){
    if(touches[e.pointerId]) touches[e.pointerId] = px(e);

    if(pinch){
      var ids = Object.keys(touches);
      if(ids.length < 2) return;
      var a = touches[ids[0]], b = touches[ids[1]];
      var d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
      var c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      /* Pan and zoom in one gesture, which is how every map behaves and
         therefore how everybody already expects this to behave. */
      VIEW.x -= (c[0] - pinch.c[0]) / VIEW.k;
      VIEW.y -= (c[1] - pinch.c[1]) / VIEW.k;
      zoomAt(c[0], c[1], d / pinch.d);
      pinch = { d: d, c: c };
      redraw();
      return;
    }

    if(panning){
      var at2 = px(e);
      VIEW.x -= (at2[0] - panning[0]) / VIEW.k;
      VIEW.y -= (at2[1] - panning[1]) / VIEW.k;
      panning = at2;
      redraw();
      return;
    }

    if(!live) return;
    if(live.from){
      /* Redrawn from the two corners every time, so dragging back and forth
         resizes it instead of leaving a trail behind. */
      live.p = shapePoints(shape, live.from, at(e));
      redraw();
      return;
    }
    /* A stylus reports far faster than the screen repaints. Reading the
       samples the browser held back is the difference between handwriting
       and a polygon. */
    /* `|| [e]` is not enough: getCoalescedEvents returns an EMPTY ARRAY for
       an event the browser did not itself generate, and an empty array is
       truthy. The fallback never ran, the loop had nothing to iterate, and
       the stroke came out as the single dot from pointerdown. */
    var held = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    var pts = (held && held.length) ? held : [e];
    for(var i = 0; i < pts.length; i++) extend(at(pts[i]));
  });

  ["pointerup", "pointercancel", "pointerleave"].forEach(function(ev){
    cv.addEventListener(ev, function(e){
      delete touches[e.pointerId];
      if(Object.keys(touches).length < 2) pinch = null;
      panning = null;
      if(!live) return;
      if(live.p.length > 1){
        delete live.from;
        strokes.push(live);
        undone.length = 0;    // a new mark ends the redo trail
      }
      live = null;
      /* The mark count and the hint live on the same repaint, so finishing a
         stroke has to trigger one — otherwise the board says "0 marks" with
         a lesson's working on it. */
      redraw();
    });
  });

  /* A wheel SCROLLS the board and ctrl-wheel zooms it, which is the pairing
     every drawing tool and every map uses — and the one a trackpad's
     pinch already sends as ctrl-wheel without being asked. */
  cv.addEventListener("wheel", function(e){
    e.preventDefault();
    var p = px(e);
    if(e.ctrlKey || e.metaKey){
      zoomAt(p[0], p[1], Math.pow(0.999, e.deltaY));
    }else{
      VIEW.x += e.deltaX * DPR / VIEW.k;
      VIEW.y += e.deltaY * DPR / VIEW.k;
    }
    redraw();
  }, { passive: false });

  /* Space to grab the board, the way every drawing tool has done for thirty
     years. Only while the writing space is on screen: a listener left on the
     document would eat the space bar in every text box on the board. */
  var SPACE = false;
  function spaceDown(e){
    if(e.code !== "Space" || e.repeat) return;
    var t = e.target;
    if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if(!document.getElementById("wCanvas")){
      document.removeEventListener("keydown", spaceDown);
      document.removeEventListener("keyup", spaceUp);
      return;
    }
    e.preventDefault();
    SPACE = true;
    cv.style.cursor = "grab";
  }
  function spaceUp(e){
    if(e.code !== "Space") return;
    SPACE = false;
    cv.style.cursor = "";
  }
  document.addEventListener("keydown", spaceDown);
  document.addEventListener("keyup", spaceUp);

  wq("wHand").onclick = function(){
    handing = !handing;
    wq("wHand").classList.toggle("on", handing);
    cv.style.cursor = handing ? "grab" : "";
  };
  wq("wIn").onclick = function(){
    zoomAt(cv.width / 2, cv.height / 2, 1.25); redraw(); };
  wq("wOut").onclick = function(){
    zoomAt(cv.width / 2, cv.height / 2, 1 / 1.25); redraw(); };
  wq("wFit").onclick = fit;

  function markTool(){
    wq("wTools").querySelectorAll("[data-shape]").forEach(function(q){
      q.classList.toggle("on", q.dataset.shape === shape);
    });
  }
  wq("wTools").querySelectorAll("[data-shape]").forEach(function(b){
    b.onclick = function(){
      /* Tapping the tool you are holding puts the pen back, so there is
         always a way out without hunting for a pen button. */
      shape = (shape === b.dataset.shape) ? "" : b.dataset.shape;
      if(shape) erasing = false;
      markTool();
    };
  });
  wq("wTools").querySelectorAll("[data-pen]").forEach(function(b){
    b.onclick = function(){
      shape = ""; markTool();
      if(b.dataset.pen === "erase"){ erasing = true; return; }
      erasing = false;
      pen = PENS[+b.dataset.pen].colour;
    };
  });
  wq("wSize").oninput = function(){ size = +wq("wSize").value; };
  /* Undo, because Clear on its own is a lesson's worth of working thrown
     away by one mis-tap, and every board a teacher has used has this. */
  wq("wUndo").onclick = function(){
    if(!strokes.length) return;
    undone.push(strokes.pop());
    redraw();
  };
  wq("wRedo").onclick = function(){
    if(!undone.length) return;
    strokes.push(undone.pop());
    redraw();
  };
  wq("wClear").onclick = function(){
    if(strokes.length && !confirm("Rub out everything on the board?")) return;
    /* Clear is undoable: it is one tap away from a lesson's working. */
    undone.unshift.apply(undone, strokes.slice().reverse());
    strokes.length = 0;
    redraw();
  };
  /* A picture of the board — the working, not the browser chrome around it.
     Drawn from the points at a fixed size rather than copied off the screen,
     so what a teacher sends to a class is the same sharp picture whether
     they wrote it full screen or in a corner of a four-way split. Solid
     background first, or a transparent PNG opens as black on black in half
     the apps it will be sent to. */
  /* The writing space has no toast — the board has no global one at all —
     so it says things on the hint line under the canvas, which is where a
     person writing on it is already looking. */
  function wSay(text){
    var hint = wq("wHint");
    if(hint){ hint.textContent = text; hint.style.display = ""; }
  }

  /* A picture of the WORKING, not of the window it was seen through.
   *
   * On a fixed board these were the same thing. On a plane they are not:
   * saving what is on screen would save whatever the teacher happened to
   * have panned to, and lose the half of the derivation that is off to the
   * left. So the export is taken from the bounding box of every mark, at a
   * fixed print scale, with a margin — and it is drawn from the points
   * rather than copied off the screen, so it is sharp whether the board was
   * full screen or a corner of a four-way split.
   *
   * Capped, because an endless board can hold an endless amount and a
   * hundred-megapixel PNG is a save that silently fails on a school tablet.
   */
  var SHOT_MAX = 4200;             // pixels on the longer side
  function shotCanvas(){
    var b = bounds() || [0, 0, BOARD_UNIT, BOARD_UNIT * 0.56];
    var pad = 40;
    var bw = Math.max(1, b[2] - b[0]) + pad * 2;
    var bh = Math.max(1, b[3] - b[1]) + pad * 2;
    var scale = Math.min(2, SHOT_MAX / Math.max(bw, bh));
    var out = document.createElement("canvas");
    out.width = Math.max(1, Math.round(bw * scale));
    out.height = Math.max(1, Math.round(bh * scale));
    var c = out.getContext("2d");
    c.fillStyle = BOARD_BG;
    c.fillRect(0, 0, out.width, out.height);
    /* Ink on its own layer here too, for the same reason as on screen: an
       eraser stroke composited straight onto the background would punch a
       transparent hole through the saved picture. */
    var lay = document.createElement("canvas");
    lay.width = out.width;
    lay.height = out.height;
    paintInk(lay.getContext("2d"), strokes, scale,
             (-b[0] + pad) * scale, (-b[1] + pad) * scale,
             out.width, out.height);
    c.drawImage(lay, 0, 0);
    return out;
  }

  function boardPng(cb){
    var out = shotCanvas();
    if(out.toBlob) out.toBlob(cb, "image/png");
    else cb(null);
  }

  wq("wShot").onclick = function(){
    var a = document.createElement("a");
    a.href = shotCanvas().toDataURL("image/png");
    a.download = "craxlearn-" + new Date().toISOString().slice(0, 16)
                   .replace(/[:T]/g, "-") + ".png";
    a.click();
  };

  /* Ask Axle without leaving the board. The teacher is mid-sentence with a
     pen in their hand; making them go home, find a tile and come back is
     how a tool stops being used during a lesson and starts being used
     during the free period, which is not what it is for. */
  wq("wAsk").onclick = function(){ go("board"); };

  /* Keep what was written by hand on the class's subject page.
   *
   * The Save button downloaded a PNG, which is a file in somebody's Downloads
   * folder and not a thing the class can find. The lesson Axle teaches files
   * itself under the class and subject it was taught in; a page of working
   * written by hand on the same board did not, and a worked example on a
   * whiteboard is exactly the thing a child wants again the night before an
   * exam.
   *
   * Where it goes is decided the same way the AI lesson decides: the room the
   * board is open on, or the one subject this teacher holds in the class. If
   * that is genuinely ambiguous it asks rather than guessing, because filing
   * a page of algebra under History is worse than one more question. */
  var keep = wq("wKeep");
  if(keep) keep.onclick = async function(){
    /* A board holding a subject code MAY keep this — that is the whole of
       what the code buys, and the reason a teacher typed it. Only a board
       with no code at all has nowhere to put a page. */
    if(OPEN && !boarded()){
      wSay("Enter your subject code to keep this on the class page.");
      return;
    }
    var cid = 0, subject = "";
    if(ROOM && ROOM.class_id){ cid = ROOM.class_id; subject = ROOM.subject || ""; }
    if(!cid){
      var mine = (ME.classes || []).filter(function(c){ return c.mine !== false; });
      if(mine.length === 1){
        cid = mine[0].id;
        var subs = (mine[0].subjects || []).filter(function(x){ return x.mine; });
        if(subs.length === 1) subject = subs[0].name || "";
      }
    }
    if(!cid){
      wSay("Open a classroom first — enter the class or subject code.");
      return;
    }
    if(!subject){
      subject = (prompt("Which subject does this belong to?", "") || "").trim();
      if(!subject) return;
    }
    var title = (prompt("What is this page?",
                        "Board notes — " + new Date().toLocaleDateString()) || "").trim();
    if(!title) return;

    keep.disabled = true;
    var was = keep.textContent;
    keep.textContent = "Saving…";
    boardPng(async function(blob){
      if(!blob){
        keep.disabled = false; keep.textContent = was;
        wSay("This browser cannot turn the board into a picture.");
        return;
      }
      try{
        var fd = new FormData();
        fd.append("file", blob, "board.png");
        fd.append("title", title);
        fd.append("subject", subject);
        fd.append("class_id", String(cid));
        /* One route for a board holding a code, another for a signed-in
           teacher. The board route takes the class and the subject from the
           token and ignores what is in the form, which is why a code can be
           trusted with it. */
        await window.bapi.send(
          boarded() ? "/api/craxlearn/board/file"
                    : "/api/teacher/class/" + cid + "/material/file", fd);
        wSay("Kept on " + subject + ". Your class can open it any time.");
      }catch(e){
        wSay(e.message || "It could not be saved.");
      }finally{
        keep.disabled = false; keep.textContent = was;
      }
    });
  };
}

/* Mount a 3D scene, and SAY SO when it cannot be mounted.
 *
 * three.js comes from a CDN. On a school network that blocks it — or a
 * board with no internet at that moment — the viewer silently never
 * appears, and an empty box reads as "this app is broken" rather than
 * "this board cannot reach the library". One is a support call about us;
 * the other is a five-minute conversation with the IT technician.
 */
async function show3D(host, scene){
  host.innerHTML = '<div class="muted" style="padding:1rem">Drawing…</div>';
  if(!window.Three3D || !Three3D.mount){
    host.innerHTML = '<div class="note bad">The 3D viewer could not load. ' +
      "It comes from a public CDN — this board may be offline or the " +
      "network may be blocking it. Everything else here still works.</div>";
    return false;
  }
  try{
    host.innerHTML = "";
    await Three3D.mount(host, scene);
    /* mount() can resolve without having drawn anything if the library
       itself failed to arrive. A canvas is the proof it worked. */
    if(!host.querySelector("canvas")) throw new Error("nothing was drawn");
    return true;
  }catch(e){
    host.innerHTML = '<div class="note bad">The 3D viewer could not draw ' +
      "this. It comes from a public CDN — this board may be offline or the " +
      "network may be blocking it.</div>";
    return false;
  }
}

/* The subjects a teacher may file under in one class. Not a text box: a
   class has subjects and each subject has a teacher, and typing the name
   lets the same subject be filed as "Biology", "biology" and "Bio" in one
   term — which nobody notices until a class cannot find last week's work.
   The server checks this again; this is so the screen offers the truth. */
function subjectsFor(cid){
  var c = (ME.classes || []).filter(function(x){ return x.id === +cid; })[0];
  return (c && c.my_subjects) || [];
}
function subjectPicker(id, cid){
  var subs = subjectsFor(cid);
  if(!subs.length){
    return '<span class="muted" id="' + id + 'Note">' +
      "no subject here yet</span>" +
      '<input id="' + id + '" type="hidden" value="">';
  }
  return '<select id="' + id + '">' + subs.map(function(x){
    return '<option>' + esc(x) + "</option>"; }).join("") + "</select>";
}

/* ---------- the board anybody can teach on ----------
 *
 * A board in a classroom is used by whoever is standing in front of it, and
 * making the first thing it says be "sign in" is how a smart board becomes
 * the thing nobody switches on. So the writing space and the calculator open
 * with no account at all: pick up the pen, teach, rub it out.
 *
 * Signing in is what makes the board YOURS for that lesson, and it buys the
 * two things that need to know who you are — keeping what you taught on your
 * subject's page, and driving the board from your phone. Nothing is saved
 * anywhere until somebody has said who they are, which is also the right
 * answer for a machine a hundred children walk past every day.
 *
 * What is on the board survives signing in, because the ink is kept in the
 * page and not in the element: a teacher who starts writing and then signs in
 * to keep it does not lose the thing she signed in to keep.
 */
var OPEN = false;                    // running with no account

var OPEN_TOOLS = ["write", "calc"];  // everything that needs no server

function openBoard(){
  OPEN = true;
  ME = { user:{ name:"This board" }, role:"guest", classes:[],
         institution:null, open:true };
  el("gate").hidden = true;
  el("app").hidden = false;
  el("who").innerHTML = "<b>This board</b>not signed in";
  /* A board with no code opens straight onto the writing space, because
     there is nothing else it can do. A board that knows its subject opens on
     the home screen, where the teaching tiles are AND everything already
     saved for that subject is one press from the screen. */
  PANES = [{ page: boarded() ? "home" : "write", arg:null }];
  LIVE = 0;
  paintPanes();
}

/* The one thing an open board says about itself: what signing in would add.
   Shown where the Keep and Remote blocks would be, so the answer is in the
   place the question is asked rather than in a menu. */
/* There is no sign-in on this board, so this offers the only thing there is:
   a subject code. It said "Sign in" and pointed at a form that no longer
   exists — a button that takes somebody to a place they cannot get to is
   worse than no button, and worse still on a screen a class is watching. */
function signInPrompt(what){
  if(boarded()) return "";
  return '<div class="note">' +
    "<b>Enter your subject code to " + esc(what) + ".</b> This board is open " +
    "— anybody can write on it, and nothing is kept. The code your school " +
    "gave you for a subject opens that class here, and whatever you teach is " +
    "saved to it." +
    ' <button class="btn" data-signin="1" style="margin-top:.6rem">' +
    "Enter a code</button></div>";
}

function wireSignIn(host){
  (host || document).querySelectorAll("[data-signin]").forEach(function(b){
    b.onclick = function(){
      /* Straight to the code box, with the board still behind it: the ink
         is in the page, so it is still there afterwards. */
      OPEN = false;
      el("app").hidden = true;
      el("gate").hidden = false;
      tab("Code");
    };
  });
}

/* ---------- the phone as a remote control ----------
 *
 * A board is bolted to a wall. Reaching it means turning your back on the
 * room, and the microphone in it is across a classroom from whoever is
 * talking. The phone already in a teacher's hand solves both: it is a
 * keypad she can see without looking up, and its microphone is six inches
 * from her mouth.
 *
 * The phone is NOT signed in. This product allows one login per account, so
 * a teacher who signed in on her phone would sign the board out from under
 * the class she is standing in front of. It holds a six-character code
 * instead, and that code buys exactly one thing: permission to change what
 * is on that one screen.
 */
var REMOTE = { on:false, code:"", timer:0, missed:0 };

function remotePanel(){
  var host = main();
  if(OPEN){
    host.innerHTML = '<div class="eyebrow">Remote</div>' +
      signInPrompt("drive this board from your phone");
    wireSignIn(host);
    return;
  }
  host.innerHTML =
    '<div class="eyebrow">Remote</div>' +
    '<div class="card">' +
      '<p class="muted" style="margin-top:0">Drive this board from your ' +
        "phone. Open Craxlearn on the phone, tap <b>Remote</b> on the sign-in " +
        "screen, and type the code below. You do not sign in on the phone — " +
        "signing in there would sign this board out." +
      "</p>" +
      '<div id="rmCode" class="remoteCode">' +
        (REMOTE.on ? esc(REMOTE.code) : "— — — — — —") + "</div>" +
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap">' +
        '<button class="btn" id="rmOn"' + (REMOTE.on ? " hidden" : "") +
          ">Turn the remote on</button>" +
        '<button class="btn ghost" id="rmOff"' + (REMOTE.on ? "" : " hidden") +
          ">Turn it off</button>" +
      "</div>" +
      '<div class="muted" id="rmMsg" style="margin-top:.6rem">' +
        (REMOTE.on ? "Listening. Anything the phone taps happens here."
                   : "Off. Nothing can drive this board.") + "</div>" +
    "</div>" +
    '<div class="eyebrow">What the phone can do</div>' +
    '<div class="card muted">' +
      "Say or type a topic and have it taught here · turn the pages of a " +
      "lesson · open any of the tools · add and close spaces · change pen " +
      "colour, undo, and rub out the writing space." +
      "<br><br>It cannot see a learner's record, a class list or a mark. " +
      "A remote changes what is on a screen; that is all this one does." +
    "</div>";

  el("rmOn").onclick = remoteOn;
  el("rmOff").onclick = remoteOff;
}

async function remoteOn(){
  var msg = el("rmMsg");
  if(msg) msg.textContent = "Asking for a code…";
  try{
    var d = await api.post("/api/craxlearn/remote/open", {});
    REMOTE.on = true;
    REMOTE.code = d.code;
    REMOTE.missed = 0;
    remoteWatch();
    if(PANES[LIVE] && PANES[LIVE].page === "remote") remotePanel();
  }catch(e){
    if(msg) msg.textContent = e.message;
  }
}

async function remoteOff(){
  REMOTE.on = false;
  REMOTE.code = "";
  clearTimeout(REMOTE.timer);
  REMOTE.timer = 0;
  try{ await api.post("/api/craxlearn/remote/close", {}); }catch(e){}
  if(PANES[LIVE] && PANES[LIVE].page === "remote") remotePanel();
}

/* Polling, not a socket. The one thing nobody controls here is a school's
   network, and a socket that dies in a corridor is a remote that stops
   working halfway through a lesson with nothing to show for it. Two seconds
   is under the time it takes to look up from a phone. */
function remoteWatch(){
  clearTimeout(REMOTE.timer);
  if(!REMOTE.on) return;
  REMOTE.timer = setTimeout(async function(){
    if(!REMOTE.on) return;
    try{
      var d = await api.get("/api/craxlearn/remote/poll");
      REMOTE.missed = 0;
      if(!d.linked){ REMOTE.on = false; return; }
      for(var i = 0; i < (d.cmds || []).length; i++){
        try{ await remoteDo(d.cmds[i]); }
        catch(e){ /* one bad command must not stop the rest */ }
      }
    }catch(e){
      /* A blip is a blip. Enough of them in a row and the board has lost
         the server, which is worth saying rather than polling forever. */
      REMOTE.missed++;
      if(REMOTE.missed > 30){ REMOTE.on = false; return; }
    }
    remoteWatch();
  }, 2000);
}

/* What a command actually does to this screen. Everything here goes through
   the same functions a tap on the board would, so the remote can never do
   something the board itself cannot. */
async function remoteDo(c){
  var k = c.kind, p = c.payload || {};
  if(k === "home"){ go("home"); return; }
  if(k === "go"){
    if(TOOL_NAMES[p.page]) go(p.page, p.arg || null);
    return;
  }
  if(k === "teach"){
    var topic = (p.topic || "").trim();
    if(topic.length < 2) return;
    /* Into the live space, so a teacher can leave a diagram up beside it. */
    go("board", topic);
    return;
  }
  if(k === "slide"){
    if(!LESSON) return;
    if(p.to === "next") lessonGo(LESSON.at + 1);
    else if(p.to === "back") lessonGo(LESSON.at - 1);
    else lessonGo(+p.to || 0);
    return;
  }
  if(k === "split"){ el("splitBtn").click(); return; }
  if(k === "close"){
    var x = document.querySelector('[data-close="' + LIVE + '"]');
    if(x) x.click();
    return;
  }
  /* The writing space, driven through its own controls: they are the only
     things that know where its ink lives. */
  if(k === "pen"){
    var b = document.querySelector('[data-pen="' + (p.i || 0) + '"]');
    if(b) b.click();
    return;
  }
  if(k === "clear"){ if(el("wClear")) el("wClear").click(); return; }
  if(k === "undo"){ if(el("wUndo")) el("wUndo").click(); return; }
  if(k === "redo"){ if(el("wRedo")) el("wRedo").click(); return; }
}

async function remoteJoin(){

    var d = await api.post("/api/craxlearn/remote/join", { code: code });
    PHONE.code = d.code;
    PHONE.board = d.board;
    msg.textContent = "";
    phoneScreen();

    msg.textContent = e.message;
  }

async function phoneSend(kind, payload){
  var msg = el("phMsg");

    var d = await api.post("/api/craxlearn/remote/cmd",
                           { code: PHONE.code, kind: kind, payload: payload || {} });
    if(msg){
      msg.textContent = d.board_awake ? "Sent."
        : "Sent — but the board has not answered for a while. Is it awake " +
          "and on Craxlearn?";
    }
  }catch(e){
    if(msg) msg.textContent = e.message;
  }
}

/* ---------- saying it instead of typing it ----------
 *
 * What is heard becomes the TOPIC, never the answer. A teacher says
 * "photosynthesis" and the board explains photosynthesis, with the same
 * diagrams and the same 3D it would have built had she typed the word —
 * it does not read her sentence back at her. The words land in the box
 * first, so a misheard one can be corrected before it is taught.
 *
 * One listen per press, not a conversation. A teacher names a topic and
 * turns back to the class; a recogniser left running would transcribe the
 * lesson, and on a board in a full classroom that is both useless and a
 * microphone nobody asked to leave open.
 *
 * Recognition is the browser's own. In Chrome that is Google's recogniser:
 * good at Indian English, and free per minute, because the audio never
 * reaches our servers. A paid speech API would put a per-second bill on the
 * most open-ended thing in a classroom.
 */
var MIC_TROUBLE = {
  "not-allowed": "This board is blocking the microphone. Allow it for this " +
    "site — the padlock in the address bar — and try again.",
  "service-not-allowed": "This board is blocking the microphone. Allow it " +
    "for this site and try again.",
  "no-speech": "I did not catch anything. Tap the mic and say it straight after.",
  "audio-capture": "No microphone was found on this board. Check it is " +
    "plugged in and not in use by another app.",
  "network": "Speech recognition needs the network and could not reach it. " +
    "Type the topic instead.",
  "aborted": "",   // stopped on purpose; say nothing
  "language-not-supported": "This board has no Indian English for speech. " +
    "Trying again in US English — say it once more.",
  "bad-grammar": "The microphone returned something unusable. Try again."
};

var MIC = { rec: null, btn: null, fallback: false };

function micStop(){
  if(MIC.rec){ try{ MIC.rec.abort(); }catch(e){} }
  MIC.rec = null;
  if(MIC.btn){ MIC.btn.classList.remove("listening"); MIC.btn = null; }
}

/* Listen once, put the words in `box`, then run `then`. `say` reports
   trouble wherever this particular tool shows its messages. */
function hearInto(btn, box, then, say){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    say("This board's browser cannot listen. Chrome and Edge can; Firefox " +
        "cannot. Type the topic instead.");
    return;
  }
  /* A second press stops it. Without this it tried to open a second
     recogniser and threw, which reads as a mic that will not let go. */
  if(MIC.rec){ micStop(); say(""); return; }

  var r = new SR();
  MIC.rec = r;
  MIC.btn = btn;
  btn.classList.add("listening");
  r.lang = MIC.fallback ? "en-US" : "en-IN";
  r.interimResults = false;
  r.maxAlternatives = 1;
  say("Listening — say the topic.");

  r.onresult = function(ev){
    var heard = ((ev.results[0][0] || {}).transcript || "").trim();
    micStop();
    if(!heard){ say("I did not catch that. Try once more."); return; }
    box.value = heard;
    say("");
    then();
  };
  r.onerror = function(ev){
    var code = (ev && ev.error) || "";
    micStop();
    /* Some browsers ship no Indian English and refuse the locale outright.
       One silent retry in US English, which every one of them has. */
    if(code === "language-not-supported" && !MIC.fallback){
      MIC.fallback = true;
      hearInto(btn, box, then, say);
      return;
    }
    var m = MIC_TROUBLE[code];
    say(m !== undefined ? m
        : "The microphone reported “" + (code || "an unknown fault") +
          "”. Try again, or type it instead.");
  };
  r.onend = function(){ micStop(); };
  try{ r.start(); }
  catch(e){
    micStop();
    say("The microphone was already busy. Try again.");
  }
}

/* The button itself, so every tool that takes a topic gets the same one. */
function micButton(id){
  return '<button class="iconbtn mic" id="' + id + '" ' +
    'title="Say it instead of typing it">🎤</button>';
}

/* Leaving a page with the microphone live is not acceptable, and on a board
   the page changes every time a space is switched. */
window.addEventListener("pagehide", micStop);

/* ---------- any structure worth turning around ----------
 *
 * Only ones somebody measured. A name with nothing behind it says so rather
 * than showing a plausible arrangement of spheres with a real compound's
 * name under it — which is the failure this whole codebase is built to
 * avoid, and the one a class cannot possibly catch.
 */
async function structure(name){
  var n = (name || "").trim();
  var host = main();
  host.classList.add("noscroll");
  host.innerHTML =
    '<div class="fillcol">' +
    '<div class="eyebrow">3D structures</div>' +
    '<div class="card"><div style="display:flex;gap:.5rem;flex-wrap:wrap">' +
      '<input id="stName" style="flex:1 1 14rem" value="' + esc(n) + '" ' +
        'placeholder="caffeine · silicon · graphene · haemoglobin · the solar system">' +

    '</div><div class="muted" id="stMsg" style="margin-top:.4rem">' +

/* ---------- the courses, the lessons and the exams ----------
 *
 * Fetched once and kept. The curriculum is 19 tracks and 82 lessons of
 * mostly static text; re-fetching it every time somebody opens a lesson is
 * a megabyte a lesson on a school connection shared by thirty devices.
 */
var CURRICULUM = null;
async function curriculum(){
  if(CURRICULUM) return CURRICULUM;
  CURRICULUM = (await api.get("/api/curriculum")).tracks || [];
  return CURRICULUM;
}
var PROGRESS = {}, QUIZ_PASSED = {};
async function progress(){
  try{
    /* The endpoint answers {done:{slug:true}, code:{slug:"..."}, quiz:{...}},
       not a list of rows. Reading it as a list left every lesson looking
       unfinished and threw away saved lab work on the way. */
    var d = await api.get("/api/progress");
    PROGRESS = {};
    Object.keys(d.done || {}).forEach(function(slug){
      PROGRESS[slug] = { completed:true };
    });
    Object.keys(d.code || {}).forEach(function(slug){
      PROGRESS[slug] = PROGRESS[slug] || {};
      PROGRESS[slug].code = d.code[slug];
    });
    QUIZ_PASSED = d.quiz || {};
  }catch(e){ PROGRESS = {}; QUIZ_PASSED = {}; }
  return PROGRESS;
}

async function tracks(){
  main().innerHTML = '<div class="muted">Loading the courses…</div>';
  var ts = await curriculum();
  await progress();
  if(!ts.length){
    main().innerHTML = '<div class="card muted">No courses are loaded on ' +
      "this server yet.</div>";
    return;
  }
  var byAud = {};
  ts.forEach(function(t){ (byAud[t.audience] = byAud[t.audience] || []).push(t); });
  var h = "";
  Object.keys(byAud).sort().forEach(function(aud){
    h += '<div class="eyebrow">' + esc(aud === "school" ? "School" : aud) +
      "</div><div class=\"tiles\">" +
      byAud[aud].map(function(t){
        var done = (t.lessons || []).filter(function(l){
          return PROGRESS[l.id] && PROGRESS[l.id].completed; }).length;
        return '<button class="tile" data-track="' + esc(t.id) + '">' +
          '<span class="ic">' + esc(t.icon || "📘") + "</span><b>" +
          esc(t.name) + "</b><span>" + esc(t.desc || "") + "</span>" +
          '<span class="muted">' + done + " of " + (t.lessons || []).length +
          " lessons" + ((t.quiz || []).length ? " · has an exam" : "") +
          "</span></button>";
      }).join("") + "</div>";
  });
  main().innerHTML = h;
  main().querySelectorAll("[data-track]").forEach(function(b){
    b.onclick = function(){ go("track", b.dataset.track); };
  });
}

function findTrack(id){
  return (CURRICULUM || []).filter(function(t){ return t.id === id; })[0];
}

async function track(id){
  await curriculum();
  await progress();
  var t = findTrack(id);
  if(!t){ return tracks(); }
  var h = '<button class="btn ghost" data-go="tracks">← All courses</button>' +
    "<h1 style=\"margin-top:.8rem\">" + esc(t.icon || "") + " " + esc(t.name) + "</h1>" +
    '<p class="muted">' + esc(t.desc || "") + "</p>";
  if((t.outcomes || []).length){
    h += '<div class="card"><b>By the end you can</b>' +
      t.outcomes.map(function(o){ return "<div>· " + esc(o) + "</div>"; }).join("") +
      "</div>";
  }
  h += (t.lessons || []).map(function(l, i){
    var done = PROGRESS[l.id] && PROGRESS[l.id].completed;
    return '<button class="card" data-lesson="' + esc(l.id) +
      '" style="width:100%;text-align:left;cursor:pointer">' +
      (done ? '<span style="color:var(--ok)">✓</span> ' : (i + 1) + ". ") +
      "<b>" + esc(l.title) + "</b>" +
      '<span class="muted"> · ' + (l.mins || 10) + " min" +
      ((l.lab && l.lab.prompt) ? " · has a lab" : "") + "</span></button>";
  }).join("");
  if((t.quiz || []).length){
    h += '<button class="btn" data-exam="' + esc(t.id) + '">Take the exam · ' +
      t.quiz.length + " questions</button>";
  }
  main().innerHTML = h;
  main().querySelectorAll("[data-lesson]").forEach(function(b){
    b.onclick = function(){ go("lesson", { track:id, lesson:b.dataset.lesson }); };
  });
  var ex = main().querySelector("[data-exam]");
  if(ex) ex.onclick = function(){ go("exam", id); };
}

/* Python runs through Pyodide, JavaScript through the browser itself.
 * Both fail out loud: a lab that silently does nothing is a lesson a
 * learner decides is broken and skips. */
var PY = null, PY_FAILED = false;
async function pyodide(){
  if(PY) return PY;
  if(PY_FAILED) return null;
  try{
    if(!window.loadPyodide){
      await new Promise(function(res, rej){
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
        s.onload = res;
        s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    PY = await window.loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/" });
    return PY;
  }catch(e){ PY_FAILED = true; return null; }
}

async function runCode(lang, code){
  if(lang === "js"){
    var out = [];
    var log = console.log;
    console.log = function(){ out.push([].slice.call(arguments).join(" ")); };
    try{ new Function(code)(); }
    catch(e){ out.push(String(e)); }
    finally{ console.log = log; }
    return out.join("\n") || "(nothing printed)";
  }
  var py = await pyodide();
  if(!py){
    return "Python could not start on this board. It is downloaded from a " +
           "public CDN — this board may be offline or the network may be " +
           "blocking it.";
  }
  py.runPython("import sys, io\n_b = io.StringIO()\nsys.stdout = _b\nsys.stderr = _b");
  try{ py.runPython(code); }
  catch(e){ py.runPython("import traceback; traceback.print_exc()"); }
  return py.runPython(
    "sys.stdout = sys.__stdout__\nsys.stderr = sys.__stderr__\n_b.getvalue()")
    || "(nothing printed)";
}

async function lesson(arg){
  await curriculum();
  await progress();
  var t = findTrack(arg && arg.track);
  var l = t && (t.lessons || []).filter(function(x){
    return x.id === (arg && arg.lesson); })[0];
  if(!l) return tracks();

  var done = PROGRESS[l.id] && PROGRESS[l.id].completed;
  var h = '<button class="btn ghost" data-back="' + esc(t.id) + '">← ' +
      esc(t.name) + "</button>" +
    "<h1 style=\"margin-top:.8rem\">" + esc(l.title) + "</h1>" +
    /* Lesson bodies are HTML in the curriculum — <h3>, <p>, <pre><code> —
       written by us and seeded from the repository's own files, not typed
       by a user. Escaping them printed the tags on the screen. */
    '<div class="card lessonBody">' + (l.content || "") + "</div>";

  if(l.lab && l.lab.prompt){
    h += '<div class="eyebrow">Try it</div><div class="card">' +
      '<div class="muted" style="margin-bottom:.5rem">' + esc(l.lab.prompt) + "</div>" +
      '<textarea id="labCode" rows="10" spellcheck="false" ' +
        'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;' +
        'font-size:.66rem;padding:.6rem;border-radius:12px;border:1px solid ' +
        'var(--line);background:var(--panel2);color:var(--text)">' +
        esc((PROGRESS[l.id] && PROGRESS[l.id].code) || l.lab.starter || "") +
      "</textarea>" +
      '<div style="margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap">' +
        '<button class="btn" id="labRun">Run it</button>' +
        '<button class="btn ghost" id="labSave">Save my work</button>' +
        (l.lab.solution ? '<button class="btn ghost" id="labSol">Show one answer</button>' : "") +
      "</div>" +
      '<pre id="labOut" class="wrap" style="margin-top:.6rem;font-size:.64rem;' +
        'background:var(--panel2);padding:.6rem;border-radius:12px;' +
        'min-height:2rem;white-space:pre-wrap"></pre>' +
      "</div>";
  }

  if((l.exercises || []).length){
    h += '<div class="eyebrow">Questions</div>' +
      l.exercises.map(function(x, i){
        return '<div class="card"><b>' + (i + 1) + ".</b> " +
          esc(x.q || x.prompt || "") +
          (x.a ? '<details style="margin-top:.4rem"><summary class="muted">' +
            "Show the answer</summary><div style=\"white-space:pre-wrap\">" +
            esc(x.a) + "</div></details>" : "") + "</div>";
      }).join("");
  }

  h += '<button class="btn" id="lDone">' +
    (done ? "✓ Finished — mark it unfinished" : "Mark this lesson finished") +
    '</button> <span class="muted" id="lMsg"></span>';
  main().innerHTML = h;

  main().querySelector("[data-back]").onclick = function(){ go("track", t.id); };
  el("lDone").onclick = async function(){
    try{
      await api.post("/api/progress", { lesson: l.id, completed: !done });
      await progress();
      lesson(arg);
    }catch(e){ el("lMsg").textContent = e.message; }
  };
  var run = el("labRun");
  if(run) run.onclick = async function(){
    el("labOut").textContent = "Running…";
    el("labOut").textContent = await runCode(l.lang === "js" ? "js" : "py",
                                             el("labCode").value || "");
  };
  var save = el("labSave");
  if(save) save.onclick = async function(){
    try{
      await api.post("/api/progress", { lesson: l.id,
                                        code: el("labCode").value || "" });
      el("labOut").textContent = "Saved.";
    }catch(e){ el("labOut").textContent = e.message; }
  };
  var sol = el("labSol");
  if(sol) sol.onclick = function(){ el("labCode").value = l.lab.solution; };
}

/* The exam. Marked here and recorded on the server, which is where the
   teacher's view of "what exams they did take" comes from. */
async function exam(id){
  await curriculum();
  var t = findTrack(id);
  if(!t || !(t.quiz || []).length) return tracks();
  var picks = {};

  main().innerHTML =
    '<button class="btn ghost" data-back="' + esc(t.id) + '">← ' +
      esc(t.name) + "</button>" +
    "<h1 style=\"margin-top:.8rem\">" + esc(t.name) + " — exam</h1>" +
    '<p class="muted">' + t.quiz.length + " questions. Every one has to be " +
      "right to pass, and you may retake it as often as you like.</p>" +
    t.quiz.map(function(q, qi){
      return '<div class="card"><b>' + (qi + 1) + ".</b> " + esc(q.q) +
        '<div style="margin-top:.5rem">' + (q.o || []).map(function(o, oi){
          return '<button class="btn ghost" data-q="' + qi + '" data-o="' + oi +
            '" style="display:block;width:100%;text-align:left;margin-bottom:.3rem">' +
            esc(o) + "</button>";
        }).join("") + "</div></div>";
    }).join("") +
    '<button class="btn" id="exGo">Hand it in</button> ' +
    '<span class="muted" id="exMsg"></span>';

  main().querySelector("[data-back]").onclick = function(){ go("track", t.id); };
  main().querySelectorAll("[data-q]").forEach(function(b){
    b.onclick = function(){
      var qi = b.dataset.q;
      main().querySelectorAll('[data-q="' + qi + '"]').forEach(function(x){
        x.className = "btn ghost";
        x.style.display = "block"; x.style.width = "100%";
        x.style.textAlign = "left"; x.style.marginBottom = ".3rem";
      });
      b.className = "btn";
      b.style.display = "block"; b.style.width = "100%";
      b.style.textAlign = "left"; b.style.marginBottom = ".3rem";
      picks[qi] = +b.dataset.o;
    };
  });
  el("exGo").onclick = async function(){
    var score = 0;
    t.quiz.forEach(function(q, qi){ if(picks[qi] === q.a) score++; });
    try{
      var r = await api.post("/api/quiz", { track: t.id, score: score,
                                            total: t.quiz.length });
      el("exMsg").textContent = score + " of " + t.quiz.length + " — " +
        (r.passed ? "passed. It is on your record."
                  : "not passed yet. Look again at the ones you missed.");
    }catch(e){ el("exMsg").textContent = e.message; }
  };
}

/* ---------- PhET simulations ----------
 *
 * Embedded from PhET's own servers, so what a class runs is the current
 * published version and the CC BY licence is satisfied by pointing at the
 * original rather than copying it. The server has already checked that each
 * one answers, so nothing here can be a 404 on the board mid-lesson.
 */
async function phet(pick){
  main().innerHTML = '<div class="eyebrow">Simulations</div>' +
    '<div class="muted">Loading what PhET has…</div>';
  var d;
  try{ d = await api.get("/api/craxlearn/phet"); }
  catch(e){ main().innerHTML = '<div class="note bad">' + esc(e.message) + "</div>"; return; }

  if(!(d.sims || []).length){
    main().innerHTML = '<div class="eyebrow">Simulations</div>' +
      '<div class="note bad">' + esc(d.note || "Nothing available.") + "</div>";
    return;
  }
  var subs = {};
  d.sims.forEach(function(s){ (subs[s.subject] = subs[s.subject] || []).push(s); });

  var chosen = pick || d.sims[0].id;
  var sim = d.sims.filter(function(s){ return s.id === chosen; })[0] || d.sims[0];
  remember(sim.id);

  var host = main();
  host.classList.add("noscroll");
  host.innerHTML = '<div class="fillcol">' +
    '<div class="eyebrow">Simulations</div>' +
    '<div class="card" style="padding:.7rem;max-height:40%;overflow-y:auto">' +
      Object.keys(subs).sort().map(function(k){
        return '<div style="margin-bottom:.4rem"><span class="muted">' + esc(k) +
          "</span><br>" + subs[k].map(function(x){
            return '<button class="btn ' + (x.id === sim.id ? "" : "ghost") +
              '" data-sim="' + esc(x.id) + '" style="margin:.2rem .3rem 0 0">' +
              esc(x.title) + "</button>";
          }).join("") + "</div>";
      }).join("") +
    "</div>" +
    '<div class="card viewer" style="background:#000">' +
      '<iframe src="' + esc(sim.url) + '" title="' + esc(sim.title) + '" ' +
        'style="border-radius:12px;background:#000" allowfullscreen></iframe>' +
    "</div>" +
    '<div class="muted">' + esc(sim.title) + " · " +
      esc(d.licence) + ' · <a href="' + esc(sim.page) +
      '" target="_blank" rel="noopener">on PhET</a></div>' +
    "</div>";

  main().querySelectorAll("[data-sim]").forEach(function(b2){
    b2.onclick = function(){ phet(b2.dataset.sim); };
  });
}
