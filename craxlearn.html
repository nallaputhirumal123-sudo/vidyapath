<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Craxlearn — the teaching board</title>
<meta name="description" content="Craxlearn: the teaching half of Craxle, for schools, colleges and coaching centres. No job board.">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/craxlearn.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f16">
<style>
/* Sized for the display at the front of a room, not for a laptop.
   The whole of this file is one decision repeated: the person reading it is
   four metres away and the person operating it is doing so with a finger.
   Base type is 20px rather than 16, targets are 52px rather than 36, and
   nothing depends on hover — a smart board has no pointer to hover with. */
:root{
  --bg:#0b0f16; --panel:#121a26; --panel2:#0e1621; --line:#22303f;
  --text:#e8eef6; --muted:#93a3b8; --dim:#6a7b8f;
  --accent:#ff9933; --accent2:#c2410c; --ok:#3fae6a; --bad:#e05a5a;
  --pad:clamp(16px,2.2vw,34px);
  --r:16px;
}
:root[data-scale="board"]{ font-size:26px }
:root[data-scale="desk"]{ font-size:18px }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:1rem; line-height:1.6; -webkit-text-size-adjust:100%;
  min-height:100vh;
}
button{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1rem}

/* ---- frame ---- */
#top{
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.7rem var(--pad); border-bottom:1px solid var(--line);
  background:var(--panel2); position:sticky; top:0; z-index:50;
}
#brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem}
#brand .dot{
  width:1.5rem;height:1.5rem;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent),var(--accent2));
}
#brand small{display:block;font-size:.5rem;font-weight:500;color:var(--muted);
  letter-spacing:.14em;text-transform:uppercase}
.grow{flex:1 1 auto}
#top .who{font-size:.62rem;color:var(--muted);text-align:right;line-height:1.35}
#top .who b{display:block;color:var(--text);font-size:.72rem}

.iconbtn{
  min-width:2rem;min-height:2rem;padding:0 .55rem;border-radius:12px;
  border:1px solid var(--line);background:transparent;cursor:pointer;
  font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn:active{border-color:var(--accent)}

/* ---- the tile grid: the whole home screen ---- */
#main{padding:var(--pad);max-width:1500px;margin:0 auto}
.tiles{
  display:grid;gap:clamp(12px,1.4vw,22px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));
}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;
  text-align:left;padding:1.1rem 1.15rem;min-height:7.2rem;
  border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel);cursor:pointer;
}
.tile:active{border-color:var(--accent);transform:translateY(1px)}
.tile .ic{font-size:1.9rem;line-height:1}
.tile b{font-size:.92rem;font-weight:700}
.tile span{font-size:.66rem;color:var(--muted);line-height:1.45}

.eyebrow{
  font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:1.6rem 0 .7rem;font-weight:700;
}
.eyebrow:first-child{margin-top:0}

.card{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:1.1rem 1.2rem;margin-bottom:1rem;
}
.muted{color:var(--muted);font-size:.72rem}
.big{font-size:1.6rem;font-weight:800;line-height:1}

.btn{
  padding:.6rem 1.1rem;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(150deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;cursor:pointer;font-size:.78rem;
  min-height:2.4rem;
}
.btn.ghost{background:transparent;color:var(--text);font-weight:600}
.btn:active{transform:translateY(1px)}
input,select{
  font:inherit;font-size:.78rem;padding:.55rem .7rem;border-radius:12px;
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  min-height:2.4rem;max-width:100%;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}

table{border-collapse:collapse;width:100%;font-size:.72rem}
th,td{border-bottom:1px solid var(--line);padding:.5rem .6rem;text-align:left;
  vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.62rem;
  text-transform:uppercase;letter-spacing:.1em}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.note{
  border:1px solid rgba(255,153,51,.35);background:rgba(255,153,51,.09);
  border-radius:var(--r);padding:.9rem 1.05rem;font-size:.74rem;
  line-height:1.6;margin-bottom:1rem;
}
.bad{border-color:rgba(224,90,90,.4);background:rgba(224,90,90,.1)}

/* A lesson body is authored HTML. Give its tags somewhere to live rather
   than inheriting the card's bare defaults. */
.lessonBody h3{font-size:.92rem;margin:1rem 0 .3rem}
.lessonBody p{margin:0 0 .6rem;font-size:.76rem;line-height:1.7}
.lessonBody ul,.lessonBody ol{margin:0 0 .6rem 1.1rem;font-size:.76rem}
.lessonBody li{margin-bottom:.25rem}
.lessonBody code{font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.68rem;background:var(--panel2);padding:.05rem .3rem;
  border-radius:6px}
.lessonBody pre{background:var(--panel2);padding:.7rem;border-radius:12px;
  overflow-x:auto;font-size:.66rem;line-height:1.55}
.lessonBody pre code{background:none;padding:0}
.lessonBody b,.lessonBody strong{color:var(--text)}

/* ---- sign in ---- */
#gate{max-width:26rem;margin:8vh auto;padding:0 var(--pad)}
#gate .card{padding:1.5rem}
#gate input{width:100%;margin-bottom:.6rem}
#gate .btn{width:100%}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.tabs button{
  flex:1;padding:.5rem;border-radius:12px;border:1px solid var(--line);
  background:transparent;cursor:pointer;font-size:.72rem;min-height:2.2rem;
}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}

/* ---- spaces ----
   Two tools side by side, with a divider you drag. A classroom board is
   wide and a lesson is usually two things at once — the lesson and the
   working, the diagram and the question — and a teacher who has to keep
   swapping between them stops using the second one.

   Stacked rather than side by side under 900px, because two half-width
   columns on a phone are two unreadable columns. */
/* A grid rather than wrapped flex, because a grid can be dragged.
   The columns and rows are set from JS as plain fr numbers, so one drag
   handle changes one template and every layout resizes the same way.

   Handles float over the gaps rather than sitting in the flow: a divider
   that is a grid item has to be counted in every template, and it was
   forgetting to count it that left three and four spaces unadjustable. */
#panes{display:grid;gap:8px;position:relative;
  grid-template-columns:1fr;grid-template-rows:1fr;
  height:calc(100vh - 4rem)}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;
  overflow:hidden}
.pane.wide{grid-column:1 / -1}
.paneHead{
  display:flex;align-items:center;gap:.4rem;padding:.4rem var(--pad);
  border-bottom:1px solid var(--line);background:var(--panel2);flex:0 0 auto;
}
.pane[data-live="1"] .paneHead{border-bottom-color:var(--accent)}
.paneHead select{font-size:.66rem;min-height:1.9rem;padding:.2rem .45rem}
.paneBody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:var(--pad);
  -webkit-overflow-scrolling:touch}
#panes.one .paneHead{display:none}
#panes.one .paneBody{max-width:1500px;margin:0 auto;width:100%}

/* The handles. Wide enough for a finger on a board, drawn narrow. */
.grip{position:absolute;z-index:20;touch-action:none;background:transparent}
.grip::after{content:"";position:absolute;background:var(--line);
  border-radius:3px}
.grip:hover::after,.grip.on::after{background:var(--accent)}
/* The two handles cross in the middle of a 2x2, and whichever is later in
   the DOM would win there — which is the exact point a finger lands on a
   board. The vertical one takes the crossing: it is the shorter of the two
   hit areas, while the horizontal one spans the whole width and loses only
   a 22px band it can be grabbed either side of. */
.grip.v{top:0;bottom:0;width:22px;margin-left:-11px;cursor:col-resize;
  z-index:22}
.grip.h{z-index:21}
.grip.v::after{left:9px;top:8px;bottom:8px;width:4px}
.grip.h{left:0;right:0;height:22px;margin-top:-11px;cursor:row-resize}
.grip.h::after{top:9px;left:8px;right:8px;height:4px}

@media(max-width:900px){
  /* One column on a phone: two half-width columns are two unreadable ones.
     The rows still drag. */
  #panes{grid-template-columns:1fr !important}
  .pane.wide{grid-column:1}
  .grip.v{display:none}
}

/* The writing space owns its whole pane and never scrolls: the surface IS
   the space it was given. The canvas is taken out of the flow so it can
   only ever be told its size, never argue about it — a canvas left in a
   flex column can grow the box that is sizing it, and the two then chase
   each other bigger every frame. */
.paneBody.noscroll{overflow:hidden;display:flex;flex-direction:column}
.wboard{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.5rem}
/* The tools take one row in a full pane and are allowed to wrap in a
   quarter of one rather than overflow. They are kept small so wrapping is
   rare: every row they take is a row off the surface. */
.wtools{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;flex:0 0 auto}
.wtools .btn{padding:.3rem .6rem;font-size:.72rem;min-height:2rem}
.wtools .iconbtn{width:2rem;min-height:2rem;padding:0}
.wsurf{flex:1 1 auto;min-height:0;position:relative}
.wsurf canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
  touch-action:none}
.whint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;color:var(--muted);pointer-events:none;font-size:.8rem}

/* A viewer takes whatever is left after the controls above it, and follows
   the space when it is dragged. A fixed height is wrong in both directions
   at once on a board: a small picture on a wall, or a picture taller than
   the quarter it was put in. Controls keep their own size; only the viewer
   is elastic, so nothing is ever pushed out of reach. */
.fillcol{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  gap:.6rem}
.fillcol > *{flex:0 0 auto}
.fillcol > .viewer{flex:1 1 auto;min-height:0;position:relative;
  overflow:hidden;padding:0}
/* Out of the flow, so the viewer's height is something it is told, never
   something the thing inside it argues about. */
.viewer > canvas,.viewer > iframe{position:absolute;left:0;top:0;
  width:100%;height:100%;border:0;display:block}
.viewer > .note,.viewer > .muted{padding:1rem}

/* A figure inside a lesson. The 2D renderers work out their own height from
   the width they are given, so they get a plain block; a 3D scene has no
   natural height, so it is told a shape and fills it. */
.fig{background:var(--panel2);border-radius:12px;overflow:hidden;
  margin:.4rem 0}
.fig3d{position:relative;aspect-ratio:16/10}
.fig3d > canvas{position:absolute;left:0;top:0;display:block}
.figcap{font-size:.68rem;color:var(--muted);margin:.7rem 0 .2rem}
.lessonBody img{max-width:100%;border-radius:12px;display:block}

/* A lesson as pages. The controls sit at the top with the title, because on
   a wall-mounted board the bottom of the screen is below the shoulder of
   whoever is standing at it. */
.lessonBar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  margin:.2rem 0 .6rem}
.lessonBar h1{font-size:1.1rem}
.lessonBar .iconbtn{font-size:1.2rem;min-width:2.6rem;min-height:2.6rem}
.lessonBar .iconbtn[disabled]{opacity:.35}
.lessonPage{animation:pageIn .18s ease-out}
/* A lesson kept on the subject page, opened where it is. */
.lessonKept{margin-top:.6rem;padding-top:.6rem;
  border-top:1px solid var(--line)}
.lessonKept p{margin:.4rem 0}

/* A classroom's subjects, and who teaches each. */
.subjects{display:grid;gap:.4rem;margin-top:.6rem;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,11rem),1fr))}
.subject{background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:.55rem .7rem;display:flex;
  flex-direction:column;gap:.15rem}
.subject.mine{border-color:var(--accent)}
.subject span{font-size:.66rem}
@keyframes pageIn{from{opacity:.4}}
@media(prefers-reduced-motion:reduce){.lessonPage{animation:none}}

/* Listening. A board is across the room, so the only thing that says the
   microphone is open has to be visible from there. */
.iconbtn.mic.listening{background:var(--accent);border-color:var(--accent);
  color:#10151c;animation:micpulse 1.1s ease-in-out infinite}
@keyframes micpulse{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){
  .iconbtn.mic.listening{animation:none}
}

/* The pairing code is read off a board from the back of a room, so it is
   set at the size that makes that possible and no smaller. */
.remoteCode{font-size:clamp(2rem,9vw,4.5rem);letter-spacing:.18em;
  font-weight:700;text-align:center;color:var(--accent);
  margin:.6rem 0 1rem;font-family:ui-monospace,Menlo,Consolas,monospace}

/* The remote itself. It is used one-handed, without looking down, in a room
   where somebody is talking — so everything on it is thumb-sized. */
.phone{max-width:32rem;margin:0 auto;padding:var(--pad)}
.phone .btn,.phone .iconbtn{min-height:2.8rem}
.phRow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.phGrid{display:grid;gap:.5rem;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,9rem),1fr))}

/* The boards render into #main and bring their own CSS. They were written
   for a 16px page, so they are scaled down relative to the room-sized base
   rather than left to fill a wall with one input box. */
.paneBody .nwwrap,.paneBody .labwrap,.paneBody .sqlwrap{font-size:.62rem}

@media print{ #top,.tile{display:none!important} }
</style>
</head>
<body>

<div id="top">
  <div id="brand"><span class="dot"></span>
    <span>Craxlearn<small>Schools · Colleges · Coaching</small></span></div>
  <span class="grow"></span>
  <div class="who" id="who"></div>
  <button class="iconbtn" id="splitBtn" title="Open another space beside this one">▥</button>
  <button class="iconbtn" id="shotBtn" title="Screenshot">⛶</button>
  <button class="iconbtn" id="installBtn" title="Install on this board" hidden>⤓</button>
  <button class="iconbtn" id="scaleBtn" title="Board size / desk size">⤢</button>
  <button class="iconbtn" id="homeBtn" title="Home">⌂</button>
  <button class="iconbtn" id="outBtn" title="Sign out">↪</button>
</div>

<div id="gate" hidden>
  <div class="card">
    <h1>Craxlearn</h1>
    <p class="muted" style="margin-top:0">The teaching half of Craxle, for
      schools, colleges and coaching centres. No job board, no adverts,
      nothing to buy in the classroom.</p>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabCode" aria-selected="true">Class code</button>
      <button role="tab" id="tabIn" aria-selected="false">Sign in</button>
      <button role="tab" id="tabUp" aria-selected="false">New account</button>
      <button role="tab" id="tabRemote" aria-selected="false">Remote</button>
      <button role="tab" id="tabOpen" aria-selected="false">Just the board</button>
    </div>
    <div id="gateForm"></div>
    <div id="gateMsg" class="muted" style="margin-top:.7rem"></div>
  </div>
  <p class="muted" style="text-align:center">
    <a href="/api/craxlearn/sources">Where our answers come from</a> ·
    <a href="/privacy">Privacy</a>
  </p>
</div>

<div id="app" hidden><div id="panes"></div></div>

<script>
/* The things the board modules need from a host page, defined BEFORE they
 * load. Each of them captures window.$ once, at load time — so this has to
 * be here rather than in the app script below, and putting it there is
 * exactly why net, lab, sqlboard and the scanner all rendered into nothing
 * the first time. The app script hands this shim its real pane resolver
 * once it runs.
 */
window.__paneBody = null;
window.$ = function (sel) {
  if (sel === "#main" && window.__paneBody) return window.__paneBody();
  return document.querySelector(sel);
};
window.esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
             '"': "&quot;", "'": "&#39;" }[c];
  });
};
</script>
<script src="sqlboard.js?v=7c5033791d"></script>
<script src="net.js?v=0338e61617"></script>
<script src="lab.js?v=63294b493d"></script>
<script src="draw.js?v=89efe3a887"></script>
<script src="sketch.js?v=665dcd5a1b"></script>
<script src="three3d.js?v=d4abae1b11"></script>
<script src="scanner.js?v=2f02744728"></script>
<script>
/* Craxlearn — the institution app.
 *
 * A separate page from index.html, deliberately, and for one reason: a
 * school is buying a URL it can put on the board at the front of a room and
 * hand to a fourteen-year-old. A single app with the job half hidden behind
 * a flag is one bug away from showing it, and the person who finds that bug
 * is a child. There is no job-board code in this file to go wrong.
 *
 * The server does not take this file's word for any of it. Every job-side
 * route is refused at the door by the middleware in main.py, for institution
 * accounts and for under-18s, whichever page asked. This file only decides
 * what to draw.
 *
 * The boards themselves — SQL, the packet walkthrough, the lab — are the
 * same modules the main app loads. They need four things from their host:
 * `api.get`, `api.post`, a `$` selector reaching `#main`, and `window.esc`.
 * That contract is provided below and nothing else is.
 */
(function(){
"use strict";

/* ---------- the four things the board modules need ---------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* The head of this file already installed window.$ and window.esc so the
   modules could capture them. This hands that shim the real resolver — the
   modules keep the function they captured and it starts answering "#main"
   with whichever space is being drawn into. */
/* A module resolves "#main" EVERY time it repaints, not once at mount, and
   sqlboard.js/net.js/lab.js/scanner.js all repaint on their own after a
   fetch or a button press — long after drawPane has moved on. Resolving to
   "the space being drawn right now" was therefore right only for the first
   paint: the SQL board's second paint landed in whichever space was drawn
   last, so it appeared in two panes at once.

   So a module-hosting space is pinned. MODULE_HOST is set when a module
   tool is opened and every later repaint goes there, whoever is drawing. */
var MODULE_HOST = null;
window.__paneBody = function(){
  if(MODULE_HOST && MODULE_HOST.isConnected) return MODULE_HOST;
  return paneBody();
};

/* The tools that are separate files and own their own repainting. */
var MODULE_TOOLS = ["net", "lab", "sqlboard", "scan"];

async function req(method, path, body){
  var opt = { method:method, credentials:"same-origin",
              headers:{ "Content-Type":"application/json" } };
  if(body !== undefined) opt.body = JSON.stringify(body);
  var r = await fetch(path, opt);
  var text = await r.text();
  var data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
  if(!r.ok){
    var msg = (data && data.detail) || r.statusText || "Something went wrong";
    var err = new Error(msg);
    err.status = r.status;
    /* The gate answers 403 with a reason, so the page can say WHICH wall
       was hit rather than "forbidden". A learner told "not allowed" goes
       and asks a teacher; one told "this is a Craxlearn server" does not. */
    err.craxlearn = data && data.craxlearn;
    throw err;
  }
  return data;
}
window.api = {
  get:  function(p){ return req("GET", p); },
  post: function(p,b){ return req("POST", p, b===undefined?{}:b); },
  del:  function(p){ return req("DELETE", p); }
};

/* ---------- state ---------- */
var ME = null;
var VIEW = { page:"home" };
/* bot.js and the board modules read these. Kept as the same shape the main
   app uses so the modules need no branch for which page they are on. */
window.S = VIEW.page ? { view:VIEW } : { view:VIEW };
window.S.view = VIEW;

var el = function(id){ return document.getElementById(id); };

/* ---------- spaces ----------
 *
 * One or two, side by side, with a divider you drag. Each holds any tool.
 * `main()` is the body of whichever one is being drawn into, which is what
 * lets every page function in this file — all of which were written against
 * a single screen — work unchanged in either.
 */
var PANES = [{ page:"home", arg:null }];
var LIVE = 0;          // the space a new page opens into
var DRAW = 0;          // the space currently being drawn
var PAINTING = false;  // true while that drawing is in progress

/* What a space is showing, so that splitting the screen — which rebuilds
   every space — comes back to the same structure or the same search rather
   than to an empty box. The live space is the one whose controls were just
   used: a tap anywhere in a space makes it live before the control sees the
   click. */
function remember(arg){
  /* During a repaint the space being drawn is not necessarily the live one,
     and writing to the live one would overwrite what a DIFFERENT space is
     showing. */
  var i = PAINTING ? DRAW : LIVE;
  if(PANES[i]) PANES[i].arg = arg;
}

function paneBody(){
  var p = document.querySelector('.paneBody[data-i="' + DRAW + '"]');
  return p || document.querySelector(".paneBody") || el("app");
}
var main = paneBody;

var TOOL_NAMES = {
  home:"Home", board:"Ask the board", write:"Writing space",
  calc:"Calculator", structure:"3D structures", find:"Search the sources",
  phet:"Simulations", scan:"Scan a problem", tracks:"Courses and exams",
  lesson:"A lesson", track:"A course", exam:"An exam",
  net:"Packet walkthrough", lab:"The lab", sqlboard:"SQL board",
  materials:"Study material", roster:"Class register", roll:"Your classes",
  inbox:"To review", activity:"What the class is asking",
  sources:"Where answers come from", remote:"Remote",
  assignment:"Assignment",
  student:"A student", review:"Reviewing"
};

/* A space that has been drilled into — an open lesson, one student's record —
   is still, as far as its selector is concerned, the tool it came from. Without
   this the selector goes blank the moment a teacher opens a lesson, because no
   option matches "lesson". */
var PARENT = {
  lesson:"tracks", track:"tracks", exam:"tracks",
  assignment:"roll", student:"roll", review:"inbox"
};
function toolOf(page){ return PARENT[page] || page; }

var MAX_PANES = 4;

/* How the spaces are arranged, and where the drag handles go.
 *
 * SPLIT is the fraction of the width the left column takes, ROWS the
 * fraction of the height the top row takes. One pair of numbers drives
 * every layout, which is why three and four spaces are now adjustable and
 * were not before: the old flex version had a divider only for two.
 *
 *   1  one space
 *   2  two columns            — vertical handle
 *   3  two columns, two rows, the third spanning the bottom
 *                             — vertical + horizontal handles
 *   4  two by two             — vertical + horizontal handles
 */
var SPLIT = 0.5, ROWS = 0.5;

function layout(){
  var n = PANES.length;
  var wrap = el("panes");
  var cols = (n === 1) ? "1fr"
                       : (SPLIT.toFixed(3) + "fr " + (1 - SPLIT).toFixed(3) + "fr");
  var rows = (n <= 2) ? "1fr"
                      : (ROWS.toFixed(3) + "fr " + (1 - ROWS).toFixed(3) + "fr");
  wrap.style.gridTemplateColumns = cols;
  wrap.style.gridTemplateRows = rows;
  /* Three spaces: the third takes the whole bottom row rather than leaving
     a hole, which is what a teacher expects when they add one. */
  wrap.querySelectorAll(".pane").forEach(function(p, i){
    p.classList.toggle("wide", n === 3 && i === 2);
  });
  var v = wrap.querySelector(".grip.v"), h = wrap.querySelector(".grip.h");
  if(v){
    v.hidden = n < 2;
    v.style.left = (SPLIT * 100) + "%";
  }
  if(h){
    h.hidden = n < 3;
    h.style.top = (ROWS * 100) + "%";
  }
}

function paintPanes(){
  var wrap = el("panes");
  wrap.className = PANES.length === 1 ? "one" : "";
  var html = "";
  PANES.forEach(function(p, i){
    html += '<div class="pane" data-i="' + i + '" data-live="' +
      (i === LIVE ? 1 : 0) + '">' +
      '<div class="paneHead">' +
        '<select data-pick="' + i + '">' +
          Object.keys(TOOL_NAMES).filter(function(k){
            if(["assignment","student","review","lesson","track",
                "exam"].indexOf(k) >= 0) return false;
            /* An open board offers what works without an account, and the
               Remote — which is where it explains what signing in would
               add. Offering the rest would be a menu of things that all
               answer "sign in first". */
            if(OPEN && OPEN_TOOLS.indexOf(k) < 0
               && k !== "home" && k !== "remote") return false;
            /* Each tool names its own fields by id, so two copies of one
               tool would both write into the same boxes. Home is exempt:
               it has nothing to type into. */
            if(k === "home" || k === toolOf(p.page)) return true;
            /* One module tool at a time, anywhere. They are separate files
               that each ask for "#main" and repaint themselves; two of them
               open at once would both be pinned to one space. */
            if(MODULE_TOOLS.indexOf(k) >= 0
               && PANES.some(function(q, j){
                    return j !== i && MODULE_TOOLS.indexOf(q.page) >= 0; })){
              return false;
            }
            return !PANES.some(function(q, j){
              return j !== i && toolOf(q.page) === k; });
          }).map(function(k){
            return '<option value="' + k + '"' +
              (k === toolOf(p.page) ? " selected" : "") + ">" +
              esc(TOOL_NAMES[k]) + "</option>";
          }).join("") +
        "</select>" +
        '<span class="grow"></span>' +
        '<button class="iconbtn" data-shot="' + i + '" title="Screenshot this space">⛶</button>' +
        (PANES.length > 1
          ? '<button class="iconbtn" data-close="' + i + '" title="Close this space">✕</button>'
          : "") +
      "</div>" +
      '<div class="paneBody" data-i="' + i + '"></div>' +
      "</div>";
  });
  // The two handles live outside the panes and are positioned over the gaps,
  // so they do not have to be counted in any grid template.
  html += '<div class="grip v" hidden></div><div class="grip h" hidden></div>';
  wrap.innerHTML = html;
  // Every body element was just replaced, so the old pin points at a node
  // that is no longer in the document.
  MODULE_HOST = null;
  layout();
  wirePanes();
  (async function(){
    for(var i = 0; i < PANES.length; i++) await drawPane(i);
  })();
}

async function drawPane(i){
  var was = DRAW, wasPainting = PAINTING;
  DRAW = i;
  PAINTING = true;
  try{ await paint(PANES[i].page, PANES[i].arg); }
  catch(e){ /* one space failing must not stop the others drawing */ }
  finally{ DRAW = was; PAINTING = wasPainting; }
}

function wirePanes(){
  var wrap = el("panes");
  wrap.querySelectorAll("[data-pick]").forEach(function(sel){
    sel.onchange = function(){
      var i = +sel.dataset.pick;
      PANES[i] = { page: sel.value, arg: null, flex: PANES[i].flex };
      LIVE = i;
      paintPanes();
    };
  });
  wrap.querySelectorAll("[data-close]").forEach(function(b){
    b.onclick = function(){
      PANES.splice(+b.dataset.close, 1);
      LIVE = 0;
      paintPanes();
    };
  });
  wrap.querySelectorAll("[data-shot]").forEach(function(b){
    b.onclick = function(){ shoot(); };
  });
  wrap.querySelectorAll(".pane").forEach(function(p){
    p.addEventListener("pointerdown", function(){
      var i = +p.dataset.i;
      if(i === LIVE) return;
      LIVE = i;
      wrap.querySelectorAll(".pane").forEach(function(q){
        q.dataset.live = (+q.dataset.i === LIVE) ? 1 : 0;
      });
    }, true);
  });

  /* Dragging. Both handles work the same way: read where the pointer is
     as a fraction of the grid, clamp it so a space can never be dragged to
     nothing, and rewrite the template. Fractions rather than pixels, so
     rotating a board or plugging in another screen keeps the proportions
     the teacher chose. */
  wrap.querySelectorAll(".grip").forEach(function(g){
    var vertical = g.classList.contains("v");
    g.addEventListener("pointerdown", function(e){
      e.preventDefault();
      g.setPointerCapture(e.pointerId);
      g.classList.add("on");
      function move(ev){
        var r = wrap.getBoundingClientRect();
        var f = vertical ? (ev.clientX - r.left) / r.width
                         : (ev.clientY - r.top) / r.height;
        f = Math.min(0.85, Math.max(0.15, f));
        if(vertical) SPLIT = f; else ROWS = f;
        layout();
      }
      function up(){
        g.classList.remove("on");
        g.removeEventListener("pointermove", move);
        g.removeEventListener("pointerup", up);
        g.removeEventListener("pointercancel", up);
      }
      g.addEventListener("pointermove", move);
      g.addEventListener("pointerup", up);
      g.addEventListener("pointercancel", up);
    });
    /* Double-tap a handle to put it back to even. Faster than dragging it
       back, and on a board a dragged handle is easy to nudge by accident. */
    g.addEventListener("dblclick", function(){
      if(vertical) SPLIT = 0.5; else ROWS = 0.5;
      layout();
    });
  });
}

/* A picture of whatever is on the screen, using the browser's own capture
   rather than a DOM-to-canvas library. It is the only way to get a true
   screenshot without shipping a dependency, it captures the 3D view and the
   writing space correctly where a DOM copy would not, and on a board it is
   one tap and a confirm. */
async function shoot(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    alert("This board's browser cannot take a screenshot. The writing " +
          "space has its own Save as picture button.");
    return;
  }
  var stream = null;
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: "browser" }, audio: false });
    var track = stream.getVideoTracks()[0];
    var v = document.createElement("video");
    v.srcObject = stream;
    v.muted = true;
    await v.play();
    /* One frame is enough, but the first one is often blank while the
       capture warms up. */
    await new Promise(function(r){ setTimeout(r, 320); });
    var st = track.getSettings ? track.getSettings() : {};
    var cv = document.createElement("canvas");
    cv.width = st.width || v.videoWidth || 1920;
    cv.height = st.height || v.videoHeight || 1080;
    cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
    var a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = "craxlearn-" + new Date().toISOString().slice(0,16)
                   .replace(/[:T]/g,"-") + ".png";
    a.click();
  }catch(e){
    /* Cancelling the picker is not an error worth a dialog. */
  }finally{
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
  }
}

/* ---------- room size ---------- */
/* Two sizes and a button, remembered per device. A teacher sets it once on
   the board in the room and once on their own laptop, and neither has to
   think about it again. Defaulting by screen width was tried on paper and
   is wrong: a smart board reports a perfectly ordinary 1920 wide and would
   have been given laptop type. */
function scale(next){
  var v = next || localStorage.getItem("cl_scale") || "board";
  document.documentElement.setAttribute("data-scale", v);
  localStorage.setItem("cl_scale", v);
  var b = el("scaleBtn");
  if(b) b.title = v === "board" ? "Board size — press for desk size"
                                : "Desk size — press for board size";
}

/* ---------- signing in with nothing but a class code ----------
 *
 * Two taps and no credential. A child types the code the teacher wrote on
 * the board, picks their own name off the register, and is in. There is
 * nothing to remember, nothing to reset, and nothing to leak — the account
 * behind it has a synthetic address and a password nobody has ever seen.
 *
 * The name list is the whole reason a teacher types a register first. Code
 * alone would give a teacher a queue of work from "Learner 4".
 */
function codeForm(){
  el("gateForm").innerHTML =
    '<input id="gCode" placeholder="Class code" autocapitalize="characters" ' +
      'autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em">' +
    '<button class="btn" id="gCodeGo">Find my class</button>';
  el("gCodeGo").onclick = findClass;
  el("gCode").onkeydown = function(e){ if(e.key === "Enter") findClass(); };
}

async function findClass(){
  var msg = el("gateMsg");
  var code = ((el("gCode") || {}).value || "").trim();
  if(code.length < 3){ msg.textContent = "Type the code your teacher gave you."; return; }
  msg.textContent = "Looking…";
  var d;
  try{ d = await api.post("/api/craxlearn/code", { code: code }); }
  catch(e){ msg.textContent = e.message; return; }

  if(!d.roster_ready){
    msg.textContent = "Your teacher has not put the class register in yet. " +
      "Ask them to add the names, then try again.";
    return;
  }
  if(!(d.names || []).length){
    msg.textContent = "Everybody on this register has already signed in. " +
      "If none of them is you, ask your teacher to add your name.";
    return;
  }
  msg.textContent = "";
  el("gateForm").innerHTML =
    '<p class="muted" style="margin-top:0">' + esc(d.class_name) +
      (d.school ? " · " + esc(d.school) : "") + " — tap your name.</p>" +
    '<div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,9rem),1fr))">' +
      d.names.map(function(n){
        return '<button class="tile" style="min-height:auto;padding:.8rem" ' +
          'data-claim="' + n.id + '"><b>' + esc(n.name) + "</b></button>";
      }).join("") +
    "</div>" +
    '<button class="btn ghost" id="gBack" style="margin-top:.8rem">← Different code</button>';

  el("gBack").onclick = function(){ el("gateMsg").textContent = ""; codeForm(); };
  el("gateForm").querySelectorAll("[data-claim]").forEach(function(b){
    b.onclick = async function(){
      el("gateMsg").textContent = "Signing you in…";
      try{
        await api.post("/api/craxlearn/claim",
                       { code: code, roster_id: +b.dataset.claim });
        await boot();
      }catch(e){
        el("gateMsg").textContent = e.message;
        /* Somebody took that name while this list was on screen. Show the
           list again rather than leaving a dead button. */
        if(e.status === 409) findClass();
      }
    };
  });
}

/* ---------- sign in ---------- */
function gateForm(mode){
  var up = mode === "up";
  el("gateForm").innerHTML =
    (up ? '<input id="gName" placeholder="Your name" autocomplete="name">' : "") +
    '<input id="gEmail" type="email" placeholder="Email" autocomplete="email">' +
    '<input id="gPass" type="password" placeholder="Password" ' +
      'autocomplete="' + (up ? "new-password" : "current-password") + '">' +
    (up ? '<input id="gCode" placeholder="School or class code (optional)">' : "") +
    '<button class="btn" id="gGo">' + (up ? "Create account" : "Sign in") + "</button>";
  el("gGo").onclick = function(){ submit(up); };
  el("gPass").onkeydown = function(e){ if(e.key === "Enter") submit(up); };
}

async function submit(up){
  var msg = el("gateMsg");
  msg.textContent = "…";
  var body = { email:(el("gEmail").value||"").trim(),
               password:el("gPass").value||"" };
  if(up) body.name = (el("gName").value||"").trim();
  try{
    await api.post(up ? "/api/auth/signup" : "/api/auth/login", body);
    var code = up && el("gCode") ? (el("gCode").value||"").trim() : "";
    if(code){
      /* A wrong code must not cost somebody the account they just made. */
      try{ await api.post("/api/class/join", { code:code }); }
      catch(e){ msg.textContent = "Signed in, but that code did not match: "
                                  + e.message; }
    }
    await boot();
  }catch(e){
    msg.textContent = e.message;
  }
}

/* ---------- pages ---------- */
/* Every tile here is a teaching surface and there is nothing else. The list
   is short on purpose: a board at the front of a room is operated by
   somebody mid-sentence, and a menu they have to read is a menu that stops
   the lesson. */
var TILES = [
  { page:"board",  ic:"⚡", name:"Ask the board",
    sub:"Any subject, taught step by step, with a diagram where one helps." },
  { page:"write",  ic:"✍️", name:"Writing space",
    sub:"A blank surface to work on by hand. Save it as a picture." },
  { page:"calc",   ic:"🧮", name:"Calculator",
    sub:"Arithmetic, powers and roots, worked on screen where the room can see it." },
  { page:"structure", ic:"🧬", name:"3D structures",
    sub:"Turn a molecule, a crystal, a protein or an orbit around. Measured, never drawn." },
  { page:"find",   ic:"🔎", name:"Search the sources",
    sub:"A photograph or a structure from the open catalogues, with its licence." },
  { page:"phet",   ic:"🔬", name:"Simulations",
    sub:"PhET: build an atom, wire a circuit, balance an equation. Free and open." },
  { page:"scan",   ic:"📷", name:"Scan a problem",
    sub:"Photograph a question from a book or the board and have it worked through." },
  { page:"tracks", ic:"🎓", name:"Courses and exams",
    sub:"The lessons, the labs you type into, and the track exams." },
  { page:"net",    ic:"🌐", name:"Packet walkthrough",
    sub:"Send a packet through real routes and firewall rules and watch the decision." },
  { page:"lab",    ic:"🧪", name:"The lab",
    sub:"Mix real reagents and run real experiments. Every reaction from a table, never guessed." },
  { page:"sqlboard", ic:"🗄️", name:"SQL board",
    sub:"Write queries against a real database and see what comes back." },
  { page:"remote", ic:"📱", name:"Remote",
    sub:"Drive this board from your phone, so you can teach facing the room." }
];

var TEACHER_TILES = [
  { page:"roll",     ic:"👥", name:"Your classes",
    sub:"The classrooms you teach, who is in them, and how each one is doing." },
  { page:"materials", ic:"📎", name:"Study material",
    sub:"Links, PDFs and slides your class can open." },
  { page:"roster",   ic:"📋", name:"Class register",
    sub:"Type the names once, and they sign in with the class code alone." },
  { page:"inbox",    ic:"📥", name:"To review",
    sub:"Work your students have handed in, across every class." },
  { page:"activity", ic:"📊", name:"What the class is asking",
    sub:"The topics your learners have been stuck on, as counts." },
  { page:"sources",  ic:"📚", name:"Where answers come from",
    sub:"Every source we teach from, with its licence." }
];

function tile(t){
  return '<button class="tile" data-go="' + t.page + '">' +
    '<span class="ic">' + t.ic + "</span>" +
    "<b>" + esc(t.name) + "</b><span>" + esc(t.sub) + "</span></button>";
}

/* Work, on whichever login is looking.
 *
 * The same assignment, two views, both filled from the server on the way in
 * rather than by anybody pressing publish. A teacher sets it from the board
 * and it is on the students' home screen; a student hands it in and it is in
 * the teacher's inbox. Nothing in between is a state somebody has to
 * remember to move it out of, because the state somebody forgets is the one
 * that loses a term's homework.
 */
function workBlock(){
  if(isTeacher()){
    var n = (ME.inbox || {}).total || 0;
    return '<div class="eyebrow">To review</div>' +
      '<button class="card" data-go="inbox" style="width:100%;text-align:left;' +
      'cursor:pointer;border-color:' + (n ? "var(--accent)" : "var(--line)") + '">' +
        '<span class="big">' + n + "</span> " +
        '<span class="muted">' +
          (n ? "piece" + (n === 1 ? "" : "s") + " of work waiting for you"
             : "nothing waiting — you are up to date") +
        "</span></button>";
  }
  var due = (ME.assignments || []);
  if(!due.length) return "";
  return '<div class="eyebrow">Your work</div>' +
    due.map(function(a){
      var state = a.reviewed ? "✓ marked"
                : a.done     ? "handed in"
                             : "to do";
      return '<button class="card" data-asg="' + a.id + '" ' +
        'style="width:100%;text-align:left;cursor:pointer;border-color:' +
        (a.done ? "var(--line)" : "var(--accent)") + '">' +
        "<b>" + esc(a.title) + "</b><br>" +
        '<span class="muted">' + esc(a.class_name) +
          (a.subject ? " · " + esc(a.subject) : "") +
          (a.due_date ? " · due " + esc(a.due_date) : "") +
          " · " + state + "</span></button>";
    }).join("");
}

function isTeacher(){
  return ME.role === "head" || ME.role === "teacher" || ME.role === "admin";
}

function money(paise, cur){
  var n = (paise || 0) / 100;
  return (cur === "INR" ? "\u20b9" : (cur || "") + " ") +
    n.toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0 });
}

/* What a learner needs to know about themselves that is not schoolwork.
   Attendance, what is owed, what to buy, and whatever the office has put
   up — one glance, because a student checking four screens to find out
   whether they are in trouble checks none of them. Nothing here is
   editable from this app by anybody: it is the school office's to change. */
function standingBlock(){
  var st = ME.standing;
  if(!st) return "";
  var h = "";

  var urgent = (st.notices || []).filter(function(n){ return n.urgent; });
  var rest   = (st.notices || []).filter(function(n){ return !n.urgent; });
  if(urgent.length){
    h += urgent.map(function(n){
      return '<div class="note bad"><b>' + esc(n.title) + "</b>" +
        (n.body ? "<br>" + esc(n.body) : "") + "</div>";
    }).join("");
  }

  var bits = [];
  if(st.attendance_pct !== null && st.attendance_pct !== undefined){
    bits.push('<div class="card" style="flex:1 1 11rem"><div class="muted">Attendance</div>' +
      '<span class="big">' + st.attendance_pct + "%</span>" +
      '<div class="muted">' + st.days_present + " of " + st.days_recorded +
      " days</div></div>");
  }
  if(st.owed > 0){
    bits.push('<div class="card" style="flex:1 1 11rem;border-color:var(--accent)">' +
      '<div class="muted">Still to pay</div>' +
      '<span class="big">' + money(st.owed, st.currency) + "</span>" +
      '<div class="muted">' + ((st.fees || []).filter(function(f){ return !f.settled; }).length) +
      " item(s)</div></div>");
  }
  if(bits.length){
    h += '<div class="eyebrow">You</div>' +
      '<div style="display:flex;gap:1rem;flex-wrap:wrap">' + bits.join("") + "</div>";
  }

  var owing = (st.fees || []).concat(st.to_buy || [])
    .filter(function(f){ return !f.settled; });
  if(owing.length){
    h += '<div class="card">' + owing.map(function(f){
      return "<div style=\"display:flex;gap:.6rem;justify-content:space-between;" +
        "padding:.3rem 0;flex-wrap:wrap\"><span>" + esc(f.title) +
        (f.kind === "buy" ? ' <span class="muted">· to buy</span>' : "") +
        (f.due_on ? ' <span class="muted">· by ' + esc(f.due_on) + "</span>" : "") +
        "</span><b>" + money(f.outstanding, f.currency) + "</b></div>";
    }).join("") + "</div>";
  }

  if(rest.length){
    h += '<div class="eyebrow">From the school office</div>' +
      rest.map(function(n){
        return '<div class="card"><b>' + esc(n.title) + "</b>" +
          (n.body ? '<div class="muted" style="margin-top:.35rem">' +
            esc(n.body) + "</div>" : "") + "</div>";
      }).join("");
  }
  return h;
}

function home(){
  var teacher = isTeacher();
  var h = standingBlock() + workBlock();
  if(ME.institution){
    h += '<div class="card"><div class="muted">Institution</div>' +
         '<div class="big">' + esc(ME.institution.name) + "</div>" +
         '<div class="muted">' +
           esc([ME.institution.city, ME.institution.country]
                 .filter(Boolean).join(", ")) +
           (ME.classes && ME.classes.length
             ? " · " + ME.classes.map(function(c){ return esc(c.name); }).join(", ")
             : "") +
         "</div></div>";
  }

  /* A student has one classroom, and that classroom has several subjects
     with a different teacher in front of each. Naming the room alone left a
     learner unable to answer the only two questions they ever ask about it:
     what am I taught here, and who do I ask. */
  var rooms = (ME.classes || []).filter(function(c){
    return teacher ? c.mine : true; });
  if(rooms.length){
    h += '<div class="eyebrow">' +
      (teacher ? "The classrooms you teach" : "Your classroom") + "</div>";
    h += rooms.map(function(c){
      var subs = c.subjects || [];
      return '<div class="card"><b>' + esc(c.name) + "</b>" +
        (c.school ? '<span class="muted"> · ' + esc(c.school) + "</span>" : "") +
        (subs.length
          ? '<div class="subjects">' + subs.map(function(x){
              return '<div class="subject' + (x.mine ? " mine" : "") + '">' +
                "<b>" + esc(x.name) + "</b>" +
                '<span class="muted">' +
                  (x.mine ? "you teach this"
                          : (x.teacher ? esc(x.teacher)
                                       : "no teacher yet")) +
                "</span></div>";
            }).join("") + "</div>"
          : '<div class="muted" style="margin-top:.4rem">' +
            (teacher
              ? "No subjects in this class yet. A head teacher creates them."
              : "Your school has not listed this class's subjects yet.") +
            "</div>") +
        "</div>";
    }).join("");
  }
  /* Remote stays on an open board even though it needs an account: it is
     where "use your phone" lives, and a teacher looking for it must find
     the answer rather than find nothing. */
  var offer = OPEN
    ? TILES.filter(function(t){
        return OPEN_TOOLS.indexOf(t.page) >= 0 || t.page === "remote"; })
    : TILES;
  h += '<div class="eyebrow">Teaching</div><div class="tiles">' +
       offer.map(tile).join("") + "</div>";
  if(OPEN){
    h += signInPrompt("teach a topic, keep a lesson, or use your phone");
  }
  if(!teacher && (ME.classes || []).length){
    h += '<div class="eyebrow">From your teacher</div><div class="tiles">' +
      tile({ page:"materials", ic:"📎", name:"Study material",
             sub:"Links, PDFs and slides your teacher has put here." }) +
      "</div>";
  }
  if(teacher){
    h += '<div class="eyebrow">Your class</div><div class="tiles">' +
         TEACHER_TILES.map(tile).join("") + "</div>";
  }
  h += '<div class="eyebrow">This app</div>' +
       '<div class="note">' +
       "<b>Craxlearn is the teaching half of Craxle.</b> " +
       (ME.message ? esc(ME.message) + " " : "") +
       "What your learners search and ask is stored inside your institution " +
       "and is never used to answer anybody else's question. " +
       '<a href="/api/craxlearn/sources">Every source we teach from</a> is ' +
       "open, and listed with its licence." +
       "</div>";
  main().innerHTML = h;
}

/* ---------- a surface to write on ----------
 *
 * The thing a smart board is for. Everything else here is the platform
 * teaching; this is the teacher teaching, and a classroom display without
 * somewhere to write by hand is a television.
 *
 * Pointer events rather than mouse or touch, because a board is used with a
 * finger, a stylus and sometimes a mouse in the same lesson, and three
 * separate handlers is three chances for one of them to be the broken one.
 * Coalesced events are read where the browser offers them: a stylus reports
 * far faster than the screen repaints, and dropping those samples is what
 * makes handwriting look like a polygon.
 */
var PENS = [
  { name:"White", colour:"#e8eef6" }, { name:"Amber", colour:"#ff9933" },
  { name:"Green", colour:"#3fae6a" }, { name:"Red", colour:"#e05a5a" },
  { name:"Blue",  colour:"#5aa9e0" }
];

/* The board fills whatever space it is given, and then holds that shape.
 *
 * An empty board takes the pane's own proportions, so opening the writing
 * space never shows an empty margin — the surface simply IS the space. The
 * moment there is something written on it the shape is fixed, and further
 * dragging fits the board inside the pane rather than stretching it. That
 * is what every fixed-surface board on the market does, and the reason is
 * the same for all of them: a surface that stretched would turn a circle
 * drawn in a tall pane into an ellipse when the pane is dragged wide, and
 * handwriting into something nobody can read. Fitting also means nothing
 * ever goes out of reach, which is the point of not scrolling. */
var BOARD_W = 1600;

/* What is on the board outlives the element it is drawn on. Splitting the
   screen rebuilds every space, and a teacher who added a second space
   halfway through an explanation should not come back to a blank board.
   `h` is the board's height in the same units — its shape, once locked. */
var BOARD_INK = { strokes: [], undone: [], h: 900 };

function write(){
  var host = main();
  /* The space stops scrolling and becomes a column: toolbar, then surface. */
  host.classList.add("noscroll");
  host.innerHTML =
    '<div class="wboard">' +
      '<div id="wTools" class="wtools">' +
        PENS.map(function(p, i){
          return '<button class="iconbtn" data-pen="' + i + '" title="' + p.name + '" ' +
            'style="background:' + p.colour + ';border-color:' + p.colour +
            ';width:2rem"></button>';
        }).join("") +
        '<button class="iconbtn" data-pen="erase" title="Rub out">⌫</button>' +
        '<input type="range" id="wSize" min="2" max="28" value="5" ' +
          'title="Thickness" style="width:6rem">' +
        '<button class="iconbtn" id="wUndo" title="Undo">↶</button>' +
        '<button class="iconbtn" id="wRedo" title="Redo">↷</button>' +
        '<span class="grow"></span>' +
        '<button class="btn ghost" id="wClear">Clear</button>' +
        '<button class="btn ghost" id="wShot" title="Save the board as a picture">Save</button>' +
      "</div>" +
      '<div class="wsurf" id="wSurf">' +
        '<canvas id="wCanvas"></canvas>' +
        '<div class="whint" id="wHint">' +
          "Write with a finger, a stylus or a mouse." +
        "</div>" +
      "</div>" +
    "</div>" +
    (OPEN ? signInPrompt("keep this on your subject's page") : "");

  var cv = el("wCanvas"), surf = el("wSurf");
  var ctx = cv.getContext("2d");
  var pen = PENS[0].colour, size = 5, erasing = false;

  /* What is on the board, kept as points rather than pixels.
     A stroke is { c: colour, e: true when it rubs out, w: thickness,
     p: [[x, y, pressure], ...] } with x and y in board units. Because it is
     points, the board can be drawn again at any size — which is what makes
     dragging a pane bigger keep the writing instead of cropping it, and what
     makes the exported picture sharp even when the pane was a quarter of a
     phone screen. */
  var strokes = BOARD_INK.strokes, undone = BOARD_INK.undone, live = null;

  /* Where the board sits inside the pane, and how big one board unit is.
     Recomputed on every draw because the pane is dragged mid-lesson. */
  var S = 1, OX = 0, OY = 0, DPR = 1, BH = BOARD_INK.h;
  function measure(){
    var r = surf.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(r.width * DPR));
    var h = Math.max(1, Math.round(r.height * DPR));
    if(cv.width !== w) cv.width = w;
    if(cv.height !== h) cv.height = h;
    /* Nothing written yet, and nothing to bring back with Redo: the board
       is free to take the shape of the space it is in, and fill it exactly.
       Bounded, so a sliver of a pane does not produce a board that is all
       height and no width. */
    if(!strokes.length && !undone.length && !live){
      BOARD_INK.h = Math.max(BOARD_W / 4,
                     Math.min(BOARD_W * 3, Math.round(BOARD_W * h / w)));
    }
    BH = BOARD_INK.h;
    S  = Math.min(w / BOARD_W, h / BH);
    OX = (w - BOARD_W * S) / 2;
    OY = (h - BH * S) / 2;
  }

  function penWidth(s, pressure){
    return Math.max(0.5, (s.e ? s.w * 3 : s.w) * S * (0.6 + pressure * 0.8));
  }

  /* One stroke, in whatever size the board currently is. Segment by segment
     so a stylus's pressure still varies along it. */
  function drawStroke(c, s, scale, ox, oy){
    c.globalCompositeOperation = s.e ? "destination-out" : "source-over";
    c.strokeStyle = s.c;
    c.lineCap = "round";
    c.lineJoin = "round";
    var pts = s.p;
    for(var i = 1; i < pts.length; i++){
      c.lineWidth = Math.max(0.5, (s.e ? s.w * 3 : s.w) * scale
                                  * (0.6 + pts[i][2] * 0.8));
      c.beginPath();
      c.moveTo(ox + pts[i - 1][0] * scale, oy + pts[i - 1][1] * scale);
      c.lineTo(ox + pts[i][0] * scale, oy + pts[i][1] * scale);
      c.stroke();
    }
  }

  /* The whole board, onto any context. The screen and the exported picture
     go through the same function at different sizes, so what is saved is
     exactly what is shown. */
  var BOARD_BG = "#131c28";
  function paintBoard(c, scale, ox, oy, w, h){
    c.globalCompositeOperation = "source-over";
    c.clearRect(0, 0, w, h);
    /* The surface, drawn rather than assumed: when the pane is a different
       shape to the board, the margin is pane and this is where writing
       actually lands. */
    c.fillStyle = BOARD_BG;
    var bw = BOARD_W * scale, bh = BH * scale;
    if(c.roundRect){
      c.beginPath();
      c.roundRect(ox, oy, bw, bh, 12 * scale);
      c.fill();
    }else{
      c.fillRect(ox, oy, bw, bh);
    }
    var all = strokes.concat(live ? [live] : []);
    for(var i = 0; i < all.length; i++) drawStroke(c, all[i], scale, ox, oy);
    c.globalCompositeOperation = "source-over";
  }

  function redraw(){
    measure();
    paintBoard(ctx, S, OX, OY, cv.width, cv.height);
    var hint = el("wHint");
    if(hint) hint.hidden = strokes.length > 0 || !!live;
  }

  /* The pane is dragged, the board is rotated, the browser zooms: all of
     them arrive here, and all of them are answered by drawing again rather
     than by stretching a bitmap. */
  if(window.ResizeObserver){
    new ResizeObserver(function(){ redraw(); }).observe(surf);
  }else{
    window.addEventListener("resize", redraw);
  }
  redraw();

  /* Screen position to board units. Clamped, so a stroke that runs off the
     edge stops at the edge instead of being stored somewhere it can never
     be seen again. */
  function at(e){
    var r = cv.getBoundingClientRect();
    var x = ((e.clientX - r.left) * DPR - OX) / S;
    var y = ((e.clientY - r.top) * DPR - OY) / S;
    var p = (e.pressure && e.pointerType === "pen") ? e.pressure : 0.5;
    return [Math.min(BOARD_W, Math.max(0, x)),
            Math.min(BH, Math.max(0, y)), p];
  }

  /* Drawing paints only the new segment — redrawing every stroke on every
     pointer sample is what makes a board feel like it is lagging behind
     the pen. */
  function extend(pt){
    var pts = live.p;
    pts.push(pt);
    if(pts.length < 2) return;
    var a = pts[pts.length - 2], b = pt;
    ctx.globalCompositeOperation = live.e ? "destination-out" : "source-over";
    ctx.strokeStyle = live.c;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = penWidth(live, b[2]);
    ctx.beginPath();
    ctx.moveTo(OX + a[0] * S, OY + a[1] * S);
    ctx.lineTo(OX + b[0] * S, OY + b[1] * S);
    ctx.stroke();
    ctx.globalCompositeOperation = "source-over";
  }

  cv.addEventListener("pointerdown", function(e){
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    var hint = el("wHint");
    if(hint) hint.hidden = true;
    live = { c: pen, e: erasing, w: size, p: [] };
    var p0 = at(e);
    live.p.push(p0);
    extend([p0[0] + 0.01, p0[1], p0[2]]);   // a dot is a mark too
  });
  cv.addEventListener("pointermove", function(e){
    if(!live) return;
    /* A stylus reports far faster than the screen repaints. Reading the
       samples the browser held back is the difference between handwriting
       and a polygon. */
    var pts = (e.getCoalescedEvents ? e.getCoalescedEvents() : null) || [e];
    for(var i = 0; i < pts.length; i++) extend(at(pts[i]));
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function(ev){
    cv.addEventListener(ev, function(){
      if(!live) return;
      if(live.p.length > 1){
        strokes.push(live);
        undone.length = 0;    // a new mark ends the redo trail
      }
      live = null;
    });
  });

  el("wTools").querySelectorAll("[data-pen]").forEach(function(b){
    b.onclick = function(){
      if(b.dataset.pen === "erase"){ erasing = true; return; }
      erasing = false;
      pen = PENS[+b.dataset.pen].colour;
    };
  });
  el("wSize").oninput = function(){ size = +el("wSize").value; };
  /* Undo, because Clear on its own is a lesson's worth of working thrown
     away by one mis-tap, and every board a teacher has used has this. */
  el("wUndo").onclick = function(){
    if(!strokes.length) return;
    undone.push(strokes.pop());
    redraw();
  };
  el("wRedo").onclick = function(){
    if(!undone.length) return;
    strokes.push(undone.pop());
    redraw();
  };
  el("wClear").onclick = function(){
    if(strokes.length && !confirm("Rub out everything on the board?")) return;
    /* Clear is undoable: it is one tap away from a lesson's working. */
    undone.unshift.apply(undone, strokes.slice().reverse());
    strokes.length = 0;
    redraw();
  };
  /* A picture of the board — the working, not the browser chrome around it.
     Drawn from the points at a fixed size rather than copied off the screen,
     so what a teacher sends to a class is the same sharp picture whether
     they wrote it full screen or in a corner of a four-way split. Solid
     background first, or a transparent PNG opens as black on black in half
     the apps it will be sent to. */
  el("wShot").onclick = function(){
    var out = document.createElement("canvas");
    out.width = BOARD_W * 2;
    out.height = Math.round(BH * 2);
    paintBoard(out.getContext("2d"), 2, 0, 0, out.width, out.height);
    var a = document.createElement("a");
    a.href = out.toDataURL("image/png");
    a.download = "craxlearn-" + new Date().toISOString().slice(0, 16)
                   .replace(/[:T]/g, "-") + ".png";
    a.click();
  };
}

/* Mount a 3D scene, and SAY SO when it cannot be mounted.
 *
 * three.js comes from a CDN. On a school network that blocks it — or a
 * board with no internet at that moment — the viewer silently never
 * appears, and an empty box reads as "this app is broken" rather than
 * "this board cannot reach the library". One is a support call about us;
 * the other is a five-minute conversation with the IT technician.
 */
async function show3D(host, scene){
  host.innerHTML = '<div class="muted" style="padding:1rem">Drawing…</div>';
  if(!window.Three3D || !Three3D.mount){
    host.innerHTML = '<div class="note bad">The 3D viewer could not load. ' +
      "It comes from a public CDN — this board may be offline or the " +
      "network may be blocking it. Everything else here still works.</div>";
    return false;
  }
  try{
    host.innerHTML = "";
    await Three3D.mount(host, scene);
    /* mount() can resolve without having drawn anything if the library
       itself failed to arrive. A canvas is the proof it worked. */
    if(!host.querySelector("canvas")) throw new Error("nothing was drawn");
    return true;
  }catch(e){
    host.innerHTML = '<div class="note bad">The 3D viewer could not draw ' +
      "this. It comes from a public CDN — this board may be offline or the " +
      "network may be blocking it.</div>";
    return false;
  }
}

/* The subjects a teacher may file under in one class. Not a text box: a
   class has subjects and each subject has a teacher, and typing the name
   lets the same subject be filed as "Biology", "biology" and "Bio" in one
   term — which nobody notices until a class cannot find last week's work.
   The server checks this again; this is so the screen offers the truth. */
function subjectsFor(cid){
  var c = (ME.classes || []).filter(function(x){ return x.id === +cid; })[0];
  return (c && c.my_subjects) || [];
}
function subjectPicker(id, cid){
  var subs = subjectsFor(cid);
  if(!subs.length){
    return '<span class="muted" id="' + id + 'Note">' +
      "no subject here yet</span>" +
      '<input id="' + id + '" type="hidden" value="">';
  }
  return '<select id="' + id + '">' + subs.map(function(x){
    return '<option>' + esc(x) + "</option>"; }).join("") + "</select>";
}

/* ---------- the board anybody can teach on ----------
 *
 * A board in a classroom is used by whoever is standing in front of it, and
 * making the first thing it says be "sign in" is how a smart board becomes
 * the thing nobody switches on. So the writing space and the calculator open
 * with no account at all: pick up the pen, teach, rub it out.
 *
 * Signing in is what makes the board YOURS for that lesson, and it buys the
 * two things that need to know who you are — keeping what you taught on your
 * subject's page, and driving the board from your phone. Nothing is saved
 * anywhere until somebody has said who they are, which is also the right
 * answer for a machine a hundred children walk past every day.
 *
 * What is on the board survives signing in, because the ink is kept in the
 * page and not in the element: a teacher who starts writing and then signs in
 * to keep it does not lose the thing she signed in to keep.
 */
var OPEN = false;                    // running with no account

var OPEN_TOOLS = ["write", "calc"];  // everything that needs no server

function openBoard(){
  OPEN = true;
  ME = { user:{ name:"This board" }, role:"guest", classes:[],
         institution:null, open:true };
  el("gate").hidden = true;
  el("app").hidden = false;
  el("who").innerHTML = "<b>This board</b>not signed in";
  PANES = [{ page:"write", arg:null }];
  LIVE = 0;
  paintPanes();
}

/* The one thing an open board says about itself: what signing in would add.
   Shown where the Keep and Remote blocks would be, so the answer is in the
   place the question is asked rather than in a menu. */
function signInPrompt(what){
  return '<div class="note">' +
    "<b>Sign in to " + esc(what) + ".</b> This board is open — anybody can " +
    "teach on it, and nothing is kept. Signing in puts what you teach on " +
    "your own subject's page and lets your phone drive the board." +
    ' <button class="btn" data-signin="1" style="margin-top:.6rem">' +
    "Sign in</button></div>";
}

function wireSignIn(host){
  (host || document).querySelectorAll("[data-signin]").forEach(function(b){
    b.onclick = function(){
      /* Straight to the sign-in form, with the board still behind it: the
         ink is in the page, so it is still there afterwards. */
      OPEN = false;
      el("app").hidden = true;
      el("gate").hidden = false;
      tab("In");
    };
  });
}

/* ---------- the phone as a remote control ----------
 *
 * A board is bolted to a wall. Reaching it means turning your back on the
 * room, and the microphone in it is across a classroom from whoever is
 * talking. The phone already in a teacher's hand solves both: it is a
 * keypad she can see without looking up, and its microphone is six inches
 * from her mouth.
 *
 * The phone is NOT signed in. This product allows one login per account, so
 * a teacher who signed in on her phone would sign the board out from under
 * the class she is standing in front of. It holds a six-character code
 * instead, and that code buys exactly one thing: permission to change what
 * is on that one screen.
 */
var REMOTE = { on:false, code:"", timer:0, missed:0 };

function remotePanel(){
  var host = main();
  if(OPEN){
    host.innerHTML = '<div class="eyebrow">Remote</div>' +
      signInPrompt("drive this board from your phone");
    wireSignIn(host);
    return;
  }
  host.innerHTML =
    '<div class="eyebrow">Remote</div>' +
    '<div class="card">' +
      '<p class="muted" style="margin-top:0">Drive this board from your ' +
        "phone. Open Craxlearn on the phone, tap <b>Remote</b> on the sign-in " +
        "screen, and type the code below. You do not sign in on the phone — " +
        "signing in there would sign this board out." +
      "</p>" +
      '<div id="rmCode" class="remoteCode">' +
        (REMOTE.on ? esc(REMOTE.code) : "— — — — — —") + "</div>" +
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap">' +
        '<button class="btn" id="rmOn"' + (REMOTE.on ? " hidden" : "") +
          ">Turn the remote on</button>" +
        '<button class="btn ghost" id="rmOff"' + (REMOTE.on ? "" : " hidden") +
          ">Turn it off</button>" +
      "</div>" +
      '<div class="muted" id="rmMsg" style="margin-top:.6rem">' +
        (REMOTE.on ? "Listening. Anything the phone taps happens here."
                   : "Off. Nothing can drive this board.") + "</div>" +
    "</div>" +
    '<div class="eyebrow">What the phone can do</div>' +
    '<div class="card muted">' +
      "Say or type a topic and have it taught here · turn the pages of a " +
      "lesson · open any of the tools · add and close spaces · change pen " +
      "colour, undo, and rub out the writing space." +
      "<br><br>It cannot see a learner's record, a class list or a mark. " +
      "A remote changes what is on a screen; that is all this one does." +
    "</div>";

  el("rmOn").onclick = remoteOn;
  el("rmOff").onclick = remoteOff;
}

async function remoteOn(){
  var msg = el("rmMsg");
  if(msg) msg.textContent = "Asking for a code…";
  try{
    var d = await api.post("/api/craxlearn/remote/open", {});
    REMOTE.on = true;
    REMOTE.code = d.code;
    REMOTE.missed = 0;
    remoteWatch();
    if(PANES[LIVE] && PANES[LIVE].page === "remote") remotePanel();
  }catch(e){
    if(msg) msg.textContent = e.message;
  }
}

async function remoteOff(){
  REMOTE.on = false;
  REMOTE.code = "";
  clearTimeout(REMOTE.timer);
  REMOTE.timer = 0;
  try{ await api.post("/api/craxlearn/remote/close", {}); }catch(e){}
  if(PANES[LIVE] && PANES[LIVE].page === "remote") remotePanel();
}

/* Polling, not a socket. The one thing nobody controls here is a school's
   network, and a socket that dies in a corridor is a remote that stops
   working halfway through a lesson with nothing to show for it. Two seconds
   is under the time it takes to look up from a phone. */
function remoteWatch(){
  clearTimeout(REMOTE.timer);
  if(!REMOTE.on) return;
  REMOTE.timer = setTimeout(async function(){
    if(!REMOTE.on) return;
    try{
      var d = await api.get("/api/craxlearn/remote/poll");
      REMOTE.missed = 0;
      if(!d.linked){ REMOTE.on = false; return; }
      for(var i = 0; i < (d.cmds || []).length; i++){
        try{ await remoteDo(d.cmds[i]); }
        catch(e){ /* one bad command must not stop the rest */ }
      }
    }catch(e){
      /* A blip is a blip. Enough of them in a row and the board has lost
         the server, which is worth saying rather than polling forever. */
      REMOTE.missed++;
      if(REMOTE.missed > 30){ REMOTE.on = false; return; }
    }
    remoteWatch();
  }, 2000);
}

/* What a command actually does to this screen. Everything here goes through
   the same functions a tap on the board would, so the remote can never do
   something the board itself cannot. */
async function remoteDo(c){
  var k = c.kind, p = c.payload || {};
  if(k === "home"){ go("home"); return; }
  if(k === "go"){
    if(TOOL_NAMES[p.page]) go(p.page, p.arg || null);
    return;
  }
  if(k === "teach"){
    var topic = (p.topic || "").trim();
    if(topic.length < 2) return;
    /* Into the live space, so a teacher can leave a diagram up beside it. */
    go("board", topic);
    return;
  }
  if(k === "slide"){
    if(!LESSON) return;
    if(p.to === "next") lessonGo(LESSON.at + 1);
    else if(p.to === "back") lessonGo(LESSON.at - 1);
    else lessonGo(+p.to || 0);
    return;
  }
  if(k === "split"){ el("splitBtn").click(); return; }
  if(k === "close"){
    var x = document.querySelector('[data-close="' + LIVE + '"]');
    if(x) x.click();
    return;
  }
  /* The writing space, driven through its own controls: they are the only
     things that know where its ink lives. */
  if(k === "pen"){
    var b = document.querySelector('[data-pen="' + (p.i || 0) + '"]');
    if(b) b.click();
    return;
  }
  if(k === "clear"){ if(el("wClear")) el("wClear").click(); return; }
  if(k === "undo"){ if(el("wUndo")) el("wUndo").click(); return; }
  if(k === "redo"){ if(el("wRedo")) el("wRedo").click(); return; }
}

/* ---------- the phone end ----------
 *
 * A separate screen, not the app: the phone is not signed in, so there is
 * nothing here that reads anything. It sends and it says whether the board
 * heard.
 */
var PHONE = { code:"", board:"", level:"Class 10" };

function openForm(){
  el("gateForm").innerHTML =
    '<p class="muted" style="margin-top:0">Open the writing space and the ' +
      "calculator with no account. Anybody can teach on this board — nothing " +

    "</p>" +
    '<button class="btn" id="obGo">Open the board</button>' +
    '<p class="muted">Sign in when you want to keep what you taught on your ' +
      "subject's page, or drive the board from your phone. What you have " +
      "already written stays on the board when you do.</p>";
  el("obGo").onclick = openBoard;
}

function remoteJoinForm(){
  el("gateForm").innerHTML =
    '<p class="muted" style="margin-top:0">Turn on the remote on the board ' +
      "— <b>Remote</b> in its tools — and type the six characters it shows." +
    "</p>" +
    '<input id="rjCode" placeholder="Code from the board" maxlength="8" ' +
      'autocapitalize="characters" autocomplete="off" ' +
      'style="text-transform:uppercase;letter-spacing:.25em;font-size:1.2rem;' +

/* ---------- saying it instead of typing it ----------
 *
 * What is heard becomes the TOPIC, never the answer. A teacher says
 * "photosynthesis" and the board explains photosynthesis, with the same
 * diagrams and the same 3D it would have built had she typed the word —
 * it does not read her sentence back at her. The words land in the box
 * first, so a misheard one can be corrected before it is taught.
 *
 * One listen per press, not a conversation. A teacher names a topic and
 * turns back to the class; a recogniser left running would transcribe the
 * lesson, and on a board in a full classroom that is both useless and a
 * microphone nobody asked to leave open.
 *
 * Recognition is the browser's own. In Chrome that is Google's recogniser:
 * good at Indian English, and free per minute, because the audio never
 * reaches our servers. A paid speech API would put a per-second bill on the
 * most open-ended thing in a classroom.
 */
var MIC_TROUBLE = {
  "not-allowed": "This board is blocking the microphone. Allow it for this " +
    "site — the padlock in the address bar — and try again.",
  "service-not-allowed": "This board is blocking the microphone. Allow it " +
    "for this site and try again.",
  "no-speech": "I did not catch anything. Tap the mic and say it straight after.",
  "audio-capture": "No microphone was found on this board. Check it is " +
    "plugged in and not in use by another app.",
  "network": "Speech recognition needs the network and could not reach it. " +
    "Type the topic instead.",
  "aborted": "",   // stopped on purpose; say nothing
  "language-not-supported": "This board has no Indian English for speech. " +
    "Trying again in US English — say it once more.",
  "bad-grammar": "The microphone returned something unusable. Try again."
};

var MIC = { rec: null, btn: null, fallback: false };

function micStop(){
  if(MIC.rec){ try{ MIC.rec.abort(); }catch(e){} }
  MIC.rec = null;
  if(MIC.btn){ MIC.btn.classList.remove("listening"); MIC.btn = null; }
}

/* Listen once, put the words in `box`, then run `then`. `say` reports
   trouble wherever this particular tool shows its messages. */
function hearInto(btn, box, then, say){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    say("This board's browser cannot listen. Chrome and Edge can; Firefox " +
        "cannot. Type the topic instead.");
    return;
  }
  /* A second press stops it. Without this it tried to open a second
     recogniser and threw, which reads as a mic that will not let go. */
  if(MIC.rec){ micStop(); say(""); return; }

  var r = new SR();
  MIC.rec = r;
  MIC.btn = btn;
  btn.classList.add("listening");
  r.lang = MIC.fallback ? "en-US" : "en-IN";
  r.interimResults = false;
  r.maxAlternatives = 1;
  say("Listening — say the topic.");

  r.onresult = function(ev){
    var heard = ((ev.results[0][0] || {}).transcript || "").trim();
    micStop();
    if(!heard){ say("I did not catch that. Try once more."); return; }
    box.value = heard;
    say("");
    then();
  };
  r.onerror = function(ev){
    var code = (ev && ev.error) || "";
    micStop();
    /* Some browsers ship no Indian English and refuse the locale outright.
       One silent retry in US English, which every one of them has. */
    if(code === "language-not-supported" && !MIC.fallback){
      MIC.fallback = true;
      hearInto(btn, box, then, say);
      return;
    }
    var m = MIC_TROUBLE[code];
    say(m !== undefined ? m
        : "The microphone reported “" + (code || "an unknown fault") +
          "”. Try again, or type it instead.");
  };
  r.onend = function(){ micStop(); };
  try{ r.start(); }
  catch(e){
    micStop();
    say("The microphone was already busy. Try again.");
  }
}
