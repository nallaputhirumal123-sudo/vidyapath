/* ---------- the courses, the lessons and the exams ----------
 *
 * Fetched once and kept. The curriculum is 19 tracks and 82 lessons of
 * mostly static text; re-fetching it every time somebody opens a lesson is
 * a megabyte a lesson on a school connection shared by thirty devices.
 */
var CURRICULUM = null;
async function curriculum(){
  if(CURRICULUM) return CURRICULUM;
  CURRICULUM = (await api.get("/api/curriculum")).tracks || [];
  return CURRICULUM;
}
var PROGRESS = {}, QUIZ_PASSED = {};
async function progress(){
  try{
    /* The endpoint answers {done:{slug:true}, code:{slug:"..."}, quiz:{...}},
       not a list of rows. Reading it as a list left every lesson looking
       unfinished and threw away saved lab work on the way. */
    var d = await api.get("/api/progress");
    PROGRESS = {};
    Object.keys(d.done || {}).forEach(function(slug){
      PROGRESS[slug] = { completed:true };
    });
    Object.keys(d.code || {}).forEach(function(slug){
      PROGRESS[slug] = PROGRESS[slug] || {};
      PROGRESS[slug].code = d.code[slug];
    });
    QUIZ_PASSED = d.quiz || {};
  }catch(e){ PROGRESS = {}; QUIZ_PASSED = {}; }
  return PROGRESS;
}

async function tracks(){
  main().innerHTML = '<div class="muted">Loading the courses…</div>';
  var ts = await curriculum();
  await progress();
  if(!ts.length){
    main().innerHTML = '<div class="card muted">No courses are loaded on ' +
      "this server yet.</div>";
    return;
  }
  var byAud = {};
  ts.forEach(function(t){ (byAud[t.audience] = byAud[t.audience] || []).push(t); });
  var h = "";
  Object.keys(byAud).sort().forEach(function(aud){
    h += '<div class="eyebrow">' + esc(aud === "school" ? "School" : aud) +
      "</div><div class=\"tiles\">" +
      byAud[aud].map(function(t){
        var done = (t.lessons || []).filter(function(l){
          return PROGRESS[l.id] && PROGRESS[l.id].completed; }).length;
        return '<button class="tile" data-track="' + esc(t.id) + '">' +
          '<span class="ic">' + esc(t.icon || "📘") + "</span><b>" +
          esc(t.name) + "</b><span>" + esc(t.desc || "") + "</span>" +
          '<span class="muted">' + done + " of " + (t.lessons || []).length +
          " lessons" + ((t.quiz || []).length ? " · has an exam" : "") +
          "</span></button>";
      }).join("") + "</div>";
  });
  main().innerHTML = h;
  main().querySelectorAll("[data-track]").forEach(function(b){
    b.onclick = function(){ go("track", b.dataset.track); };
  });
}

function findTrack(id){
  return (CURRICULUM || []).filter(function(t){ return t.id === id; })[0];
}

async function track(id){
  await curriculum();
  await progress();
  var t = findTrack(id);
  if(!t){ return tracks(); }
  var h = '<button class="btn ghost" data-go="tracks">← All courses</button>' +
    "<h1 style=\"margin-top:.8rem\">" + esc(t.icon || "") + " " + esc(t.name) + "</h1>" +
    '<p class="muted">' + esc(t.desc || "") + "</p>";
  if((t.outcomes || []).length){
    h += '<div class="card"><b>By the end you can</b>' +
      t.outcomes.map(function(o){ return "<div>· " + esc(o) + "</div>"; }).join("") +
      "</div>";
  }
  h += (t.lessons || []).map(function(l, i){
    var done = PROGRESS[l.id] && PROGRESS[l.id].completed;
    return '<button class="card" data-lesson="' + esc(l.id) +
      '" style="width:100%;text-align:left;cursor:pointer">' +
      (done ? '<span style="color:var(--ok)">✓</span> ' : (i + 1) + ". ") +
      "<b>" + esc(l.title) + "</b>" +
      '<span class="muted"> · ' + (l.mins || 10) + " min" +
      ((l.lab && l.lab.prompt) ? " · has a lab" : "") + "</span></button>";
  }).join("");
  if((t.quiz || []).length){
    h += '<button class="btn" data-exam="' + esc(t.id) + '">Take the exam · ' +
      t.quiz.length + " questions</button>";
  }
  main().innerHTML = h;
  main().querySelectorAll("[data-lesson]").forEach(function(b){
    b.onclick = function(){ go("lesson", { track:id, lesson:b.dataset.lesson }); };
  });
  var ex = main().querySelector("[data-exam]");
  if(ex) ex.onclick = function(){ go("exam", id); };
}

/* Python runs through Pyodide, JavaScript through the browser itself.
 * Both fail out loud: a lab that silently does nothing is a lesson a
 * learner decides is broken and skips. */
var PY = null, PY_FAILED = false;
async function pyodide(){
  if(PY) return PY;
  if(PY_FAILED) return null;
  try{
    if(!window.loadPyodide){
      await new Promise(function(res, rej){
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
        s.onload = res;
        s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    PY = await window.loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/" });
    return PY;
  }catch(e){ PY_FAILED = true; return null; }
}

async function runCode(lang, code){
  if(lang === "js"){
    var out = [];
    var log = console.log;
    console.log = function(){ out.push([].slice.call(arguments).join(" ")); };
    try{ new Function(code)(); }
    catch(e){ out.push(String(e)); }
    finally{ console.log = log; }
    return out.join("\n") || "(nothing printed)";
  }
  var py = await pyodide();
  if(!py){
    return "Python could not start on this board. It is downloaded from a " +
           "public CDN — this board may be offline or the network may be " +
           "blocking it.";
  }
  py.runPython("import sys, io\n_b = io.StringIO()\nsys.stdout = _b\nsys.stderr = _b");
  try{ py.runPython(code); }
  catch(e){ py.runPython("import traceback; traceback.print_exc()"); }
  return py.runPython(
    "sys.stdout = sys.__stdout__\nsys.stderr = sys.__stderr__\n_b.getvalue()")
    || "(nothing printed)";
}

async function lesson(arg){
  await curriculum();
  await progress();
  var t = findTrack(arg && arg.track);
  var l = t && (t.lessons || []).filter(function(x){
    return x.id === (arg && arg.lesson); })[0];
  if(!l) return tracks();

  var done = PROGRESS[l.id] && PROGRESS[l.id].completed;
  var h = '<button class="btn ghost" data-back="' + esc(t.id) + '">← ' +
      esc(t.name) + "</button>" +
    "<h1 style=\"margin-top:.8rem\">" + esc(l.title) + "</h1>" +
    /* Lesson bodies are HTML in the curriculum — <h3>, <p>, <pre><code> —
       written by us and seeded from the repository's own files, not typed
       by a user. Escaping them printed the tags on the screen. */
    '<div class="card lessonBody">' + (l.content || "") + "</div>";

  if(l.lab && l.lab.prompt){
    h += '<div class="eyebrow">Try it</div><div class="card">' +
      '<div class="muted" style="margin-bottom:.5rem">' + esc(l.lab.prompt) + "</div>" +
      '<textarea id="labCode" rows="10" spellcheck="false" ' +
        'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;' +
        'font-size:.66rem;padding:.6rem;border-radius:12px;border:1px solid ' +
        'var(--line);background:var(--panel2);color:var(--text)">' +
        esc((PROGRESS[l.id] && PROGRESS[l.id].code) || l.lab.starter || "") +
      "</textarea>" +
      '<div style="margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap">' +
        '<button class="btn" id="labRun">Run it</button>' +
        '<button class="btn ghost" id="labSave">Save my work</button>' +
        (l.lab.solution ? '<button class="btn ghost" id="labSol">Show one answer</button>' : "") +
      "</div>" +
      '<pre id="labOut" class="wrap" style="margin-top:.6rem;font-size:.64rem;' +
        'background:var(--panel2);padding:.6rem;border-radius:12px;' +
        'min-height:2rem;white-space:pre-wrap"></pre>' +
      "</div>";
  }

  if((l.exercises || []).length){
    h += '<div class="eyebrow">Questions</div>' +
      l.exercises.map(function(x, i){
        return '<div class="card"><b>' + (i + 1) + ".</b> " +
          esc(x.q || x.prompt || "") +
          (x.a ? '<details style="margin-top:.4rem"><summary class="muted">' +
            "Show the answer</summary><div style=\"white-space:pre-wrap\">" +
            esc(x.a) + "</div></details>" : "") + "</div>";
      }).join("");
  }

  h += '<button class="btn" id="lDone">' +
    (done ? "✓ Finished — mark it unfinished" : "Mark this lesson finished") +
    '</button> <span class="muted" id="lMsg"></span>';
  main().innerHTML = h;

  main().querySelector("[data-back]").onclick = function(){ go("track", t.id); };
  el("lDone").onclick = async function(){
    try{
      await api.post("/api/progress", { lesson: l.id, completed: !done });
      await progress();
      lesson(arg);
    }catch(e){ el("lMsg").textContent = e.message; }
  };
  var run = el("labRun");
  if(run) run.onclick = async function(){
    el("labOut").textContent = "Running…";
    el("labOut").textContent = await runCode(l.lang === "js" ? "js" : "py",
                                             el("labCode").value || "");
  };
  var save = el("labSave");
  if(save) save.onclick = async function(){
    try{
      await api.post("/api/progress", { lesson: l.id,
                                        code: el("labCode").value || "" });
      el("labOut").textContent = "Saved.";
    }catch(e){ el("labOut").textContent = e.message; }
  };
  var sol = el("labSol");
  if(sol) sol.onclick = function(){ el("labCode").value = l.lab.solution; };
}

/* The exam. Marked here and recorded on the server, which is where the
   teacher's view of "what exams they did take" comes from. */
async function exam(id){
  await curriculum();
  var t = findTrack(id);
  if(!t || !(t.quiz || []).length) return tracks();
  var picks = {};

  main().innerHTML =
    '<button class="btn ghost" data-back="' + esc(t.id) + '">← ' +
      esc(t.name) + "</button>" +
    "<h1 style=\"margin-top:.8rem\">" + esc(t.name) + " — exam</h1>" +
    '<p class="muted">' + t.quiz.length + " questions. Every one has to be " +
      "right to pass, and you may retake it as often as you like.</p>" +
    t.quiz.map(function(q, qi){
      return '<div class="card"><b>' + (qi + 1) + ".</b> " + esc(q.q) +
        '<div style="margin-top:.5rem">' + (q.o || []).map(function(o, oi){
          return '<button class="btn ghost" data-q="' + qi + '" data-o="' + oi +
            '" style="display:block;width:100%;text-align:left;margin-bottom:.3rem">' +
            esc(o) + "</button>";
        }).join("") + "</div></div>";
    }).join("") +
    '<button class="btn" id="exGo">Hand it in</button> ' +
    '<span class="muted" id="exMsg"></span>';

  main().querySelector("[data-back]").onclick = function(){ go("track", t.id); };
  main().querySelectorAll("[data-q]").forEach(function(b){
    b.onclick = function(){
      var qi = b.dataset.q;
      main().querySelectorAll('[data-q="' + qi + '"]').forEach(function(x){
        x.className = "btn ghost";
        x.style.display = "block"; x.style.width = "100%";
        x.style.textAlign = "left"; x.style.marginBottom = ".3rem";
      });
      b.className = "btn";
      b.style.display = "block"; b.style.width = "100%";
      b.style.textAlign = "left"; b.style.marginBottom = ".3rem";
      picks[qi] = +b.dataset.o;
    };
  });
  el("exGo").onclick = async function(){
    var score = 0;
    t.quiz.forEach(function(q, qi){ if(picks[qi] === q.a) score++; });
    try{
      var r = await api.post("/api/quiz", { track: t.id, score: score,
                                            total: t.quiz.length });
      el("exMsg").textContent = score + " of " + t.quiz.length + " — " +
        (r.passed ? "passed. It is on your record."
                  : "not passed yet. Look again at the ones you missed.");
    }catch(e){ el("exMsg").textContent = e.message; }
  };
}

/* ---------- PhET simulations ----------
 *
 * Embedded from PhET's own servers, so what a class runs is the current
 * published version and the CC BY licence is satisfied by pointing at the
 * original rather than copying it. The server has already checked that each
 * one answers, so nothing here can be a 404 on the board mid-lesson.
 */
async function phet(pick){
  main().innerHTML = '<div class="eyebrow">Simulations</div>' +
    '<div class="muted">Loading what PhET has…</div>';
  var d;
  try{ d = await api.get("/api/craxlearn/phet"); }
  catch(e){ main().innerHTML = '<div class="note bad">' + esc(e.message) + "</div>"; return; }

  if(!(d.sims || []).length){
    main().innerHTML = '<div class="eyebrow">Simulations</div>' +
      '<div class="note bad">' + esc(d.note || "Nothing available.") + "</div>";
    return;
  }
  var subs = {};
  d.sims.forEach(function(s){ (subs[s.subject] = subs[s.subject] || []).push(s); });

  var chosen = pick || d.sims[0].id;
  var sim = d.sims.filter(function(s){ return s.id === chosen; })[0] || d.sims[0];
  remember(sim.id);

  var host = main();
  host.classList.add("noscroll");
  host.innerHTML = '<div class="fillcol">' +
    '<div class="eyebrow">Simulations</div>' +
    '<div class="card" style="padding:.7rem;max-height:40%;overflow-y:auto">' +
      Object.keys(subs).sort().map(function(k){
        return '<div style="margin-bottom:.4rem"><span class="muted">' + esc(k) +
          "</span><br>" + subs[k].map(function(x){
            return '<button class="btn ' + (x.id === sim.id ? "" : "ghost") +
              '" data-sim="' + esc(x.id) + '" style="margin:.2rem .3rem 0 0">' +
              esc(x.title) + "</button>";
          }).join("") + "</div>";
      }).join("") +
    "</div>" +
    '<div class="card viewer" style="background:#000">' +
      '<iframe src="' + esc(sim.url) + '" title="' + esc(sim.title) + '" ' +
        'style="border-radius:12px;background:#000" allowfullscreen></iframe>' +
    "</div>" +
    '<div class="muted">' + esc(sim.title) + " · " +
      esc(d.licence) + ' · <a href="' + esc(sim.page) +
      '" target="_blank" rel="noopener">on PhET</a></div>' +
    "</div>";

  main().querySelectorAll("[data-sim]").forEach(function(b2){
    b2.onclick = function(){ phet(b2.dataset.sim); };
  });
}

/* ---------- a calculator the back row can read ---------- */
function calc(){
  main().innerHTML =
    '<div class="eyebrow">Calculator</div>' +
    '<div class="card" style="max-width:26rem">' +
      '<input id="cIn" placeholder="12 * (3 + 4) - 2^5" ' +
        'style="width:100%;font-size:1rem;text-align:right" autocomplete="off">' +
      '<div id="cOut" class="big" style="text-align:right;margin:.6rem 0;' +
        'min-height:1.6rem;color:var(--accent)"></div>' +
      '<div class="muted" id="cErr"></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.7rem">' +
        ["7","8","9","/","4","5","6","*","1","2","3","-","0",".","(",")",
         "^","sqrt(","%","+"].map(function(k){
          return '<button class="btn ghost" data-k="' + k + '">' + k + "</button>";
        }).join("") +
        '<button class="btn ghost" data-k="back">←</button>' +
        '<button class="btn ghost" data-k="clear">C</button>' +
        '<button class="btn" data-k="eq" style="grid-column:span 2">=</button>' +
      "</div></div>" +
    '<div class="muted" style="max-width:26rem">Worked on the server with the ' +
      "same checker the lessons use, so it cannot run anything but arithmetic.</div>";

  var inp = el("cIn");
  function press(k){
    if(k === "clear"){ inp.value = ""; el("cOut").textContent = ""; el("cErr").textContent = ""; return; }
    if(k === "back"){ inp.value = inp.value.slice(0, -1); return; }
    if(k === "eq"){ run(); return; }
    inp.value += k;
    inp.focus();
  }
  async function run(){
    var expr = (inp.value || "").trim();
    if(!expr) return;
    el("cErr").textContent = "";
    try{
      var d = await api.post("/api/craxlearn/calc", { expression: expr });
      el("cOut").textContent = d.result;
    }catch(e){
      el("cOut").textContent = "";
      el("cErr").textContent = e.message;
    }
  }
  main().querySelectorAll("[data-k]").forEach(function(b){
    b.onclick = function(){ press(b.dataset.k); };
  });
  inp.onkeydown = function(e){ if(e.key === "Enter") run(); };
  inp.focus();
}

/* ---------- study material ----------
 *
 * One screen, two audiences. A student gets a list they can open; a teacher
 * gets the same list with a way to add to it and take things off it. Not two
 * pages, because material a teacher cannot see the way a student sees it is
 * material that turns out to be broken during a lesson.
 */
function pickClass(){
  /* Which class this screen is about. A learner is normally in one; a head
     teacher has several, so they choose. */
  var cls = ME.classes || [];
  if(!cls.length) return null;
  if(!ME.pickedClass || !cls.some(function(c){ return c.id === ME.pickedClass; })){
    ME.pickedClass = cls[0].id;
  }
  return ME.pickedClass;
}

function classPicker(onPick){
  var cls = ME.classes || [];
  if(cls.length < 2) return "";
  return '<select id="clsPick" style="margin-bottom:.8rem">' +
    cls.map(function(c){
      return '<option value="' + c.id + '"' +
        (c.id === ME.pickedClass ? " selected" : "") + ">" +
        esc(c.name) + "</option>";
    }).join("") + "</select>";
}

async function materials(){
  var cid = pickClass();
  if(!cid){
    main().innerHTML = '<div class="card muted">You are not in a class yet. ' +
      "Join one with a class code, or ask your teacher for one.</div>";
    return;
  }
  main().innerHTML = '<div class="muted">Loading…</div>';
  var d;
  try{ d = await api.get("/api/class/" + cid + "/materials"); }
  catch(e){ main().innerHTML = '<div class="note bad">' + esc(e.message) + "</div>"; return; }

  var h = '<div class="eyebrow">Study material</div>' + classPicker();
  if(!(d.materials || []).length){
    h += '<div class="card muted">Nothing here yet.</div>';
  }else{
    h += (d.materials).map(function(m){
      /* A lesson kept from the board opens where it is. A link and a file
         cannot — they live somewhere else — but the words of a lesson are
         right here, and making somebody download them to read them is how a
         revision note goes unread the night before an exam. */
      var open = m.kind === "lesson"
        ? '<button class="btn ghost" data-openmat="' + m.id + '">Read it</button>'
        : m.kind === "link"
        ? '<a class="btn ghost" href="' + esc(m.url) + '" target="_blank" rel="noopener">Open the link</a>'
        : '<a class="btn ghost" href="/api/material/' + m.id + '/file" target="_blank">Open ' +
          esc(m.file_name || "the file") + "</a>";
      /* Subject and teacher on every card. A reading list from nobody in
         particular leaves a class not knowing whose lesson it is for or
         which teacher to ask about it. */
      var meta = [m.subject, m.by ? "put up by " + m.by : "",
                  (m.at || "").slice(0, 10)].filter(Boolean).join(" · ");
      return '<div class="card"><b>' + esc(m.title) + "</b>" +
        (meta ? '<div class="muted" style="margin-top:.2rem">' + esc(meta) + "</div>" : "") +
        (m.note ? '<div class="muted" style="margin:.35rem 0">' + esc(m.note) + "</div>" : "") +
        '<div style="margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">' +
          open +
          (m.size ? '<span class="muted">' + Math.max(1, Math.round(m.size/1000)) + " KB</span>" : "") +
          (isTeacher() ? '<button class="btn ghost" data-delmat="' + m.id + '">Remove</button>' : "") +
        "</div>" +
        (m.kind === "lesson"
          ? '<div class="lessonKept" id="mBody' + m.id + '" hidden>' +
            m.body.split("\n").map(function(ln){
              return ln.trim() ? "<p>" + esc(ln) + "</p>" : "";
            }).join("") +
            /* The pictures the lesson was taught with, kept beside its
               words. A lesson whose point was the molecule the class turned
               around is not that lesson with the molecule taken out. */
            (m.figures || []).map(function(f, i){
              return '<div class="figcap">' +
                (f.how === "scene" ? "🧊 " : "✏️ ") +
                esc((f.spec && f.spec.caption) || "") + "</div>" +
                '<div class="fig' + (f.how === "scene" ? " fig3d" : "") +
                '"' + (f.how === "scene" ? ' data-fill="1"' : "") +
                ' id="mFig' + m.id + "_" + i + '"></div>';
            }).join("") +
            "</div>"
          : "") +
        "</div>";
    }).join("");
  }

  if(isTeacher()){
    h += '<div class="eyebrow">Add something</div>' +
      '<div class="card"><b>A link</b>' +
        '<input id="mTitle" placeholder="What is it called" style="width:100%;margin:.5rem 0">' +
        '<input id="mSubject" placeholder="Subject — Science, Maths…" style="width:100%;margin-bottom:.5rem">' +
        '<input id="mUrl" placeholder="https://…" style="width:100%;margin-bottom:.5rem">' +
        '<input id="mNote" placeholder="Why they should read it (optional)" style="width:100%;margin-bottom:.5rem">' +
        '<button class="btn" id="mAdd">Add the link</button>' +
        ' <span class="muted" id="mMsg"></span>' +
      "</div>" +
      '<div class="card"><b>A file</b>' +
        '<div class="muted" style="margin:.35rem 0">PDF, PowerPoint, Word, ' +
          "text or an image. Up to 12 MB — link to anything bigger.</div>" +
        '<input type="file" id="mFile" style="width:100%;margin-bottom:.5rem" ' +
          'accept=".pdf,.ppt,.pptx,.doc,.docx,.txt,.png,.jpg,.jpeg,.webp">' +
        '<input id="mFTitle" placeholder="What is it called (optional)" style="width:100%;margin-bottom:.5rem">' +
        '<input id="mFSubject" placeholder="Subject — Science, Maths…" style="width:100%;margin-bottom:.5rem">' +
        '<button class="btn" id="mUp">Upload it</button>' +
        ' <span class="muted" id="mFMsg"></span>' +
      "</div>";
  }
  main().innerHTML = h;

  var pick = el("clsPick");
  if(pick) pick.onchange = function(){ ME.pickedClass = +pick.value; materials(); };

  main().querySelectorAll("[data-openmat]").forEach(function(b){
    b.onclick = async function(){
      var id = b.dataset.openmat, box = el("mBody" + id);
      if(!box) return;
      box.hidden = !box.hidden;
      b.textContent = box.hidden ? "Read it" : "Close it";
      /* Mounted when it is opened, not when the list is drawn: a subject
         page with a term's lessons on it would otherwise start every 3D
         scene on it at once, all of them behind a closed card. */
      if(box.hidden || box.dataset.drawn) return;
      box.dataset.drawn = "1";
      var mat = (d.materials || []).filter(function(x){
        return String(x.id) === String(id); })[0];
      await mountFigures(((mat && mat.figures) || []).map(function(f, i){
        return { how: f.how, id: "mFig" + id + "_" + i, spec: f.spec };
      }));
    };
  });
  main().querySelectorAll("[data-delmat]").forEach(function(b){
    b.onclick = async function(){
      try{ await api.del("/api/teacher/material/" + b.dataset.delmat); materials(); }
      catch(e){ alert(e.message); }
    };
  });

  var add = el("mAdd");
  if(add) add.onclick = async function(){
    el("mMsg").textContent = "Adding…";
    try{
      await api.post("/api/teacher/class/" + cid + "/material/link", {
        title: el("mTitle").value || "", url: el("mUrl").value || "",
        subject: el("mSubject").value || "",
        note: el("mNote").value || "" });
      materials();
    }catch(e){ el("mMsg").textContent = e.message; }
  };

  var up = el("mUp");
  if(up) up.onclick = async function(){
    var f = (el("mFile").files || [])[0];
    if(!f){ el("mFMsg").textContent = "Choose a file first."; return; }
    el("mFMsg").textContent = "Uploading…";
    var fd = new FormData();
    fd.append("file", f);
    fd.append("title", el("mFTitle").value || "");
    fd.append("subject", el("mFSubject").value || "");
    /* Sent with fetch directly rather than through api.post: this is
       multipart, and setting Content-Type by hand strips the boundary the
       browser generates, which the server then cannot parse. */
    try{
      var r = await fetch("/api/teacher/class/" + cid + "/material/file",
                          { method:"POST", credentials:"same-origin", body:fd });
      var data = null;
      try{ data = await r.json(); }catch(err){}
      if(!r.ok) throw new Error((data && data.detail) || "Upload failed");
      materials();
    }catch(e){ el("mFMsg").textContent = e.message; }
  };
}

/* The step-by-step board. Kept simple on purpose: this is the corner of a
   lesson, not the main app's full board with its lenses and deeper links. */
async function board(topic){
  var t = (topic || "").trim();
  main().innerHTML =
    '<div class="eyebrow">Ask the board</div>' +
    '<div class="card"><div style="display:flex;gap:.5rem;flex-wrap:wrap">' +
      '<input id="bTopic" style="flex:1 1 16rem" ' +
        'placeholder="Anything — photosynthesis, longest prefix match, the quadratic formula" ' +
        'value="' + esc(t) + '">' +
      micButton("bMic") +
      '<select id="bLevel">' +
        ["Class 6","Class 8","Class 10","Class 12","Undergraduate","Research"]
          .map(function(l){ return '<option>' + l + "</option>"; }).join("") +
      "</select>" +
      '<button class="btn" id="bGo">Teach it</button>' +
    '</div><div class="muted" id="bMsg" style="margin-top:.4rem">' +
      "Say it or type it — either way the board explains the idea, with a " +
      "drawing or something to turn around where one helps." +
    "</div></div><div id=\"bOut\"></div>";
  el("bGo").onclick = teach;
  el("bTopic").onkeydown = function(e){ if(e.key === "Enter") teach(); };
  /* Spoken and typed go down the same path on purpose: what she said is the
     topic, and what comes back is the concept explained — never her sentence
     repeated. */
  el("bMic").onclick = function(){
    hearInto(el("bMic"), el("bTopic"), teach, function(m){
      var b = el("bMsg");
      if(b) b.textContent = m || "Say it or type it — either way the board " +
        "explains the idea, with a drawing or something to turn around " +
        "where one helps.";
    });
  };
  if(t) teach();
}

/* A taught lesson, as pages.
 *
 * A board is not a document. Thirty people are looking at one screen from
 * across a room, and a teacher who has to find her place in a scroll after
 * every question has lost the room. So a lesson is pages by default: one
 * step at a time, filling the space, with Next and Back big enough to hit
 * without looking.
 *
 * Scrolling is still there for anybody who wants the whole thing at once —
 * revising from it, or reading it on a phone — and which one you get is
 * remembered, because it is a preference and not a decision to make again
 * every lesson.
 */
var LESSON = null;   // the lesson on the board, its pages, and where we are

function lessonView(){
  try{ return localStorage.getItem("cl.lessonView") === "scroll"
         ? "scroll" : "pages"; }
  catch(e){ return "pages"; }
}
function setLessonView(v){
  try{ localStorage.setItem("cl.lessonView", v); }catch(e){}
}

/* One step becomes one page. A step carrying a drawing is a page of its own
   whatever else is on it — two figures on one board page is two things
   nobody is looking at. */
function lessonPages(L, topic){
  var pages = [];

  if(L.photo && L.photo.url){
    pages.push({
      title: L.title || topic,
      html: '<div class="card"><img src="' + esc(L.photo.url) + '" alt="" ' +
        'style="max-width:100%;border-radius:12px;display:block">' +
        '<div class="muted" style="margin-top:.5rem">' +
        esc(L.photo.title || "") +
        (L.photo.credit ? " · " + esc(L.photo.credit) : "") +
        (L.photo.licence ? " · " + esc(L.photo.licence) : "") + "</div></div>",
      figures: []
    });
  }

  (L.steps || []).forEach(function(st, i){
    var body = typeof st === "string" ? st : (st.t || "");
    var figs = [];
    var h = '<div class="card"><div class="muted">Step ' + (i + 1) +
      (st && st.where ? " · " + esc(st.where) : "") + "</div>" +
      body.split("\n").filter(Boolean)
          .map(function(ln){ return "<p>" + esc(ln) + "</p>"; }).join("");
    if(st && st.code){
      h += '<pre class="wrap" style="font-size:.62rem;background:var(--panel2);' +
           'padding:.7rem;border-radius:12px"><code>' + esc(st.code) +
           "</code></pre>";
    }
    if(st && st.draw){
      h += '<div class="figcap">✏️ ' + esc(st.draw.caption || "") + "</div>" +
           '<div class="fig" id="bDraw' + i + '"></div>';
      figs.push({ how:"draw", id:"bDraw" + i, spec:st.draw });
    }
    if(st && st.sketch){
      h += '<div class="figcap">✏️ ' + esc(st.sketch.caption || "") + "</div>" +
           '<div class="fig" id="bSketch' + i + '"></div>';
      figs.push({ how:"sketch", id:"bSketch" + i, spec:st.sketch });
    }
    if(st && st.scene){
      h += '<div class="figcap">🧊 ' +
           esc(st.scene.caption || "Drag to turn it, pinch or scroll to zoom") +
           "</div>" +
           '<div class="fig fig3d" data-fill="1" id="bScene' + i + '"></div>';
      figs.push({ how:"scene", id:"bScene" + i, spec:st.scene });
    }
    h += "</div>";
    pages.push({ title: L.title || topic, html: h, figures: figs });
  });

  /* The last page: what to remember, and where it could go next. Both were
     being thrown away before — on a board the second one is the question a
     teacher would otherwise have to think of while thirty people watch. */
  var last = "";
  if(L.takeaway) last += '<div class="note"><b>Remember:</b> ' + esc(L.takeaway) + "</div>";
  if((L.deeper || []).length){
    last += '<div class="eyebrow">Go further</div><div class="card">' +
      L.deeper.map(function(x){
        return '<button class="btn ghost" data-deeper="' + esc(x) +
          '" style="margin:.2rem .3rem 0 0">' + esc(x) + "</button>";
      }).join("") + "</div>";
  }
  if(last) pages.push({ title: L.title || topic, html: last, figures: [] });

  if(!pages.length){
    pages.push({ title: L.title || topic,
                 html: '<div class="note">This lesson came back empty.</div>',
                 figures: [] });
  }
  return pages;
}

/* Fill the figure boxes on a page. Only ever the page being shown: three
   live 3D scenes on a wall-mounted board is three renderers competing for
   one GPU, and two of them are behind the one anybody is looking at. */
async function mountFigures(figures){
  for(var i = 0; i < figures.length; i++){
    var f = figures[i], host = el(f.id);
    if(!host) continue;
    try{
      if(f.how === "draw" && window.Draw) Draw.mount(host, f.spec);
      else if(f.how === "sketch" && window.Sketch) Sketch.mount(host, f.spec);
      else if(f.how === "scene") await show3D(host, f.spec);
      else host.innerHTML = '<div class="muted" style="padding:1rem">' +
        "This drawing needs a file the board could not load.</div>";
    }catch(e){
      /* One figure failing must not take the lesson with it. A lesson with a
         missing drawing is still a lesson. */
      host.innerHTML = '<div class="muted" style="padding:1rem">' +
        "This drawing could not be built.</div>";
    }
  }
}

function lessonGo(to){
  if(!LESSON) return;
  var n = LESSON.pages.length;
  LESSON.at = Math.max(0, Math.min(n - 1, to));
  paintLesson();
}

function paintLesson(){
  var out = el("bOut");
  if(!out || !LESSON) return;
  var pages = LESSON.pages, n = pages.length;
  var scrolling = LESSON.view === "scroll";

  var bar =
    '<div class="lessonBar">' +
      '<h1 style="margin:0;flex:1 1 12rem">' + esc(LESSON.title) + "</h1>" +
      (scrolling ? "" :
        '<button class="iconbtn" id="bPrev" title="Back">‹</button>' +
        '<span class="muted" id="bWhere">' + (LESSON.at + 1) + " / " + n + "</span>" +
        '<button class="iconbtn" id="bNext" title="Next">›</button>') +
      '<button class="btn ghost" id="bView" title="' +
        (scrolling ? "Show it a page at a time" : "Show the whole thing to scroll") +
        '">' + (scrolling ? "Pages" : "Scroll") + "</button>" +
    "</div>";

  if(scrolling){
    out.innerHTML = bar + '<div class="lessonScroll">' +
      pages.map(function(p){ return p.html; }).join("") + "</div>" + LESSON.tail;
    var all = [];
    pages.forEach(function(p){ all = all.concat(p.figures); });
    mountFigures(all);
  }else{
    var p = pages[LESSON.at];
    /* Keeping it and setting it are under every page, not only the last.
       A teacher decides to keep a lesson at the moment it lands, which is
       rarely the moment she happens to be on the closing page — and an
       action you can only reach by paging to the end is one nobody finds. */
    out.innerHTML = bar + '<div class="lessonPage">' + p.html + "</div>" +
      LESSON.tail;
    mountFigures(p.figures);
    var prev = el("bPrev"), next = el("bNext");
    if(prev){
      prev.disabled = LESSON.at === 0;
      prev.onclick = function(){ lessonGo(LESSON.at - 1); };
    }
    if(next){
      next.disabled = LESSON.at === n - 1;
      next.onclick = function(){ lessonGo(LESSON.at + 1); };
    }
  }

  el("bView").onclick = function(){
    LESSON.view = scrolling ? "pages" : "scroll";
    setLessonView(LESSON.view);
    paintLesson();
  };

  out.querySelectorAll("[data-deeper]").forEach(function(b){
    b.onclick = function(){
      el("bTopic").value = b.dataset.deeper;
      remember(b.dataset.deeper);
      teach();
    };
  });
  wireAssign();
}

/* Turning a taught lesson into the work a class takes away, without anybody
   retyping it. Teachers only, and only for classes they hold. */
function wireAssign(){
  /* The subjects offered belong to the class chosen, so they change with
     it — a teacher who holds Biology in 9-A and nothing in 9-B must not be
     shown Biology while 9-B is selected. */
  [["asgClass", "asgSubject"], ["savClass", "savSubject"]].forEach(function(p){
    var pick = el(p[0]);
    if(!pick) return;
    pick.onchange = function(){
      var box = el(p[1]);
      if(!box || !box.parentNode) return;
      var span = document.createElement("span");
      span.innerHTML = subjectPicker(p[1], pick.value);
      box.parentNode.replaceChild(span.firstChild, box);
      var note = el(p[1] + "Note");
      if(note) note.remove();
    };
  });

  var save = el("savGo");
  if(save && LESSON) save.onclick = async function(){
    var msg = el("savMsg");
    msg.textContent = "Saving…";
    try{
      await api.post("/api/craxlearn/board/save", {
        class_id: +el("savClass").value,
        topic: LESSON.topic,
        title: LESSON.title,
        subject: (el("savSubject").value || "").trim(),
        note: (el("savNote").value || "").trim(),
        lesson: LESSON.raw
      });
      msg.textContent = "Saved. It is on that class's Study material page now.";
    }catch(e){
      msg.textContent = e.message;
    }
  };

  var go = el("asgGo");
  if(!go || !LESSON) return;
  go.onclick = async function(){
    var msg = el("asgMsg");
    msg.textContent = "Setting…";
    try{
      var r = await api.post("/api/craxlearn/board/assign", {
        class_id: +el("asgClass").value,
        topic: LESSON.topic,
        title: LESSON.title,
        subject: (el("asgSubject") || {}).value || "",
        due_date: el("asgDue").value || "",
        task: el("asgTask").value || "",
        lesson: LESSON.raw
      });
      msg.textContent = "Set for " + r.students + " student" +
        (r.students === 1 ? "" : "s") + ". It is on their home screen now.";
      await refreshMe();
    }catch(e){
      msg.textContent = e.message;
    }
  };
}

async function teach(){
  var topic = (el("bTopic").value||"").trim();
  if(topic.length < 2) return;
  remember(topic);
  var level = el("bLevel").value;
  var out = el("bOut");
  out.innerHTML = '<div class="card muted">Building the lesson…</div>';
  var d;
  try{
    d = await api.post("/api/board/lesson", { topic:topic, level:level });
  }catch(e){
    out.innerHTML = '<div class="note bad">' + esc(e.message) + "</div>";
    return;
  }
  var L = d.lesson || {};

  var mine = (ME.classes || []).filter(function(c){ return c.mine; });
  var tail = "";
  if(isTeacher() && mine.length){
    tail = '<div class="eyebrow">Set this for a class</div><div class="card">' +
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">' +
        '<select id="asgClass">' + mine.map(function(c){
          return '<option value="' + c.id + '">' + esc(c.name) + "</option>";
        }).join("") + "</select>" +
        subjectPicker("asgSubject", mine[0].id) +
        '<input id="asgDue" type="date" title="Due date (optional)">' +
        '<input id="asgTask" style="flex:1 1 14rem" ' +
          'placeholder="What they have to do (optional)">' +
        '<button class="btn" id="asgGo">Set it</button>' +
      "</div>" +
      '<div class="muted" id="asgMsg" style="margin-top:.5rem">' +
        "It appears on their home screen straight away — there is nothing to publish." +
      "</div></div>" +

      /* Keeping it is a different thing from setting it, and both are
         wanted. An assignment is work with a deadline that disappears once
         it is marked; this files the explanation itself under its subject,
         where the teacher can open it again next year and the class can
         read it again the night before an exam. */
      '<div class="eyebrow">Keep it on the subject page</div><div class="card">' +
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">' +
        '<select id="savClass">' + mine.map(function(c){
          return '<option value="' + c.id + '">' + esc(c.name) + "</option>";
        }).join("") + "</select>" +
        subjectPicker("savSubject", mine[0].id) +
        '<input id="savNote" style="flex:1 1 12rem" ' +
          'placeholder="A line about it (optional)">' +
        '<button class="btn" id="savGo">Save it</button>' +
      "</div>" +
      '<div class="muted" id="savMsg" style="margin-top:.5rem">' +
        "It goes to Study material for that class, under the subject you " +
        "give it. Both you and your students can open it there." +
      "</div></div>";
  }

  LESSON = { raw: L, topic: topic, title: L.title || topic,
             pages: lessonPages(L, topic), at: 0,
             view: lessonView(), tail: tail };
  paintLesson();
}

/* ---------- routing ---------- */
/* go() opens a page in the live space; paint() draws one that is already
   chosen. Splitting them is what lets a space be redrawn — after a refresh,
   after a resize — without it stealing focus from the other one. */
function go(page, arg){
  PANES[LIVE] = { page:page, arg:arg, flex: PANES[LIVE].flex };
  VIEW.page = page;
  window.S.view = VIEW;
  DRAW = LIVE;
  var head = document.querySelector('[data-pick="' + LIVE + '"]');
  if(head && TOOL_NAMES[page]) head.value = page;
  paint(page, arg);
}

/* Draw a module tool and pin the space it drew into, so its own later
   repaints go back to the same one. */
function mod(render){
  MODULE_HOST = paneBody();
  return render();
}

async function paint(page, arg){
  var m = main();
  if(m){ m.scrollTop = 0; m.classList.remove("noscroll"); }
  /* Whatever the page turns out to be, the sign-in prompts on it are live.
     One place rather than in each tool, because a prompt that does nothing
     when tapped is worse than no prompt. */
  if(OPEN) setTimeout(function(){ wireSignIn(main()); }, 0);
  /* Every branch RETURNS, so an async page's promise reaches drawPane and
     DRAW keeps pointing at this space until it has finished writing. */
  if(page === "home")           return home();
  else if(page === "activity")  return activity();
  else if(page === "sources")   return sources();
  else if(page === "inbox")     return inbox();
  else if(page === "materials") return materials();
  else if(page === "write")     return write();
  else if(page === "remote")    return remotePanel();
  else if(page === "calc")      return calc();
  else if(page === "roll")      return roll();
  else if(page === "student")   return student(arg);
  else if(page === "roster")    return roster();
  else if(page === "assignment") return assignment(arg);
  else if(page === "review")    return review(arg && arg.aid, arg && arg.sid);
  else if(page === "board")     return board(arg);
  else if(page === "net"       && window.renderNet)      return mod(window.renderNet);
  else if(page === "lab"       && window.renderLab)      return mod(window.renderLab);
  else if(page === "sqlboard"  && window.renderSqlBoard) return mod(window.renderSqlBoard);
  else if(page === "structure") return structure(arg);
  else if(page === "find")      return find(arg);
  else if(page === "phet")      return phet(arg);
  else if(page === "tracks")    return tracks();
  else if(page === "track")     return track(arg);
  else if(page === "lesson")    return lesson(arg);
  else if(page === "exam")      return exam(arg);
  else if(page === "scan" && window.renderScanner) return mod(window.renderScanner);
  return home();
}
window.render = function(){ paint(VIEW.page, null); };

document.addEventListener("click", function(e){
  var t = e.target;
  if(!t.closest) return;
  var b;
  if((b = t.closest("[data-asg]")))    return go("assignment", b.dataset.asg);
  if((b = t.closest("[data-review]"))) return go("review",
      { aid:b.dataset.review, sid:b.dataset.student });
  if((b = t.closest("[data-teach]")))  return go("board", b.dataset.teach);
  if((b = t.closest("[data-go]")))     return go(b.dataset.go);
});

/* ---------- boot ---------- */
/* One place that knows what work exists, refreshed after anything that
   changes it. A page that painted its counts once and never again is a
   teacher who hands work back and still sees "3 waiting" until they reload,
   and then stops trusting the number. */
async function refreshMe(){
  if(!ME) return;
  if(isTeacher()){
    try{ ME.inbox = await api.get("/api/teacher/inbox"); }
    catch(e){ ME.inbox = { total:0, waiting:[] }; }
  }
  /* A teacher can also be enrolled somewhere as a learner, and a head
     teacher's own classes come back here too — so this runs for everybody
     rather than in an else. */
  try{ ME.standing = await api.get("/api/craxlearn/standing"); }
  catch(e){ ME.standing = null; }
  try{
    var mine = await api.get("/api/class/mine");
    var flat = [];
    (mine.classes || []).forEach(function(c){
      (c.assignments || []).forEach(function(a){
        flat.push(Object.assign({ class_name:c.name }, a));
      });
    });
    /* Not handed in first, then by due date. The list is a to-do list, so
       the thing that is still to do belongs at the top of it. */
    flat.sort(function(x, y){
      if(!!x.done !== !!y.done) return x.done ? 1 : -1;
      return String(x.due_date || "9999").localeCompare(String(y.due_date || "9999"));
    });
    ME.assignments = flat;
  }catch(e){ ME.assignments = []; }
}

async function boot(){
  try{
    ME = await api.get("/api/craxlearn/me");
  }catch(err){
    ME = null;
  }
  if(ME) await refreshMe();
  var signedIn = !!ME;
  el("gate").hidden = signedIn;
  el("app").hidden = !signedIn;
  if(!signedIn){
    el("who").innerHTML = "";
    /* The class code first, because it is the one most people arriving here
       are holding. An email box in front of a nine-year-old with a code in
       their hand is a wrong turn they take before they read the tabs. */
    tab("Code");
    return;
  }
  el("who").innerHTML = "<b>" + esc(ME.user.name) + "</b>" +
    esc(ME.institution ? ME.institution.name : (ME.role || "learner"));
  PANES = [{ page:"home", arg:null }];
  LIVE = 0;
  paintPanes();
}

function tab(which){
  ["Code","In","Up","Remote","Open"].forEach(function(t){
    el("tab" + t).setAttribute("aria-selected", String(t === which));
  });
  el("gateMsg").textContent = "";
  if(which === "Code") codeForm();
  else if(which === "Remote") remoteJoinForm();
  else if(which === "Open") openForm();
  else gateForm(which === "Up" ? "up" : "in");
}
el("tabCode").onclick = function(){ tab("Code"); };
el("tabIn").onclick   = function(){ tab("In"); };
el("tabUp").onclick   = function(){ tab("Up"); };
el("tabRemote").onclick = function(){ tab("Remote"); };
el("tabOpen").onclick = function(){ tab("Open"); };
el("homeBtn").onclick = function(){ go("home"); };
el("shotBtn").onclick = function(){ shoot(); };
/* One press adds a space, up to four; the fifth press goes back to one.
   A cycle rather than separate add and remove buttons, because a board is
   operated mid-sentence and one button you press again is easier to
   explain than two you have to choose between. The space that was live is
   the one kept when it wraps — it is what the teacher was working in. */
el("splitBtn").onclick = function(){
  if(PANES.length >= MAX_PANES){
    PANES = [{ page: PANES[LIVE].page, arg: PANES[LIVE].arg }];
    LIVE = 0;
  }else{
    PANES = PANES.map(function(p){
      return { page:p.page, arg:p.arg, flex:1 };
    });
    /* A board beside whatever is being taught is the split a teacher wants
       first — but not a second copy of it. Every tool names its fields by
       id, so two of one tool would both write into the same boxes. */
    var want = ["write", "home"].filter(function(k){
      return !PANES.some(function(q){ return toolOf(q.page) === k; });
    });
    PANES.push({ page: want[0] || "home", arg: null, flex: 1 });
    LIVE = PANES.length - 1;
  }
  el("splitBtn").title = PANES.length >= MAX_PANES
    ? "Back to one space" : "Open another space (" + PANES.length + " of 4)";
  paintPanes();
};
el("scaleBtn").onclick = function(){
  scale(document.documentElement.getAttribute("data-scale") === "board"
        ? "desk" : "board");
};
el("outBtn").onclick = async function(){
  try{ await api.post("/api/auth/logout"); }catch(e){}
  ME = null;
  boot();
};

/* Installable on the board itself. A browser only offers "install" for a
   page with a manifest AND a service worker, and an icon on the smart
   board's home screen is the difference between a teacher opening this and
   opening whatever was already on the screen.

   Registered last and failure is ignored: an install prompt is a nicety and
   nothing here should stop the app working without one. */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/craxlearn-sw.js").catch(function(){});
  });
}

/* Chromium hides its own install button on a smart board often enough that
   a teacher never finds it, so the prompt is offered on ours. */
var deferredInstall = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstall = e;
  var b = el("installBtn");
  if(b) b.hidden = false;
});
(function(){
  var b = el("installBtn");
  if(!b) return;
  b.onclick = async function(){
    if(!deferredInstall) return;
    deferredInstall.prompt();
    try{ await deferredInstall.userChoice; }catch(e){}
    deferredInstall = null;
    b.hidden = true;
  };
})();

scale();
boot();
})();
</script>
</body>
</html>
