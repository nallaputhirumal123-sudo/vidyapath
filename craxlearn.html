<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Craxlearn — the teaching board</title>
<meta name="description" content="Craxlearn: the teaching half of Craxle, for schools, colleges and coaching centres. No job board.">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/craxlearn.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f16">
<style>
/* Sized for the display at the front of a room, not for a laptop.
   The whole of this file is one decision repeated: the person reading it is
   four metres away and the person operating it is doing so with a finger.
   Base type is 20px rather than 16, targets are 52px rather than 36, and
   nothing depends on hover — a smart board has no pointer to hover with. */
:root{
  --bg:#0b0f16; --panel:#121a26; --panel2:#0e1621; --line:#22303f;
  --text:#e8eef6; --muted:#93a3b8; --dim:#6a7b8f;
  --accent:#ff9933; --accent2:#c2410c; --ok:#3fae6a; --bad:#e05a5a;
  --pad:clamp(16px,2.2vw,34px);
  --r:16px;
}
:root[data-scale="board"]{ font-size:26px }
:root[data-scale="desk"]{ font-size:18px }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:1rem; line-height:1.6; -webkit-text-size-adjust:100%;
  min-height:100vh;
}
button{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1rem}

/* ---- frame ---- */
#top{
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.7rem var(--pad); border-bottom:1px solid var(--line);
  background:var(--panel2); position:sticky; top:0; z-index:50;
}
#brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem}
/* The mark itself, not a coloured circle standing in for one.
   The gradient was a placeholder from before there was an icon; the icon has
   existed since the board became installable, at every size, and a plain
   orange dot on a screen at the front of a room is the one place a product
   should not look unfinished. object-fit so a non-square asset is never
   squashed, and the rounded corner because the icon is drawn with one. */
#brand .dot{
  width:1.6rem;height:1.6rem;border-radius:.42rem;flex:0 0 auto;
  object-fit:cover;display:block;
}
#brand small{display:block;font-size:.5rem;font-weight:500;color:var(--muted);
  letter-spacing:.14em;text-transform:uppercase}
.grow{flex:1 1 auto}
#top .who{font-size:.62rem;color:var(--muted);text-align:right;line-height:1.35}
#top .who b{display:block;color:var(--text);font-size:.72rem}

.iconbtn{
  min-width:2rem;min-height:2rem;padding:0 .55rem;border-radius:12px;
  border:1px solid var(--line);background:transparent;cursor:pointer;
  font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn:active{border-color:var(--accent)}
/* The tool currently held. Without it a teacher who has picked the rectangle
   has no way to tell, and finds out by drawing one. */
.iconbtn.on{border-color:var(--accent);color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent)}

/* ---- the tile grid: the whole home screen ---- */
#main{padding:var(--pad);max-width:1500px;margin:0 auto}
.tiles{
  display:grid;gap:clamp(12px,1.4vw,22px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));
}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;
  text-align:left;padding:1.1rem 1.15rem;min-height:7.2rem;
  border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel);cursor:pointer;
}
.tile:active{border-color:var(--accent);transform:translateY(1px)}
.tile .ic{font-size:1.9rem;line-height:1}
.tile b{font-size:.92rem;font-weight:700}
.tile span{font-size:.66rem;color:var(--muted);line-height:1.45}

.eyebrow{
  font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:1.6rem 0 .7rem;font-weight:700;
}
.eyebrow:first-child{margin-top:0}

.card{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:1.1rem 1.2rem;margin-bottom:1rem;
}
.muted{color:var(--muted);font-size:.72rem}
.big{font-size:1.6rem;font-weight:800;line-height:1}

.btn{
  padding:.6rem 1.1rem;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(150deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;cursor:pointer;font-size:.78rem;
  min-height:2.4rem;
}
.btn.ghost{background:transparent;color:var(--text);font-weight:600}
.btn:active{transform:translateY(1px)}
input,select{
  font:inherit;font-size:.78rem;padding:.55rem .7rem;border-radius:12px;
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  min-height:2.4rem;max-width:100%;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}

table{border-collapse:collapse;width:100%;font-size:.72rem}
th,td{border-bottom:1px solid var(--line);padding:.5rem .6rem;text-align:left;
  vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.62rem;
  text-transform:uppercase;letter-spacing:.1em}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.note{
  border:1px solid rgba(255,153,51,.35);background:rgba(255,153,51,.09);
  border-radius:var(--r);padding:.9rem 1.05rem;font-size:.74rem;
  line-height:1.6;margin-bottom:1rem;
}
.bad{border-color:rgba(224,90,90,.4);background:rgba(224,90,90,.1)}

/* A lesson body is authored HTML. Give its tags somewhere to live rather
   than inheriting the card's bare defaults. */
.lessonBody h3{font-size:.92rem;margin:1rem 0 .3rem}
.lessonBody p{margin:0 0 .6rem;font-size:.76rem;line-height:1.7}
.lessonBody ul,.lessonBody ol{margin:0 0 .6rem 1.1rem;font-size:.76rem}
.lessonBody li{margin-bottom:.25rem}
.lessonBody code{font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.68rem;background:var(--panel2);padding:.05rem .3rem;
  border-radius:6px}
.lessonBody pre{background:var(--panel2);padding:.7rem;border-radius:12px;
  overflow-x:auto;font-size:.66rem;line-height:1.55}
.lessonBody pre code{background:none;padding:0}
.lessonBody b,.lessonBody strong{color:var(--text)}

/* ---- sign in ---- */
#gate{max-width:26rem;margin:8vh auto;padding:0 var(--pad)}
#gate .card{padding:1.5rem}
#gate input{width:100%;margin-bottom:.6rem}
#gate .btn{width:100%}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.tabs button{
  flex:1;padding:.5rem;border-radius:12px;border:1px solid var(--line);
  background:transparent;cursor:pointer;font-size:.72rem;min-height:2.2rem;
}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}

/* ---- spaces ----
   Two tools side by side, with a divider you drag. A classroom board is
   wide and a lesson is usually two things at once — the lesson and the
   working, the diagram and the question — and a teacher who has to keep
   swapping between them stops using the second one.

   Stacked rather than side by side under 900px, because two half-width
   columns on a phone are two unreadable columns. */
/* A grid rather than wrapped flex, because a grid can be dragged.
   The columns and rows are set from JS as plain fr numbers, so one drag
   handle changes one template and every layout resizes the same way.

   Handles float over the gaps rather than sitting in the flow: a divider
   that is a grid item has to be counted in every template, and it was
   forgetting to count it that left three and four spaces unadjustable. */
#panes{display:grid;gap:8px;position:relative;
  grid-template-columns:1fr;grid-template-rows:1fr;
  height:calc(100vh - 4rem)}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;
  overflow:hidden}
.pane.wide{grid-column:1 / -1}
.paneHead{
  display:flex;align-items:center;gap:.4rem;padding:.4rem var(--pad);
  border-bottom:1px solid var(--line);background:var(--panel2);flex:0 0 auto;
}
.pane[data-live="1"] .paneHead{border-bottom-color:var(--accent)}
.paneHead select{font-size:.66rem;min-height:1.9rem;padding:.2rem .45rem}
.paneBody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:var(--pad);
  -webkit-overflow-scrolling:touch}
#panes.one .paneHead{display:none}
#panes.one .paneBody{max-width:1500px;margin:0 auto;width:100%}

/* The handles. Wide enough for a finger on a board, drawn narrow. */
.grip{position:absolute;z-index:20;touch-action:none;background:transparent}
.grip::after{content:"";position:absolute;background:var(--line);
  border-radius:3px}
.grip:hover::after,.grip.on::after{background:var(--accent)}
/* The two handles cross in the middle of a 2x2, and whichever is later in
   the DOM would win there — which is the exact point a finger lands on a
   board. The vertical one takes the crossing: it is the shorter of the two
   hit areas, while the horizontal one spans the whole width and loses only
   a 22px band it can be grabbed either side of. */
.grip.v{top:0;bottom:0;width:22px;margin-left:-11px;cursor:col-resize;
  z-index:22}
.grip.h{z-index:21}
.grip.v::after{left:9px;top:8px;bottom:8px;width:4px}
.grip.h{left:0;right:0;height:22px;margin-top:-11px;cursor:row-resize}
.grip.h::after{top:9px;left:8px;right:8px;height:4px}

@media(max-width:900px){
  /* One column on a phone: two half-width columns are two unreadable ones.
     The rows still drag. */
  #panes{grid-template-columns:1fr !important}
  .pane.wide{grid-column:1}
  .grip.v{display:none}
}

/* The writing space owns its whole pane and never scrolls: the surface IS
   the space it was given. The canvas is taken out of the flow so it can
   only ever be told its size, never argue about it — a canvas left in a
   flex column can grow the box that is sizing it, and the two then chase
   each other bigger every frame. */
.paneBody.noscroll{overflow:hidden;display:flex;flex-direction:column}
/* The surface first, the tools UNDER it — which is where a hand is.
   A board is a wall, and the top of a wall is above head height in a room
   full of children. The controls belong where the arm already is. */
/* `flex-basis: 0`, not `auto`. With `auto` the board asks for the height of
   its own contents — which, once the toolbar wraps to four rows in a narrow
   pane, is the toolbar and nothing else. Anything sharing the column (the
   sign-in prompt on an open board) then takes the rest, and the surface is
   left with no height at all: a writing space you cannot write on. */
.wboard{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:.5rem}
/* The tools take one row in a full pane and are allowed to wrap in a
   quarter of one rather than overflow. They are kept small so wrapping is
   rare: every row they take is a row off the surface. */
/* A literal colour, not a variable with a fallback. `var(--panel2, …)` uses
   the fallback only when the variable is UNDEFINED — if it is defined and
   transparent, the fallback never runs and the bar is a sheet of glass with
   whatever is behind it showing through the buttons. */
.wtools{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;flex:0 0 auto;
  background:#101823;border:1px solid #2a3444;
  border-radius:14px;padding:.4rem .5rem}
.wtools .btn{padding:.3rem .6rem;font-size:.72rem;min-height:2rem}
.wtools .iconbtn{width:2rem;min-height:2rem;padding:0}
.wtools .sep{width:1px;align-self:stretch;background:var(--line,#2a3444);
  margin:0 .15rem}
/* A floor under the surface. A board that has been squeezed to nothing is
   indistinguishable from one that is broken, and the pane can always scroll
   the last row of tools out of sight instead. */
.wsurf{flex:1 1 auto;min-height:9rem;position:relative}
.wsurf canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
  touch-action:none}
.whint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;color:var(--muted);pointer-events:none;font-size:.8rem}
/* Where you are on a surface that has no edges. Without it, panning an empty
   part of the canvas looks exactly like a board that has stopped working. */
.wwhere{position:absolute;right:.5rem;bottom:.5rem;font-size:.62rem;
  color:var(--muted);background:rgba(0,0,0,.35);border-radius:8px;
  padding:.15rem .4rem;pointer-events:none;font-variant-numeric:tabular-nums}

/* A viewer takes whatever is left after the controls above it, and follows
   the space when it is dragged. A fixed height is wrong in both directions
   at once on a board: a small picture on a wall, or a picture taller than
   the quarter it was put in. Controls keep their own size; only the viewer
   is elastic, so nothing is ever pushed out of reach. */
.fillcol{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  gap:.6rem}
.fillcol > *{flex:0 0 auto}
.fillcol > .viewer{flex:1 1 auto;min-height:0;position:relative;
  overflow:hidden;padding:0}
/* Out of the flow, so the viewer's height is something it is told, never
   something the thing inside it argues about. */
.viewer > canvas,.viewer > iframe{position:absolute;left:0;top:0;
  width:100%;height:100%;border:0;display:block}
.viewer > .note,.viewer > .muted{padding:1rem}

/* A figure inside a lesson. The 2D renderers work out their own height from
   the width they are given, so they get a plain block; a 3D scene has no
   natural height, so it is told a shape and fills it. */
.fig{background:var(--panel2);border-radius:12px;overflow:hidden;
  margin:.4rem 0}
.fig3d{position:relative;aspect-ratio:16/10}
.fig3d > canvas{position:absolute;left:0;top:0;display:block}
.figcap{font-size:.68rem;color:var(--muted);margin:.7rem 0 .2rem}
.lessonBody img{max-width:100%;border-radius:12px;display:block}

/* A lesson as pages. The controls sit at the top with the title, because on
   a wall-mounted board the bottom of the screen is below the shoulder of
   whoever is standing at it. */
.lessonBar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  margin:.2rem 0 .6rem}
.lessonBar h1{font-size:1.1rem}
.lessonBar .iconbtn{font-size:1.2rem;min-width:2.6rem;min-height:2.6rem}
.lessonBar .iconbtn[disabled]{opacity:.35}
.lessonPage{animation:pageIn .18s ease-out}
/* A lesson kept on the subject page, opened where it is. */
.lessonKept{margin-top:.6rem;padding-top:.6rem;
  border-top:1px solid var(--line)}
.lessonKept p{margin:.4rem 0}

/* A classroom's subjects, and who teaches each. */
.subjects{display:grid;gap:.4rem;margin-top:.6rem;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,11rem),1fr))}
.subject{background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:.55rem .7rem;display:flex;
  flex-direction:column;gap:.15rem}
.subject.mine{border-color:var(--accent)}
.subject span{font-size:.66rem}
@keyframes pageIn{from{opacity:.4}}
@media(prefers-reduced-motion:reduce){.lessonPage{animation:none}}

/* Listening. A board is across the room, so the only thing that says the
   microphone is open has to be visible from there. */
.iconbtn.mic.listening{background:var(--accent);border-color:var(--accent);
  color:#10151c;animation:micpulse 1.1s ease-in-out infinite}
@keyframes micpulse{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){
  .iconbtn.mic.listening{animation:none}
}

/* The pairing code is read off a board from the back of a room, so it is
   set at the size that makes that possible and no smaller. */
.remoteCode{font-size:clamp(2rem,9vw,4.5rem);letter-spacing:.18em;
  font-weight:700;text-align:center;color:var(--accent);
  margin:.6rem 0 1rem;font-family:ui-monospace,Menlo,Consolas,monospace}

/* The remote itself. It is used one-handed, without looking down, in a room
   where somebody is talking — so everything on it is thumb-sized. */
.phone{max-width:32rem;margin:0 auto;padding:var(--pad)}
.phone .btn,.phone .iconbtn{min-height:2.8rem}
.phRow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.phGrid{display:grid;gap:.5rem;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,9rem),1fr))}

/* The boards render into #main and bring their own CSS. They were written
   for a 16px page, so they are scaled down relative to the room-sized base
   rather than left to fill a wall with one input box. */
.paneBody .nwwrap,.paneBody .labwrap,.paneBody .sqlwrap{font-size:.62rem}

@media print{ #top,.tile{display:none!important} }

/* The board's clock. Sized to be read from the back of a room, and quiet
   enough not to compete with the sign-in tabs under it. */
#clock{margin:.2rem 0 1.1rem}
#clockTime{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1;font-weight:800;
  letter-spacing:.01em;font-variant-numeric:tabular-nums}
#clockDate{font-size:clamp(.95rem,1.8vw,1.25rem);margin-top:.35rem}
</style>
</head>
<body>

<div id="top">
  <div id="brand"><img class="dot" src="/icon-192.png" alt="Craxle" width="192" height="192">
    <!-- The clock lives here, under the name, where the market segments
         used to be. That line named who the product is sold to, on a
         screen only people who already have it ever look at. -->
    <span>Craxlearn<small id="barClock">—</small></span></div>
  <span class="grow"></span>
  <div class="who" id="who"></div>
  <button class="iconbtn" id="splitBtn" title="Open another space beside this one">▥</button>
  <button class="iconbtn" id="shotBtn" title="Screenshot">⛶</button>
  <button class="iconbtn" id="installBtn" title="Install on this board" hidden>⤓</button>
  <button class="iconbtn" id="scaleBtn" title="Board size / desk size">⤢</button>
  <button class="iconbtn" id="homeBtn" title="Home">⌂</button>
  <button class="iconbtn" id="outBtn" title="Sign out">↪</button>
</div>

<div id="gate" hidden>
  <div class="card">
    <h1>Craxlearn</h1>
    <!-- A clock, where the sales line used to be.
         "For schools, colleges and coaching centres" is written for somebody
         deciding whether to buy this. It sat on the screen at the front of a
         classroom all day, in front of people who already have it. The one
         thing a wall-mounted display is useful for while nobody is teaching
         is telling the room the time. -->
    <div id="clock" aria-live="off">
      <div id="clockTime">--:--</div>
      <div id="clockDate" class="muted"></div>
    </div>
    <div class="tabs" role="tablist">
      <!-- No "New account" here, on purpose.

           Nobody signs up at a board. A board is a screen on a classroom
           wall: the school admin signs in on it once to turn it on, teachers
           join their own classroom with the code they were given, and pupils
           tap their name off the register. An account is made by the school,
           on the school's own screen, by somebody who knows who they are
           employing — not by whoever is standing in front of the television.
        -->
      <button role="tab" id="tabCode" aria-selected="true">Enter a code</button>
      <button role="tab" id="tabRemote" aria-selected="false">Remote</button>
      <button role="tab" id="tabOpen" aria-selected="false">Just the board</button>
    </div>
    <div id="gateForm"></div>
    <div id="gateMsg" class="muted" style="margin-top:.7rem"></div>
  </div>
  <p class="muted" style="text-align:center">
    <a href="/api/craxlearn/sources">Where our answers come from</a> ·
    <a href="/privacy">Privacy</a>
  </p>
</div>

<div id="app" hidden><div id="panes"></div></div>

<script>
/* The things the board modules need from a host page, defined BEFORE they
 * load. Each of them captures window.$ once, at load time — so this has to
 * be here rather than in the app script below, and putting it there is
 * exactly why net, lab, sqlboard and the scanner all rendered into nothing
 * the first time. The app script hands this shim its real pane resolver
 * once it runs.
 */
window.__paneBody = null;
window.$ = function (sel) {
  if (sel === "#main" && window.__paneBody) return window.__paneBody();
  return document.querySelector(sel);
};
window.esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
             '"': "&quot;", "'": "&#39;" }[c];
  });
};
</script>
<script src="sqlboard.js?v=eece7ffc7b"></script>
<script src="net.js?v=4381cbbb1f"></script>
<script src="lab.js?v=c536df7feb"></script>
<script src="draw.js?v=89efe3a887"></script>
<script src="sketch.js?v=665dcd5a1b"></script>
<script src="three3d.js?v=2825c4b40c"></script>
<script src="scanner.js?v=f62f1b0eb8"></script>
<script>
/* Craxlearn — the institution app.
 *
 * A separate page from index.html, deliberately, and for one reason: a
 * school is buying a URL it can put on the board at the front of a room and
 * hand to a fourteen-year-old. A single app with the job half hidden behind
 * a flag is one bug away from showing it, and the person who finds that bug
 * is a child. There is no job-board code in this file to go wrong.
 *
 * The server does not take this file's word for any of it. Every job-side
 * route is refused at the door by the middleware in main.py, for institution
 * accounts and for under-18s, whichever page asked. This file only decides
 * what to draw.
 *
 * The boards themselves — SQL, the packet walkthrough, the lab — are the
 * same modules the main app loads. They need four things from their host:
 * `api.get`, `api.post`, a `$` selector reaching `#main`, and `window.esc`.
 * That contract is provided below and nothing else is.
 */
(function(){
"use strict";

/* ---------- the four things the board modules need ---------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* The head of this file already installed window.$ and window.esc so the
   modules could capture them. This hands that shim the real resolver — the
   modules keep the function they captured and it starts answering "#main"
   with whichever space is being drawn into. */
/* A module resolves "#main" EVERY time it repaints, not once at mount, and
   sqlboard.js/net.js/lab.js/scanner.js all repaint on their own after a
   fetch or a button press — long after drawPane has moved on. Resolving to
   "the space being drawn right now" was therefore right only for the first
   paint: the SQL board's second paint landed in whichever space was drawn
   last, so it appeared in two panes at once.

   So a module-hosting space is pinned. MODULE_HOST is set when a module
   tool is opened and every later repaint goes there, whoever is drawing. */
var MODULE_HOST = null;
window.__paneBody = function(){
  if(MODULE_HOST && MODULE_HOST.isConnected) return MODULE_HOST;
  return paneBody();
};

/* The tools that are separate files and own their own repainting. */
var MODULE_TOOLS = ["net", "lab", "sqlboard", "scan"];

/* One sentence out of whatever the server put in "detail".

   Three shapes arrive here: a plain string (our own refusals), an object with
   a .message (a structured refusal), and an ARRAY of {loc, msg} from FastAPI
   when a field fails validation. The array is the one that matters, because
   an array passed to new Error() stringifies to "[object Object]" — which is
   what reached the screen instead of the reason. */
function _detailText(detail, status, statusText){
  var fallback = statusText || ("Request failed (" + status + ")");
  if(!detail) return fallback;
  if(typeof detail === "string") return detail;
  if(Object.prototype.toString.call(detail) === "[object Array]"){
    var first = detail[0];
    if(!first) return fallback;
    if(typeof first === "string") return first;
    var msg = (first.msg || first.message || fallback)
                .replace(/^Value error,\s*/i, "");
    var loc = [];
    if(Object.prototype.toString.call(first.loc) === "[object Array]"){
      loc = first.loc.filter(function(x){
        return ["body","query","path","header"].indexOf(x) === -1; });
    }
    var field = loc.length ? String(loc[loc.length - 1]) : "";
    if(field && msg.toLowerCase().indexOf(field.toLowerCase()) === -1){
      msg = field.replace(/_/g, " ") + ": " + msg;
    }
    return msg;
  }
  if(typeof detail === "object") return detail.message || fallback;
  return fallback;
}

async function req(method, path, body){
  /* "omit", not "same-origin". The board must not become whoever last
     signed in to craxle.com on this machine — see boot(). */
  var opt = { method:method, credentials:"omit",
              headers:{ "Content-Type":"application/json" } };
  if(body !== undefined) opt.body = JSON.stringify(body);
  var r = await fetch(path, opt);
  var text = await r.text();
  var data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
  if(!r.ok){
    /* detail is a string for our own refusals and an ARRAY of
       {loc, msg} objects for a FastAPI validation failure. Passing the array
       straight to new Error() gives the message "[object Object]", which is
       what a teacher saw on the board instead of being told which field was
       wrong. Same helper, same reasoning as index.html. */
    var msg = _detailText(data && data.detail, r.status, r.statusText);
    var err = new Error(msg);
    err.status = r.status;
    /* The gate answers 403 with a reason, so the page can say WHICH wall
       was hit rather than "forbidden". A learner told "not allowed" goes
       and asks a teacher; one told "this is a Craxlearn server" does not. */
    err.craxlearn = data && data.craxlearn;
    throw err;
  }
  return data;
}
window.api = {
  get:  function(p){ return req("GET", p); },
  post: function(p,b){ return req("POST", p, b===undefined?{}:b); },
  del:  function(p){ return req("DELETE", p); }
};

/* ---------- what a subject code is worth here ----------
 *
 * A subject code opens the room and hands back a short-lived token naming
 * one class and one subject. The server has honoured it for a while; nothing
 * on this page ever sent it, so a board opened with a code could draw and
 * calculate and keep nothing.
 *
 * It goes in a HEADER rather than the body or the URL, for two reasons. It
 * is a credential and not part of what is being saved; and the routes that
 * take it must be able to refuse an anonymous caller before they look at a
 * body, which they can only do if the refusal does not need one.
 *
 * BOARDED is the question every caller actually wants answered: is this
 * board standing in a subject it may file into. */
function boarded(){ return !!(ROOM && ROOM.board_token); }

function bhdr(h){
  h = h || {};
  if(boarded()) h["X-Board-Token"] = ROOM.board_token;
  return h;
}

/* The same three verbs as `api`, carrying the token. A signed-in teacher
   sends the cookie as well and the server prefers whichever arrives — so one
   set of call sites serves both, instead of every button branching on how
   the person in front of it got here. */
window.bapi = {
  get: function(p){
    return _bfetch("GET", p, null, { "Content-Type":"application/json" });
  },
  post: function(p, b){
    return _bfetch("POST", p, JSON.stringify(b || {}),
                   { "Content-Type":"application/json" });
  },
  /* Multipart: the Content-Type must be left off entirely so the browser can
     write the boundary into it. Setting it by hand produces a body no server
     can split. */
  send: function(p, fd){ return _bfetch("POST", p, fd, {}); }
};

async function _bfetch(method, path, body, headers){
  var opt = { method:method, credentials:"omit",
              headers: bhdr(headers) };
  if(body !== null && body !== undefined) opt.body = body;
  var r = await fetch(path, opt);
  var text = await r.text();
  var data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
  if(!r.ok){
    var err = new Error(_detailText(data && data.detail, r.status, r.statusText));
    err.status = r.status;
    throw err;
  }
  return data;
}

/* ---------- state ---------- */
var ME = null;
var VIEW = { page:"home" };
/* bot.js and the board modules read these. Kept as the same shape the main
   app uses so the modules need no branch for which page they are on. */
window.S = VIEW.page ? { view:VIEW } : { view:VIEW };
window.S.view = VIEW;

var el = function(id){ return document.getElementById(id); };

/* ---------- spaces ----------
 *
 * One or two, side by side, with a divider you drag. Each holds any tool.
 * `main()` is the body of whichever one is being drawn into, which is what
 * lets every page function in this file — all of which were written against
 * a single screen — work unchanged in either.
 */
var PANES = [{ page:"home", arg:null }];
var LIVE = 0;          // the space a new page opens into
var DRAW = 0;          // the space currently being drawn
var PAINTING = false;  // true while that drawing is in progress

/* What a space is showing, so that splitting the screen — which rebuilds
   every space — comes back to the same structure or the same search rather
   than to an empty box. The live space is the one whose controls were just
   used: a tap anywhere in a space makes it live before the control sees the
   click. */
function remember(arg){
  /* During a repaint the space being drawn is not necessarily the live one,
     and writing to the live one would overwrite what a DIFFERENT space is
     showing. */
  var i = PAINTING ? DRAW : LIVE;
  if(PANES[i]) PANES[i].arg = arg;
}

function paneBody(){
  var p = document.querySelector('.paneBody[data-i="' + DRAW + '"]');
  return p || document.querySelector(".paneBody") || el("app");
}
var main = paneBody;

var TOOL_NAMES = {
  home:"Home", board:"Ask the board", write:"Writing space",
  calc:"Calculator", structure:"3D structures", find:"Search the sources",
  phet:"Simulations", scan:"Scan a problem", tracks:"Courses and exams",
  lesson:"A lesson", track:"A course", exam:"An exam",
  net:"Trace a packet", lab:"The lab", sqlboard:"SQL board",
  materials:"Study material", roster:"Class register", roll:"Your classes",
  inbox:"To review", activity:"What the class is asking",
  sources:"Where answers come from", remote:"Remote",
  bring:"Saved for this subject",
  assignment:"Assignment",
  student:"A student", review:"Reviewing"
};

/* A space that has been drilled into — an open lesson, one student's record —
   is still, as far as its selector is concerned, the tool it came from. Without
   this the selector goes blank the moment a teacher opens a lesson, because no
   option matches "lesson". */
var PARENT = {
  lesson:"tracks", track:"tracks", exam:"tracks",
  assignment:"roll", student:"roll", review:"inbox"
};
function toolOf(page){ return PARENT[page] || page; }

var MAX_PANES = 4;

/* How the spaces are arranged, and where the drag handles go.
 *
 * SPLIT is the fraction of the width the left column takes, ROWS the
 * fraction of the height the top row takes. One pair of numbers drives
 * every layout, which is why three and four spaces are now adjustable and
 * were not before: the old flex version had a divider only for two.
 *
 *   1  one space
 *   2  two columns            — vertical handle
 *   3  two columns, two rows, the third spanning the bottom
 *                             — vertical + horizontal handles
 *   4  two by two             — vertical + horizontal handles
 */
var SPLIT = 0.5, ROWS = 0.5;

function layout(){
  var n = PANES.length;
  var wrap = el("panes");
  var cols = (n === 1) ? "1fr"
                       : (SPLIT.toFixed(3) + "fr " + (1 - SPLIT).toFixed(3) + "fr");
  var rows = (n <= 2) ? "1fr"
                      : (ROWS.toFixed(3) + "fr " + (1 - ROWS).toFixed(3) + "fr");
  wrap.style.gridTemplateColumns = cols;
  wrap.style.gridTemplateRows = rows;
  /* Three spaces: the third takes the whole bottom row rather than leaving
     a hole, which is what a teacher expects when they add one. */
  wrap.querySelectorAll(".pane").forEach(function(p, i){
    p.classList.toggle("wide", n === 3 && i === 2);
  });
  var v = wrap.querySelector(".grip.v"), h = wrap.querySelector(".grip.h");
  if(v){
    v.hidden = n < 2;
    v.style.left = (SPLIT * 100) + "%";
  }
  if(h){
    h.hidden = n < 3;
    h.style.top = (ROWS * 100) + "%";
  }
}

function paintPanes(){
  var wrap = el("panes");
  wrap.className = PANES.length === 1 ? "one" : "";
  var html = "";
  PANES.forEach(function(p, i){
    html += '<div class="pane" data-i="' + i + '" data-live="' +
      (i === LIVE ? 1 : 0) + '">' +
      '<div class="paneHead">' +
        '<select data-pick="' + i + '">' +
          Object.keys(TOOL_NAMES).filter(function(k){
            if(["assignment","student","review","lesson","track",
                "exam"].indexOf(k) >= 0) return false;
            /* An open board offers what works without an account, and the
               Remote — which is where it explains what signing in would
               add. Offering the rest would be a menu of things that all
               answer "sign in first". */
            if(OPEN && OPEN_TOOLS.indexOf(k) < 0
               && k !== "home" && k !== "remote") return false;
            /* Each tool names its own fields by id, so two copies of one
               tool would both write into the same boxes. Home is exempt:
               it has nothing to type into. */
            if(k === "home" || k === toolOf(p.page)) return true;
            /* One module tool at a time, anywhere. They are separate files
               that each ask for "#main" and repaint themselves; two of them
               open at once would both be pinned to one space. */
            if(MODULE_TOOLS.indexOf(k) >= 0
               && PANES.some(function(q, j){
                    return j !== i && MODULE_TOOLS.indexOf(q.page) >= 0; })){
              return false;
            }
            return !PANES.some(function(q, j){
              return j !== i && toolOf(q.page) === k; });
          }).map(function(k){
            return '<option value="' + k + '"' +
              (k === toolOf(p.page) ? " selected" : "") + ">" +
              esc(TOOL_NAMES[k]) + "</option>";
          }).join("") +
        "</select>" +
        '<span class="grow"></span>' +
        '<button class="iconbtn" data-shot="' + i + '" title="Screenshot this space">⛶</button>' +
        // Being wrong costs most here. A lesson on a classroom
        // display is read by thirty people at once, none of whom can
        // check it, with a teacher beside it lending it authority.
        '<button class="iconbtn" data-wrong="' + i + '" title="Report an error in this">⚠</button>' +
        (PANES.length > 1
          ? '<button class="iconbtn" data-close="' + i + '" title="Close this space">✕</button>'
          : "") +
      "</div>" +
      '<div class="paneBody" data-i="' + i + '"></div>' +
      "</div>";
  });
  // The two handles live outside the panes and are positioned over the gaps,
  // so they do not have to be counted in any grid template.
  html += '<div class="grip v" hidden></div><div class="grip h" hidden></div>';
  wrap.innerHTML = html;
  // Every body element was just replaced, so the old pin points at a node
  // that is no longer in the document.
  MODULE_HOST = null;
  layout();
  wirePanes();
  (async function(){
    for(var i = 0; i < PANES.length; i++) await drawPane(i);
  })();
}

async function drawPane(i){
  var was = DRAW, wasPainting = PAINTING;
  DRAW = i;
  PAINTING = true;
  try{ await paint(PANES[i].page, PANES[i].arg); }
  catch(e){ /* one space failing must not stop the others drawing */ }
  finally{ DRAW = was; PAINTING = wasPainting; }
}

function wirePanes(){
  var wrap = el("panes");
  wrap.querySelectorAll("[data-pick]").forEach(function(sel){
    sel.onchange = function(){
      var i = +sel.dataset.pick;
      PANES[i] = { page: sel.value, arg: null, flex: PANES[i].flex };
      LIVE = i;
      paintPanes();
    };
  });
  wrap.querySelectorAll("[data-close]").forEach(function(b){
    b.onclick = function(){
      PANES.splice(+b.dataset.close, 1);
      LIVE = 0;
      paintPanes();
    };
  });
  wrap.querySelectorAll("[data-shot]").forEach(function(b){
    b.onclick = function(){ shoot(); };
  });
  wrap.querySelectorAll("[data-wrong]").forEach(function(b){
    b.onclick = function(){ reportWrong(+b.dataset.wrong); };
  });
  wrap.querySelectorAll(".pane").forEach(function(p){
    p.addEventListener("pointerdown", function(){
      var i = +p.dataset.i;
      if(i === LIVE) return;
      LIVE = i;
      wrap.querySelectorAll(".pane").forEach(function(q){
        q.dataset.live = (+q.dataset.i === LIVE) ? 1 : 0;
      });
    }, true);
  });

  /* Dragging. Both handles work the same way: read where the pointer is
     as a fraction of the grid, clamp it so a space can never be dragged to
     nothing, and rewrite the template. Fractions rather than pixels, so
     rotating a board or plugging in another screen keeps the proportions
     the teacher chose. */
  wrap.querySelectorAll(".grip").forEach(function(g){
    var vertical = g.classList.contains("v");
    g.addEventListener("pointerdown", function(e){
      e.preventDefault();
      g.setPointerCapture(e.pointerId);
      g.classList.add("on");
      function move(ev){
        var r = wrap.getBoundingClientRect();
        var f = vertical ? (ev.clientX - r.left) / r.width
                         : (ev.clientY - r.top) / r.height;
        f = Math.min(0.85, Math.max(0.15, f));
        if(vertical) SPLIT = f; else ROWS = f;
        layout();
      }
      function up(){
        g.classList.remove("on");
        g.removeEventListener("pointermove", move);
        g.removeEventListener("pointerup", up);
        g.removeEventListener("pointercancel", up);
      }
      g.addEventListener("pointermove", move);
      g.addEventListener("pointerup", up);
      g.addEventListener("pointercancel", up);
    });
    /* Double-tap a handle to put it back to even. Faster than dragging it
       back, and on a board a dragged handle is easy to nudge by accident. */
    g.addEventListener("dblclick", function(){
      if(vertical) SPLIT = 0.5; else ROWS = 0.5;
      layout();
    });
  });
}

/* A picture of whatever is on the screen, using the browser's own capture
   rather than a DOM-to-canvas library. It is the only way to get a true
   screenshot without shipping a dependency, it captures the 3D view and the
   writing space correctly where a DOM copy would not, and on a board it is
   one tap and a confirm. */
async function shoot(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    alert("This board's browser cannot take a screenshot. The writing " +
          "space has its own Save as picture button.");
    return;
  }
  var stream = null;
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: "browser" }, audio: false });
    var track = stream.getVideoTracks()[0];
    var v = document.createElement("video");
    v.srcObject = stream;
    v.muted = true;
    await v.play();
    /* One frame is enough, but the first one is often blank while the
       capture warms up. */
    await new Promise(function(r){ setTimeout(r, 320); });
    var st = track.getSettings ? track.getSettings() : {};
    var cv = document.createElement("canvas");
    cv.width = st.width || v.videoWidth || 1920;
    cv.height = st.height || v.videoHeight || 1080;
    cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
    /* The frame is captured; now choose how much of it to keep. */
    cropPick(cv);
  }catch(e){
    /* Cancelling the picker is not an error worth a dialog. */
  }finally{
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
  }
}


/* Choose a part of the picture, or keep all of it.
 *
 * The screenshot took the whole surface and downloaded it. On a board that is
 * usually far more than anybody wanted — a teacher photographing one worked
 * equation got the browser chrome, the tab bar and the other half of a split
 * screen with it, and then had to crop it somewhere else.
 *
 * So the captured frame is shown back and a rectangle is dragged over the
 * part that matters. Dragging on the IMAGE rather than on the live page
 * matters: the capture is in screen pixels and the page is in CSS pixels, and
 * on a board with any zoom or scaling those are not the same coordinates. What
 * you drag over is exactly what you get.
 */
function cropPick(src){
  var back = document.createElement("div");
  back.style.cssText = "position:fixed;inset:0;z-index:9999;background:#000c;" +
    "display:flex;flex-direction:column;align-items:center;justify-content:center;" +
    "gap:.6rem;padding:1rem";
  var bar = document.createElement("div");
  bar.style.cssText = "color:#fff;font:600 15px system-ui;display:flex;" +
    "gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center";
  bar.innerHTML = '<span>Drag over the part you want.</span>' +
    '<button class="btn ghost" id="shotAll">Whole screen</button>' +
    '<button class="btn ghost" id="shotNo">Cancel</button>';
  var holder = document.createElement("div");
  holder.style.cssText = "position:relative;max-width:96vw;max-height:80vh;" +
    "box-shadow:0 0 0 1px #fff3";
  var img = document.createElement("img");
  img.src = src.toDataURL("image/png");
  img.style.cssText = "display:block;max-width:96vw;max-height:80vh;" +
    "cursor:crosshair;user-select:none;-webkit-user-drag:none";
  var box = document.createElement("div");
  box.style.cssText = "position:absolute;border:2px solid #ff9933;" +
    "background:#ff993322;display:none;pointer-events:none";
  holder.appendChild(img); holder.appendChild(box);
  back.appendChild(bar); back.appendChild(holder);
  document.body.appendChild(back);

  function close(){ if(back.parentNode) back.parentNode.removeChild(back); }
  function save(cnv){
    var a = document.createElement("a");
    a.href = cnv.toDataURL("image/png");
    a.download = "craxlearn-" + new Date().toISOString().slice(0,16)
                   .replace(/[:T]/g,"-") + ".png";
    a.click();
    close();
  }
  el("shotNo").onclick = close;
  el("shotAll").onclick = function(){ save(src); };
  back.addEventListener("keydown", function(e){
    if(e.key === "Escape") close(); });

  var a0 = null;
  function spot(e){
    var r = img.getBoundingClientRect();
    var t = (e.touches && e.touches[0]) || e;
    return [Math.min(Math.max(t.clientX - r.left, 0), r.width),
            Math.min(Math.max(t.clientY - r.top, 0), r.height)];
  }
  img.addEventListener("pointerdown", function(e){
    e.preventDefault();
    img.setPointerCapture(e.pointerId);
    a0 = spot(e);
    box.style.display = "block";
    box.style.left = a0[0] + "px"; box.style.top = a0[1] + "px";
    box.style.width = "0px"; box.style.height = "0px";
  });
  img.addEventListener("pointermove", function(e){
    if(!a0) return;
    var b = spot(e);
    box.style.left = Math.min(a0[0], b[0]) + "px";
    box.style.top = Math.min(a0[1], b[1]) + "px";
    box.style.width = Math.abs(b[0] - a0[0]) + "px";
    box.style.height = Math.abs(b[1] - a0[1]) + "px";
  });
  img.addEventListener("pointerup", function(e){
    if(!a0) return;
    var b = spot(e), start = a0; a0 = null;
    var r = img.getBoundingClientRect();
    /* The image is shown scaled to fit, so what was dragged has to be
       converted back into the captured frame's own pixels — otherwise a
       crop on a board would come out a third of the size it looked. */
    var kx = src.width / r.width, ky = src.height / r.height;
    var x = Math.min(start[0], b[0]) * kx, y = Math.min(start[1], b[1]) * ky;
    var w = Math.abs(b[0] - start[0]) * kx, h = Math.abs(b[1] - start[1]) * ky;
    if(w < 8 || h < 8){
      /* A tap, not a drag. Treat it as "I did not mean to select" rather
         than saving an eight-pixel picture nobody asked for. */
      box.style.display = "none";
      return;
    }
    var out = document.createElement("canvas");
    out.width = Math.round(w); out.height = Math.round(h);
    out.getContext("2d").drawImage(src, x, y, w, h, 0, 0, out.width, out.height);
    save(out);
  });
}

/* ---------- room size ---------- */
/* Two sizes and a button, remembered per device. A teacher sets it once on
   the board in the room and once on their own laptop, and neither has to
   think about it again. Defaulting by screen width was tried on paper and
   is wrong: a smart board reports a perfectly ordinary 1920 wide and would
   have been given laptop type. */
function scale(next){
  var v = next || localStorage.getItem("cl_scale") || "board";
  document.documentElement.setAttribute("data-scale", v);
  localStorage.setItem("cl_scale", v);
  var b = el("scaleBtn");
  if(b) b.title = v === "board" ? "Board size — press for desk size"
                                : "Desk size — press for board size";
}

/* ---------- signing in with nothing but a class code ----------
 *
 * Two taps and no credential. A child types the code the teacher wrote on
 * the board, picks their own name off the register, and is in. There is
 * nothing to remember, nothing to reset, and nothing to leak — the account
 * behind it has a synthetic address and a password nobody has ever seen.
 *
 * The name list is the whole reason a teacher types a register first. Code
 * alone would give a teacher a queue of work from "Learner 4".
 */
function codeForm(){
  el("gateForm").innerHTML =
    '<input id="gCode" placeholder="Class or subject code" autocapitalize="characters" ' +
      'autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em">' +
    '<button class="btn" id="gCodeGo">Find my class</button>';
  el("gCodeGo").onclick = findClass;
  el("gCode").onkeydown = function(e){ if(e.key === "Enter") findClass(); };
}

/* Which classroom this board is standing in.
 *
 * ROOM is set by a class code (the room) or a subject code (the room and the
 * subject), and it is what a saved lesson is filed under. It is NOT a
 * sign-in: the server deliberately refuses to mint a session from a code
 * here, because a code on a screen at the front of a room has been read by
 * everybody in it. Identity still comes from signing in.
 */
var ROOM = null;

function roomLine(){
  if(!ROOM) return "";
  return '<div class="note" style="margin:.6rem 0">' +
    '<b>' + esc(ROOM.class_name) + '</b>' +
    (ROOM.subject ? ' · ' + esc(ROOM.subject) : "") +
    (ROOM.school ? '<span class="muted"> · ' + esc(ROOM.school) + '</span>' : "") +
    '<div class="muted">Anything saved from this board goes here.</div>' +
    '</div>';
}

/* A class code or a subject code, in the same box. Tried before the student
   sign-in, so a teacher typing T-KDV9 gets their subject rather than "no
   class has that code". */
async function openRoom(code){
  try{
    var d = await api.post("/api/craxlearn/room", { code: code });
    ROOM = d;
    return d;
  }catch(e){ return null; }
}

async function findClass(){
  var msg = el("gateMsg");
  var code = ((el("gCode") || {}).value || "").trim();
  if(code.length < 3){ msg.textContent = "Type the code your teacher gave you."; return; }
  msg.textContent = "Looking…";

  /* A subject code first. One box takes either kind, because a person
     standing at a board has one code in their hand and should not have to
     know which sort it is — and typing T-KDV9 here used to answer "no class
     has that code", which is true and unhelpful.

     A subject code opens the room and names the subject. It does not sign
     anybody in: on a screen at the front of a class, a code has been read by
     everybody in the room. */
  var room = await openRoom(code);
  if(room && room.kind === "subject"){
    msg.textContent = "";
    el("gateForm").innerHTML =
      '<p class="muted" style="margin-top:0">This board is now open on</p>' +
      '<div class="big">' + esc(room.class_name) + " · " +
        esc(room.subject) + "</div>" +
      (room.teacher
        ? '<p class="muted">' + esc(room.teacher) + " teaches this.</p>"
        : '<p class="muted">No teacher is on this subject yet.</p>') +
      '<p class="muted">Anything you keep from this board is filed under ' +
      'this class and this subject.</p>' +
      '<button class="btn" id="gRoomGo">Open the board</button> ' +
      '<button class="btn ghost" id="gBack2">← Different code</button>';
    el("gRoomGo").onclick = function(){ openBoard(); };
    el("gBack2").onclick = function(){ ROOM = null; el("gateMsg").textContent = ""; codeForm(); };
    return;
  }

  /* A class code opens the room, and does NOT list the children.
   *
   * It used to answer with the register so a pupil could tap their name. On a
   * pupil's own phone that is exactly right and it is still there. On the
   * board it put every child's name on a television at the front of the room,
   * for the whole class and anybody walking past to read. A register is a
   * list of children; it is not wallpaper.
   *
   * So on the board a class code says which room this is, and nothing about
   * who is in it. */
  if(room && room.kind === "class"){
    msg.textContent = "";
    el("gateForm").innerHTML =
      '<p class="muted" style="margin-top:0">This board is now open on</p>' +
      '<div class="big">' + esc(room.class_name) + "</div>" +
      (room.school ? '<p class="muted">' + esc(room.school) + "</p>" : "") +
      '<p class="muted">Enter a subject code to teach a subject here, or ' +
      'open the board as it is.</p>' +
      '<button class="btn" id="gRoomGo">Open the board</button> ' +
      '<button class="btn ghost" id="gBack">← Different code</button>';
    el("gRoomGo").onclick = function(){ openBoard(); };
    el("gBack").onclick = function(){
      ROOM = null; el("gateMsg").textContent = ""; codeForm(); };
    return;
  }

  msg.textContent = "That code is not a class or a subject at this school.";
}

/* ---------- reporting an error ---------- */
/* The one check a machine cannot do.
 *
 * Everything else here is the machine checking itself — constants,
 * arithmetic, units, and a second read of the argument. A lesson that is
 * confidently wrong in a way nobody anticipated is caught by a person, and
 * on a board that person is standing in front of thirty others.
 *
 * Asks what was wrong rather than taking a bare thumbs-down: "this is wrong"
 * cannot be acted on, "step 3 has the wrong units" can. Sends the cached
 * lesson's key so the server drops that exact answer rather than a topic
 * that may have been rebuilt since.
 */
async function reportWrong(i){
  var pane = PANES[i] || {};
  var said = window.prompt(
    "What is wrong with this?\n\n" +
    "One sentence is plenty. Naming the step helps most.");
  if(said === null) return;
  said = (said || "").trim();
  if(!said){ return; }
  try{
    // A pane is {page, arg, flex} — there is no lesson object on it, so the
    // page and its argument are what identify what was on screen.
    var r = await api.post("/api/report", {
      qkey: "",
      topic: (String(pane.page || "") + " " +
              String(pane.arg || "")).trim().slice(0, 300),
      what: said.slice(0, 1200),
      where: "craxlearn"
    });
    window.alert("Thank you. That has been recorded" +
                 (r && r.dropped ? " and the answer removed." : "."));
  }catch(e){
    window.alert((e && e.message) || "Could not send that just now.");
  }
}

/* ---------- sign in ---------- */
function gateForm(mode){
  var up = mode === "up";
  el("gateForm").innerHTML =
    (up ? '<input id="gName" placeholder="Your name" autocomplete="name">' : "") +
    '<input id="gEmail" type="email" placeholder="Email" autocomplete="email">' +
    '<input id="gPass" type="password" placeholder="Password" ' +
      'autocomplete="' + (up ? "new-password" : "current-password") + '">' +
    (up ? '<input id="gCode" placeholder="School or class code (optional)">' : "") +
    '<button class="btn" id="gGo">' + (up ? "Create account" : "Sign in") + "</button>";
  el("gGo").onclick = function(){ submit(up); };
  el("gPass").onkeydown = function(e){ if(e.key === "Enter") submit(up); };
}

async function submit(up){
  var msg = el("gateMsg");
  msg.textContent = "…";
  var body = { email:(el("gEmail").value||"").trim(),
               password:el("gPass").value||"" };
  if(up) body.name = (el("gName").value||"").trim();
  try{
    await api.post(up ? "/api/auth/signup" : "/api/auth/login", body);
    var code = up && el("gCode") ? (el("gCode").value||"").trim() : "";
    if(code){
      /* A wrong code must not cost somebody the account they just made. */
      try{ await api.post("/api/class/join", { code:code }); }
      catch(e){ msg.textContent = "Signed in, but that code did not match: "
                                  + e.message; }
    }
    await boot();
  }catch(e){
    msg.textContent = e.message;
  }
}

/* ---------- pages ---------- */
/* Every tile here is a teaching surface and there is nothing else. The list
   is short on purpose: a board at the front of a room is operated by
   somebody mid-sentence, and a menu they have to read is a menu that stops

var TILES = [
  { page:"board",  ic:"⚡", name:"Ask the board",
    sub:"Any subject, taught step by step, with a diagram where one helps." },
  { page:"write",  ic:"✍️", name:"Writing space",

  { page:"calc",   ic:"🧮", name:"Calculator",
    sub:"Arithmetic, powers and roots, worked on screen where the room can see it." },
  { page:"structure", ic:"🧬", name:"3D structures",
    sub:"Turn a molecule, a crystal, a protein or an orbit around. Measured, never drawn." },
  { page:"find",   ic:"🔎", name:"Search the sources",
    sub:"A photograph or a structure from the open catalogues, with its licence." },
  { page:"phet",   ic:"🔬", name:"Simulations",
    sub:"PhET: build an atom, wire a circuit, balance an equation. Free and open." },
  { page:"scan",   ic:"📷", name:"Scan a problem",
    sub:"Photograph a question from a book or the board and have it worked through." },
  { page:"tracks", ic:"🎓", name:"Courses and exams",
    sub:"The lessons, the labs you type into, and the track exams." },
  { page:"net",    ic:"🌐", name:"Trace a packet",
    sub:"Send a packet through real routes and firewall rules and watch the decision." },
  { page:"lab",    ic:"🧪", name:"The lab",
    sub:"Mix real reagents and run real experiments. Every reaction from a table, never guessed." },
  { page:"sqlboard", ic:"🗄️", name:"SQL board",
    sub:"Write queries against a real database and see what comes back." },
  { page:"bring",  ic:"📄", name:"Saved for this subject",
