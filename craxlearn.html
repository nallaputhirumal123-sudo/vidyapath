<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Craxlearn — the teaching board</title>
<meta name="description" content="Craxlearn: the teaching half of Craxle, for schools, colleges and coaching centres. No job board.">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/craxlearn.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f16">
<style>
/* Sized for the display at the front of a room, not for a laptop.
   The whole of this file is one decision repeated: the person reading it is
   four metres away and the person operating it is doing so with a finger.
   Base type is 20px rather than 16, targets are 52px rather than 36, and
   nothing depends on hover — a smart board has no pointer to hover with. */
:root{
  --bg:#0b0f16; --panel:#121a26; --panel2:#0e1621; --line:#22303f;
  --text:#e8eef6; --muted:#93a3b8; --dim:#6a7b8f;
  --accent:#ff9933; --accent2:#c2410c; --ok:#3fae6a; --bad:#e05a5a;
  --pad:clamp(16px,2.2vw,34px);
  --r:16px;
}
/* Five sizes, not two.
 *
 * This was a toggle between 26px and 18px, and a toggle only fits a room if
 * the room happens to be one of two. A hall wants more than a board; a
 * teacher marking on a laptop wants less than a desk; somebody at the back
 * of a long classroom wants whatever it takes. A named ladder lets a school
 * pick the one that suits the room they actually have, once, and never
 * think about it again. */
:root[data-scale="small"]{ font-size:16px }
:root[data-scale="normal"]{ font-size:19px }
:root[data-scale="large"]{ font-size:22px }
:root[data-scale="board"]{ font-size:26px }
:root[data-scale="hall"]{ font-size:31px }
/* Kept so a board that was set before this still comes up the size it was
   set to, rather than resetting itself the morning of an update. */
:root[data-scale="desk"]{ font-size:18px }
/* A phone is not a wall.
 *
 * Board size is 26px because a wall-mounted screen is read from the back of
 * a room. Every measurement here is in rem, so on a 390px phone that same
 * setting made the top bar, the pane heads and the tool rows eat the screen
 * and left nothing for the board itself — and "board" is the DEFAULT, so a
 * phone that had never chosen got it.
 *
 * Guessing the size from width is wrong in general and that reasoning still
 * stands: a smart board reports a perfectly ordinary 1920 and would be given
 * laptop type. It does not stand at 600px. Nothing that narrow is on a wall,
 * so the choice is kept and the sizes it means are brought back to a phone. */
@media (max-width:600px){
  :root[data-scale="small"]{ font-size:14px }
  :root[data-scale="normal"]{ font-size:16px }
  :root[data-scale="large"]{ font-size:17px }
  :root[data-scale="board"]{ font-size:19px }
  :root[data-scale="hall"]{ font-size:21px }
  :root[data-scale="desk"]{ font-size:16px }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:1rem; line-height:1.6; -webkit-text-size-adjust:100%;
  /* A column of exactly the screen, so the panes can take what is LEFT.
     dvh over vh: on a phone 100vh is the height with the browser's own bars
     HIDDEN, which is not the height anything is being read at. */
  display:flex; flex-direction:column;
  min-height:100vh; min-height:100dvh;
  height:100vh; height:100dvh;
}
button{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1rem}

/* ---- frame ---- */
#top{
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.7rem var(--pad); border-bottom:1px solid var(--line);
  background:var(--panel2); position:sticky; top:0; z-index:50;
  flex:0 0 auto;
}
/* Whatever the header did not use. On a narrow screen it WRAPS to two rows —
   124px against the 4rem this used to subtract — so the panes were 48px
   taller than the screen and .pane's overflow:hidden cut the bottom off. On a
   phone the browser's URL bar takes another sixty or so on top of that,
   which is how half an explanation went missing. Nothing measures the header
   now; the column does it. */
#app{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
/* `hidden` has to actually hide.
 *
 * The browser's own rule for [hidden] is display:none at the lowest possible
 * specificity, and `#app{display:flex}` beats it — an id selector against a
 * UA default is not close. So el("app").hidden = true set the attribute,
 * changed nothing, and the split panes stayed on screen UNDERNEATH the code
 * box: a board that had been signed out still showing the last lesson's
 * spaces to whoever walked up next.
 *
 * The same trap applies to anything else given both an id and a display, so
 * the rule is written once and generally. */
[hidden]{display:none !important}
#gate{flex:1 1 auto; min-height:0; overflow-y:auto}
#brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem}
/* The mark itself, not a coloured circle standing in for one.
   The gradient was a placeholder from before there was an icon; the icon has
   existed since the board became installable, at every size, and a plain
   orange dot on a screen at the front of a room is the one place a product
   should not look unfinished. object-fit so a non-square asset is never
   squashed, and the rounded corner because the icon is drawn with one. */
#brand .dot{
  width:1.6rem;height:1.6rem;border-radius:.42rem;flex:0 0 auto;
  object-fit:cover;display:block;
}
#brand small{display:block;font-size:.5rem;font-weight:500;color:var(--muted);
  letter-spacing:.14em;text-transform:uppercase}
.grow{flex:1 1 auto}
#top .who{font-size:.62rem;color:var(--muted);text-align:right;line-height:1.35}
#top .who b{display:block;color:var(--text);font-size:.72rem}

.iconbtn{
  min-width:2rem;min-height:2rem;padding:0 .55rem;border-radius:12px;
  border:1px solid var(--line);background:transparent;cursor:pointer;
  font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;
}
/* The one control that is always on screen and is not housekeeping. */
.iconbtn.askbtn{border-color:var(--accent);color:var(--accent);
  font-size:1.05rem;font-weight:700}
.iconbtn.askbtn:hover{background:var(--accent);color:#1a1205}
.iconbtn:active{border-color:var(--accent)}
/* The tool currently held. Without it a teacher who has picked the rectangle
   has no way to tell, and finds out by drawing one. */
.iconbtn.on{border-color:var(--accent);color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent)}

/* ---- the tile grid: the whole home screen ---- */
#main{padding:var(--pad);max-width:1500px;margin:0 auto}
.tiles{
  display:grid;gap:clamp(12px,1.4vw,22px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));
}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;
  text-align:left;padding:1.1rem 1.15rem;min-height:7.2rem;
  border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel);cursor:pointer;
}
.tile:active{border-color:var(--accent);transform:translateY(1px)}
.tile .ic{font-size:1.9rem;line-height:1}
.tile b{font-size:.92rem;font-weight:700}
.tile span{font-size:.66rem;color:var(--muted);line-height:1.45}

.eyebrow{
  font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:1.6rem 0 .7rem;font-weight:700;
}
.eyebrow:first-child{margin-top:0}

.card{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:1.1rem 1.2rem;margin-bottom:1rem;
}
.muted{color:var(--muted);font-size:.72rem}
.big{font-size:1.6rem;font-weight:800;line-height:1}

.btn{
  padding:.6rem 1.1rem;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(150deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;cursor:pointer;font-size:.78rem;
  min-height:2.4rem;
}
.btn.ghost{background:transparent;color:var(--text);font-weight:600}
.btn:active{transform:translateY(1px)}
input,select{
  font:inherit;font-size:.78rem;padding:.55rem .7rem;border-radius:12px;
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  min-height:2.4rem;max-width:100%;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}

table{border-collapse:collapse;width:100%;font-size:.72rem}
th,td{border-bottom:1px solid var(--line);padding:.5rem .6rem;text-align:left;
  vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.62rem;
  text-transform:uppercase;letter-spacing:.1em}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.note{
  border:1px solid rgba(255,153,51,.35);background:rgba(255,153,51,.09);
  border-radius:var(--r);padding:.9rem 1.05rem;font-size:.74rem;
  line-height:1.6;margin-bottom:1rem;
}
.bad{border-color:rgba(224,90,90,.4);background:rgba(224,90,90,.1)}

/* A lesson body is authored HTML. Give its tags somewhere to live rather
   than inheriting the card's bare defaults. */
.lessonBody h3{font-size:.92rem;margin:1rem 0 .3rem}
.lessonBody p{margin:0 0 .6rem;font-size:.76rem;line-height:1.7}
.lessonBody ul,.lessonBody ol{margin:0 0 .6rem 1.1rem;font-size:.76rem}
.lessonBody li{margin-bottom:.25rem}
.lessonBody code{font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.68rem;background:var(--panel2);padding:.05rem .3rem;
  border-radius:6px}
.lessonBody pre{background:var(--panel2);padding:.7rem;border-radius:12px;
  overflow-x:auto;font-size:.66rem;line-height:1.55}
.lessonBody pre code{background:none;padding:0}
.lessonBody b,.lessonBody strong{color:var(--text)}

/* ---- sign in ---- */
#gate{max-width:26rem;margin:8vh auto;padding:0 var(--pad)}
#gate .card{padding:1.5rem}
#gate input{width:100%;margin-bottom:.6rem}
#gate .btn{width:100%}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.tabs button{
  flex:1;padding:.5rem;border-radius:12px;border:1px solid var(--line);
  background:transparent;cursor:pointer;font-size:.72rem;min-height:2.2rem;
}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}

/* ---- spaces ----
   Two tools side by side, with a divider you drag. A classroom board is
   wide and a lesson is usually two things at once — the lesson and the
   working, the diagram and the question — and a teacher who has to keep
   swapping between them stops using the second one.

   Stacked rather than side by side under 900px, because two half-width
   columns on a phone are two unreadable columns. */
/* A grid rather than wrapped flex, because a grid can be dragged.
   The columns and rows are set from JS as plain fr numbers, so one drag
   handle changes one template and every layout resizes the same way.

   Handles float over the gaps rather than sitting in the flow: a divider
   that is a grid item has to be counted in every template, and it was
   forgetting to count it that left three and four spaces unadjustable. */
#panes{display:grid;gap:8px;position:relative;
  grid-template-columns:1fr;grid-template-rows:1fr;
  flex:1 1 auto; min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;
  overflow:hidden}
.pane.wide{grid-column:1 / -1}
/* The bar that says which tool is open, kept to what that is worth.
 *
 * It was 15% of every space — and with the board split four ways that is
 * 15% of each of them, spent on a row whose whole content is the name of a
 * tool the teacher just chose. Trimmed to about 11%: the padding was the
 * cheap part, and the controls were 1.9rem when 1.6 is still 41px on a real
 * board, which is a touch target a finger finds.
 *
 * Below this it stops being pressable on a wall screen, which is why the
 * answer to wanting the space back is the fold — one button, four pixels,
 * and the line that is left still says which space is live. */
.paneHead{
  display:flex;align-items:center;gap:.34rem;padding:.24rem var(--pad);
  border-bottom:1px solid var(--line);background:var(--panel2);flex:0 0 auto;
}
.pane[data-live="1"] .paneHead{border-bottom-color:var(--accent)}
.paneHead select{font-size:.64rem;min-height:1.6rem;padding:.15rem .4rem}
/* `overflow:hidden auto` rather than `overflow-y:auto`.
   With only the y axis named, the x axis is `visible` — and `visible` on one
   axis is promoted to `auto` by the spec, which is not the same as clipping.
   A stroke dragged past the right edge of one space could paint into the one
   beside it, which is the one thing a pen fixed to a pane must never do. The
   .pane above clips as well, so this is belt and braces on the axis nobody
   thinks about. */
.paneBody{flex:1 1 auto;min-height:0;overflow:hidden auto;padding:var(--pad);
  -webkit-overflow-scrolling:touch;position:relative}
/* The pen for one space. Sized to the pane's SCROLLABLE height, not its
   visible height, and left in the normal flow above the content — so it
   scrolls with what it is drawn on rather than being repositioned by hand
   on every scroll event, and a mark stays on the paragraph it was drawn on.
   Inert until the ✎ is pressed: a sheet of glass that always took clicks
   would make the lesson underneath unclickable. */
.paneMark{position:absolute;left:0;top:0;z-index:5;pointer-events:none;
  touch-action:none}
.paneMark.on{pointer-events:auto;cursor:crosshair}
.pane[data-marking="1"] .paneHead{border-bottom-color:#ff3b30}
.markBar{position:absolute;right:.4rem;bottom:.4rem;z-index:6;display:none;
  gap:.25rem;padding:.3rem;border-radius:10px;background:#14181c;
  border:1px solid #2c3238;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.markBar.on{display:flex}
.markBar button{font:600 .62rem/1 inherit;color:#e8eef2;cursor:pointer;
  background:transparent;border:1px solid transparent;border-radius:7px;
  padding:.35rem .45rem;white-space:nowrap}
.markBar .sw{width:1.1rem;height:1.1rem;border-radius:50%;padding:0;
  border:2px solid transparent}
.markBar .sw.sel{border-color:#e8eef2}
.markBar button.sel{border-color:#ffb020;color:#ffb020}
#panes.one .paneHead{display:none}
/* Split, the head has to earn its height.
 *
 * Controls on this board are 52px because a finger finds them from across a
 * room. That is right for one space filling the screen, and wrong inside a
 * quarter of it: measured at four panes, the head was 74px of a 329px pane —
 * 22% of every space, 147px of the board gone to two rows of chrome that say
 * which tool is open.
 *
 * Still 44px of target, which is the floor for a finger; it is the padding
 * and the oversizing that go, not the tap area. */
/* Put away entirely, when the room needs the board and not the controls.
 *
 * Slimming it took 74px to 53, and 53 is still a row per space that says
 * which tool is open — which a teacher mid-lesson already knows. Collapsed,
 * each head becomes the 4px line that was its own bottom border, and that
 * line is the way back: press it, or the ⌃ in the top bar, and they return.
 * Dragging one downward puts them away, which is the gesture somebody
 * reaches for first. */
#panes.noheads .paneHead{height:4px;min-height:0;padding:0;overflow:hidden;
  cursor:ns-resize;border-bottom:4px solid var(--line)}
#panes.noheads .pane[data-live="1"] .paneHead{border-bottom-color:var(--accent)}
#panes.noheads .paneHead > *{display:none}
/* Slimmer again when the board is split, because the cost is per space.
 *
 * 1.7rem was already a trim from the full-size control, and with the board
 * in four it is still 15% of every one of them — a bar whose whole content
 * is the name of a tool the teacher chose a moment ago. 1.45rem is 38px on
 * a real board, which a finger still finds, and takes the row to about 11%.
 *
 * It does not go below this. Smaller stops being pressable on a wall screen,
 * and the answer to wanting the rest of the space back is the fold: one
 * button, four pixels, and the line left behind still says which space is
 * live. */
#panes:not(.one) .paneHead{padding:.1rem var(--pad);gap:.28rem}
#panes:not(.one) .paneHead select{min-height:1.45rem;font-size:.58rem;
  padding:.08rem .28rem}
#panes:not(.one) .paneHead .iconbtn{width:1.45rem;min-height:1.45rem;
  font-size:.7rem;padding:0}
#panes.one .paneBody{max-width:1500px;margin:0 auto;width:100%}

/* The handles. Wide enough for a finger on a board, drawn narrow. */
.grip{position:absolute;z-index:20;touch-action:none;background:transparent}
.grip::after{content:"";position:absolute;background:var(--line);
  border-radius:3px}
.grip:hover::after,.grip.on::after{background:var(--accent)}
/* The two handles cross in the middle of a 2x2, and whichever is later in
   the DOM would win there — which is the exact point a finger lands on a
   board. The vertical one takes the crossing: it is the shorter of the two
   hit areas, while the horizontal one spans the whole width and loses only
   a 22px band it can be grabbed either side of. */
.grip.v{top:0;bottom:0;width:22px;margin-left:-11px;cursor:col-resize;
  z-index:22}
.grip.h{z-index:21}
.grip.v::after{left:9px;top:8px;bottom:8px;width:4px}
.grip.h{left:0;right:0;height:22px;margin-top:-11px;cursor:row-resize}
.grip.h::after{top:9px;left:8px;right:8px;height:4px}

@media(max-width:900px){
  /* One column on a phone: two half-width columns are two unreadable ones.
     The rows still drag. */
  #panes{grid-template-columns:1fr !important}
  .pane.wide{grid-column:1}
  .grip.v{display:none}
}

/* The writing space owns its whole pane and never scrolls: the surface IS
   the space it was given. The canvas is taken out of the flow so it can
   only ever be told its size, never argue about it — a canvas left in a
   flex column can grow the box that is sizing it, and the two then chase
   each other bigger every frame. */
.paneBody.noscroll{overflow:hidden;display:flex;flex-direction:column}
/* The surface first, the tools UNDER it — which is where a hand is.
   A board is a wall, and the top of a wall is above head height in a room
   full of children. The controls belong where the arm already is. */
/* `flex-basis: 0`, not `auto`. With `auto` the board asks for the height of
   its own contents — which, once the toolbar wraps to four rows in a narrow
   pane, is the toolbar and nothing else. Anything sharing the column (the
   sign-in prompt on an open board) then takes the rest, and the surface is
   left with no height at all: a writing space you cannot write on. */
.wboard{flex:1 1 0;min-height:0;display:flex;flex-direction:column;
  gap:.5rem;overflow-y:auto}
/* The tools take one row in a full pane and are allowed to wrap in a
   quarter of one rather than overflow. They are kept small so wrapping is
   rare: every row they take is a row off the surface. */
/* A literal colour, not a variable with a fallback. `var(--panel2, …)` uses
   the fallback only when the variable is UNDEFINED — if it is defined and
   transparent, the fallback never runs and the bar is a sheet of glass with
   whatever is behind it showing through the buttons. */
/* Wrapping, but with a CEILING on how much of the board it may take.
 *
 * These wrapped freely. On a wide board that is right — every control
 * visible, no hunting — and it is a disaster the moment the pane is narrow:
 * the same buttons became 245 pixels of rows in a 394px pane, on a board 256
 * tall, which left the writing surface TWO PIXELS high. That is the "it is
 * eating the board" report.
 *
 * Two fixes were wrong before this one, and both are worth remembering. A
 * media query on the WINDOW width does not help, because wrapping depends on
 * the PANE's width: a board split three ways at 1440px still gave 211 pixels
 * of tools against a 182-pixel surface. And forcing a single sideways-
 * scrolling row fixed the height everywhere at the cost of hiding controls
 * behind a scroll even on a full-width board, where there was no problem to
 * solve — the buttons are about 1800px laid out flat.
 *
 * A fixed ceiling was the third wrong answer: the board runs at a 26px root
 * font, so any rem figure large enough to be useless on a phone was already
 * biting on a full-width board.
 *
 * What is actually wanted is an ORDER of who gives way. The surface has a
 * floor and takes what is left; the bar may shrink, and scrolls inside
 * itself once it has. So where there is room every row shows exactly as
 * before, and where there is not the bar gives way rather than the board. */
.wtools{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;
  flex:0 1 auto;min-height:2.6rem;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  background:#101823;border:1px solid #2a3444;
  border-radius:14px;padding:.4rem .5rem}
.wtools::-webkit-scrollbar{display:none}
.wtools > *{flex:0 0 auto}
.wtools .btn{padding:.3rem .6rem;font-size:.72rem;min-height:2rem}
.wtools .iconbtn{width:2rem;min-height:2rem;padding:0}
.wtools .sep{width:1px;align-self:stretch;background:var(--line,#2a3444);
  margin:0 .15rem}
/* A floor under the surface. A board that has been squeezed to nothing is
   indistinguishable from one that is broken, and the pane can always scroll
   the last row of tools out of sight instead. */
/* The surface takes what is LEFT after the tools, and no more.
   flex-basis:auto with a 9rem floor meant the surface refused to shrink,
   so in a split pane the wrapped toolbar was pushed out of the bottom of
   a pane that clips — 'Save to the class' rendered 211px below the visible
   area and could not be pressed. The button was never broken; it was off
   the screen, which looks identical to a dead button and is worse, because
   there is nothing to report. Controls win over canvas: a surface you
   cannotcontrol is worth less than a smaller one you can. */
/* Takes what is left after the tools, and never less than something you can
   write on. min-height:0 alone let it collapse to nothing the moment the bar
   grew — which is how a two-pixel canvas happened. The floor is small enough
   that the tools still win on a short pane, and .wboard scrolls if even that
   does not fit, so nothing is ever unreachable. */
.wsurf{flex:1 1 0;min-height:7rem;position:relative}
.wsurf canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
  touch-action:none}
.whint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;color:var(--muted);pointer-events:none;font-size:.8rem}
/* Where you are on a surface that has no edges. Without it, panning an empty
   part of the canvas looks exactly like a board that has stopped working. */
.wwhere{position:absolute;right:.5rem;bottom:.5rem;font-size:.62rem;
  color:var(--muted);background:rgba(0,0,0,.35);border-radius:8px;
  padding:.15rem .4rem;pointer-events:none;font-variant-numeric:tabular-nums}

/* The picture drawer. Over the surface, never a second row in the toolbar:
   the bar is the tightest thing on a short pane and another row in it is
   how the writing space ended up 452 pixels tall once already. Capped at
   half the surface so there is always board visible behind it. */
.wpic{position:absolute;left:.5rem;right:.5rem;top:.5rem;z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:.5rem;max-height:52%;overflow-y:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.wpic .row{display:flex;gap:.4rem;flex-wrap:wrap}
.wpic input{flex:1 1 9rem;min-width:0}
.wpic .muted{margin:.4rem 0 0;font-size:.7rem}
.wpic figure{margin:.5rem 0 0}
.wpic img{max-width:100%;max-height:9rem;border-radius:8px;display:block}
.wpic figcaption{font-size:.65rem;color:var(--muted);margin-top:.25rem}

/* ---- writing on top of whatever is on the board ------------------------
 *
 * The writing space is a tool you open, and that is the wrong shape for
 * most of what a teacher does with a pen. The moment worth annotating is a
 * lesson already on the screen, a diagram out of a chapter, a simulation
 * mid-run — and reaching those meant leaving them.
 *
 * So the ink is a sheet OVER the board rather than a page inside it. It
 * covers everything, it passes every click straight through until it is
 * switched on, and its bar is pinned to the bottom of the screen where a
 * hand already is.
 */
#inkLayer{position:fixed;inset:0;z-index:70;pointer-events:none;
  touch-action:none}
#inkLayer.on{pointer-events:auto;cursor:crosshair}
#inkBar{position:fixed;left:0;right:0;bottom:0;z-index:71;display:none;
  gap:.35rem;align-items:center;flex-wrap:wrap;justify-content:center;
  padding:.5rem .6rem;background:#101823f2;border-top:1px solid #2a3444;
  backdrop-filter:blur(6px)}
#inkBar.on{display:flex}
/* Folded away, without putting the pen down.
 *
 * The writing space has a toolbar of its own along the bottom of its pane,
 * and the pen's bar is fixed across the bottom of the SCREEN — so with both
 * out they stack, and which one a control belongs to stops being obvious.
 * Folding leaves a handle rather than closing: closing loses the ink, and
 * somebody who wants the room to see the board without the controls does not
 * want to lose what they have drawn. */
#inkBar.folded{padding:0;gap:0;background:transparent;border-top:0;
  backdrop-filter:none;pointer-events:none}
#inkBar.folded > *{display:none}
#inkBar.folded > #inkFold{display:inline-flex;pointer-events:auto}
/* Folded, it is a handle and not a bar: 26 pixels of tab against 93 of
   controls, so the board underneath is the board and not the last row of
   somebody's toolbar. */
#inkBar.folded > #inkFold{width:3rem;min-height:1.35rem;height:1.35rem;
  padding:0;border-radius:8px 8px 0 0;background:#101823f2;
  border:1px solid #2a3444;border-bottom:0;font-size:.7rem}
#inkBar .btn{padding:.3rem .6rem;font-size:.72rem;min-height:2rem}
#inkBar .iconbtn{width:2rem;min-height:2rem;padding:0}
#inkBar .sep{width:1px;align-self:stretch;background:#2a3444;margin:0 .15rem}
/* The bar sits over the page, so the page needs somewhere to end. */
body.inking{padding-bottom:4.2rem}
/* Before a code is entered there is nothing to act ON.
 *
 * The screen is a clock and a text box. Every control here works on a board
 * — split it, screenshot it, fold its bars, go to its home, sign out of it,
 * ask its subject a question — and a board is exactly what does not exist
 * yet. They were all sitting in the top bar of the code screen, which is a
 * row of nine buttons that either do nothing or take somebody somewhere they
 * cannot be. A control that does nothing is worse than one that is not
 * there.
 *
 * What stays is what still makes sense with no board: the text size, because
 * somebody is reading this screen, and the install prompt.
 *
 * "Where our answers come from" goes too. It is worth reading and it is not
 * worth putting on the screen a class is looking at while the teacher types
 * a code; it is a tool inside the board, where somebody has asked for it. */
body.gated #inkBtn,
body.gated #inkLayer,
body.gated #inkBar,
body.gated #splitBtn,
body.gated #askBtn,
body.gated #shotBtn,
body.gated #headsBtn,
body.gated #homeBtn,
body.gated #outBtn,
body.gated .gatesources{display:none}

/* A viewer takes whatever is left after the controls above it, and follows
   the space when it is dragged. A fixed height is wrong in both directions
   at once on a board: a small picture on a wall, or a picture taller than
   the quarter it was put in. Controls keep their own size; only the viewer
   is elastic, so nothing is ever pushed out of reach. */
.fillcol{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  gap:.6rem}
.fillcol > *{flex:0 0 auto}
.fillcol > .viewer{flex:1 1 auto;min-height:0;position:relative;
  overflow:hidden;padding:0}
/* Out of the flow, so the viewer's height is something it is told, never
   something the thing inside it argues about. */
.viewer > canvas,.viewer > iframe{position:absolute;left:0;top:0;
  width:100%;height:100%;border:0;display:block}
.viewer > .note,.viewer > .muted{padding:1rem}

/* A figure inside a lesson. The 2D renderers work out their own height from
   the width they are given, so they get a plain block; a 3D scene has no
   natural height, so it is told a shape and fills it. */
.fig{background:var(--panel2);border-radius:12px;overflow:hidden;
  margin:.5rem 0 .9rem}
/* Wider, because a molecule or a circuit on a wall has to be readable from
   the back of the room. 16:10 in a narrow column is a letterbox; a minimum
   height tied to the viewport gives it the space the board actually has. */
.fig3d{position:relative;aspect-ratio:16/10;min-height:clamp(260px,46vh,620px)}
.fig3d > canvas{position:absolute;left:0;top:0;display:block}
.figcap{font-size:.68rem;color:var(--muted);margin:.7rem 0 .2rem}
.lessonBody img{max-width:100%;border-radius:12px;display:block}

/* Prose on a board: a shape the eye can land on, at distance, while
   somebody is also talking.
 *
 * A section heading was .74rem, uppercase and letter-spaced — SMALLER than
 * the body it introduced. Uppercase micro-type is a label on a form; it
 * reads as furniture at arm's length and disappears entirely from the back
 * of a room, which is the one place this has to work. A heading here is
 * bigger than what follows it, in sentence case, because that is what makes
 * a page scannable while somebody is also listening to a person talk. */
.lessonBody .lh{font-size:1.45em;line-height:1.25;color:var(--accent);
  margin:1.3rem 0 .5rem;font-weight:700;letter-spacing:-.01em}
.lessonBody .lh:first-child{margin-top:.1rem}
.lessonBody .lp{margin:0 0 .7rem;line-height:1.65;max-width:62ch;
  font-size:1.02em}
.lessonBody .lead{font-size:1.22em;line-height:1.5;font-weight:500}
.lessonBody .ll{margin:.2rem 0 .9rem 1.3rem;padding:0;font-size:1.02em}
/* The same size as a paragraph. A bullet was coming out five pixels
   smaller, which makes a list look like a footnote to the sentence above it
   when it is usually the substance. */
.lessonBody .ll li{margin:.32rem 0;line-height:1.6;padding-left:.2rem}
.lessonBody .ll li::marker{color:var(--accent)}

/* The step number, as a number rather than a whisper.
 *
 * It was muted grey text reading "Step 1", the same size as a caption. On a
 * paged lesson the number is how a class knows where they are and how much
 * is left, and a teacher says it out loud — so it is the one thing on the
 * page that should be readable from the door. */
.lessonBody .lstep{display:flex;align-items:baseline;gap:.55rem;
  margin:0 0 .7rem}
.lessonBody .lstep b{font-size:1.9em;line-height:1;color:var(--accent);
  font-weight:800;letter-spacing:-.02em}
.lessonBody .lstep span{font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}

/* A picture the document itself carried. On white, boxed and captioned,
   because a room has to be able to tell what the author drew from what we
   drew for them. */
.lpic{margin:.8rem 0;padding:0;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;background:#fff}
.lpic img{display:block;width:100%;height:auto;max-height:58vh;
  object-fit:contain;background:#fff;border-radius:0}
.lpic figcaption{font-size:.62rem;color:var(--muted);background:var(--panel2);
  padding:.3rem .6rem;border-top:1px solid var(--line)}

/* A lesson as pages. The controls sit at the top with the title, because on
   a wall-mounted board the bottom of the screen is below the shoulder of
   whoever is standing at it. */
.lessonBar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  margin:.2rem 0 .6rem}
.lessonBar h1{font-size:1.1rem}
.lessonBar .iconbtn{font-size:1.2rem;min-width:2.6rem;min-height:2.6rem}
.lessonBar .iconbtn[disabled]{opacity:.35}
.lessonPage{animation:pageIn .18s ease-out}
/* A lesson kept on the subject page, opened where it is. */
.lessonKept{margin-top:.6rem;padding-top:.6rem;
  border-top:1px solid var(--line)}
.lessonKept p{margin:.4rem 0}

/* A classroom's subjects, and who teaches each. */
.subjects{display:grid;gap:.4rem;margin-top:.6rem;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,11rem),1fr))}
.subject{background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:.55rem .7rem;display:flex;
  flex-direction:column;gap:.15rem}
.subject.mine{border-color:var(--accent)}
.subject span{font-size:.66rem}
@keyframes pageIn{from{opacity:.4}}
@media(prefers-reduced-motion:reduce){.lessonPage{animation:none}}

/* Listening. A board is across the room, so the only thing that says the
   microphone is open has to be visible from there. */
.iconbtn.mic.listening{background:var(--accent);border-color:var(--accent);
  color:#10151c;animation:micpulse 1.1s ease-in-out infinite}
@keyframes micpulse{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){
  .iconbtn.mic.listening{animation:none}
}

/* The pairing code is read off a board from the back of a room, so it is
   set at the size that makes that possible and no smaller. */
.remoteCode{font-size:clamp(2rem,9vw,4.5rem);letter-spacing:.18em;
  font-weight:700;text-align:center;color:var(--accent);
  margin:.6rem 0 1rem;font-family:ui-monospace,Menlo,Consolas,monospace}

/* The remote itself. It is used one-handed, without looking down, in a room
   where somebody is talking — so everything on it is thumb-sized. */
.phone{max-width:32rem;margin:0 auto;padding:var(--pad)}
.phone .btn,.phone .iconbtn{min-height:2.8rem}
.phRow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.phGrid{display:grid;gap:.5rem;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,9rem),1fr))}

/* The boards render into #main and bring their own CSS. They were written
   for a 16px page, so they are scaled down relative to the room-sized base
   rather than left to fill a wall with one input box. */
.paneBody .nwwrap,.paneBody .labwrap,.paneBody .sqlwrap{font-size:.62rem}

@media print{ #top,.tile{display:none!important} }

/* The board's clock. Sized to be read from the back of a room, and quiet
   enough not to compete with the sign-in tabs under it. */
#clock{margin:.2rem 0 1.1rem}
#clockTime{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1;font-weight:800;
  letter-spacing:.01em;font-variant-numeric:tabular-nums}
#clockDate{font-size:clamp(.95rem,1.8vw,1.25rem);margin-top:.35rem}
</style>
</head>
<body>

<div id="top">
  <div id="brand"><img class="dot" src="/icon-192.png" alt="Craxle" width="192" height="192">
    <!-- The clock lives here, under the name, where the market segments
         used to be. That line named who the product is sold to, on a
         screen only people who already have it ever look at. -->
    <span>Craxlearn<small id="barClock">—</small></span></div>
  <span class="grow"></span>
  <div class="who" id="who"></div>
  <button class="iconbtn" id="splitBtn" title="Open another space beside this one">▥</button>
  <!-- Ask Axle, always reachable.
       It is a tile on the home screen, which is fine until a teacher is two
       screens deep in a lesson and wants to ask something — at which point
       the way to it is Home, then find the tile, mid-sentence, with the room
       waiting. It is the thing this board is for, so it gets the one button
       that is always on the screen, in the accent, like the ⚡ card on
       craxle.com's own home. -->
  <button class="iconbtn askbtn" id="askBtn" title="Ask Axle">⚡</button>
  <button class="iconbtn" id="inkBtn" title="Write on the screen">✏️</button>
  <button class="iconbtn" id="shotBtn" title="Screenshot">⛶</button>
  <button class="iconbtn" id="installBtn" title="Install on this board" hidden>⤓</button>
  <button class="iconbtn" id="headsBtn" title="Hide the space bars">⌃</button>
  <button class="iconbtn" id="scaleBtn" title="Text size">Aa</button>
  <button class="iconbtn" id="fullBtn" title="Full screen">⤢</button>
  <button class="iconbtn" id="homeBtn" title="Home">⌂</button>
  <button class="iconbtn" id="outBtn" title="Sign out">↪</button>
</div>

<canvas id="inkLayer"></canvas>
<div id="inkBar"></div>

<div id="gate" hidden>
  <div class="card">
    <h1>Craxlearn</h1>
    <!-- A clock, where the sales line used to be.
         "For schools, colleges and coaching centres" is written for somebody
         deciding whether to buy this. It sat on the screen at the front of a
         classroom all day, in front of people who already have it. The one
         thing a wall-mounted display is useful for while nobody is teaching
         is telling the room the time. -->
    <div id="clock" aria-live="off">
      <div id="clockTime">--:--</div>
      <div id="clockDate" class="muted"></div>
    </div>
    <div class="tabs" role="tablist">
      <!-- No "New account" here, on purpose.

           Nobody signs up at a board. A board is a screen on a classroom
           wall: the school admin signs in on it once to turn it on, teachers
           join their own classroom with the code they were given, and pupils
           tap their name off the register. An account is made by the school,
           on the school's own screen, by somebody who knows who they are
           employing — not by whoever is standing in front of the television.
        -->
      <button role="tab" id="tabCode" aria-selected="true">Enter a code</button>
      <button role="tab" id="tabRemote" aria-selected="false">Remote</button>
      <button role="tab" id="tabOpen" aria-selected="false">Just the board</button>
    </div>
    <div id="gateForm"></div>
    <div id="gateMsg" class="muted" style="margin-top:.7rem"></div>
  </div>
  <p class="muted" style="text-align:center">
    <a class="gatesources" href="/api/craxlearn/sources">Where our answers
      come from</a><span class="gatesources"> · </span>
    <a href="/privacy">Privacy</a>
  </p>
</div>

<div id="app" hidden><div id="panes"></div></div>

<script>
/* The things the board modules need from a host page, defined BEFORE they
 * load. Each of them captures window.$ once, at load time — so this has to
 * be here rather than in the app script below, and putting it there is
 * exactly why net, lab, sqlboard and the scanner all rendered into nothing
 * the first time. The app script hands this shim its real pane resolver
 * once it runs.
 */
window.__paneBody = null;
window.$ = function (sel) {
  if (sel === "#main" && window.__paneBody) return window.__paneBody();
  return document.querySelector(sel);
};
window.esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
             '"': "&quot;", "'": "&#39;" }[c];
  });
};
</script>
<script src="sqlboard.js?v=eece7ffc7b"></script>
<script src="net.js?v=4381cbbb1f"></script>
<script src="lab.js?v=c536df7feb"></script>
<script src="draw.js?v=89efe3a887"></script>
<script src="sketch.js?v=665dcd5a1b"></script>
<script src="three3d.js?v=2825c4b40c"></script>
<script src="scanner.js?v=f62f1b0eb8"></script>
<script>
/* Craxlearn — the institution app.
 *
 * A separate page from index.html, deliberately, and for one reason: a
 * school is buying a URL it can put on the board at the front of a room and
 * hand to a fourteen-year-old. A single app with the job half hidden behind
 * a flag is one bug away from showing it, and the person who finds that bug
 * is a child. There is no job-board code in this file to go wrong.
 *
 * The server does not take this file's word for any of it. Every job-side
 * route is refused at the door by the middleware in main.py, for institution
 * accounts and for under-18s, whichever page asked. This file only decides
 * what to draw.
 *
 * The boards themselves — SQL, the packet walkthrough, the lab — are the
 * same modules the main app loads. They need four things from their host:
 * `api.get`, `api.post`, a `$` selector reaching `#main`, and `window.esc`.
 * That contract is provided below and nothing else is.
 */
(function(){
"use strict";

/* ---------- the four things the board modules need ---------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* The head of this file already installed window.$ and window.esc so the
   modules could capture them. This hands that shim the real resolver — the
   modules keep the function they captured and it starts answering "#main"
   with whichever space is being drawn into. */
/* A module resolves "#main" EVERY time it repaints, not once at mount, and
   sqlboard.js/net.js/lab.js/scanner.js all repaint on their own after a
   fetch or a button press — long after drawPane has moved on. Resolving to
   "the space being drawn right now" was therefore right only for the first
   paint: the SQL board's second paint landed in whichever space was drawn
   last, so it appeared in two panes at once.

   So a module-hosting space is pinned. MODULE_HOST is set when a module
   tool is opened and every later repaint goes there, whoever is drawing. */
var MODULE_HOST = null;
window.__paneBody = function(){
  if(MODULE_HOST && MODULE_HOST.isConnected) return MODULE_HOST;
  return paneBody();
};

/* The tools that are separate files and own their own repainting. */
var MODULE_TOOLS = ["net", "lab", "sqlboard", "scan"];

/* One sentence out of whatever the server put in "detail".

   Three shapes arrive here: a plain string (our own refusals), an object with
   a .message (a structured refusal), and an ARRAY of {loc, msg} from FastAPI
   when a field fails validation. The array is the one that matters, because
   an array passed to new Error() stringifies to "[object Object]" — which is
   what reached the screen instead of the reason. */
function _detailText(detail, status, statusText){
  var fallback = statusText || ("Request failed (" + status + ")");
  if(!detail) return fallback;
  if(typeof detail === "string") return detail;
  if(Object.prototype.toString.call(detail) === "[object Array]"){
    var first = detail[0];
    if(!first) return fallback;
    if(typeof first === "string") return first;
    var msg = (first.msg || first.message || fallback)
                .replace(/^Value error,\s*/i, "");
    var loc = [];
    if(Object.prototype.toString.call(first.loc) === "[object Array]"){
      loc = first.loc.filter(function(x){
        return ["body","query","path","header"].indexOf(x) === -1; });
    }
    var field = loc.length ? String(loc[loc.length - 1]) : "";
    if(field && msg.toLowerCase().indexOf(field.toLowerCase()) === -1){
      msg = field.replace(/_/g, " ") + ": " + msg;
    }
    return msg;
  }
  if(typeof detail === "object") return detail.message || fallback;
  return fallback;
}

async function req(method, path, body){
  /* "omit", not "same-origin". The board must not become whoever last
     signed in to craxle.com on this machine — see boot(). */
  /* And it carries the board's token, when it has one.
   *
   * This sent nothing at all, so every tool reaching for `api` was anonymous
   * on a board that was holding a perfectly good subject code. Simulations
   * answered "Not signed in"; the course list threw where nothing caught it
   * and sat on "Loading the courses…" for as long as anybody waited. Both
   * read a published catalogue — there was never a person to be.
   *
   * This does not weaken the isolation the line above is about. Credentials
   * stay omitted, so the board still cannot become whoever last used this
   * machine. The token names a ROOM and nobody in it, it is the board's only
   * credential, and there is no reason for one of the two clients to send it
   * and the other to pretend it does not exist. */
  var opt = { method:method, credentials:"omit",
              headers: bhdr({ "Content-Type":"application/json" }) };
  if(body !== undefined) opt.body = JSON.stringify(body);
  var r = await fetch(path, opt);
  var text = await r.text();
  var data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
  if(!r.ok){
    /* detail is a string for our own refusals and an ARRAY of
       {loc, msg} objects for a FastAPI validation failure. Passing the array
       straight to new Error() gives the message "[object Object]", which is
       what a teacher saw on the board instead of being told which field was
       wrong. Same helper, same reasoning as index.html. */
    var msg = _detailText(data && data.detail, r.status, r.statusText);
    var err = new Error(msg);
    err.status = r.status;
    /* The gate answers 403 with a reason, so the page can say WHICH wall
       was hit rather than "forbidden". A learner told "not allowed" goes
       and asks a teacher; one told "this is a Craxlearn server" does not. */
    err.craxlearn = data && data.craxlearn;
    throw err;
  }
  return data;
}
window.api = {
  get:  function(p){ return req("GET", p); },
  post: function(p,b){ return req("POST", p, b===undefined?{}:b); },
  del:  function(p){ return req("DELETE", p); }
};

/* ---------- what a subject code is worth here ----------
 *
 * A subject code opens the room and hands back a short-lived token naming
 * one class and one subject. The server has honoured it for a while; nothing
 * on this page ever sent it, so a board opened with a code could draw and
 * calculate and keep nothing.
 *
 * It goes in a HEADER rather than the body or the URL, for two reasons. It
 * is a credential and not part of what is being saved; and the routes that
 * take it must be able to refuse an anonymous caller before they look at a
 * body, which they can only do if the refusal does not need one.
 *
 * BOARDED is the question every caller actually wants answered: is this
 * board standing in a subject it may file into. */
function boarded(){ return !!(ROOM && ROOM.board_token); }

function bhdr(h){
  h = h || {};
  if(boarded()) h["X-Board-Token"] = ROOM.board_token;
  return h;
}

/* The same three verbs as `api`, carrying the token. A signed-in teacher
   sends the cookie as well and the server prefers whichever arrives — so one
   set of call sites serves both, instead of every button branching on how
   the person in front of it got here. */
window.bapi = {
  get: function(p){
    return _bfetch("GET", p, null, { "Content-Type":"application/json" });
  },
  post: function(p, b){
    return _bfetch("POST", p, JSON.stringify(b || {}),
                   { "Content-Type":"application/json" });
  },
  /* Multipart: the Content-Type must be left off entirely so the browser can
     write the boundary into it. Setting it by hand produces a body no server
     can split. */
  send: function(p, fd){ return _bfetch("POST", p, fd, {}); }
};

async function _bfetch(method, path, body, headers){
  var opt = { method:method, credentials:"omit",
              headers: bhdr(headers) };
  if(body !== null && body !== undefined) opt.body = body;
  var r = await fetch(path, opt);
  var text = await r.text();
  var data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
  if(!r.ok){
    var err = new Error(_detailText(data && data.detail, r.status, r.statusText));
    err.status = r.status;
    throw err;
  }
  return data;
}

/* ---------- state ---------- */
var ME = null;
var VIEW = { page:"home" };
/* bot.js and the board modules read these. Kept as the same shape the main
   app uses so the modules need no branch for which page they are on. */
window.S = VIEW.page ? { view:VIEW } : { view:VIEW };
window.S.view = VIEW;

var el = function(id){ return document.getElementById(id); };

/* ---------- spaces ----------
 *
 * One or two, side by side, with a divider you drag. Each holds any tool.
 * `main()` is the body of whichever one is being drawn into, which is what
 * lets every page function in this file — all of which were written against
 * a single screen — work unchanged in either.
 */
var PANES = [{ page:"home", arg:null }];
var LIVE = 0;          // the space a new page opens into
var DRAW = 0;          // the space currently being drawn
var PAINTING = false;  // true while that drawing is in progress

/* What a space is showing, so that splitting the screen — which rebuilds
   every space — comes back to the same structure or the same search rather
   than to an empty box. The live space is the one whose controls were just
   used: a tap anywhere in a space makes it live before the control sees the
   click. */
function remember(arg){
  /* During a repaint the space being drawn is not necessarily the live one,
     and writing to the live one would overwrite what a DIFFERENT space is
     showing. */
  var i = PAINTING ? DRAW : LIVE;
  if(PANES[i]) PANES[i].arg = arg;
}

function paneBody(){
  var p = document.querySelector('.paneBody[data-i="' + DRAW + '"]');
  return p || document.querySelector(".paneBody") || el("app");
}
var main = paneBody;

var TOOL_NAMES = {
  home:"Home", board:"Ask the board", write:"Writing space",
  calc:"Calculator", structure:"3D structures", find:"Search the sources",
  phet:"Simulations", scan:"Scan a problem", tracks:"Courses and exams",
  lesson:"A lesson", track:"A course", exam:"An exam",
  net:"Trace a packet", lab:"The lab", sqlboard:"SQL board",
  materials:"Study material", roster:"Class register", roll:"Your classes",
  inbox:"To review",
  sources:"Where answers come from", remote:"Remote",
  bring:"Saved for this subject",
  assignment:"Assignment",
  student:"A student", review:"Reviewing"
};

/* A space that has been drilled into — an open lesson, one student's record —
   is still, as far as its selector is concerned, the tool it came from. Without
   this the selector goes blank the moment a teacher opens a lesson, because no
   option matches "lesson". */
var PARENT = {
  lesson:"tracks", track:"tracks", exam:"tracks",
  assignment:"roll", student:"roll", review:"inbox"
};
function toolOf(page){ return PARENT[page] || page; }

var MAX_PANES = 4;

/* How the spaces are arranged, and where the drag handles go.
 *
 * SPLIT is the fraction of the width the left column takes, ROWS the
 * fraction of the height the top row takes. One pair of numbers drives
 * every layout, which is why three and four spaces are now adjustable and
 * were not before: the old flex version had a divider only for two.
 *
 *   1  one space
 *   2  two columns            — vertical handle
 *   3  two columns, two rows, the third spanning the bottom
 *                             — vertical + horizontal handles
 *   4  two by two             — vertical + horizontal handles
 */
var SPLIT = 0.5, ROWS = 0.5;

function layout(){
  var n = PANES.length;
  var wrap = el("panes");
  var cols = (n === 1) ? "1fr"
                       : (SPLIT.toFixed(3) + "fr " + (1 - SPLIT).toFixed(3) + "fr");
  var rows = (n <= 2) ? "1fr"
                      : (ROWS.toFixed(3) + "fr " + (1 - ROWS).toFixed(3) + "fr");
  wrap.style.gridTemplateColumns = cols;
  wrap.style.gridTemplateRows = rows;
  /* Three spaces: the third takes the whole bottom row rather than leaving
     a hole, which is what a teacher expects when they add one. */
  wrap.querySelectorAll(".pane").forEach(function(p, i){
    p.classList.toggle("wide", n === 3 && i === 2);
  });
  var v = wrap.querySelector(".grip.v"), h = wrap.querySelector(".grip.h");
  if(v){
    v.hidden = n < 2;
    v.style.left = (SPLIT * 100) + "%";
    /* The vertical divider separates the TOP ROW. With three spaces the
       third is full width underneath, and a handle pinned top-to-bottom
       drew a line straight down through it — a line dividing nothing, over
       a space that is not divided. It stops where the row divider is. */
    v.style.bottom = (n === 3) ? ((1 - ROWS) * 100) + "%" : "0";
  }
  if(h){
    h.hidden = n < 3;
    h.style.top = (ROWS * 100) + "%";
  }
}

/* ---- a pen for one space -------------------------------------------------
 *
 * The board already has Ink: one sheet of glass over the whole screen. That
 * is right for annotating the room's display and wrong the moment the board
 * is split. A ring drawn round a term in the lesson on the left belongs to
 * the lesson on the left — and on the glass it stayed where the glass was:
 * it did not move when that pane scrolled, and it sat over the simulation
 * when that pane was swapped to another tool.
 *
 * So each space gets its own. Three decisions worth stating.
 *
 * **The canvas is a child of the scrolling body, sized to its scrollHeight.**
 * Not fixed and repositioned on scroll — in the flow, so the browser moves
 * it with the content for free and a mark cannot lag a fast flick.
 *
 * **The strokes live on the pane, not on the element.** Panes are rebuilt
 * whenever a tool changes or the board is split again, and marks that lived
 * on the canvas would vanish every time.
 *
 * **Off means gone.** While the pen is on, that pane's glass takes every
 * pointer event and nothing underneath can be clicked — necessary while
 * marking up and intolerable otherwise.
 */
var MARK_COLOURS = ["#ff3b30", "#ffb020", "#34c759", "#3b9cff", "#ffffff"];

function markToggle(i, btn){
  var p = PANES[i];
  if(!p) return;
  if(p.marking){ markOff(i); } else { markOn(i); }
  if(btn) btn.classList.toggle("on", !!PANES[i].marking);
}

function markOff(i){
  var p = PANES[i];
  if(!p) return;
  p.marking = false;
  var pane = el("panes").querySelector('.pane[data-i="' + i + '"]');
  if(!pane) return;
  pane.dataset.marking = 0;
  var cv = pane.querySelector(".paneMark"), bar = pane.querySelector(".markBar");
  if(cv) cv.classList.remove("on");
  if(bar) bar.classList.remove("on");
  var btn = pane.querySelector("[data-mark]");
  if(btn) btn.classList.remove("on");
}

function markOn(i){
  var p = PANES[i];
  var pane = el("panes").querySelector('.pane[data-i="' + i + '"]');
  if(!p || !pane) return;
  var body = pane.querySelector(".paneBody");
  if(!body) return;
  p.marking = true;
  p.marks = p.marks || [];
  p.markColour = p.markColour || MARK_COLOURS[0];
  p.markTool = p.markTool || "pen";
  pane.dataset.marking = 1;
  var btn = pane.querySelector("[data-mark]");
  if(btn) btn.classList.add("on");

  var cv = pane.querySelector(".paneMark");
  if(!cv){
    cv = document.createElement("canvas");
    cv.className = "paneMark";
    body.appendChild(cv);
  }
  var bar = pane.querySelector(".markBar");
  if(!bar){
    bar = document.createElement("div");
    bar.className = "markBar";
    bar.innerHTML =
      MARK_COLOURS.map(function(c){
        return '<button class="sw" data-mc="' + c + '" title="' + c +
          '" style="background:' + c + '"></button>'; }).join("") +
      '<button data-mt="pen" title="Pen">✎</button>' +
      '<button data-mt="eraser" title="Rub out">⌫</button>' +
      '<button data-mclear="1" title="Take every mark off">Clear</button>' +
      '<button data-mdone="1" title="Put the pen down">Done</button>';
    body.appendChild(bar);
  }
  cv.classList.add("on");
  bar.classList.add("on");

  var ctx = null, live = null, drawing = false;
  var R = Math.min(window.devicePixelRatio || 1, 2);

  function size(){
    /* The scrollable extent, not the visible box. A canvas the height of the
       window would end at the fold, and a mark made after scrolling would
       have nowhere to land. */
    var w = body.clientWidth, h = Math.max(body.scrollHeight, body.clientHeight);
    if(cv.width === Math.round(w * R) && cv.height === Math.round(h * R)) return;
    cv.width = Math.round(w * R);
    cv.height = Math.round(h * R);
    cv.style.width = w + "px";
    cv.style.height = h + "px";
    ctx = cv.getContext("2d");
    ctx.setTransform(R, 0, 0, R, 0, 0);
    paint();
  }
  function stroke(s){
    if(!ctx) return;
    ctx.save();
    ctx.globalAlpha = s.t === "marker" ? 0.34 : 1;
    ctx.strokeStyle = s.c;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 3.2;
    if(s.p.length === 1){
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(s.p[0][0], s.p[0][1], 1.8, 0, 6.29);
      ctx.fill();
    }else{
      ctx.beginPath();
      ctx.moveTo(s.p[0][0], s.p[0][1]);
      for(var j = 1; j < s.p.length; j++) ctx.lineTo(s.p[j][0], s.p[j][1]);
      ctx.stroke();
    }
    ctx.restore();
  }
  function paint(){
    if(!ctx) return;
    ctx.clearRect(0, 0, cv.width / R, cv.height / R);
    p.marks.forEach(stroke);
    if(live) stroke(live);
  }
  /* Where the pointer is INSIDE the canvas, which is the same space the
     marks are stored in. getBoundingClientRect already carries the pane's
     scroll, so nothing here has to know about it. */
  function at(e){
    var r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function rub(q){
    var before = p.marks.length;
    p.marks = p.marks.filter(function(s){
      return !s.p.some(function(pt){
        return Math.abs(pt[0] - q[0]) < 20 && Math.abs(pt[1] - q[1]) < 20; });
    });
    if(p.marks.length !== before) paint();
  }

  size();
  /* The content can grow after this — a lesson finishes rendering, an image
     loads — and the canvas has to grow with it or marks below the old fold
     are lost. */
  if(window.ResizeObserver && !cv._ro){
    cv._ro = new ResizeObserver(function(){ size(); });
    cv._ro.observe(body);
  }

  cv.onpointerdown = function(e){
    e.preventDefault();
    drawing = true;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    if(p.markTool === "eraser") return rub(at(e));
    live = { c: p.markColour, t: p.markTool, p: [at(e)] };
    paint();
  };
  cv.onpointermove = function(e){
    if(!drawing) return;
    e.preventDefault();
    if(p.markTool === "eraser") return rub(at(e));
    if(!live) return;
    var held = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    var pts = (held && held.length) ? held : [e];
    for(var j = 0; j < pts.length; j++) live.p.push(at(pts[j]));
    paint();
  };
  ["pointerup", "pointercancel", "pointerleave"].forEach(function(ev){
    cv.addEventListener(ev, function(){
      if(!drawing) return;
      drawing = false;
      if(live && live.p.length) p.marks.push(live);
      live = null;
      paint();
    });
  });

  bar.querySelectorAll("[data-mc]").forEach(function(b){
    b.classList.toggle("sel", b.dataset.mc === p.markColour);
    b.onclick = function(){
      p.markColour = b.dataset.mc;
      p.markTool = "pen";
      bar.querySelectorAll("[data-mc]").forEach(function(o){
        o.classList.toggle("sel", o === b); });
      bar.querySelectorAll("[data-mt]").forEach(function(o){
        o.classList.toggle("sel", o.dataset.mt === "pen"); });
    };
  });
  bar.querySelectorAll("[data-mt]").forEach(function(b){
    b.classList.toggle("sel", b.dataset.mt === p.markTool);
    b.onclick = function(){
      p.markTool = b.dataset.mt;
      bar.querySelectorAll("[data-mt]").forEach(function(o){
        o.classList.toggle("sel", o === b); });
    };
  });
  bar.querySelector("[data-mclear]").onclick = function(){
    p.marks = [];
    paint();
  };
  bar.querySelector("[data-mdone]").onclick = function(){ markOff(i); };
}

function paintPanes(){
  var wrap = el("panes");
  /* `one` is recomputed here and `noheads` is not — it is a choice the
     teacher made, and assigning className wholesale threw it away on every
     repaint, so the bars came back the moment anybody switched tool. */
  wrap.className = (PANES.length === 1 ? "one" : "") +
    (headsHidden() ? " noheads" : "");
  var html = "";
  PANES.forEach(function(p, i){
    html += '<div class="pane" data-i="' + i + '" data-live="' +
      (i === LIVE ? 1 : 0) + '">' +
      '<div class="paneHead">' +
        '<select data-pick="' + i + '">' +
          Object.keys(TOOL_NAMES).filter(function(k){
            if(["assignment","student","review","lesson","track",
                "exam"].indexOf(k) >= 0) return false;
            /* An open board offers what works without an account, and the
               Remote — which is where it explains what signing in would
               add. Offering the rest would be a menu of things that all
               answer "sign in first". */
            if(OPEN && OPEN_TOOLS.indexOf(k) < 0
               && k !== "home" && k !== "remote") return false;
            /* Some tools need a PERSON, and this screen never has one.
               The register, your classes and the marking queue all read a
               craxle.com session; a board carries a subject code, which
               names a room and nobody in it. They were unreachable while a
               coded board was mislabelled as anonymous, and offering them
               now would only put three tools in the menu that answer "sign
               in first" — on a screen that cannot sign in at all. */
            if(ACCOUNT_TOOLS.indexOf(k) >= 0) return false;
            /* Each tool names its own fields by id, so two copies of one
               tool would both write into the same boxes. Home is exempt:
               it has nothing to type into. */
            if(k === "home" || k === toolOf(p.page)) return true;
            /* One module tool at a time, anywhere. They are separate files
               that each ask for "#main" and repaint themselves; two of them
               open at once would both be pinned to one space. */
            if(MODULE_TOOLS.indexOf(k) >= 0
               && PANES.some(function(q, j){
                    return j !== i && MODULE_TOOLS.indexOf(q.page) >= 0; })){
              return false;
            }
            return !PANES.some(function(q, j){
              return j !== i && toolOf(q.page) === k; });
          }).map(function(k){
            return '<option value="' + k + '"' +
              (k === toolOf(p.page) ? " selected" : "") + ">" +
              esc(TOOL_NAMES[k]) + "</option>";
          }).join("") +
        "</select>" +
        '<span class="grow"></span>' +
        /* A pen for THIS space. The board has one big sheet of glass over
           everything, which is right for annotating the room's screen and
           wrong the moment the board is split: a ring drawn over the lesson
           on the left belongs to the lesson on the left, and it followed
           the glass instead — staying put when that pane scrolled and
           sitting over the simulation when the pane was swapped. */
        /* Not on the writing space: that IS a pen, with its own colours,
           its own eraser and an endless surface behind it. A second sheet
           of glass over it would take the pointer events the board needs
           and leave a teacher unable to write on the writing space. */
        (p.page === "write" ? "" :
          '<button class="iconbtn" data-mark="' + i + '" ' +
            'title="Draw on this space">✎</button>') +
        '<button class="iconbtn" data-shot="' + i + '" title="Screenshot this space">⛶</button>' +
        // Being wrong costs most here. A lesson on a classroom
        // display is read by thirty people at once, none of whom can
        // check it, with a teacher beside it lending it authority.
        '<button class="iconbtn" data-wrong="' + i + '" title="Report an error in this">⚠</button>' +
        (PANES.length > 1
          ? '<button class="iconbtn" data-close="' + i + '" title="Close this space">✕</button>'
          : "") +
      "</div>" +
      '<div class="paneBody" data-i="' + i + '"></div>' +
      "</div>";
  });
  // The two handles live outside the panes and are positioned over the gaps,
  // so they do not have to be counted in any grid template.
  html += '<div class="grip v" hidden></div><div class="grip h" hidden></div>';
  wrap.innerHTML = html;
  // Every body element was just replaced, so the old pin points at a node
  // that is no longer in the document.
  MODULE_HOST = null;
  layout();
  wirePanes();
  /* Every repaint is a change worth surviving a reload: the tool in each
     space, and how the space is divided. */
  remberRoom();
  (async function(){
    for(var i = 0; i < PANES.length; i++) await drawPane(i);
  })();
}

async function drawPane(i){
  var was = DRAW, wasPainting = PAINTING;
  DRAW = i;
  PAINTING = true;
  try{ await paint(PANES[i].page, PANES[i].arg); }
  catch(e){ /* one space failing must not stop the others drawing */ }
  finally{ DRAW = was; PAINTING = wasPainting; }
}

function wirePanes(){
  var wrap = el("panes");
  wrap.querySelectorAll("[data-pick]").forEach(function(sel){
    sel.onchange = function(){
      var i = +sel.dataset.pick;
      PANES[i] = { page: sel.value, arg: null, flex: PANES[i].flex };
      LIVE = i;
      paintPanes();
    };
  });
  wrap.querySelectorAll("[data-close]").forEach(function(b){
    b.onclick = function(){
      PANES.splice(+b.dataset.close, 1);
      LIVE = 0;
      paintPanes();
    };
  });
  /* Each space photographs ITSELF, and the picture goes to the subject.
   *
   * This asked to share the whole screen — a browser permission prompt, the
   * browser's own chrome in the shot, and the other half of a split board
   * with it. For the writing space none of that is necessary: the board is
   * a canvas and it can be read directly, with no permission and nothing in
   * frame that is not the board.
   *
   * And it is KEPT rather than downloaded. A picture of the board on a
   * machine bolted to a wall reaches nobody; on the subject page the class
   * opens it that evening. Anything that is not the writing space still
   * goes through the screen capture, because a lesson is a page of HTML and
   * a browser cannot rasterise one without a library. */
  wrap.querySelectorAll("[data-shot]").forEach(function(b){
    b.title = "Keep a picture of this space on the class page";
    b.onclick = function(){
      var i = +b.dataset.shot;
      var isWriting = PANES[i] && PANES[i].page === "write";
      if(isWriting && WRITING_SHOT){
        try{ return keepShot(WRITING_SHOT(), b); }
        catch(e){ /* fall through to the screen capture */ }
      }
      shoot();
    };
  });
  wrap.querySelectorAll("[data-wrong]").forEach(function(b){
    b.onclick = function(){ reportWrong(+b.dataset.wrong); };
  });
  wrap.querySelectorAll("[data-mark]").forEach(function(b){
    b.onclick = function(){ markToggle(+b.dataset.mark, b); };
  });
  /* A space that was being drawn on before this repaint gets its marks
     back. Panes are rebuilt whenever a tool changes or the board is split
     again, and the ink belongs to the space, not to the element. */
  PANES.forEach(function(p, i){
    if(p.marking && p.page !== "write") markOn(i);
    else if(p.marking) p.marking = false;
  });
  wrap.querySelectorAll(".pane").forEach(function(p){
    p.addEventListener("pointerdown", function(){
      var i = +p.dataset.i;
      if(i === LIVE) return;
      LIVE = i;
      wrap.querySelectorAll(".pane").forEach(function(q){
        q.dataset.live = (+q.dataset.i === LIVE) ? 1 : 0;
      });
    }, true);
  });

  /* Dragging. Both handles work the same way: read where the pointer is
     as a fraction of the grid, clamp it so a space can never be dragged to
     nothing, and rewrite the template. Fractions rather than pixels, so
     rotating a board or plugging in another screen keeps the proportions
     the teacher chose. */
  wrap.querySelectorAll(".grip").forEach(function(g){
    var vertical = g.classList.contains("v");
    g.addEventListener("pointerdown", function(e){
      e.preventDefault();
      g.setPointerCapture(e.pointerId);
      g.classList.add("on");
      function move(ev){
        var r = wrap.getBoundingClientRect();
        var f = vertical ? (ev.clientX - r.left) / r.width
                         : (ev.clientY - r.top) / r.height;
        f = Math.min(0.85, Math.max(0.15, f));
        if(vertical) SPLIT = f; else ROWS = f;
        layout();
      }
      function up(){
        g.classList.remove("on");
        g.removeEventListener("pointermove", move);
        g.removeEventListener("pointerup", up);
        g.removeEventListener("pointercancel", up);
      }
      g.addEventListener("pointermove", move);
      g.addEventListener("pointerup", up);
      g.addEventListener("pointercancel", up);
    });
    /* Double-tap a handle to put it back to even. Faster than dragging it
       back, and on a board a dragged handle is easy to nudge by accident. */
    g.addEventListener("dblclick", function(){
      if(vertical) SPLIT = 0.5; else ROWS = 0.5;
      layout();
    });
  });
}

/* A picture of whatever is on the screen, using the browser's own capture
   rather than a DOM-to-canvas library. It is the only way to get a true
   screenshot without shipping a dependency, it captures the 3D view and the
   writing space correctly where a DOM copy would not, and on a board it is
   one tap and a confirm. */
async function shoot(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    alert("This board's browser cannot take a screenshot. The writing " +
          "space has its own Save as picture button.");
    return;
  }
  var stream = null;
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: "browser" }, audio: false });
    var track = stream.getVideoTracks()[0];
    var v = document.createElement("video");
    v.srcObject = stream;
    v.muted = true;
    await v.play();
    /* One frame is enough, but the first one is often blank while the
       capture warms up. */
    await new Promise(function(r){ setTimeout(r, 320); });
    var st = track.getSettings ? track.getSettings() : {};
    var cv = document.createElement("canvas");
    cv.width = st.width || v.videoWidth || 1920;
    cv.height = st.height || v.videoHeight || 1080;
    cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
    /* The frame is captured; now choose how much of it to keep. */
    cropPick(cv);
  }catch(e){
    /* Cancelling the picker is not an error worth a dialog. */
  }finally{
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
  }
}


/* Choose a part of the picture, or keep all of it.
 *
 * The screenshot took the whole surface and downloaded it. On a board that is
 * usually far more than anybody wanted — a teacher photographing one worked
 * equation got the browser chrome, the tab bar and the other half of a split
 * screen with it, and then had to crop it somewhere else.
 *
 * So the captured frame is shown back and a rectangle is dragged over the
 * part that matters. Dragging on the IMAGE rather than on the live page
 * matters: the capture is in screen pixels and the page is in CSS pixels, and
 * on a board with any zoom or scaling those are not the same coordinates. What
 * you drag over is exactly what you get.
 */
function cropPick(src){
  var back = document.createElement("div");
  back.style.cssText = "position:fixed;inset:0;z-index:9999;background:#000c;" +
    "display:flex;flex-direction:column;align-items:center;justify-content:center;" +
    "gap:.6rem;padding:1rem";
  var bar = document.createElement("div");
  bar.style.cssText = "color:#fff;font:600 15px system-ui;display:flex;" +
    "gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center";
  bar.innerHTML = '<span id="shotHow">Drag over the part you want.</span>' +
    /* A rectangle is right for a worked equation and wrong for a diagram in
       the middle of a page with writing all round it. Drawing round the
       thing is how somebody would point at it with their hand. */
    '<button class="btn ghost on" id="shotRect" title="Select a rectangle">' +
      '▭ Box</button>' +
    '<button class="btn ghost" id="shotFree" title="Draw round the part you ' +
      'want">✎ Free hand</button>' +
    '<span class="sep" style="width:1px;height:1.4rem;background:#fff3"></span>' +
    '<button class="btn ghost" id="shotAll">Download</button>' +
    '<button class="btn" id="shotKeep">Keep on the class page</button>' +
    '<button class="btn ghost" id="shotNo">Cancel</button>' +
    '<span class="muted" id="shotMsg" style="font-size:.7rem"></span>';
  var holder = document.createElement("div");
  holder.style.cssText = "position:relative;max-width:96vw;max-height:80vh;" +
    "box-shadow:0 0 0 1px #fff3";
  var img = document.createElement("img");
  img.src = src.toDataURL("image/png");
  img.style.cssText = "display:block;max-width:96vw;max-height:80vh;" +
    "cursor:crosshair;user-select:none;-webkit-user-drag:none";
  var box = document.createElement("div");
  box.style.cssText = "position:absolute;border:2px solid #ff9933;" +
    "background:#ff993322;display:none;pointer-events:none";
  /* The lasso is drawn on its own layer over the image rather than as a
     border on a div, because a free-hand outline is not a rectangle and
     cannot be expressed as one. */
  var lasso = document.createElement("canvas");
  lasso.style.cssText = "position:absolute;left:0;top:0;width:100%;" +
    "height:100%;display:none;pointer-events:none";
  holder.appendChild(img); holder.appendChild(box); holder.appendChild(lasso);
  back.appendChild(bar); back.appendChild(holder);
  document.body.appendChild(back);

  function close(){ if(back.parentNode) back.parentNode.removeChild(back); }
  /* Downloading, on the machine this usually runs on, is a dead end.
   *
   * A smart board is a shared screen bolted to a wall at the front of a
   * room. A file in ITS Downloads folder is on a computer nobody takes home
   * and most people cannot even sign in to — the teacher who pressed the
   * button does not get the picture, and neither does the class.
   *
   * So on a board holding a subject code the file goes to the subject page,
   * where both the teacher and the class can open it. On somebody's own
   * laptop or phone a download is exactly right, and still happens. */
  function save(cnv){
    if(boarded()){ keep(cnv, true); return; }
    var a = document.createElement("a");
    a.href = cnv.toDataURL("image/png");
    a.download = "craxlearn-" + new Date().toISOString().slice(0,16)
                   .replace(/[:T]/g,"-") + ".png";
    a.click();
    close();
  }
  /* A picture of the board is usually wanted BY THE CLASS, not in a
     Downloads folder. When the board knows which room it is in, that is one
     press away — the same route the writing space and the document shelf
     use, so it lands on the same subject page. */
  async function keep(cnv, viaDownload){
    var msg = document.getElementById("shotMsg");
    if(!boarded()){
      if(msg) msg.textContent = "Enter a subject code to keep this on a "
        + "class page.";
      return;
    }
    if(msg) msg.textContent = "Saving…";
    cnv.toBlob(async function(blob){
      if(!blob){ if(msg) msg.textContent = "This browser cannot save that."; return; }
      try{
        var fd = new FormData();
        fd.append("file", blob, "board.png");
        fd.append("title", "Board — " + new Date().toLocaleString());
        fd.append("class_id", String((ROOM && ROOM.class_id) || 0));
        fd.append("subject", (ROOM && ROOM.subject) || "");
        await window.bapi.send("/api/craxlearn/board/file", fd);
        /* Saying where it went, rather than just vanishing. A dialog that
           closes on success and on some failures looks the same either way,
           and the next question is always "did that work?". */
        var where = (ROOM && ROOM.subject) ? ROOM.subject : "the class page";
        if(msg) msg.textContent = viaDownload
          ? "Saved to " + where + " — this board's own Downloads folder is "
            + "not somewhere anybody can reach it."
          : "Saved to " + where + ". Your class can open it any time.";
        setTimeout(close, viaDownload ? 2200 : 900);
      }catch(e){
        if(msg) msg.textContent = e.message || "It could not be saved.";
      }
    }, "image/png");
  }
  el("shotNo").onclick = close;
  /* Both act on whatever is selected — the shape drawn if there is one and
     the whole frame if there is not. */
  el("shotAll").onclick = function(){ save(picked || src); };
  el("shotKeep").onclick = function(){ keep(picked || src); };
  back.addEventListener("keydown", function(e){
    if(e.key === "Escape") close(); });

  var MODE = "rect";
  function setMode(m){
    MODE = m;
    el("shotRect").classList.toggle("on", m === "rect");
    el("shotFree").classList.toggle("on", m === "free");
    el("shotHow").textContent = m === "free"
      ? "Draw round the part you want." : "Drag over the part you want.";
    box.style.display = "none";
    lasso.style.display = "none";
    path = [];
    picked = null;
    var m2 = document.getElementById("shotMsg");
    if(m2) m2.textContent = "";
  }
  el("shotRect").onclick = function(){ setMode("rect"); };
  el("shotFree").onclick = function(){ setMode("free"); };

  var a0 = null;
  /* The outline being drawn, in the coordinates of the image AS SHOWN. */
  var path = [];
  /* Whatever shape somebody drew, once they have drawn one. */
  var picked = null;

  /* The lasso canvas is sized in device pixels to the image's displayed box,
     so the outline is crisp on a board at any scaling. */
  function fitLasso(){
    var r = img.getBoundingClientRect();
    var d = window.devicePixelRatio || 1;
    lasso.width = Math.max(1, Math.round(r.width * d));
    lasso.height = Math.max(1, Math.round(r.height * d));
  }
  function drawLasso(closed){
    var c = lasso.getContext("2d"), d = window.devicePixelRatio || 1;
    c.clearRect(0, 0, lasso.width, lasso.height);
    if(path.length < 2) return;
    c.beginPath();
    c.moveTo(path[0][0] * d, path[0][1] * d);
    for(var i = 1; i < path.length; i++) c.lineTo(path[i][0] * d, path[i][1] * d);
    if(closed) c.closePath();
    c.fillStyle = "#ff993322";
    if(closed) c.fill();
    c.strokeStyle = "#ff9933";
    c.lineWidth = 2 * d;
    c.lineJoin = "round";
    c.lineCap = "round";
    c.stroke();
  }
  /* Everything outside the outline is cut away, and the result is cropped to
     the outline's own bounding box — so what comes out is the shape that was
     drawn, on transparency, rather than a rectangle around it. */
  function fromPath(){
    var r = img.getBoundingClientRect();
    var kx = src.width / r.width, ky = src.height / r.height;
    var xs = path.map(function(p){ return p[0] * kx; });
    var ys = path.map(function(p){ return p[1] * ky; });
    var x0 = Math.max(0, Math.min.apply(null, xs));
    var y0 = Math.max(0, Math.min.apply(null, ys));
    var x1 = Math.min(src.width, Math.max.apply(null, xs));
    var y1 = Math.min(src.height, Math.max.apply(null, ys));
    var w = x1 - x0, h = y1 - y0;
    if(w < 8 || h < 8) return null;
    var out = document.createElement("canvas");
    out.width = Math.round(w); out.height = Math.round(h);
    var c = out.getContext("2d");
    c.beginPath();
    c.moveTo(xs[0] - x0, ys[0] - y0);
    for(var i = 1; i < xs.length; i++) c.lineTo(xs[i] - x0, ys[i] - y0);
    c.closePath();
    c.clip();
    c.drawImage(src, x0, y0, w, h, 0, 0, out.width, out.height);
    return out;
  }
  function spot(e){
    var r = img.getBoundingClientRect();
    var t = (e.touches && e.touches[0]) || e;
    return [Math.min(Math.max(t.clientX - r.left, 0), r.width),
            Math.min(Math.max(t.clientY - r.top, 0), r.height)];
  }
  img.addEventListener("pointerdown", function(e){
    e.preventDefault();
    img.setPointerCapture(e.pointerId);
    if(MODE === "free"){
      fitLasso();
      path = [spot(e)];
      lasso.style.display = "block";
      box.style.display = "none";
      return;
    }
    a0 = spot(e);
    box.style.display = "block";
    box.style.left = a0[0] + "px"; box.style.top = a0[1] + "px";
    box.style.width = "0px"; box.style.height = "0px";
  });
  img.addEventListener("pointermove", function(e){
    if(MODE === "free"){
      if(!path.length) return;
      path.push(spot(e));
