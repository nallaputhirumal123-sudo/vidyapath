      drawLasso(false);
      return;
    }
    if(!a0) return;
    var b = spot(e);
    box.style.left = Math.min(a0[0], b[0]) + "px";
    box.style.top = Math.min(a0[1], b[1]) + "px";
    box.style.width = Math.abs(b[0] - a0[0]) + "px";
    box.style.height = Math.abs(b[1] - a0[1]) + "px";
  });
  img.addEventListener("pointerup", function(e){
    if(MODE === "free"){
      if(!path.length) return;
      drawLasso(true);
      var m3 = document.getElementById("shotMsg");
      var got = fromPath();
      path = [];
      if(!got){
        /* A tap, not an outline. Nothing was meant by it. */
        lasso.style.display = "none";
        return;
      }
      picked = got;
      if(m3) m3.textContent = "That shape is selected. Keep it on the class "
        + "page, or start again.";
      return;
    }
    if(!a0) return;
    var b = spot(e), start = a0; a0 = null;
    var r = img.getBoundingClientRect();
    /* The image is shown scaled to fit, so what was dragged has to be
       converted back into the captured frame's own pixels — otherwise a
       crop on a board would come out a third of the size it looked. */
    var kx = src.width / r.width, ky = src.height / r.height;
    var x = Math.min(start[0], b[0]) * kx, y = Math.min(start[1], b[1]) * ky;
    var w = Math.abs(b[0] - start[0]) * kx, h = Math.abs(b[1] - start[1]) * ky;
    if(w < 8 || h < 8){
      /* A tap, not a drag. Treat it as "I did not mean to select" rather
         than saving an eight-pixel picture nobody asked for. */
      box.style.display = "none";
      return;
    }
    var out = document.createElement("canvas");
    out.width = Math.round(w); out.height = Math.round(h);
    out.getContext("2d").drawImage(src, x, y, w, h, 0, 0, out.width, out.height);
    /* Remembered rather than saved on the spot, because there are two things
       somebody may want to do with it now — download it, or put it on the
       class page — and dragging a rectangle should not have chosen. */
    picked = out;
    var m = document.getElementById("shotMsg");
    if(m) m.textContent = "That part is selected. Download it, or keep it on "
      + "the class page.";
  });
}

/* ---------- how big the text is ---------- */
/* Remembered per device. A school sets it once on the board in the room and
   once on a teacher's laptop, and neither has to think about it again.
   Defaulting by screen width was tried on paper and is wrong: a smart board
   reports a perfectly ordinary 1920 wide and would be given laptop type.

   It was a toggle between two sizes, which fits a room only when the room
   happens to be one of the two. These are named for where they are used
   rather than in points, because nobody standing at a board knows what 22px
   looks like and everybody knows whether they are in a hall. */
var SCALES = [
  { id:"small",  name:"Small",  note:"marking on a laptop" },
  { id:"normal", name:"Normal", note:"a desk or a tablet" },
  { id:"large",  name:"Large",  note:"a small classroom" },
  { id:"board",  name:"Board",  note:"a wall screen — the usual one" },
  { id:"hall",   name:"Hall",   note:"a long room, read from the back" }
];

function scaleNow(){
  var v = localStorage.getItem("cl_scale") || "board";
  /* The old toggle wrote "desk". A board that was set before this comes up
     the size it was left at rather than resetting itself overnight. */
  if(v === "desk") v = "normal";
  return SCALES.some(function(x){ return x.id === v; }) ? v : "board";
}

function scale(next){
  var v = next || scaleNow();
  document.documentElement.setAttribute("data-scale", v);
  try{ localStorage.setItem("cl_scale", v); }catch(e){}
  var b = el("scaleBtn");
  var now = SCALES.filter(function(x){ return x.id === v; })[0];
  if(b) b.title = "Text size — " + ((now && now.name) || v);
  var menu = document.getElementById("scaleMenu");
  if(menu && menu.dataset.open === "1") paintScaleMenu();
}

/* The menu itself. A list of names rather than a cycle, so a teacher can see
   what the choices are and land on one in a single press instead of tapping
   a button until the room looks right. */
function paintScaleMenu(){
  var m = document.getElementById("scaleMenu");
  if(!m) return;
  var now = scaleNow();
  m.innerHTML = '<div class="eyebrow" style="margin:.1rem .2rem .35rem">' +
    "Text size</div>" +
    SCALES.map(function(x){
      return '<button class="btn ghost" data-scaleset="' + x.id + '" ' +
        'style="display:block;width:100%;text-align:left;margin:.15rem 0' +
        (x.id === now ? ";border-color:var(--accent)" : "") + '">' +
        (x.id === now ? "● " : "○ ") + esc(x.name) +
        '<span class="muted" style="font-size:.62rem"> · ' + esc(x.note) +
        "</span></button>";
    }).join("");
}

function toggleScaleMenu(){
  var m = document.getElementById("scaleMenu");
  if(!m){
    m = document.createElement("div");
    m.id = "scaleMenu";
    m.style.cssText = "position:fixed;top:3.4rem;right:.6rem;z-index:88;" +
      "background:#101823f2;border:1px solid #2a3444;border-radius:14px;" +
      "padding:.5rem;min-width:15rem;backdrop-filter:blur(6px);" +
      "box-shadow:0 10px 30px #0009";
    document.body.appendChild(m);
    m.addEventListener("click", function(e){
      var b = e.target.closest("[data-scaleset]");
      if(b) scale(b.dataset.scaleset);
    });
  }
  var open = m.dataset.open === "1";
  m.dataset.open = open ? "0" : "1";
  m.style.display = open ? "none" : "block";
  if(!open) paintScaleMenu();
}

/* Anywhere else closes it, which is what a menu does. */
document.addEventListener("click", function(e){
  var m = document.getElementById("scaleMenu");
  if(!m || m.dataset.open !== "1") return;
  if(m.contains(e.target) || (e.target.closest &&
      e.target.closest("#scaleBtn"))) return;
  m.dataset.open = "0";
  m.style.display = "none";
});

/* ---------- signing in with nothing but a class code ----------
 *
 * Two taps and no credential. A child types the code the teacher wrote on
 * the board, picks their own name off the register, and is in. There is
 * nothing to remember, nothing to reset, and nothing to leak — the account
 * behind it has a synthetic address and a password nobody has ever seen.
 *
 * The name list is the whole reason a teacher types a register first. Code
 * alone would give a teacher a queue of work from "Learner 4".
 */
function codeForm(){
  el("gateForm").innerHTML =
    '<input id="gCode" placeholder="Class or subject code" autocapitalize="characters" ' +
      'autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em">' +
    '<button class="btn" id="gCodeGo">Find my class</button>';
  el("gCodeGo").onclick = findClass;
  el("gCode").onkeydown = function(e){ if(e.key === "Enter") findClass(); };
}

/* Which classroom this board is standing in.
 *
 * ROOM is set by a class code (the room) or a subject code (the room and the
 * subject), and it is what a saved lesson is filed under. It is NOT a
 * sign-in: the server deliberately refuses to mint a session from a code
 * here, because a code on a screen at the front of a room has been read by
 * everybody in it. Identity still comes from signing in.
 */
var ROOM = null;

function roomLine(){
  if(!ROOM) return "";
  return '<div class="note" style="margin:.6rem 0">' +
    '<b>' + esc(ROOM.class_name) + '</b>' +
    (ROOM.subject ? ' · ' + esc(ROOM.subject) : "") +
    (ROOM.school ? '<span class="muted"> · ' + esc(ROOM.school) + '</span>' : "") +
    '<div class="muted">Anything saved from this board goes here.</div>' +
    '</div>';
}

/* A class code or a subject code, in the same box. Tried before the student
   sign-in, so a teacher typing T-KDV9 gets their subject rather than "no
   class has that code". */
async function openRoom(code){
  try{
    var d = await api.post("/api/craxlearn/room", { code: code });
    ROOM = d;
    return d;
  }catch(e){ return null; }
}

async function findClass(){
  var msg = el("gateMsg");
  var code = ((el("gCode") || {}).value || "").trim();
  if(code.length < 3){ msg.textContent = "Type the code your teacher gave you."; return; }
  msg.textContent = "Looking…";

  /* A subject code first. One box takes either kind, because a person
     standing at a board has one code in their hand and should not have to
     know which sort it is — and typing T-KDV9 here used to answer "no class
     has that code", which is true and unhelpful.

     A subject code opens the room and names the subject. It does not sign
     anybody in: on a screen at the front of a class, a code has been read by
     everybody in the room. */
  var room = await openRoom(code);
  if(room && room.kind === "subject"){
    msg.textContent = "";
    el("gateForm").innerHTML =
      '<p class="muted" style="margin-top:0">This board is now open on</p>' +
      '<div class="big">' + esc(room.class_name) + " · " +
        esc(room.subject) + "</div>" +
      (room.teacher
        ? '<p class="muted">' + esc(room.teacher) + " teaches this.</p>"
        : '<p class="muted">No teacher is on this subject yet.</p>') +
      '<p class="muted">Anything you keep from this board is filed under ' +
      'this class and this subject.</p>' +
      '<button class="btn" id="gRoomGo">Open the board</button> ' +
      '<button class="btn ghost" id="gBack2">← Different code</button>';
    el("gRoomGo").onclick = function(){ openBoard(); };
    el("gBack2").onclick = function(){ ROOM = null; el("gateMsg").textContent = ""; codeForm(); };
    return;
  }

  /* A class code opens the room, and does NOT list the children.
   *
   * It used to answer with the register so a pupil could tap their name. On a
   * pupil's own phone that is exactly right and it is still there. On the
   * board it put every child's name on a television at the front of the room,
   * for the whole class and anybody walking past to read. A register is a
   * list of children; it is not wallpaper.
   *
   * So on the board a class code says which room this is, and nothing about
   * who is in it. */
  if(room && room.kind === "class"){
    msg.textContent = "";
    el("gateForm").innerHTML =
      '<p class="muted" style="margin-top:0">This board is now open on</p>' +
      '<div class="big">' + esc(room.class_name) + "</div>" +
      (room.school ? '<p class="muted">' + esc(room.school) + "</p>" : "") +
      '<p class="muted">Enter a subject code to teach a subject here, or ' +
      'open the board as it is.</p>' +
      '<button class="btn" id="gRoomGo">Open the board</button> ' +
      '<button class="btn ghost" id="gBack">← Different code</button>';
    el("gRoomGo").onclick = function(){ openBoard(); };
    el("gBack").onclick = function(){
      ROOM = null; el("gateMsg").textContent = ""; codeForm(); };
    return;
  }

  msg.textContent = "That code is not a class or a subject at this school.";
}

/* ---------- reporting an error ---------- */
/* The one check a machine cannot do.
 *
 * Everything else here is the machine checking itself — constants,
 * arithmetic, units, and a second read of the argument. A lesson that is
 * confidently wrong in a way nobody anticipated is caught by a person, and
 * on a board that person is standing in front of thirty others.
 *
 * Asks what was wrong rather than taking a bare thumbs-down: "this is wrong"
 * cannot be acted on, "step 3 has the wrong units" can. Sends the cached
 * lesson's key so the server drops that exact answer rather than a topic
 * that may have been rebuilt since.
 */
async function reportWrong(i){
  var pane = PANES[i] || {};
  var said = window.prompt(
    "What is wrong with this?\n\n" +
    "One sentence is plenty. Naming the step helps most.");
  if(said === null) return;
  said = (said || "").trim();
  if(!said){ return; }
  try{
    // A pane is {page, arg, flex} — there is no lesson object on it, so the
    // page and its argument are what identify what was on screen.
    var r = await api.post("/api/report", {
      qkey: "",
      topic: (String(pane.page || "") + " " +
              String(pane.arg || "")).trim().slice(0, 300),
      what: said.slice(0, 1200),
      where: "craxlearn"
    });
    window.alert("Thank you. That has been recorded" +
                 (r && r.dropped ? " and the answer removed." : "."));
  }catch(e){
    window.alert((e && e.message) || "Could not send that just now.");
  }
}

/* ---------- sign in ---------- */
function gateForm(mode){
  var up = mode === "up";
  el("gateForm").innerHTML =
    (up ? '<input id="gName" placeholder="Your name" autocomplete="name">' : "") +
    '<input id="gEmail" type="email" placeholder="Email" autocomplete="email">' +
    '<input id="gPass" type="password" placeholder="Password" ' +
      'autocomplete="' + (up ? "new-password" : "current-password") + '">' +
    (up ? '<input id="gCode" placeholder="School or class code (optional)">' : "") +
    '<button class="btn" id="gGo">' + (up ? "Create account" : "Sign in") + "</button>";
  el("gGo").onclick = function(){ submit(up); };
  el("gPass").onkeydown = function(e){ if(e.key === "Enter") submit(up); };
}

async function submit(up){
  var msg = el("gateMsg");
  msg.textContent = "…";
  var body = { email:(el("gEmail").value||"").trim(),
               password:el("gPass").value||"" };
  if(up) body.name = (el("gName").value||"").trim();
  try{
    await api.post(up ? "/api/auth/signup" : "/api/auth/login", body);
    var code = up && el("gCode") ? (el("gCode").value||"").trim() : "";
    if(code){
      /* A wrong code must not cost somebody the account they just made. */
      try{ await api.post("/api/class/join", { code:code }); }
      catch(e){ msg.textContent = "Signed in, but that code did not match: "
                                  + e.message; }
    }
    await boot();
  }catch(e){
    msg.textContent = e.message;
  }
}

/* ---------- pages ---------- */
/* Every tile here is a teaching surface and there is nothing else. The list
   is short on purpose: a board at the front of a room is operated by
   somebody mid-sentence, and a menu they have to read is a menu that stops
   the lesson. */
var TILES = [
  { page:"board",  ic:"⚡", name:"Ask the board",

  { page:"calc",   ic:"🧮", name:"Calculator",
    sub:"Arithmetic, powers and roots, worked on screen where the room can see it." },
  { page:"structure", ic:"🧬", name:"3D structures",
    sub:"Turn a molecule, a crystal, a protein or an orbit around. Measured, never drawn." },
  { page:"find",   ic:"🔎", name:"Search the sources",
    sub:"A photograph or a structure from the open catalogues, with its licence." },
  { page:"phet",   ic:"🔬", name:"Simulations",
    sub:"PhET: build an atom, wire a circuit, balance an equation. Free and open." },
  { page:"scan",   ic:"📷", name:"Scan a problem",
    sub:"Photograph a question from a book or the board and have it worked through." },
  { page:"tracks", ic:"🎓", name:"Courses and exams",
    sub:"The lessons, the labs you type into, and the track exams." },
  { page:"net",    ic:"🌐", name:"Trace a packet",
    sub:"Send a packet through real routes and firewall rules and watch the decision." },
  { page:"lab",    ic:"🧪", name:"The lab",
    sub:"Mix real reagents and run real experiments. Every reaction from a table, never guessed." },
  { page:"sqlboard", ic:"🗄️", name:"SQL board",
    sub:"Write queries against a real database and see what comes back." },
  { page:"bring",  ic:"📄", name:"Saved for this subject",

  { page:"remote", ic:"📱", name:"Remote",

];

/* What a teacher reaches for WHILE TEACHING, and nothing else.
 *
 * Your classes, the register, work to review and what the class is asking have
 * moved to the teacher dashboard on craxle.com, where they are now actually
 * built — with roll numbers, search, per-row editing, and attendance and fees
 * around them, none of which these tiles ever had. Two places to type a
 * register is one too many: the one you are not standing at goes stale, and a
 * teacher in front of thirty children should not be working out which screen
 * is the real one.
 *
 * Pulling things up stays. Material is here because reaching for a chapter
 * mid-lesson is teaching, and sources are here because "where did that come
 * from" is asked during the lesson, not afterwards.
 *
 * The pages themselves are untouched and still routable — a bookmark from last
 * term keeps working. Only the tiles come off the home screen, which is the
 * difference between moving a door and bricking up a room.
 */
var TEACHER_TILES = [
  { page:"materials", ic:"📎", name:"Study material",
    sub:"Chapters, slides and links — pull one up mid-lesson." },
  { page:"sources",  ic:"📚", name:"Where answers come from",
    sub:"Every source we teach from, with its licence." }
];

function tile(t){
  return '<button class="tile" data-go="' + t.page + '">' +
    '<span class="ic">' + t.ic + "</span>" +
    "<b>" + esc(t.name) + "</b><span>" + esc(t.sub) + "</span></button>";
}

/* Work, on whichever login is looking.
 *
 * The same assignment, two views, both filled from the server on the way in
 * rather than by anybody pressing publish. A teacher sets it from the board
 * and it is on the students' home screen; a student hands it in and it is in
 * the teacher's inbox. Nothing in between is a state somebody has to
 * remember to move it out of, because the state somebody forgets is the one
 * that loses a term's homework.
 */
function workBlock(){
  if(isTeacher()){
    var n = (ME.inbox || {}).total || 0;
    return '<div class="eyebrow">To review</div>' +
      '<button class="card" data-go="inbox" style="width:100%;text-align:left;' +
      'cursor:pointer;border-color:' + (n ? "var(--accent)" : "var(--line)") + '">' +
        '<span class="big">' + n + "</span> " +
        '<span class="muted">' +
          (n ? "piece" + (n === 1 ? "" : "s") + " of work waiting for you"
             : "nothing waiting — you are up to date") +
        "</span></button>";
  }
  var due = (ME.assignments || []);
  if(!due.length) return "";
  return '<div class="eyebrow">Your work</div>' +
    due.map(function(a){
      var state = a.reviewed ? "✓ marked"
                : a.done     ? "handed in"
                             : "to do";
      return '<button class="card" data-asg="' + a.id + '" ' +
        'style="width:100%;text-align:left;cursor:pointer;border-color:' +
        (a.done ? "var(--line)" : "var(--accent)") + '">' +
        "<b>" + esc(a.title) + "</b><br>" +
        '<span class="muted">' + esc(a.class_name) +
          (a.subject ? " · " + esc(a.subject) : "") +
          (a.due_date ? " · due " + esc(a.due_date) : "") +
          " · " + state + "</span></button>";
    }).join("");
}

function isTeacher(){
  return ME.role === "head" || ME.role === "teacher" || ME.role === "admin";
}

function money(paise, cur){
  var n = (paise || 0) / 100;
  return (cur === "INR" ? "\u20b9" : (cur || "") + " ") +
    n.toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0 });
}

/* What a learner needs to know about themselves that is not schoolwork.
   Attendance, what is owed, what to buy, and whatever the office has put
   up — one glance, because a student checking four screens to find out
   whether they are in trouble checks none of them. Nothing here is
   editable from this app by anybody: it is the school office's to change. */
function standingBlock(){
  var st = ME.standing;
  if(!st) return "";
  var h = "";

  var urgent = (st.notices || []).filter(function(n){ return n.urgent; });
  var rest   = (st.notices || []).filter(function(n){ return !n.urgent; });
  if(urgent.length){
    h += urgent.map(function(n){
      return '<div class="note bad"><b>' + esc(n.title) + "</b>" +
        (n.body ? "<br>" + esc(n.body) : "") + "</div>";
    }).join("");
  }

  var bits = [];
  if(st.attendance_pct !== null && st.attendance_pct !== undefined){
    bits.push('<div class="card" style="flex:1 1 11rem"><div class="muted">Attendance</div>' +
      '<span class="big">' + st.attendance_pct + "%</span>" +
      '<div class="muted">' + st.days_present + " of " + st.days_recorded +
      " days</div></div>");
  }
  if(st.owed > 0){
    bits.push('<div class="card" style="flex:1 1 11rem;border-color:var(--accent)">' +
      '<div class="muted">Still to pay</div>' +
      '<span class="big">' + money(st.owed, st.currency) + "</span>" +
      '<div class="muted">' + ((st.fees || []).filter(function(f){ return !f.settled; }).length) +
      " item(s)</div></div>");
  }
  if(bits.length){
    h += '<div class="eyebrow">You</div>' +
      '<div style="display:flex;gap:1rem;flex-wrap:wrap">' + bits.join("") + "</div>";
  }

  var owing = (st.fees || []).concat(st.to_buy || [])
    .filter(function(f){ return !f.settled; });
  if(owing.length){
    h += '<div class="card">' + owing.map(function(f){
      return "<div style=\"display:flex;gap:.6rem;justify-content:space-between;" +
        "padding:.3rem 0;flex-wrap:wrap\"><span>" + esc(f.title) +
        (f.kind === "buy" ? ' <span class="muted">· to buy</span>' : "") +
        (f.due_on ? ' <span class="muted">· by ' + esc(f.due_on) + "</span>" : "") +
        "</span><b>" + money(f.outstanding, f.currency) + "</b></div>";
    }).join("") + "</div>";
  }

  if(rest.length){
    h += '<div class="eyebrow">From the school office</div>' +
      rest.map(function(n){
        return '<div class="card"><b>' + esc(n.title) + "</b>" +
          (n.body ? '<div class="muted" style="margin-top:.35rem">' +
            esc(n.body) + "</div>" : "") + "</div>";
      }).join("");
  }
  return h;
}

function home(){
  var teacher = isTeacher();

  /* Where you are, on one line.
   *
   * This screen opened with three stacked cards before anything you could
   * teach with: work to review, an Institution card repeating the school
   * name already in the header, and the classrooms you teach. On a
   * television at the front of a room that is the whole screen — a teacher
   * had to scroll past a dashboard to reach the board.
   *
   * A board is not a dashboard. The context is one bar, the tools come
   * first, and everything else goes underneath. */
  var h = "";
  var where = [];
  if(ME.institution) where.push(esc(ME.institution.name));
  var mine = (ME.classes || []).filter(function(c){
    return teacher ? c.mine : true; });
  if(mine.length){
    where.push(mine.map(function(c){ return esc(c.name); }).join(" · "));
  }
  if(ROOM && ROOM.subject) where.push(esc(ROOM.subject));
  if(where.length){
    h += '<div class="note" style="margin:0 0 .8rem;display:flex;gap:.6rem;' +
         'align-items:center;flex-wrap:wrap">' +
         '<b>' + where.join('</b><span class="muted"> · </span><b>') + "</b>" +
         '<span class="grow"></span>' +
         '<span class="muted">Anything you keep goes here.</span>' +
         "</div>";
  }
  /* Remote stays on an open board even though it needs an account: it is
     where "use your phone" lives, and a teacher looking for it must find
     the answer rather than find nothing. */
  /* The practice surfaces are a pupil's, not a teacher's.
   *
   * A board at the front of a room is operated mid-sentence, and twelve
   * tiles on it is a menu somebody has to read while thirty people wait.
   * Four of them are places to PRACTISE — work through the course, type
   * queries, send packets, run reactions — and practising is what a student
   * does at their own desk, at their own pace. A teacher standing at the
   * board is teaching, and the tiles they reach for are the ones that put
   * something in front of the room.
   *
   * So staff get the teaching surfaces and students get everything. The
   * pages themselves stay routable: a bookmark from last term still opens,
   * and a teacher who wants to demonstrate the SQL board can still reach it.
   * Only the home screen is shortened, which is the difference between
   * moving a door and bricking up a room. */
  var PRACTICE_TILES = ["tracks", "net", "lab", "sqlboard"];
  /* An open board holding a subject code is not the same as an open board.
     It cannot read a register or a mark and it is still nobody's account,
     but it names one class and one subject, and bringing a document into
     THAT is exactly what the code is for. So the document tile is offered
     alongside the two that need no server. */
  /* A board holding a subject code gets the TEACHING surfaces.
   *
   * It used to get four tiles: something to write on, a calculator, the
   * shelf, and the phone remote. Everything that makes this a teaching board
   * — ask it a topic, turn a molecule round, run a simulation, photograph a
   * question out of a book — needed an account, and the entire point of the
   * code is that a teacher standing at the front of a room does not have one
   * to hand. So the board was empty in the only way that matters: empty of
   * the reason to use it.
   *
   * The code buys these because the server now charges them to whoever the
   * school put on that subject. It still buys nothing that READS — no
   * register, no marks, no discussion, no fees — which is the line that
   * matters on a screen a whole room can see.
   *
   * Practice surfaces stay off, for the same reason they are off for a
   * signed-in teacher: working through a course at your own pace is what a
   * pupil does at their own desk. */
  var offer = OPEN
    ? TILES.filter(function(t){
        if(OPEN_TOOLS.indexOf(t.page) >= 0 || t.page === "remote") return true;
        if(!boarded()) return false;
        return PRACTICE_TILES.indexOf(t.page) < 0;
      })
    : TILES.filter(function(t){
        return !(teacher && PRACTICE_TILES.indexOf(t.page) >= 0); });
  h += '<div class="eyebrow">Teaching</div><div class="tiles">' +
       offer.map(tile).join("") + "</div>";
  /* And what has already been kept for this subject, on the home screen
     rather than two taps into a tool. A lesson taught last week is opened
     again far more often than a new one is written, and the teacher wanting
     it is standing in front of the class, mid-sentence. */
  if(boarded()) h += '<div id="homeSaved"></div>';

  /* A student has one classroom, and that classroom has several subjects
     with a different teacher in front of each. Naming the room alone left a
     learner unable to answer the only two questions they ever ask about it:
     what am I taught here, and who do I ask. */
  var rooms = (ME.classes || []).filter(function(c){
    return teacher ? c.mine : true; });
  if(rooms.length){
    h += '<div class="eyebrow">' +
      (teacher ? "The classrooms you teach" : "Your classroom") + "</div>";
    h += rooms.map(function(c){
      var subs = c.subjects || [];
      return '<div class="card"><b>' + esc(c.name) + "</b>" +
        (c.school ? '<span class="muted"> · ' + esc(c.school) + "</span>" : "") +
        (subs.length
          ? '<div class="subjects">' + subs.map(function(x){
              return '<div class="subject' + (x.mine ? " mine" : "") + '">' +
                "<b>" + esc(x.name) + "</b>" +
                '<span class="muted">' +
                  (x.mine ? "you teach this"
                          : (x.teacher ? esc(x.teacher)
                                       : "no teacher yet")) +
                "</span></div>";
            }).join("") + "</div>"
          : '<div class="muted" style="margin-top:.4rem">' +
            (teacher
              ? "No subjects in this class yet. The school admin creates them."
              : "Your school has not listed this class's subjects yet.") +
            "</div>") +
        "</div>";
    }).join("");
  }
  if(OPEN){
    h += signInPrompt("keep what you teach on a class page");
  }
  if(!teacher && (ME.classes || []).length){
    h += '<div class="eyebrow">From your teacher</div><div class="tiles">' +
      tile({ page:"materials", ic:"📎", name:"Study material",
             sub:"Links, PDFs and slides your teacher has put here." }) +
      "</div>";
  }
  if(teacher){
    h += '<div class="eyebrow">Your class</div><div class="tiles">' +
         TEACHER_TILES.map(tile).join("") + "</div>";
  }
  /* Work waiting, and how a learner is doing, BELOW the tools rather than
     above them. A student still needs to see what is due — dropping it to
     shorten the screen would have removed the thing they open this for —
     but a teacher reaching for the board should not scroll past a dashboard
     to find it. */
  h += standingBlock() + workBlock();

  h += '<div class="eyebrow">This app</div>' +
       '<div class="note">' +
       "<b>Craxlearn is the teaching half of Craxle.</b> " +
       (ME.message ? esc(ME.message) + " " : "") +
       "What your learners search and ask is stored inside your institution " +
       "and is never used to answer anybody else's question. " +
       '<a href="/api/craxlearn/sources">Every source we teach from</a> is ' +
       "open, and listed with its licence." +
       "</div>";
  main().innerHTML = h;
  if(boarded()) homeSaved();
}

/* The saved explanations, on the home screen of a board that knows its
   subject. Not awaited by home(): the tiles must be on the screen the
   instant the board opens, and a list of last term's lessons arriving a
   moment later is fine. It writes into a box home() already put there, so a
   slow answer landing after somebody has moved on writes into nothing
   rather than over whatever is now on the screen. */
async function homeSaved(){
  var host = el("homeSaved");
  if(!host) return;
  var d;
  try{
    d = await window.bapi.get("/api/craxlearn/board/materials" +
      "?class_id=" + (ROOM.class_id || 0) +
      "&subject=" + encodeURIComponent(ROOM.subject || ""));
  }catch(e){ return; }
  var mats = (d.materials || []).slice(0, 6);
  host = el("homeSaved");
  if(!host) return;
  if(!mats.length){
    host.innerHTML = '<div class="eyebrow">Saved on this subject</div>' +
      '<div class="muted">Nothing kept here yet. Teach something, or bring ' +
      "in a document, and it will be on this list.</div>";
    return;
  }
  host.innerHTML = '<div class="eyebrow">Saved on this subject</div>' +
    mats.map(function(x){
      var what = x.kind === "lesson" ? "a lesson"
               : x.kind === "link"   ? "a link"
                                     : (x.file_name || "a document");
      return '<div class="card" style="display:flex;gap:.6rem;' +
        'align-items:center;flex-wrap:wrap">' +
        '<div style="flex:1 1 14rem"><b>' + esc(x.title) + "</b>" +
        '<div class="muted">' + esc(what) +
        (x.at ? " · " + esc(String(x.at).slice(0, 10)) : "") + "</div></div>" +
        '<button class="btn" data-homeput="' + x.id + '">Put it up</button>' +
        "</div>";
    }).join("");
  Array.prototype.forEach.call(
    host.querySelectorAll("[data-homeput]"), function(b){
      b.onclick = function(){ go("bring", { put: b.dataset.homeput }); };
    });
}

/* One stored figure, as markup. Two screens draw these — the class's study
   material list and the board's shelf — and they had a copy each, which is
   how the one that gets a new figure kind and the one that does not end up
   disagreeing about what a lesson looks like.

   A "pic" is the document's own picture and needs no renderer at all: it is
   an image, and it is drawn here rather than mounted later. Its src has
   already been checked server-side to be base64 image data and nothing else,
   which is the only reason it is safe to put in an attribute. */
function figureHTML(f, id){
  if(!f) return "";
  /* A photograph kept with the lesson.
   *
   * These were dropped on the way into storage, so a lesson written up with
   * a picture of DNA on the screen came back to the class as prose. They are
   * kept now, and the credit is kept WITH them — these are other people's
   * photographs under licences that require the author be named, and a
   * saved copy that quietly loses the attribution is a licence breach
   * sitting on a school's page. */
  if(f.how === "photo"){
    var sp = f.spec || {};
    var credit = [sp.caption, sp.author, sp.license]
      .filter(Boolean).join(" · ");
    return '<figure class="lpic"><img src="' + esc(sp.url || "") +
      '" alt="' + esc(sp.caption || "") + '" loading="lazy">' +
      (credit ? '<figcaption>' + esc(credit) + "</figcaption>" : "") +
      "</figure>";
  }
  if(f.how === "pic"){
    var page = (f.spec && +f.spec.page) || 0;
    return '<figure class="lpic"><img src="' + esc((f.spec || {}).src || "") +
      '" alt="' + (page ? "From the document, page " + page : "From the document") +
      '" loading="lazy"><figcaption>From the document' +
      (page ? " · page " + page : "") + "</figcaption></figure>";
  }
  return '<div class="figcap">' + (f.how === "scene" ? "🧊 " : "✏️ ") +
    esc((f.spec && f.spec.caption) || "") + "</div>" +
    '<div class="fig' + (f.how === "scene" ? " fig3d" : "") + '"' +
    (f.how === "scene" ? ' data-fill="1"' : "") +
    ' id="' + id + '"></div>';
}

/* ---------- writing on top of the whole board ----------
 *
 * Screen coordinates, not world ones. This sheet annotates what is on the
 * screen right now: scroll the page and the marks stay where they were put,
 * because they were put on the screen and not on the thing underneath.
 * Pretending otherwise would need every pane to report a transform, and a
 * teacher circling a word does not expect the circle to follow it.
 *
 * Saving therefore goes through the SCREEN capture, not through this canvas.
 * The ink is part of the page, so one frame of the page has both the lesson
 * and the marks on it — which is what somebody means by "save this".
 */
var Ink = (function(){
  var cv, ctx, bar, on = false;
  var strokes = [], undone = [], live = null;
  var colour = "#ff9933", size = 4, erasing = false;
  /* "" is freehand. The shapes are SHAPES and shapePoints(), the same
     two the writing space uses — a straight line is a straight line on
     either surface, and a second vocabulary here would drift. */
  var shape = "", anchor = null;

  /* The cycle, freehand included, so the button always has a next. */
  function nextShape(){
    var order = [""].concat(SHAPES.map(function(x){ return x.k; }));
    var at = order.indexOf(shape);
    var k = order[(at + 1) % order.length];
    var found = SHAPES.filter(function(x){ return x.k === k; })[0];
    return { k: k, label: found ? found.name.toLowerCase() : "freehand" };
  }

  function fit(){
    if(!cv) return;
    var d = window.devicePixelRatio || 1;
    var w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
    if(cv.width === w && cv.height === h) return;
    cv.width = w; cv.height = h;
    cv.style.width = innerWidth + "px";
    cv.style.height = innerHeight + "px";
    redraw();
  }

  function one(c, st){
    c.globalCompositeOperation = st.e ? "destination-out" : "source-over";
    c.strokeStyle = st.c;
    c.lineCap = "round";
    c.lineJoin = "round";
    var p = st.p;
    for(var i = 1; i < p.length; i++){
      c.lineWidth = st.e ? st.w * 4 : st.w;
      c.beginPath();
      c.moveTo(p[i-1][0], p[i-1][1]);
      c.lineTo(p[i][0], p[i][1]);
      c.stroke();
    }
    c.globalCompositeOperation = "source-over";
  }

  function redraw(){
    if(!ctx) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    strokes.concat(live ? [live] : []).forEach(function(st){ one(ctx, st); });
    say();
  }

  function say(){
    var n = document.getElementById("inkCount");
    if(n) n.textContent = strokes.length
      ? strokes.length + " mark" + (strokes.length === 1 ? "" : "s") : "";
  }

  function at(e){
    var d = window.devicePixelRatio || 1;
    return [e.clientX * d, e.clientY * d];
  }

  function bind(){
    cv.addEventListener("pointerdown", function(e){
      if(!on) return;
      e.preventDefault();
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
      live = { c: colour, e: erasing, w: (erasing ? size : size) *
               (window.devicePixelRatio || 1), p: [at(e)] };
      /* A shape is dragged from where it started, so the anchor is kept and
         the whole stroke is rebuilt from it on every move. Freehand appends;
         a shape REPLACES, which is what makes it rubbery rather than a trail
         of rectangles. */
      anchor = shape ? at(e) : null;
      /* A tap is a dot, and a dot is a mark somebody meant to make. */
      live.p.push([live.p[0][0] + 0.01, live.p[0][1]]);
      redraw();
    });
    cv.addEventListener("pointermove", function(e){
      if(!on || !live) return;
      if(anchor){
        live.p = shapePoints(shape, anchor, at(e));
        redraw();
        return;
      }
      var held = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
      var pts = (held && held.length) ? held : [e];
      for(var i = 0; i < pts.length; i++) live.p.push(at(pts[i]));
      redraw();
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function(ev){
      cv.addEventListener(ev, function(){
        if(!live) return;
        strokes.push(live);
        undone.length = 0;
        live = null;
        anchor = null;
        redraw();
      });
    });
    window.addEventListener("resize", fit);
  }

  var PENS = ["#ff9933", "#e8eef6", "#3fae6a", "#e05a5a", "#5aa9e0"];

  function paintBar(){
    bar.innerHTML =
      PENS.map(function(c, i){
        return '<button class="iconbtn" data-inkpen="' + i + '" title="Pen" ' +
          'style="background:' + c + ';border-color:' + c + '"></button>';
      }).join("") +
      '<button class="iconbtn" data-inkpen="erase" title="Rub out">⌫</button>' +
      /* ONE slot, not five. The bar is fixed across the bottom of the
         screen and every control on it is board the room cannot see, so
         the four shapes share a button that cycles: freehand, line,
         arrow, rectangle, circle, freehand. Its face is what it will
         draw, so the current mode is readable without opening anything. */
      '<button class="iconbtn" id="inkShape" data-ink="shape"></button>' +
      '<input type="range" id="inkSize" min="2" max="24" value="' + size +
        '" title="Thickness" style="width:5rem">' +
      '<span class="sep"></span>' +
      '<button class="iconbtn" data-ink="undo" title="Undo">↶</button>' +
      '<button class="iconbtn" data-ink="redo" title="Redo">↷</button>' +
      '<button class="btn ghost" data-ink="clear">Clear</button>' +
      '<span class="sep"></span>' +
      '<button class="btn ghost" data-ink="type" title="Read what is ' +
        'written and turn it into text">Aa To text</button>' +
      '<button class="btn" data-ink="save">Save the screen</button>' +
      '<button class="btn ghost" data-ink="off">Done</button>' +
      '<button class="iconbtn" id="inkFold" data-ink="fold" ' +
        'title="Hide this bar — the marks stay">▾</button>' +
      '<span class="muted" id="inkCount" style="font-size:.62rem"></span>';
    mark();
    say();
  }

  /* Handwriting to typed text — only ever because somebody pressed this.
   *
   * The marks are drawn again onto a WHITE sheet in black, cropped to what
   * was actually written. Two reasons, and both are about the bill: a model
   * reads dark-on-light far better than the board's own light-on-dark, so a
   * legible picture is one call instead of a call and a retry; and cropping
   * to the writing sends a fraction of the pixels of a whole 4K board.
   *
   * The result is cached on the bytes of that picture, so pressing it twice
   * on unchanged working costs nothing.
   */
  function inkSheet(){
    var d = window.devicePixelRatio || 1, pad = 24 * d;
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    strokes.forEach(function(st){
      if(st.e) return;                    // a rubbed-out stroke is not writing
      st.p.forEach(function(p){
        if(p[0] < x0) x0 = p[0];
        if(p[1] < y0) y0 = p[1];
        if(p[0] > x1) x1 = p[0];
        if(p[1] > y1) y1 = p[1];
      });
    });
    if(!isFinite(x0)) return null;
    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
    x1 = Math.min(cv.width, x1 + pad); y1 = Math.min(cv.height, y1 + pad);
    var w = Math.round(x1 - x0), h = Math.round(y1 - y0);
    if(w < 8 || h < 8) return null;
    var out = document.createElement("canvas");
    out.width = w; out.height = h;
    var c = out.getContext("2d");
    c.fillStyle = "#ffffff";
    c.fillRect(0, 0, w, h);
    c.translate(-x0, -y0);
    c.lineCap = "round"; c.lineJoin = "round";
    c.strokeStyle = "#111111";
    strokes.forEach(function(st){
      if(st.e) return;
      c.lineWidth = st.w;
      for(var i = 1; i < st.p.length; i++){
        c.beginPath();
        c.moveTo(st.p[i-1][0], st.p[i-1][1]);
        c.lineTo(st.p[i][0], st.p[i][1]);
        c.stroke();
      }
    });
    return out;
  }

  function toText(btn){
    var n = document.getElementById("inkCount");
    if(!boarded()){
      if(n) n.textContent = "Enter a subject code first — reading the board "
        + "is charged to whoever teaches it.";
      return;
    }
    var sheet = inkSheet();
    if(!sheet){
      if(n) n.textContent = "There is nothing written to read.";
      return;
    }
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = "Reading…";
    sheet.toBlob(async function(blob){
      try{
        if(!blob) throw new Error("This browser cannot read the board.");
        var fd = new FormData();
        fd.append("file", blob, "hand.png");
        var d = await window.bapi.send("/api/craxlearn/handwriting", fd);
        showText((d && d.text) || "");
      }catch(e){
        if(n) n.textContent = e.message || "It could not be read.";
      }finally{
        btn.disabled = false; btn.textContent = was;
      }
    }, "image/png");
  }

  /* Shown back for checking, never swapped in silently. Handwriting is read
     imperfectly and a teacher must see what it made of theirs before it goes
     anywhere near a class page. */
  function showText(text){
    var old = document.getElementById("inkText");
    if(old && old.parentNode) old.parentNode.removeChild(old);
    var box = document.createElement("div");
    box.id = "inkText";
    box.style.cssText = "position:fixed;left:50%;bottom:4.6rem;" +
      "transform:translateX(-50%);z-index:72;max-width:min(46rem,94vw);" +
      "width:34rem;background:#101823;border:1px solid #2a3444;" +
      "border-radius:14px;padding:.7rem;box-shadow:0 8px 30px #0009";
    box.innerHTML =
      '<div class="eyebrow" style="margin:0 0 .4rem">What it read</div>' +
      '<textarea id="inkTextBody" style="width:100%;min-height:7rem;' +
        'background:#0b0f16;color:#e8eef6;border:1px solid #2a3444;' +
        'border-radius:10px;padding:.5rem;font-size:.8rem;' +
        'font-family:inherit"></textarea>' +
      '<div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem">' +
        '<button class="btn" id="inkTextKeep">Keep on the class page</button>' +
        '<button class="btn ghost" id="inkTextCopy">Copy</button>' +
        '<button class="btn ghost" id="inkTextNo">Close</button>' +
        '<span class="muted" id="inkTextMsg" style="font-size:.62rem"></span>' +
      "</div>";
    document.body.appendChild(box);
    var ta = document.getElementById("inkTextBody");
    ta.value = text || "";
    var msg = document.getElementById("inkTextMsg");
    if(!text) msg.textContent = "Nothing legible. Write a little larger and "
      + "try again.";
    document.getElementById("inkTextNo").onclick = function(){
      if(box.parentNode) box.parentNode.removeChild(box); };
    document.getElementById("inkTextCopy").onclick = function(){
      ta.select();
      try{ document.execCommand("copy"); msg.textContent = "Copied."; }
      catch(e){ msg.textContent = "Select it and copy."; }
    };
    /* Whatever is in the box, which may be what a teacher corrected — the
       point of showing it is that the correction is the thing kept. */
    document.getElementById("inkTextKeep").onclick = async function(){
      var body = (ta.value || "").trim();
      if(!body){ msg.textContent = "There is nothing to keep."; return; }
      msg.textContent = "Saving…";
      try{
        /* The route's own shape: a topic, and a lesson it turns into the
           saved text. Sending a bare `body` field looked reasonable and
           would have been a 422 the first time a teacher pressed it. */
        var first = body.split("\n")[0].slice(0, 60).trim();
        await window.bapi.post("/api/craxlearn/board/save", {
          topic: first.length >= 2 ? first : "Board notes",
          title: (first.length >= 2 ? first : "Board notes") + " — "
                 + new Date().toLocaleDateString(),
          class_id: (ROOM && ROOM.class_id) || 0,
          subject: (ROOM && ROOM.subject) || "",
          lesson: { title: first, steps: body.split("\n").filter(Boolean),
                    takeaway: "" }
        });
        msg.textContent = "Saved to " + ((ROOM && ROOM.subject) || "the class")
          + ".";
        setTimeout(function(){
          if(box.parentNode) box.parentNode.removeChild(box); }, 900);
      }catch(e){ msg.textContent = e.message || "It could not be saved."; }
    };
  }

  function mark(){
    var sb = document.getElementById("inkShape");
    if(sb){
      var cur = SHAPES.filter(function(x){ return x.k === shape; })[0];
      var nxt = nextShape();
      sb.textContent = cur ? cur.ic : "✎";
      sb.title = cur ? cur.name + " — tap for " + nxt.label
                     : "Freehand — tap for " + nxt.label;
      sb.classList.toggle("on", !!shape);
    }
    bar.querySelectorAll("[data-inkpen]").forEach(function(b){
      var isPen = b.dataset.inkpen !== "erase";
      var sel = erasing ? !isPen : (isPen && PENS[+b.dataset.inkpen] === colour);
      b.classList.toggle("on", sel);
    });
  }

  function open(){
    on = true;
    cv.classList.add("on");
    bar.classList.add("on");
    document.body.classList.add("inking");
    paintBar();
    /* The bar comes back the way it was left. */
    var want = null;
    try{ want = localStorage.getItem("cl_inkbar"); }catch(e){}
    if(want === "0"){
      bar.classList.add("folded");
      document.body.classList.remove("inking");
      var f = document.getElementById("inkFold");
      if(f){ f.textContent = "▴"; f.title = "Show the pen's controls"; }
    }
    fit();
  }

  function close(){
    on = false;
    cv.classList.remove("on");
    bar.classList.remove("on");
    document.body.classList.remove("inking");
  }

  function start(){
    cv = document.getElementById("inkLayer");
    bar = document.getElementById("inkBar");
    if(!cv || !bar) return;
    ctx = cv.getContext("2d");
    fit();
    bind();

    bar.addEventListener("click", function(e){
      var pen = e.target.closest("[data-inkpen]");
      if(pen){
        if(pen.dataset.inkpen === "erase") erasing = true;
        else { erasing = false; colour = PENS[+pen.dataset.inkpen]; }
        mark();
        return;
      }
      var b = e.target.closest("[data-ink]");
      if(!b) return;
      var k = b.dataset.ink;
      if(k === "undo"){ if(strokes.length) undone.push(strokes.pop()); redraw(); }
      else if(k === "redo"){ if(undone.length) strokes.push(undone.pop()); redraw(); }
      else if(k === "clear"){
        /* Undoable, like the writing space's Clear: it is one tap away from
           a lesson's worth of annotation. */
        undone.unshift.apply(undone, strokes.slice().reverse());
        strokes.length = 0;
        redraw();
      }
      else if(k === "off"){ close(); }
      else if(k === "save"){ shoot(); }
      else if(k === "type"){ toText(b); }
      else if(k === "shape"){
        shape = nextShape().k;
        erasing = false;
        mark();
      }
      else if(k === "fold"){
        var folded = bar.classList.toggle("folded");
        document.body.classList.toggle("inking", !folded);
        b.textContent = folded ? "▴" : "▾";
        b.title = folded ? "Show the pen's controls"
                         : "Hide this bar — the marks stay";
        /* Remembered, because a board that is used one way is used that way
           every lesson, and setting it again each morning is the kind of
           thing that stops a feature being used at all. */
        try{ localStorage.setItem("cl_inkbar", folded ? "0" : "1"); }
        catch(err){}
      }
    });
    bar.addEventListener("input", function(e){
      if(e.target && e.target.id === "inkSize") size = +e.target.value;
    });
  }

  return { start: start, open: open, close: close,
           toggle: function(){ on ? close() : open(); },
           isOn: function(){ return on; } };
})();

/* ---------- a surface to write on ----------
 *
 * The thing a smart board is for. Everything else here is the platform
 * teaching; this is the teacher teaching, and a classroom display without
 * somewhere to write by hand is a television.
 *
 * Pointer events rather than mouse or touch, because a board is used with a
 * finger, a stylus and sometimes a mouse in the same lesson, and three
 * separate handlers is three chances for one of them to be the broken one.
 * Coalesced events are read where the browser offers them: a stylus reports
 * far faster than the screen repaints, and dropping those samples is what
 * makes handwriting look like a polygon.
 */
var PENS = [
  { name:"White", colour:"#e8eef6" }, { name:"Amber", colour:"#ff9933" },
  { name:"Green", colour:"#3fae6a" }, { name:"Red", colour:"#e05a5a" },
  { name:"Blue",  colour:"#5aa9e0" }
];

/* The board has no edges.
 *
 * It used to be a fixed rectangle that fitted itself into the pane, on the
 * reasoning that a surface which stretched would turn a circle into an
 * ellipse and nothing would ever be out of reach. Both of those are true and
 * neither was the problem. The problem is that a lesson is longer than a
 * screen. A teacher working through a derivation filled the board, and then
 * had to rub out the beginning of the working to write the end of it — which
 * is the one moment a child looks up and needs to see the beginning.
 *
 * So the surface is now a plane you move over. Strokes are stored in WORLD
 * coordinates with no bounds at all, and what is on the screen is a window
 * onto that plane: an offset and a scale. Nothing stretches, because zoom is
 * uniform; nothing is out of reach, because you can always get back — Fit
 * puts every mark you have made on the screen at once, however far you have
 * wandered.
 *
 * The cost of an endless surface is not knowing where you are. Two things
 * answer that and both are deliberate: a grid that scales with the zoom, so
 * panning has something to move against instead of looking like a board that
 * has stopped responding, and Fit, one press away, always.
 */
var BOARD_UNIT = 1600;   // the width the OLD fixed board had; now just a scale

/* The grid is OFF unless somebody turns it on.
 *
 * It went in to answer a real problem — on a surface with no edges, panning
 * an empty part of it looks exactly like a board that has stopped responding
 * — and it solved that at the cost of the thing the board is for. A page of
 * working written over graph paper is a page of graph paper.
 *
 * Fit, the zoom readout and the mark count answer "where am I" well enough
 * without it. Kept as a switch rather than deleted because it genuinely
 * helps for plotting axes and drawing to scale, which is a maths lesson.
 * Remembered, since it is a property of how a room teaches. */
function gridOn(){
  try{ return localStorage.getItem("cl_grid") === "1"; }
  catch(e){ return false; }
}
function setGrid(on){
  try{ localStorage.setItem("cl_grid", on ? "1" : "0"); }catch(e){}
}

/* What is on the board outlives the element it is drawn on. Splitting the
   screen rebuilds every space, and a teacher who added a second space
   halfway through an explanation should not come back to a blank board —
   nor to a different part of the canvas than the one they were looking at,
   so the window travels with the ink. */
var BOARD_INK = { strokes: [], undone: [], view: null, pics: [] };

/* Pictures placed on the board, and the bytes behind them.
 *
 * A picture is { url, x, y, w, h } in board units — the same units the ink
 * is in, so it pans, zooms and exports with everything else and needs no
 * special case anywhere but the one place that draws it.
 *
 * The bytes are held separately and keyed by url, because the same diagram
 * placed twice should be one download, and because an Image object cannot
 * survive being written into the same structure the ink is kept in.
 *
 * They come through /api/craxlearn/picture rather than straight from
 * Wikimedia for a reason that has nothing to do with politeness: a remote
 * image drawn onto a canvas taints it, and a tainted canvas refuses toBlob.
 * Dropping a diagram on the board would silently break Save to the class
 * and Download — the two things a teacher does at the end of the lesson.
 */
var PICBYTES = {};
function picLoad(url){
  if(PICBYTES[url]) return PICBYTES[url];
  var pr = (async function(){
    var r = await fetch("/api/craxlearn/picture?url=" +
                        encodeURIComponent(url),
                        { headers: bhdr({}), credentials: "include" });
    if(!r.ok){
      var why = "That picture could not be fetched.";
      try{ why = (await r.json()).detail || why; }catch(e){}
      throw new Error(why);
    }
    var blob = await r.blob();
    var img = new Image();
    /* An object URL from our own origin. Revoked once the image has
       decoded — holding it open leaks a blob per picture per lesson, and
       revoking before decode gives a broken image on a slow board. */
    var u = URL.createObjectURL(blob);
    await new Promise(function(ok, no){
      img.onload = ok;
      img.onerror = function(){ no(new Error("The picture would not open.")); };
      img.src = u;
    });
    URL.revokeObjectURL(u);
    return img;
  })();
  /* The decoded image is hung on the promise itself, so the draw loop —
     which runs sixty times a second and cannot await anything — can ask
     "is it here yet" with one property read and skip it if not. */
  pr.then(function(img){ pr.img = img; });
  /* A failure must not be cached as a permanent one: the network comes
     back, and a teacher pressing Place again deserves a second attempt. */
  pr["catch"](function(){ delete PICBYTES[url]; });
  PICBYTES[url] = pr;
  return pr;
}
/* Open a saved file, carrying the board's token.
 *
 * The window is opened BEFORE the fetch, not after. A pop-up blocker allows
 * a window opened inside a click and refuses one opened in a promise that
 * settles later — so the obvious order fails silently on exactly the boards
 * this is for. */
async function openFile(btn){
  var id = btn.dataset.openfile;
  var win = window.open("", "_blank");
  var was = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Opening…";
  try{
    var r = await fetch("/api/material/" + encodeURIComponent(id) + "/file",
                        { credentials:"omit", headers: bhdr({}) });
    if(!r.ok) throw new Error(r.status === 403
      ? "That file belongs to another class."
      : "That file could not be opened.");
    var blob = await r.blob();
    var url = URL.createObjectURL(blob);
    if(win) win.location = url;
    else window.open(url, "_blank");
    /* Released once the new window has had it. Revoking immediately can
       cancel the load on a slow board. */
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }catch(e){
    if(win) win.close();
    toastLine(e.message || "That file could not be opened.");
  }finally{
    btn.disabled = false; btn.textContent = was;
  }
}

/* One place that turns a canvas into something the class can open.
 *
 * Three buttons wanted this — the space's own camera, the writing space's
 * Download, and the crop tool — and each had its own copy of the same
 * fifteen lines. On a board it is KEPT, because a file in the Downloads
 * folder of a machine bolted to a wall reaches nobody; off one, a download
 * is exactly right and still happens.
 */
async function keepShot(cnv, btn){
  if(!cnv){
    toastLine("There is nothing on the board yet — write something first.");
    return;
  }
  var was = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; }
  function done(msg){
    if(btn){ btn.disabled = false; btn.textContent = was; }
    if(msg) toastLine(msg);
  }
  if(!boarded()){
    var a = document.createElement("a");
    a.href = cnv.toDataURL("image/png");
    a.download = "craxlearn-" + new Date().toISOString().slice(0, 16)
                   .replace(/[:T]/g, "-") + ".png";
    a.click();
    return done("");
  }
  cnv.toBlob(async function(blob){
    if(!blob) return done("This browser cannot make a picture of that.");
    try{
      var fd = new FormData();
      fd.append("file", blob, "board.png");
      fd.append("title", "Board — " + new Date().toLocaleString());
      fd.append("class_id", String((ROOM && ROOM.class_id) || 0));
      fd.append("subject", (ROOM && ROOM.subject) || "");
      await window.bapi.send("/api/craxlearn/board/file", fd);
      done("Kept on " + ((ROOM && ROOM.subject) || "the class page") + ".");
    }catch(e){
      done(e.message || "It could not be kept.");
    }
  }, "image/png");
}

/* A line that says what happened and then goes away. The board had no way
   to say "that worked" outside a dialog, so a press that succeeded looked
   the same as one that did nothing. */
function toastLine(msg){
  if(!msg) return;
  var t = document.getElementById("boardToast");
  if(!t){
    t = document.createElement("div");
    t.id = "boardToast";
    t.style.cssText = "position:fixed;left:50%;bottom:1.2rem;" +
      "transform:translateX(-50%);z-index:90;background:#101823f2;" +
      "border:1px solid #2a3444;border-radius:12px;padding:.5rem .9rem;" +
      "font-size:.72rem;color:#e8eef6;box-shadow:0 8px 24px #0009";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toastLine._t);
  toastLine._t = setTimeout(function(){ t.style.display = "none"; }, 2600);
}

/* How to photograph the writing space, set by the writing space itself.
   Null until one is open, which is exactly when the pane button should fall
   back to capturing the screen instead. */
var WRITING_SHOT = null;

/* Straight things, drawn as strokes.
 *
 * A shape here is not a new kind of object: it is a stroke whose points
 * happen to lie on a line, a box or a circle. That is the whole design.
 * Undo, redo, the export, the save to a class and the redraw at any size all
 * work on strokes and none of them need to know these exist — a shape that
 * was its own type would have needed every one of them taught about it, and
 * one of them would have been missed.
 *
 * Declared out here rather than inside write(), because write() names it in
 * the markup it builds on its first line. `var` inside the function hoisted
 * the NAME and not the value, so the toolbar threw before it was drawn and
 * the writing space came up empty. It parsed, so nothing caught it.
 */
var SHAPES = [
  { k: "line",  ic: "╱", name: "Straight line" },
  { k: "arrow", ic: "→", name: "Arrow" },
  { k: "rect",  ic: "▭", name: "Rectangle" },
  { k: "oval",  ic: "◯", name: "Circle" }
];

function shapePoints(kind, a, b){
  var x0 = a[0], y0 = a[1], x1 = b[0], y1 = b[1], out = [], i;
  function P(x, y){ return [x, y, 0.5]; }
  if(kind === "line"){ return [P(x0, y0), P(x1, y1)]; }
  if(kind === "arrow"){
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    var head = Math.min(28, len * 0.28);      /* never longer than the shaft */
    var lx = x1 - ux * head, ly = y1 - uy * head;
    var px = -uy * head * 0.45, py = ux * head * 0.45;
    return [P(x0, y0), P(x1, y1),
            P(lx + px, ly + py), P(x1, y1),
            P(lx - px, ly - py), P(x1, y1)];
  }
  if(kind === "rect"){
    return [P(x0, y0), P(x1, y0), P(x1, y1), P(x0, y1), P(x0, y0)];
  }
  /* An ellipse in the dragged box, so a circle is a drag held square. */
  var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  var rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
  for(i = 0; i <= 48; i++){
    var t = (i / 48) * Math.PI * 2;
    out.push(P(cx + Math.cos(t) * rx, cy + Math.sin(t) * ry));
  }
  return out;
}

function write(){
  var host = main();
  /* The space stops scrolling and becomes a column: surface, then toolbar. */
  host.classList.add("noscroll");
  host.innerHTML =
    '<div class="wboard">' +
      '<div class="wsurf" id="wSurf">' +
        '<canvas id="wCanvas"></canvas>' +
        '<div class="whint" id="wHint">' +
          "Write with a finger, a stylus or a mouse. Two fingers, or the " +
          "space bar, to move around — the board does not end." +
        "</div>" +
        '<div class="wwhere" id="wWhere"></div>' +
        /* The picture drawer, over the surface rather than under the bar.
           The bar is already the tightest thing on a short pane; another
           row in it is how the writing space became 452 pixels tall the
           last time. Hidden until the 🖼 is pressed. */
        '<div class="wpic" id="wPicBox" hidden>' +
          '<div class="row">' +
            '<input id="wPicQ" placeholder="the eye · a volcano · Saturn">' +
            '<button class="btn" id="wPicGo">Find</button>' +
            '<button class="btn ghost" id="wPicX">Close</button>' +
          "</div>" +
          '<div class="muted" id="wPicMsg">Public catalogues, with the ' +
            "licence. Drag a placed picture to move it, or its bottom-right " +
            "corner to resize. Writing goes on top.</div>" +
          '<div id="wPicOut"></div>' +
        "</div>" +
      "</div>" +
      /* The bar sits UNDER the surface, one rectangle, always there. A
         teacher at a board reaches down, not up: the top of a wall-mounted
         screen is above head height, and a control a person has to stretch
         for is a control they stop using by the second week. */
      '<div id="wTools" class="wtools">' +
        PENS.map(function(p, i){
          return '<button class="iconbtn" data-pen="' + i + '" title="' + p.name + '" ' +
            'style="background:' + p.colour + ';border-color:' + p.colour +
            ';width:2rem"></button>';
        }).join("") +
        '<button class="iconbtn" data-pen="erase" title="Rub out">⌫</button>' +
        '<span class="sep"></span>' +
        SHAPES.map(function(sh){
          return '<button class="iconbtn" data-shape="' + sh.k +
            '" title="' + sh.name + '">' + sh.ic + "</button>"; }).join("") +
        '<input type="range" id="wSize" min="2" max="28" value="5" ' +
          'title="Thickness" style="width:5rem">' +
        '<span class="sep"></span>' +
        /* Moving around is a TOOL, not only a gesture. A stylus has one
           contact point and a wall-mounted screen often has no keyboard, so
           two-finger pan and the space bar are both unavailable exactly
           where this matters most. */
        /* A picture on the board, from the same open catalogues the search
           tool uses. Next to the grid rather than out at the end: it is a
           thing you put ON the board, like a shape, not a thing you do WITH
           the board at the end of the lesson. */
        '<button class="iconbtn" id="wPic" title="Put a picture on the board">' +
          "🖼</button>" +
        '<button class="iconbtn" id="wGrid" title="Grid on or off">#</button>' +
        '<button class="iconbtn" id="wHand" title="Move around the board">✋</button>' +
        '<button class="iconbtn" id="wOut" title="Zoom out">−</button>' +
        '<button class="iconbtn" id="wIn" title="Zoom in">+</button>' +
        '<button class="btn ghost" id="wFit" title="Bring everything on ' +
          'the board into view">Fit</button>' +
        '<span class="sep"></span>' +
        '<button class="iconbtn" id="wUndo" title="Undo">↶</button>' +
        '<button class="iconbtn" id="wRedo" title="Redo">↷</button>' +
        '<span class="grow"></span>' +
        '<button class="btn ghost" id="wAsk" title="Ask Axle to teach this">' +
          "⚡ Ask Axle</button>" +
        '<button class="btn ghost" id="wClear">Clear</button>' +
        '<button class="btn" id="wKeep" title="Keep this on the class page">' +
          "Save to the class</button>" +
        '<button class="btn ghost" id="wShot" title="Download it as a picture">' +
          "Download</button>" +
      "</div>" +
    "</div>";
  /* No sign-in card in here.
     The pane does not scroll — it cannot, or writing on it would scroll the
     page — so anything below the board competes with the board for height,
     and on a short pane the card won that fight and squeezed the surface to
     nothing. The prompt is on the home screen, where there is room for it,
     and Save to the class says exactly the same thing at the exact moment
     it matters. */

  var shape = "";          /* "" is the pen */

  /* Found INSIDE this pane, never by id alone.
     `el()` is getElementById, and the board can show the writing space in
     two spaces at once — both then carried a #wCanvas, both closures looked
     up the FIRST one, and every stroke was recorded twice while the second
     board sat dead. Ids are unique per pane, not per document. */
  /* Named wq, not w: `redraw` already uses `w` for the canvas width,
     and a helper shadowed by a number is a TypeError at the moment
     somebody draws. */
  function wq(id){ return host.querySelector("#" + id); }

  var cv = wq("wCanvas"), surf = wq("wSurf");
  var ctx = cv.getContext("2d");
  var pen = PENS[0].colour, size = 5, erasing = false;

  /* What is on the board, kept as points rather than pixels.
     A stroke is { c: colour, e: true when it rubs out, w: thickness,
     p: [[x, y, pressure], ...] } with x and y in board units. Because it is
     points, the board can be drawn again at any size — which is what makes
     dragging a pane bigger keep the writing instead of cropping it, and what
     makes the exported picture sharp even when the pane was a quarter of a
     phone screen. */
  var strokes = BOARD_INK.strokes, undone = BOARD_INK.undone, live = null;

  /* Arranging pictures is a MODE, and the drawer being open is what says so.
     Hit-testing pictures while the pen is down would mean a teacher writing
     across a diagram drags the diagram instead — so pictures are inert until
     the 🖼 is pressed, and the pen is inert while it is. One lit button, one
     answer to "what does dragging do right now". */
  if(!BOARD_INK.pics) BOARD_INK.pics = [];
  var picking = false;      // the drawer is open: drag arranges pictures
  var picked = null;        // the one with the handle on it
  var GRIP = 22;            // the resize corner, in screen pixels

  /* The window onto the plane.
   *
   * `k` is device pixels per world unit and `x`/`y` are the world point
   * sitting at the top-left of the canvas. Everything else — drawing, the
   * grid, hit testing, the export — goes through these three numbers, which
   * is the whole reason an endless surface is not a rewrite of the board:
   * `world → screen` is one function and it used to be a constant.
   *
   * Held on BOARD_INK so that splitting the screen brings a teacher back to
   * the part of the board they were looking at, not to the origin. */
  var DPR = 1;
  var VIEW = BOARD_INK.view;

  function measure(){
    var r = surf.getBoundingClientRect();
    /* A pane can be resized without the window being: splitting the board,
       folding the space bars, opening the pen's bar. The cached canvas rect
       has to go with it, or every stroke afterwards lands at an offset. */
    RECT = null;
    DPR = window.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(r.width * DPR));
    var h = Math.max(1, Math.round(r.height * DPR));
    if(cv.width !== w) cv.width = w;
    if(cv.height !== h) cv.height = h;
    /* First time in: one screen-width is one board-width, and the origin is
       the top-left of what you can see. So a teacher who never pans has
       exactly the board they had before, and never learns any of this. */
    if(!VIEW){
      VIEW = { k: w / BOARD_UNIT, x: 0, y: 0 };
      BOARD_INK.view = VIEW;
    }
  }

  function sx(wx){ return (wx - VIEW.x) * VIEW.k; }
  function sy(wy){ return (wy - VIEW.y) * VIEW.k; }

  /* Zoom about a point on the screen, so pinching and the +/− buttons both
     keep whatever is under the fingers under the fingers. */
  function zoomAt(px, py, factor){
    var k0 = VIEW.k;
    var k1 = Math.max(k0 * 0.02, Math.min(k0 * 50, VIEW.k * factor));
    /* Bounded against the FIRST scale rather than absolutely: a board on a
       phone and a board on a wall start at very different k, and a fixed
       limit would be wrong on one of them. */
    var lo = (cv.width / BOARD_UNIT) / 40, hi = (cv.width / BOARD_UNIT) * 40;
    k1 = Math.max(lo, Math.min(hi, k1));
    VIEW.x += px / VIEW.k - px / k1;
    VIEW.y += py / VIEW.k - py / k1;
    VIEW.k = k1;
  }

  function penWidth(s, pressure){
    return Math.max(0.5, (s.e ? s.w * 3 : s.w) * VIEW.k
                         * (0.6 + pressure * 0.8));
  }

  /* One stroke, in whatever size the board currently is. Segment by segment
     so a stylus's pressure still varies along it. */
  function drawStroke(c, s, scale, ox, oy){
    c.globalCompositeOperation = s.e ? "destination-out" : "source-over";
    c.strokeStyle = s.c;
    c.lineCap = "round";
    c.lineJoin = "round";
    var pts = s.p;
    for(var i = 1; i < pts.length; i++){
      c.lineWidth = Math.max(0.5, (s.e ? s.w * 3 : s.w) * scale
                                  * (0.6 + pts[i][2] * 0.8));
      c.beginPath();
      c.moveTo(ox + pts[i - 1][0] * scale, oy + pts[i - 1][1] * scale);
      c.lineTo(ox + pts[i][0] * scale, oy + pts[i][1] * scale);
      c.stroke();
    }
  }

  /* The whole board, onto any context. The screen and the exported picture
     go through the same function at different sizes, so what is saved is
     exactly what is shown. */
  var BOARD_BG = "#131c28";

  /* The grid exists so that panning an empty part of the board looks like
     moving rather than like a board that has stopped responding. It steps by
     powers of ten in WORLD units, so zooming out does not turn it into a
     solid block — the spacing on screen always stays in the same range. */
  function paintGrid(c, w, h){
    /* Both loops below multiply until the spacing looks right, and a scale
       of zero — or NaN, or infinity — makes that a loop with no way out. It
       is not hypothetical: Fit computes a scale from the size of what is on
       the board, and a pane dragged narrower than the margin, or a single
       dot with no width, produces exactly those numbers. The renderer hangs
       and the board is gone mid-lesson, so the guard is here rather than
       only at the two call sites that can currently do it. */
    if(!(VIEW.k > 0) || !isFinite(VIEW.k)) return;
    var step = 100, n = 0;                // world units
    while(step * VIEW.k < 34 && n++ < 40) step *= 5;
    n = 0;
    while(step * VIEW.k > 220 && n++ < 40) step /= 5;
    if(!(step > 0) || !isFinite(step)) return;
    var x0 = Math.floor(VIEW.x / step) * step;
    var y0 = Math.floor(VIEW.y / step) * step;
    c.save();
    c.lineWidth = 1;
    for(var wx = x0; sx(wx) <= w; wx += step){
      /* Every fifth line a little stronger, which is what makes a grid
         readable as distance rather than as texture. */
      var major = Math.abs(Math.round(wx / step) % 5) === 0;
      c.strokeStyle = major ? "rgba(255,255,255,.075)"
                            : "rgba(255,255,255,.032)";
      c.beginPath();
      c.moveTo(Math.round(sx(wx)) + 0.5, 0);
      c.lineTo(Math.round(sx(wx)) + 0.5, h);
      c.stroke();
    }
    for(var wy = y0; sy(wy) <= h; wy += step){
      var majy = Math.abs(Math.round(wy / step) % 5) === 0;
      c.strokeStyle = majy ? "rgba(255,255,255,.075)"
                           : "rgba(255,255,255,.032)";
      c.beginPath();
      c.moveTo(0, Math.round(sy(wy)) + 0.5);
      c.lineTo(w, Math.round(sy(wy)) + 0.5);
      c.stroke();
    }
    c.restore();
  }

  /* Ink goes on its own layer, and that is not a refinement.
     Rubbing out is `destination-out`, which removes whatever is underneath
     it — on a single layer that is the background and the grid as well, so
     the eraser would cut holes through the board. Strokes are drawn to their
     own transparent canvas and composited on top, so the eraser can only
     ever reach ink. */
  var inkc = document.createElement("canvas");
  var ink = inkc.getContext("2d");

  function paintInk(c, list, scale, ox, oy, w, h){
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, w, h);
    for(var i = 0; i < list.length; i++) drawStroke(c, list[i], scale, ox, oy);
    c.globalCompositeOperation = "source-over";
  }

  /* Pictures, under the ink and over the grid.
   *
   * Under the ink deliberately: a teacher puts up a diagram of the eye and
   * then labels it, and an eraser stroke must take the label back off
   * without punching a hole through the diagram. Because the ink is
   * composited on its own layer, that falls out for free — the eraser can
   * only ever reach ink.
   *
   * `picked` is drawn with a handle at its bottom-right, and only while the
   * drawer is open. A resize grip that is always on screen is a thing to
   * catch a sleeve on during a lesson. */
  function paintPics(c, scale, ox, oy, mark){
    var list = BOARD_INK.pics;
    for(var i = 0; i < list.length; i++){
      var p = list[i];
      var img = PICBYTES[p.url] && PICBYTES[p.url].img;
      if(!img) continue;
      var x = p.x * scale + ox, y = p.y * scale + oy;
      var w2 = p.w * scale, h2 = p.h * scale;
      try{ c.drawImage(img, x, y, w2, h2); }catch(e){ continue; }
      if(mark && p === picked){
        c.save();
        c.strokeStyle = "#8fe3b0";
        c.lineWidth = 2;
        c.setLineDash([6, 4]);
        c.strokeRect(x, y, w2, h2);
        c.setLineDash([]);
        c.fillStyle = "#8fe3b0";
        c.fillRect(x + w2 - GRIP, y + h2 - GRIP, GRIP, GRIP);
        c.restore();
      }
    }
  }

  function redraw(){
    measure();
    var w = cv.width, h = cv.height;
    if(inkc.width !== w) inkc.width = w;
    if(inkc.height !== h) inkc.height = h;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = BOARD_BG;
    ctx.fillRect(0, 0, w, h);
    if(gridOn()) paintGrid(ctx, w, h);
    paintPics(ctx, VIEW.k, -VIEW.x * VIEW.k, -VIEW.y * VIEW.k, picking);
    paintInk(ink, strokes.concat(live ? [live] : []),
             VIEW.k, -VIEW.x * VIEW.k, -VIEW.y * VIEW.k, w, h);
    ctx.drawImage(inkc, 0, 0);
    var hint = wq("wHint");
    if(hint) hint.hidden = strokes.length > 0 || !!live ||
                           BOARD_INK.pics.length > 0;
    var where = wq("wWhere");
    if(where){
      where.textContent = Math.round(VIEW.k / (w / BOARD_UNIT) * 100) + "%"
        + (strokes.length ? "  ·  " + strokes.length + " mark"
                            + (strokes.length === 1 ? "" : "s") : "");
    }
  }

  /* Everything on the board, on the screen at once. The way back from
     anywhere, which is what makes a surface with no edges safe to give
     somebody mid-lesson. */
  function bounds(){
    var b = null;
    function hit(x, y){
      if(!b) b = [x, y, x, y];
      else{
        if(x < b[0]) b[0] = x;
        if(y < b[1]) b[1] = y;
        if(x > b[2]) b[2] = x;
        if(y > b[3]) b[3] = y;
      }
    }
    strokes.forEach(function(s){
      s.p.forEach(function(p){ hit(p[0], p[1]); });
    });
    /* Pictures count as something being on the board. Fit ignoring them
       would scroll a labelled diagram off screen, and — worse — the empty
       board guard reads this: a board holding only a picture would have
       answered "there is nothing here yet" to Save to the class. */
    BOARD_INK.pics.forEach(function(p){
      hit(p.x, p.y);
      hit(p.x + p.w, p.y + p.h);
    });
    return b;
  }

  function fit(){
    measure();
    var b = bounds();
    if(!b){                     /* nothing written: back to where it started */
      VIEW.k = cv.width / BOARD_UNIT;
      VIEW.x = 0;
      VIEW.y = 0;
      redraw();
      return;
    }
    var pad = 40;
    var bw = Math.max(1, b[2] - b[0]), bh = Math.max(1, b[3] - b[1]);
    var base = cv.width / BOARD_UNIT;
    var k = Math.min(Math.max(1, cv.width - pad * 2) / bw,
                     Math.max(1, cv.height - pad * 2) / bh);
    k = Math.min(k, base * 4);            // do not magnify a single dot
    /* A pane narrower than the margin, or a mark with no width, produces
       zero or infinity here — and every one of those reaches the grid, which
       loops until the spacing looks right and would never stop. */
    if(!(k > 0) || !isFinite(k)) k = base;
    VIEW.k = k;
    VIEW.x = b[0] - (cv.width / VIEW.k - bw) / 2;
    VIEW.y = b[1] - (cv.height / VIEW.k - bh) / 2;
    redraw();
  }

  /* The pane is dragged, the board is rotated, the browser zooms: all of
     them arrive here, and all of them are answered by drawing again rather
     than by stretching a bitmap. */
  if(window.ResizeObserver){
    new ResizeObserver(function(){ redraw(); }).observe(surf);
  }else{
    window.addEventListener("resize", redraw);
  }
  redraw();

  /* Screen position to world units. NOT clamped any more — that clamp was
     the edge of the board, and there is no edge. A stroke that runs off the
     right of the screen is simply a stroke to the right of the screen, and
     Fit brings it back. */
  /* Where the canvas is, read ONCE rather than per pointer sample.
   *
   * getBoundingClientRect forces the browser to settle the layout before it
   * can answer. A stylus reports 120 samples a second and each one asked
   * again — so the board did over a hundred forced reflows a second while
   * somebody was writing, which is most of what "lagging behind the pen"
   * was. It only changes when the pane resizes or the page scrolls, and both
   * of those already call measure(). */
  var RECT = null;
  function rect(){
    if(!RECT) RECT = cv.getBoundingClientRect();
    return RECT;
  }
  function forgetRect(){ RECT = null; }
  window.addEventListener("resize", forgetRect);
  window.addEventListener("scroll", forgetRect, true);

  function at(e){
    var r = rect();
    var p = (e.pressure && e.pointerType === "pen") ? e.pressure : 0.5;
    return [VIEW.x + (e.clientX - r.left) * DPR / VIEW.k,
            VIEW.y + (e.clientY - r.top) * DPR / VIEW.k, p];
  }

  /* Canvas pixels, for zooming about a point and for panning. */
  function px(e){
    var r = rect();
    return [(e.clientX - r.left) * DPR, (e.clientY - r.top) * DPR];
  }

  /* Drawing paints only the new segment — redrawing every stroke on every
     pointer sample is what makes a board feel like it is lagging behind
     the pen. */
  function extend(pt){
    var pts = live.p;
    pts.push(pt);
    if(pts.length < 2) return;
    var a = pts[pts.length - 2], b = pt;
    /* Onto the ink layer, then one composite. Redrawing every stroke on
       every pointer sample is what makes a board feel like it is lagging
       behind the pen; compositing a whole canvas is a single blit. */
    ink.globalCompositeOperation = live.e ? "destination-out" : "source-over";
    ink.strokeStyle = live.c;
    ink.lineCap = "round";
    ink.lineJoin = "round";
    ink.lineWidth = penWidth(live, b[2]);
    ink.beginPath();
    ink.moveTo(sx(a[0]), sy(a[1]));
    ink.lineTo(sx(b[0]), sy(b[1]));
    ink.stroke();
    ink.globalCompositeOperation = "source-over";
    show();
  }

  /* One composite per FRAME, not one per sample.
   *
