<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Craxlearn — the teaching board</title>
<meta name="description" content="Craxlearn: the teaching half of Craxle, for schools, colleges and coaching centres. No job board.">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/craxlearn.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f16">
<style>
/* Sized for the display at the front of a room, not for a laptop.
   The whole of this file is one decision repeated: the person reading it is
   four metres away and the person operating it is doing so with a finger.
   Base type is 20px rather than 16, targets are 52px rather than 36, and
   nothing depends on hover — a smart board has no pointer to hover with. */
:root{
  --bg:#0b0f16; --panel:#121a26; --panel2:#0e1621; --line:#22303f;
  --text:#e8eef6; --muted:#93a3b8; --dim:#6a7b8f;
  --accent:#ff9933; --accent2:#c2410c; --ok:#3fae6a; --bad:#e05a5a;
  --pad:clamp(16px,2.2vw,34px);
  --r:16px;
}
:root[data-scale="board"]{ font-size:26px }
:root[data-scale="desk"]{ font-size:18px }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:1rem; line-height:1.6; -webkit-text-size-adjust:100%;
  min-height:100vh;
}
button{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1rem}

/* ---- frame ---- */
#top{
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.7rem var(--pad); border-bottom:1px solid var(--line);
  background:var(--panel2); position:sticky; top:0; z-index:50;
}
#brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem}
#brand .dot{
  width:1.5rem;height:1.5rem;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent),var(--accent2));
}
#brand small{display:block;font-size:.5rem;font-weight:500;color:var(--muted);
  letter-spacing:.14em;text-transform:uppercase}
.grow{flex:1 1 auto}
#top .who{font-size:.62rem;color:var(--muted);text-align:right;line-height:1.35}
#top .who b{display:block;color:var(--text);font-size:.72rem}

.iconbtn{
  min-width:2rem;min-height:2rem;padding:0 .55rem;border-radius:12px;
  border:1px solid var(--line);background:transparent;cursor:pointer;
  font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn:active{border-color:var(--accent)}

/* ---- the tile grid: the whole home screen ---- */
#main{padding:var(--pad);max-width:1500px;margin:0 auto}
.tiles{
  display:grid;gap:clamp(12px,1.4vw,22px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));
}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;
  text-align:left;padding:1.1rem 1.15rem;min-height:7.2rem;
  border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel);cursor:pointer;
}
.tile:active{border-color:var(--accent);transform:translateY(1px)}
.tile .ic{font-size:1.9rem;line-height:1}
.tile b{font-size:.92rem;font-weight:700}
.tile span{font-size:.66rem;color:var(--muted);line-height:1.45}

.eyebrow{
  font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:1.6rem 0 .7rem;font-weight:700;
}
.eyebrow:first-child{margin-top:0}

.card{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:1.1rem 1.2rem;margin-bottom:1rem;
}
.muted{color:var(--muted);font-size:.72rem}
.big{font-size:1.6rem;font-weight:800;line-height:1}

.btn{
  padding:.6rem 1.1rem;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(150deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;cursor:pointer;font-size:.78rem;
  min-height:2.4rem;
}
.btn.ghost{background:transparent;color:var(--text);font-weight:600}
.btn:active{transform:translateY(1px)}
input,select{
  font:inherit;font-size:.78rem;padding:.55rem .7rem;border-radius:12px;
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  min-height:2.4rem;max-width:100%;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}

table{border-collapse:collapse;width:100%;font-size:.72rem}
th,td{border-bottom:1px solid var(--line);padding:.5rem .6rem;text-align:left;
  vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.62rem;
  text-transform:uppercase;letter-spacing:.1em}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.note{
  border:1px solid rgba(255,153,51,.35);background:rgba(255,153,51,.09);
  border-radius:var(--r);padding:.9rem 1.05rem;font-size:.74rem;
  line-height:1.6;margin-bottom:1rem;
}
.bad{border-color:rgba(224,90,90,.4);background:rgba(224,90,90,.1)}

/* ---- sign in ---- */
#gate{max-width:26rem;margin:8vh auto;padding:0 var(--pad)}
#gate .card{padding:1.5rem}
#gate input{width:100%;margin-bottom:.6rem}
#gate .btn{width:100%}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.tabs button{
  flex:1;padding:.5rem;border-radius:12px;border:1px solid var(--line);
  background:transparent;cursor:pointer;font-size:.72rem;min-height:2.2rem;
}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}

/* ---- spaces ----
   Two tools side by side, with a divider you drag. A classroom board is
   wide and a lesson is usually two things at once — the lesson and the
   working, the diagram and the question — and a teacher who has to keep
   swapping between them stops using the second one.

   Stacked rather than side by side under 900px, because two half-width
   columns on a phone are two unreadable columns. */
#panes{display:flex;flex-wrap:wrap;align-items:stretch;
  min-height:calc(100vh - 4rem)}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1 1 0}
/* Four spaces on a wide board is two rows of two, not four thin columns —
   a column narrower than about 22rem holds nothing a class can read. */
#panes.grid{align-content:stretch}
#panes.grid .pane{flex:1 1 calc(50% - 5px);max-width:calc(50% - 5px);
  height:calc((100vh - 4rem) / 2)}
#panes.grid .grip{display:none}
.paneHead{
  display:flex;align-items:center;gap:.4rem;padding:.4rem var(--pad);
  border-bottom:1px solid var(--line);background:var(--panel2);
}
.pane[data-live="1"] .paneHead{border-bottom-color:var(--accent)}
.paneHead select{font-size:.66rem;min-height:1.9rem;padding:.2rem .45rem}
.paneBody{flex:1 1 auto;overflow-y:auto;padding:var(--pad);
  -webkit-overflow-scrolling:touch}
#panes.one .paneHead{display:none}
#panes.one .paneBody{max-width:1500px;margin:0 auto;width:100%}
.grip{
  flex:0 0 10px;cursor:col-resize;background:var(--line);
  background-clip:content-box;border-left:4px solid var(--bg);
  border-right:4px solid var(--bg);touch-action:none;
}
.grip:active{background:var(--accent)}
@media(max-width:900px){
  #panes{flex-direction:column}
  .grip{flex:0 0 10px;cursor:row-resize;border:none;border-top:4px solid var(--bg);
    border-bottom:4px solid var(--bg)}
}

/* The boards render into #main and bring their own CSS. They were written
   for a 16px page, so they are scaled down relative to the room-sized base
   rather than left to fill a wall with one input box. */
.paneBody .nwwrap,.paneBody .labwrap,.paneBody .sqlwrap{font-size:.62rem}

@media print{ #top,.tile{display:none!important} }
</style>
</head>
<body>

<div id="top">
  <div id="brand"><span class="dot"></span>
    <span>Craxlearn<small>Schools · Colleges · Coaching</small></span></div>
  <span class="grow"></span>
  <div class="who" id="who"></div>
  <button class="iconbtn" id="splitBtn" title="Open another space beside this one">▥</button>
  <button class="iconbtn" id="shotBtn" title="Screenshot">⛶</button>
  <button class="iconbtn" id="installBtn" title="Install on this board" hidden>⤓</button>
  <button class="iconbtn" id="scaleBtn" title="Board size / desk size">⤢</button>
  <button class="iconbtn" id="homeBtn" title="Home">⌂</button>
  <button class="iconbtn" id="outBtn" title="Sign out">↪</button>
</div>

<div id="gate" hidden>
  <div class="card">
    <h1>Craxlearn</h1>
    <p class="muted" style="margin-top:0">The teaching half of Craxle, for
      schools, colleges and coaching centres. No job board, no adverts,
      nothing to buy in the classroom.</p>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabCode" aria-selected="true">Class code</button>
      <button role="tab" id="tabIn" aria-selected="false">Sign in</button>
      <button role="tab" id="tabUp" aria-selected="false">New account</button>
    </div>
    <div id="gateForm"></div>
    <div id="gateMsg" class="muted" style="margin-top:.7rem"></div>
  </div>
  <p class="muted" style="text-align:center">
    <a href="/api/craxlearn/sources">Where our answers come from</a> ·
    <a href="/privacy">Privacy</a>
  </p>
</div>

<div id="app" hidden><div id="panes"></div></div>

<script>
/* The things the board modules need from a host page, defined BEFORE they
 * load. Each of them captures window.$ once, at load time — so this has to
 * be here rather than in the app script below, and putting it there is
 * exactly why net, lab, sqlboard and the scanner all rendered into nothing
 * the first time. The app script hands this shim its real pane resolver
 * once it runs.
 */
window.__paneBody = null;
window.$ = function (sel) {
  if (sel === "#main" && window.__paneBody) return window.__paneBody();
  return document.querySelector(sel);
};
window.esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
             '"': "&quot;", "'": "&#39;" }[c];
  });
};
</script>
<script src="sqlboard.js?v=7c5033791d"></script>
<script src="net.js?v=0338e61617"></script>
<script src="lab.js?v=63294b493d"></script>
<script src="three3d.js?v=252535ecb2"></script>
<script src="scanner.js?v=2f02744728"></script>
<script>
/* Craxlearn — the institution app.
 *
 * A separate page from index.html, deliberately, and for one reason: a
 * school is buying a URL it can put on the board at the front of a room and
 * hand to a fourteen-year-old. A single app with the job half hidden behind
 * a flag is one bug away from showing it, and the person who finds that bug
 * is a child. There is no job-board code in this file to go wrong.
 *
 * The server does not take this file's word for any of it. Every job-side
 * route is refused at the door by the middleware in main.py, for institution
 * accounts and for under-18s, whichever page asked. This file only decides
 * what to draw.
 *
 * The boards themselves — SQL, the packet walkthrough, the lab — are the
 * same modules the main app loads. They need four things from their host:
 * `api.get`, `api.post`, a `$` selector reaching `#main`, and `window.esc`.
 * That contract is provided below and nothing else is.
 */
(function(){
"use strict";

/* ---------- the four things the board modules need ---------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* The head of this file already installed window.$ and window.esc so the
   modules could capture them. This hands that shim the real resolver — the
   modules keep the function they captured and it starts answering "#main"
   with whichever space is being drawn into. */
window.__paneBody = function(){ return paneBody(); };

async function req(method, path, body){
  var opt = { method:method, credentials:"same-origin",
              headers:{ "Content-Type":"application/json" } };
  if(body !== undefined) opt.body = JSON.stringify(body);
  var r = await fetch(path, opt);
  var text = await r.text();
  var data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
  if(!r.ok){
    var msg = (data && data.detail) || r.statusText || "Something went wrong";
    var err = new Error(msg);
    err.status = r.status;
    /* The gate answers 403 with a reason, so the page can say WHICH wall
       was hit rather than "forbidden". A learner told "not allowed" goes
       and asks a teacher; one told "this is a Craxlearn server" does not. */
    err.craxlearn = data && data.craxlearn;
    throw err;
  }
  return data;
}
window.api = {
  get:  function(p){ return req("GET", p); },
  post: function(p,b){ return req("POST", p, b===undefined?{}:b); },
  del:  function(p){ return req("DELETE", p); }
};

/* ---------- state ---------- */
var ME = null;
var VIEW = { page:"home" };
/* bot.js and the board modules read these. Kept as the same shape the main
   app uses so the modules need no branch for which page they are on. */
window.S = VIEW.page ? { view:VIEW } : { view:VIEW };
window.S.view = VIEW;

var el = function(id){ return document.getElementById(id); };

/* ---------- spaces ----------
 *
 * One or two, side by side, with a divider you drag. Each holds any tool.
 * `main()` is the body of whichever one is being drawn into, which is what
 * lets every page function in this file — all of which were written against
 * a single screen — work unchanged in either.
 */
var PANES = [{ page:"home", arg:null }];
var LIVE = 0;          // the space a new page opens into
var DRAW = 0;          // the space currently being drawn

function paneBody(){
  var p = document.querySelector('.paneBody[data-i="' + DRAW + '"]');
  return p || document.querySelector(".paneBody") || el("app");
}
var main = paneBody;

var TOOL_NAMES = {
  home:"Home", board:"Ask the board", write:"Writing space",
  calc:"Calculator", structure:"3D structures", find:"Search the sources",
  phet:"Simulations", scan:"Scan a problem", tracks:"Courses and exams",
  lesson:"A lesson", track:"A course", exam:"An exam",
  net:"Packet walkthrough", lab:"The lab", sqlboard:"SQL board",
  materials:"Study material", roster:"Class register", roll:"Your classes",
  inbox:"To review", activity:"What the class is asking",
  sources:"Where answers come from", assignment:"Assignment",
  student:"A student", review:"Reviewing"
};

var MAX_PANES = 4;

function paintPanes(){
  var wrap = el("panes");
  wrap.className = PANES.length === 1 ? "one"
                 : PANES.length >= 3 ? "grid" : "";
  var html = "";
  PANES.forEach(function(p, i){
    if(i && PANES.length === 2){
      html += '<div class="grip" data-grip="' + i + '"></div>';
    }
    html += '<div class="pane" data-i="' + i + '" data-live="' +
      (i === LIVE ? 1 : 0) + '"' +
      /* Only a row layout gets an inline width. In the 2x2 the stylesheet
         owns it, and an inline flex here beat that rule and laid four
         spaces out as four unreadable columns. */
      (PANES.length === 2 ? ' style="flex:' + (p.flex || 1) + ' 1 0"' : "") +
      ">" +
      '<div class="paneHead">' +
        '<select data-pick="' + i + '">' +
          Object.keys(TOOL_NAMES).filter(function(k){
            if(["assignment","student","review","lesson","track",
                "exam"].indexOf(k) >= 0) return false;
            /* Each tool names its own fields by id, so two copies of one
               tool would both write into the same boxes. Home is exempt:
               it has nothing to type into. */
            if(k === "home" || k === p.page) return true;
            return !PANES.some(function(q, j){ return j !== i && q.page === k; });
          }).map(function(k){
            return '<option value="' + k + '"' +
              (k === p.page ? " selected" : "") + ">" +
              esc(TOOL_NAMES[k]) + "</option>";
          }).join("") +
        "</select>" +
        '<span class="grow"></span>' +
        '<button class="iconbtn" data-shot="' + i + '" title="Screenshot this space">⛶</button>' +
        (PANES.length > 1
          ? '<button class="iconbtn" data-close="' + i + '" title="Close this space">✕</button>'
          : "") +
      "</div>" +
      '<div class="paneBody" data-i="' + i + '"></div>' +
      "</div>";
  });
  wrap.innerHTML = html;
  wirePanes();
  (async function(){
    for(var i = 0; i < PANES.length; i++) await drawPane(i);
  })();
}

async function drawPane(i){
  var was = DRAW;
  DRAW = i;
  try{ await paint(PANES[i].page, PANES[i].arg); }
  catch(e){ /* one space failing must not stop the others drawing */ }
  finally{ DRAW = was; }
}

function wirePanes(){
  el("panes").querySelectorAll("[data-pick]").forEach(function(sel){
    sel.onchange = function(){
      var i = +sel.dataset.pick;
      PANES[i] = { page: sel.value, arg: null, flex: PANES[i].flex };
      LIVE = i;
      paintPanes();
    };
  });
  el("panes").querySelectorAll("[data-close]").forEach(function(b){
    b.onclick = function(){
      PANES.splice(+b.dataset.close, 1);
      LIVE = 0;
      paintPanes();
    };
  });
  el("panes").querySelectorAll("[data-shot]").forEach(function(b){
    b.onclick = function(){ shoot(); };
  });
  el("panes").querySelectorAll(".pane").forEach(function(p){
    p.addEventListener("pointerdown", function(){
      var i = +p.dataset.i;
      if(i === LIVE) return;
      LIVE = i;
      el("panes").querySelectorAll(".pane").forEach(function(q){
        q.dataset.live = (+q.dataset.i === LIVE) ? 1 : 0;
      });
    }, true);
  });

  /* Dragging the divider. Widths are kept as flex ratios rather than pixels
     so rotating a board or plugging in a different screen keeps the split
     the teacher chose instead of leaving one pane 200px wide. */
  el("panes").querySelectorAll("[data-grip]").forEach(function(g){
    g.addEventListener("pointerdown", function(e){
      e.preventDefault();
      g.setPointerCapture(e.pointerId);
      var wrap = el("panes");
      var vertical = window.matchMedia("(max-width:900px)").matches;
      function move(ev){
        var r = wrap.getBoundingClientRect();
        var f = vertical ? (ev.clientY - r.top) / r.height
                         : (ev.clientX - r.left) / r.width;
        f = Math.min(0.85, Math.max(0.15, f));
        PANES[0].flex = f;
        PANES[1].flex = 1 - f;
        wrap.querySelectorAll(".pane").forEach(function(p, i){
          p.style.flex = (PANES[i].flex || 1) + " 1 0";
        });
      }
      function up(){
        g.removeEventListener("pointermove", move);
        g.removeEventListener("pointerup", up);
      }
      g.addEventListener("pointermove", move);
      g.addEventListener("pointerup", up);
    });
  });
}

/* A picture of whatever is on the screen, using the browser's own capture
   rather than a DOM-to-canvas library. It is the only way to get a true
   screenshot without shipping a dependency, it captures the 3D view and the
   writing space correctly where a DOM copy would not, and on a board it is
   one tap and a confirm. */
async function shoot(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    alert("This board's browser cannot take a screenshot. The writing " +
          "space has its own Save as picture button.");
    return;
  }
  var stream = null;
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: "browser" }, audio: false });
    var track = stream.getVideoTracks()[0];
    var v = document.createElement("video");
    v.srcObject = stream;
    v.muted = true;
    await v.play();
    /* One frame is enough, but the first one is often blank while the
       capture warms up. */
    await new Promise(function(r){ setTimeout(r, 320); });
    var st = track.getSettings ? track.getSettings() : {};
    var cv = document.createElement("canvas");
    cv.width = st.width || v.videoWidth || 1920;
    cv.height = st.height || v.videoHeight || 1080;
    cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
    var a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = "craxlearn-" + new Date().toISOString().slice(0,16)
                   .replace(/[:T]/g,"-") + ".png";
    a.click();
  }catch(e){
    /* Cancelling the picker is not an error worth a dialog. */
  }finally{
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
  }
}

/* ---------- room size ---------- */
/* Two sizes and a button, remembered per device. A teacher sets it once on
   the board in the room and once on their own laptop, and neither has to
   think about it again. Defaulting by screen width was tried on paper and
   is wrong: a smart board reports a perfectly ordinary 1920 wide and would
   have been given laptop type. */
function scale(next){
  var v = next || localStorage.getItem("cl_scale") || "board";
  document.documentElement.setAttribute("data-scale", v);
  localStorage.setItem("cl_scale", v);
  var b = el("scaleBtn");
  if(b) b.title = v === "board" ? "Board size — press for desk size"
                                : "Desk size — press for board size";
}

/* ---------- signing in with nothing but a class code ----------
 *
 * Two taps and no credential. A child types the code the teacher wrote on
 * the board, picks their own name off the register, and is in. There is
 * nothing to remember, nothing to reset, and nothing to leak — the account
 * behind it has a synthetic address and a password nobody has ever seen.
 *
 * The name list is the whole reason a teacher types a register first. Code
 * alone would give a teacher a queue of work from "Learner 4".
 */
function codeForm(){
  el("gateForm").innerHTML =
    '<input id="gCode" placeholder="Class code" autocapitalize="characters" ' +
      'autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em">' +
    '<button class="btn" id="gCodeGo">Find my class</button>';
  el("gCodeGo").onclick = findClass;
  el("gCode").onkeydown = function(e){ if(e.key === "Enter") findClass(); };
}

async function findClass(){
  var msg = el("gateMsg");
  var code = ((el("gCode") || {}).value || "").trim();
  if(code.length < 3){ msg.textContent = "Type the code your teacher gave you."; return; }
  msg.textContent = "Looking…";
  var d;
  try{ d = await api.post("/api/craxlearn/code", { code: code }); }
  catch(e){ msg.textContent = e.message; return; }

  if(!d.roster_ready){
    msg.textContent = "Your teacher has not put the class register in yet. " +
      "Ask them to add the names, then try again.";
    return;
  }
  if(!(d.names || []).length){
    msg.textContent = "Everybody on this register has already signed in. " +
      "If none of them is you, ask your teacher to add your name.";
    return;
  }
  msg.textContent = "";
  el("gateForm").innerHTML =
    '<p class="muted" style="margin-top:0">' + esc(d.class_name) +
      (d.school ? " · " + esc(d.school) : "") + " — tap your name.</p>" +
    '<div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,9rem),1fr))">' +
      d.names.map(function(n){
        return '<button class="tile" style="min-height:auto;padding:.8rem" ' +
          'data-claim="' + n.id + '"><b>' + esc(n.name) + "</b></button>";
      }).join("") +
    "</div>" +
    '<button class="btn ghost" id="gBack" style="margin-top:.8rem">← Different code</button>';

  el("gBack").onclick = function(){ el("gateMsg").textContent = ""; codeForm(); };
  el("gateForm").querySelectorAll("[data-claim]").forEach(function(b){
    b.onclick = async function(){
      el("gateMsg").textContent = "Signing you in…";
      try{
        await api.post("/api/craxlearn/claim",
                       { code: code, roster_id: +b.dataset.claim });
        await boot();
      }catch(e){

/* ---------- sign in ---------- */
function gateForm(mode){
  var up = mode === "up";
  el("gateForm").innerHTML =
    (up ? '<input id="gName" placeholder="Your name" autocomplete="name">' : "") +
    '<input id="gEmail" type="email" placeholder="Email" autocomplete="email">' +
    '<input id="gPass" type="password" placeholder="Password" ' +
      'autocomplete="' + (up ? "new-password" : "current-password") + '">' +
    (up ? '<input id="gCode" placeholder="School or class code (optional)">' : "") +
    '<button class="btn" id="gGo">' + (up ? "Create account" : "Sign in") + "</button>";
  el("gGo").onclick = function(){ submit(up); };
  el("gPass").onkeydown = function(e){ if(e.key === "Enter") submit(up); };
}

async function submit(up){
  var msg = el("gateMsg");
  msg.textContent = "…";
  var body = { email:(el("gEmail").value||"").trim(),
               password:el("gPass").value||"" };
  if(up) body.name = (el("gName").value||"").trim();
  try{
    await api.post(up ? "/api/auth/signup" : "/api/auth/login", body);
    var code = up && el("gCode") ? (el("gCode").value||"").trim() : "";
    if(code){
      /* A wrong code must not cost somebody the account they just made. */
      try{ await api.post("/api/class/join", { code:code }); }
      catch(e){ msg.textContent = "Signed in, but that code did not match: "
                                  + e.message; }
    }
    await boot();
  }catch(e){
    msg.textContent = e.message;
  }
}

/* ---------- a surface to write on ----------
 *
 * The thing a smart board is for. Everything else here is the platform
 * teaching; this is the teacher teaching, and a classroom display without
 * somewhere to write by hand is a television.
 *
 * Pointer events rather than mouse or touch, because a board is used with a
 * finger, a stylus and sometimes a mouse in the same lesson, and three
 * separate handlers is three chances for one of them to be the broken one.
 * Coalesced events are read where the browser offers them: a stylus reports
 * far faster than the screen repaints, and dropping those samples is what
 * makes handwriting look like a polygon.
 */
var PENS = [
  { name:"White", colour:"#e8eef6" }, { name:"Amber", colour:"#ff9933" },
  { name:"Green", colour:"#3fae6a" }, { name:"Red", colour:"#e05a5a" },
  { name:"Blue",  colour:"#5aa9e0" }
];

function write(){
  main().innerHTML =
    '<div class="eyebrow">Writing space</div>' +
    '<div class="card" style="padding:.7rem">' +
      '<div id="wTools" style="display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem">' +
        PENS.map(function(p, i){
          return '<button class="iconbtn" data-pen="' + i + '" title="' + p.name + '" ' +
            'style="background:' + p.colour + ';border-color:' + p.colour +
            ';width:2rem"></button>';
        }).join("") +
        '<button class="iconbtn" data-pen="erase" title="Rub out">⌫</button>' +
        '<input type="range" id="wSize" min="2" max="28" value="5" ' +
          'title="Thickness" style="width:7rem">' +
        '<span class="grow"></span>' +
        '<button class="btn ghost" id="wClear">Clear</button>' +
        '<button class="btn ghost" id="wShot">Save as picture</button>' +
      "</div>" +
      '<canvas id="wCanvas" style="width:100%;height:62vh;touch-action:none;' +
        'background:var(--panel2);border-radius:12px;display:block"></canvas>' +
      '<div class="muted" id="wMsg" style="margin-top:.4rem">' +
        "Write with a finger, a stylus or a mouse.</div>" +
    "</div>";

  var cv = el("wCanvas");
  var ctx = cv.getContext("2d");
  var pen = PENS[0].colour, size = 5, erasing = false, drawing = false;

  /* Sized to the device's real pixels, or a 4K board draws a blurry line
     over a stretched bitmap. Redrawn from a saved copy so resizing (or
     rotating the board) does not wipe what is on it. */
  function fit(){
    var keep = null;
    try{ keep = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null; }
    catch(e){ keep = null; }
    var r = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if(keep) try{ ctx.putImageData(keep, 0, 0); }catch(e){}
  }
  fit();
  window.addEventListener("resize", fit);

  function at(e){
    var r = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    return { x:(e.clientX - r.left) * dpr, y:(e.clientY - r.top) * dpr };
  }
  function stroke(from, to, e){
    ctx.globalCompositeOperation = erasing ? "destination-out" : "source-over";
    ctx.strokeStyle = pen;
    /* A stylus that reports pressure is used with it; everything else draws
       at the chosen thickness. */
    var p = (e && e.pressure && e.pointerType === "pen") ? e.pressure : 0.5;
    ctx.lineWidth = (erasing ? size * 3 : size) * (window.devicePixelRatio || 1)
                    * (0.6 + p * 0.8);
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  }

  var last = null;
  cv.addEventListener("pointerdown", function(e){
    drawing = true;
    last = at(e);
    cv.setPointerCapture(e.pointerId);
    stroke(last, { x:last.x + 0.01, y:last.y }, e);   // a dot is a mark too
  });
  cv.addEventListener("pointermove", function(e){
    if(!drawing) return;
    var pts = (e.getCoalescedEvents ? e.getCoalescedEvents() : null) || [e];
    for(var i = 0; i < pts.length; i++){
      var now_ = at(pts[i]);
      stroke(last, now_, pts[i]);
      last = now_;
    }
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function(ev){
    cv.addEventListener(ev, function(){ drawing = false; last = null; });
  });

  el("wTools").querySelectorAll("[data-pen]").forEach(function(b){
    b.onclick = function(){
      if(b.dataset.pen === "erase"){ erasing = true; return; }
      erasing = false;
      pen = PENS[+b.dataset.pen].colour;
    };
  });
  el("wSize").oninput = function(){ size = +el("wSize").value; };
  el("wClear").onclick = function(){
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, cv.width, cv.height);
  };
  /* A picture of what is on the board, which is what "screenshot" means in
     a classroom — the working, not the browser chrome around it. Drawn onto
     a solid background first, or a transparent PNG opens as black on black
     in half the apps a teacher will send it to. */
  el("wShot").onclick = function(){
    var out = document.createElement("canvas");
    out.width = cv.width;
    out.height = cv.height;
    var o = out.getContext("2d");
    o.fillStyle = "#0e1621";
    o.fillRect(0, 0, out.width, out.height);
    o.drawImage(cv, 0, 0);
    var a = document.createElement("a");
    a.href = out.toDataURL("image/png");
    a.download = "craxlearn-" + new Date().toISOString().slice(0, 16)
                   .replace(/[:T]/g, "-") + ".png";
    a.click();
    el("wMsg").textContent = "Saved as a picture.";
  };
}

/* Mount a 3D scene, and SAY SO when it cannot be mounted.
 *
 * three.js comes from a CDN. On a school network that blocks it — or a
 * board with no internet at that moment — the viewer silently never
 * appears, and an empty box reads as "this app is broken" rather than
 * "this board cannot reach the library". One is a support call about us;
 * the other is a five-minute conversation with the IT technician.
 */
async function show3D(host, scene){
  host.innerHTML = '<div class="muted" style="padding:1rem">Drawing…</div>';
  if(!window.Three3D || !Three3D.mount){
    host.innerHTML = '<div class="note bad">The 3D viewer could not load. ' +
      "It comes from a public CDN — this board may be offline or the " +
      "network may be blocking it. Everything else here still works.</div>";
    return false;
  }
  try{
    host.innerHTML = "";
    await Three3D.mount(host, scene);
    /* mount() can resolve without having drawn anything if the library
       itself failed to arrive. A canvas is the proof it worked. */
    if(!host.querySelector("canvas")) throw new Error("nothing was drawn");
    return true;
  }catch(e){
    host.innerHTML = '<div class="note bad">The 3D viewer could not draw ' +
      "this. It comes from a public CDN — this board may be offline or the " +
      "network may be blocking it.</div>";
    return false;
  }
}

/* ---------- any structure worth turning around ----------
 *
 * Only ones somebody measured. A name with nothing behind it says so rather
 * than showing a plausible arrangement of spheres with a real compound's
 * name under it — which is the failure this whole codebase is built to
 * avoid, and the one a class cannot possibly catch.
 */
async function structure(name){
  var n = (name || "").trim();
  main().innerHTML =
    '<div class="eyebrow">3D structures</div>' +
    '<div class="card"><div style="display:flex;gap:.5rem;flex-wrap:wrap">' +
      '<input id="stName" style="flex:1 1 14rem" value="' + esc(n) + '" ' +
        'placeholder="caffeine · silicon · graphene · haemoglobin · the solar system">' +
      '<button class="btn" id="stGo">Show it</button>' +
    '</div><div class="muted" id="stMsg" style="margin-top:.4rem">' +
      "Measured — from PubChem, the Protein Data Bank, or a published table. " +
      "Free to look at as many as you like.</div></div>" +
    '<div id="stHost" class="card" style="min-height:24rem;padding:.4rem"></div>';

  var run = async function(){
    var want = (el("stName").value || "").trim();
    if(want.length < 2) return;
    el("stMsg").textContent = "Looking…";
    el("stHost").innerHTML = "";
    try{
      var d = await api.get("/api/craxlearn/structure?name=" +
                            encodeURIComponent(want));
      el("stMsg").textContent = d.scene.caption || want;
      await show3D(el("stHost"), d.scene);
    }catch(e){
      el("stMsg").textContent = e.message;
    }
  };
  el("stGo").onclick = run;
  el("stName").onkeydown = function(e){ if(e.key === "Enter") run(); };
  if(n) run();
}

/* ---------- searching the open sources ---------- */
async function find(term){
  var t = (term || "").trim();
  main().innerHTML =
    '<div class="eyebrow">Search the sources</div>' +
    '<div class="card"><div style="display:flex;gap:.5rem;flex-wrap:wrap">' +
      '<input id="fq" style="flex:1 1 14rem" value="' + esc(t) + '" ' +
        'placeholder="a mitochondrion · Saturn · a titration">' +
      '<button class="btn" id="fGo">Search</button>' +
    '</div><div class="muted" id="fMsg" style="margin-top:.4rem">' +
      "Public catalogues only, with the licence beside each result.</div></div>" +
    '<div id="fOut"></div>';

  var run = async function(){
    var q = (el("fq").value || "").trim();
    if(q.length < 2) return;
    el("fMsg").textContent = "Searching…";
    el("fOut").innerHTML = "";
    var d;
    try{ d = await api.get("/api/craxlearn/search?q=" + encodeURIComponent(q)); }
    catch(e){ el("fMsg").textContent = e.message; return; }

    el("fMsg").textContent = d.found
      ? "From: " + (d.sources || []).join(", ")
      : "Nothing in the open catalogues for that. Try the plain name of the " +
        "thing rather than a question about it.";
    var h = "";
    if(d.photo){
      h += '<div class="card"><img src="' + esc(d.photo.url || "") +
        '" alt="" style="max-width:100%;border-radius:12px;display:block">' +
        '<div class="muted" style="margin-top:.5rem">' +
        esc(d.photo.title || "") +
        (d.photo.credit ? " · " + esc(d.photo.credit) : "") +
        (d.photo.licence ? " · " + esc(d.photo.licence) : "") + "</div></div>";
    }
    if(d.scene){
      h += '<div class="card" style="padding:.4rem"><div id="fScene" ' +
        'style="min-height:22rem"></div><div class="muted" style="padding:.4rem">' +
        esc(d.scene.caption || "") + "</div></div>";
    }
    el("fOut").innerHTML = h;
    if(d.scene) await show3D(el("fScene"), d.scene);
  };
  el("fGo").onclick = run;
  el("fq").onkeydown = function(e){ if(e.key === "Enter") run(); };
  if(t) run();
}

/* ---------- the courses, the lessons and the exams ----------
 *
 * Fetched once and kept. The curriculum is 19 tracks and 82 lessons of
 * mostly static text; re-fetching it every time somebody opens a lesson is
 * a megabyte a lesson on a school connection shared by thirty devices.
 */
var CURRICULUM = null;
async function curriculum(){
  if(CURRICULUM) return CURRICULUM;
  CURRICULUM = (await api.get("/api/curriculum")).tracks || [];
  return CURRICULUM;
}
var PROGRESS = {}, QUIZ_PASSED = {};
async function progress(){
  try{
    /* The endpoint answers {done:{slug:true}, code:{slug:"..."}, quiz:{...}},
       not a list of rows. Reading it as a list left every lesson looking
       unfinished and threw away saved lab work on the way. */
    var d = await api.get("/api/progress");
    PROGRESS = {};
    Object.keys(d.done || {}).forEach(function(slug){
      PROGRESS[slug] = { completed:true };
    });
    Object.keys(d.code || {}).forEach(function(slug){
      PROGRESS[slug] = PROGRESS[slug] || {};
      PROGRESS[slug].code = d.code[slug];
    });
    QUIZ_PASSED = d.quiz || {};
  }catch(e){ PROGRESS = {}; QUIZ_PASSED = {}; }
  return PROGRESS;
}

/* Python runs through Pyodide, JavaScript through the browser itself.
 * Both fail out loud: a lab that silently does nothing is a lesson a
 * learner decides is broken and skips. */
var PY = null, PY_FAILED = false;
async function pyodide(){
  if(PY) return PY;
  if(PY_FAILED) return null;
  try{
    if(!window.loadPyodide){
      await new Promise(function(res, rej){
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
        s.onload = res;
        s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    PY = await window.loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/" });
    return PY;
  }catch(e){ PY_FAILED = true; return null; }
}

async function runCode(lang, code){
  if(lang === "js"){
    var out = [];
    var log = console.log;
    console.log = function(){ out.push([].slice.call(arguments).join(" ")); };
    try{ new Function(code)(); }
    catch(e){ out.push(String(e)); }
    finally{ console.log = log; }
    return out.join("\n") || "(nothing printed)";
  }
  var py = await pyodide();
  if(!py){
    return "Python could not start on this board. It is downloaded from a " +
           "public CDN — this board may be offline or the network may be " +
           "blocking it.";
  }
  py.runPython("import sys, io\n_b = io.StringIO()\nsys.stdout = _b\nsys.stderr = _b");
  try{ py.runPython(code); }
  catch(e){ py.runPython("import traceback; traceback.print_exc()"); }
  return py.runPython(
    "sys.stdout = sys.__stdout__\nsys.stderr = sys.__stderr__\n_b.getvalue()")
    || "(nothing printed)";
}

/* ---------- PhET simulations ----------
 *
 * Embedded from PhET's own servers, so what a class runs is the current
 * published version and the CC BY licence is satisfied by pointing at the
 * original rather than copying it. The server has already checked that each
 * one answers, so nothing here can be a 404 on the board mid-lesson.

      '<div class="note bad">' + esc(d.note || "Nothing available.") + "</div>";
    return;
  }
  var subs = {};

  var chosen = pick || d.sims[0].id;
  var sim = d.sims.filter(function(s){ return s.id === chosen; })[0] || d.sims[0];

  main().innerHTML = '<div class="eyebrow">Simulations</div>' +
    '<div class="card" style="padding:.7rem">' +
      Object.keys(subs).sort().map(function(k){
        return '<div style="margin-bottom:.4rem"><span class="muted">' + esc(k) +
          "</span><br>" + subs[k].map(function(x){
            return '<button class="btn ' + (x.id === sim.id ? "" : "ghost") +
              '" data-sim="' + esc(x.id) + '" style="margin:.2rem .3rem 0 0">' +
              esc(x.title) + "</button>";
          }).join("") + "</div>";
      }).join("") +
    "</div>" +
    '<div class="card" style="padding:.3rem">' +
      '<iframe src="' + esc(sim.url) + '" title="' + esc(sim.title) + '" ' +
        'style="width:100%;height:62vh;border:0;border-radius:12px;' +
        'background:#000" allowfullscreen></iframe>' +
      '<div class="muted" style="padding:.4rem">' + esc(sim.title) + " · " +
        esc(d.licence) + ' · <a href="' + esc(sim.page) +
        '" target="_blank" rel="noopener">on PhET</a></div>' +
    "</div>";

  main().querySelectorAll("[data-sim]").forEach(function(b2){
    b2.onclick = function(){ phet(b2.dataset.sim); };

}

/* ---------- a calculator the back row can read ---------- */
function calc(){
  main().innerHTML =
    '<div class="eyebrow">Calculator</div>' +
    '<div class="card" style="max-width:26rem">' +
      '<input id="cIn" placeholder="12 * (3 + 4) - 2^5" ' +
        'style="width:100%;font-size:1rem;text-align:right" autocomplete="off">' +
      '<div id="cOut" class="big" style="text-align:right;margin:.6rem 0;' +
        'min-height:1.6rem;color:var(--accent)"></div>' +
      '<div class="muted" id="cErr"></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.7rem">' +
        ["7","8","9","/","4","5","6","*","1","2","3","-","0",".","(",")",
         "^","sqrt(","%","+"].map(function(k){
          return '<button class="btn ghost" data-k="' + k + '">' + k + "</button>";
        }).join("") +
        '<button class="btn ghost" data-k="back">←</button>' +
        '<button class="btn ghost" data-k="clear">C</button>' +
        '<button class="btn" data-k="eq" style="grid-column:span 2">=</button>' +
      "</div></div>" +
    '<div class="muted" style="max-width:26rem">Worked on the server with the ' +
      "same checker the lessons use, so it cannot run anything but arithmetic.</div>";

  var inp = el("cIn");
  function press(k){
    if(k === "clear"){ inp.value = ""; el("cOut").textContent = ""; el("cErr").textContent = ""; return; }
    if(k === "back"){ inp.value = inp.value.slice(0, -1); return; }
    if(k === "eq"){ run(); return; }
    inp.value += k;
    inp.focus();
  }
  async function run(){
    var expr = (inp.value || "").trim();
    if(!expr) return;
    el("cErr").textContent = "";
    try{
      var d = await api.post("/api/craxlearn/calc", { expression: expr });
      el("cOut").textContent = d.result;
    }catch(e){
      el("cOut").textContent = "";
      el("cErr").textContent = e.message;
    }
  }
  main().querySelectorAll("[data-k]").forEach(function(b){
    b.onclick = function(){ press(b.dataset.k); };
  });
  inp.onkeydown = function(e){ if(e.key === "Enter") run(); };
  inp.focus();
}

/* ---------- study material ----------
 *
 * One screen, two audiences. A student gets a list they can open; a teacher
 * gets the same list with a way to add to it and take things off it. Not two
 * pages, because material a teacher cannot see the way a student sees it is
 * material that turns out to be broken during a lesson.
 */
function pickClass(){
  /* Which class this screen is about. A learner is normally in one; a head
     teacher has several, so they choose. */
  var cls = ME.classes || [];
  if(!cls.length) return null;
  if(!ME.pickedClass || !cls.some(function(c){ return c.id === ME.pickedClass; })){
    ME.pickedClass = cls[0].id;
  }
  return ME.pickedClass;
}

function classPicker(onPick){
  var cls = ME.classes || [];
  if(cls.length < 2) return "";
  return '<select id="clsPick" style="margin-bottom:.8rem">' +
    cls.map(function(c){
      return '<option value="' + c.id + '"' +
        (c.id === ME.pickedClass ? " selected" : "") + ">" +
        esc(c.name) + "</option>";
    }).join("") + "</select>";
}

async function materials(){
  var cid = pickClass();
  if(!cid){
    main().innerHTML = '<div class="card muted">You are not in a class yet. ' +
      "Join one with a class code, or ask your teacher for one.</div>";
    return;
  }
  main().innerHTML = '<div class="muted">Loading…</div>';
  var d;
  try{ d = await api.get("/api/class/" + cid + "/materials"); }
  catch(e){ main().innerHTML = '<div class="note bad">' + esc(e.message) + "</div>"; return; }

  var h = '<div class="eyebrow">Study material</div>' + classPicker();
  if(!(d.materials || []).length){
    h += '<div class="card muted">Nothing here yet.</div>';
  }else{
    h += (d.materials).map(function(m){
      var open = m.kind === "link"
        ? '<a class="btn ghost" href="' + esc(m.url) + '" target="_blank" rel="noopener">Open the link</a>'
        : '<a class="btn ghost" href="/api/material/' + m.id + '/file" target="_blank">Open ' +
          esc(m.file_name || "the file") + "</a>";
      /* Subject and teacher on every card. A reading list from nobody in
         particular leaves a class not knowing whose lesson it is for or
         which teacher to ask about it. */
      var meta = [m.subject, m.by ? "put up by " + m.by : "",
                  (m.at || "").slice(0, 10)].filter(Boolean).join(" · ");
      return '<div class="card"><b>' + esc(m.title) + "</b>" +
        (meta ? '<div class="muted" style="margin-top:.2rem">' + esc(meta) + "</div>" : "") +
        (m.note ? '<div class="muted" style="margin:.35rem 0">' + esc(m.note) + "</div>" : "") +
        '<div style="margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">' +
          open +
          (m.size ? '<span class="muted">' + Math.max(1, Math.round(m.size/1000)) + " KB</span>" : "") +
          (isTeacher() ? '<button class="btn ghost" data-delmat="' + m.id + '">Remove</button>' : "") +
        "</div></div>";
    }).join("");
  }

  if(isTeacher()){
    h += '<div class="eyebrow">Add something</div>' +
      '<div class="card"><b>A link</b>' +
        '<input id="mTitle" placeholder="What is it called" style="width:100%;margin:.5rem 0">' +
        '<input id="mSubject" placeholder="Subject — Science, Maths…" style="width:100%;margin-bottom:.5rem">' +
        '<input id="mUrl" placeholder="https://…" style="width:100%;margin-bottom:.5rem">' +
        '<input id="mNote" placeholder="Why they should read it (optional)" style="width:100%;margin-bottom:.5rem">' +
        '<button class="btn" id="mAdd">Add the link</button>' +
        ' <span class="muted" id="mMsg"></span>' +
      "</div>" +
      '<div class="card"><b>A file</b>' +
        '<div class="muted" style="margin:.35rem 0">PDF, PowerPoint, Word, ' +
          "text or an image. Up to 12 MB — link to anything bigger.</div>" +
        '<input type="file" id="mFile" style="width:100%;margin-bottom:.5rem" ' +
          'accept=".pdf,.ppt,.pptx,.doc,.docx,.txt,.png,.jpg,.jpeg,.webp">' +
        '<input id="mFTitle" placeholder="What is it called (optional)" style="width:100%;margin-bottom:.5rem">' +
        '<input id="mFSubject" placeholder="Subject — Science, Maths…" style="width:100%;margin-bottom:.5rem">' +
        '<button class="btn" id="mUp">Upload it</button>' +
        ' <span class="muted" id="mFMsg"></span>' +
      "</div>";
  }
  main().innerHTML = h;

  var pick = el("clsPick");
  if(pick) pick.onchange = function(){ ME.pickedClass = +pick.value; materials(); };

  main().querySelectorAll("[data-delmat]").forEach(function(b){
    b.onclick = async function(){
      try{ await api.del("/api/teacher/material/" + b.dataset.delmat); materials(); }
      catch(e){ alert(e.message); }
    };
  });

  var add = el("mAdd");
  if(add) add.onclick = async function(){
    el("mMsg").textContent = "Adding…";
    try{
      await api.post("/api/teacher/class/" + cid + "/material/link", {
        title: el("mTitle").value || "", url: el("mUrl").value || "",
        subject: el("mSubject").value || "",
        note: el("mNote").value || "" });
      materials();
    }catch(e){ el("mMsg").textContent = e.message; }
  };

  var up = el("mUp");
  if(up) up.onclick = async function(){
    var f = (el("mFile").files || [])[0];
    if(!f){ el("mFMsg").textContent = "Choose a file first."; return; }
    el("mFMsg").textContent = "Uploading…";
    var fd = new FormData();
    fd.append("file", f);
    fd.append("title", el("mFTitle").value || "");
    fd.append("subject", el("mFSubject").value || "");
    /* Sent with fetch directly rather than through api.post: this is
       multipart, and setting Content-Type by hand strips the boundary the
       browser generates, which the server then cannot parse. */
    try{
      var r = await fetch("/api/teacher/class/" + cid + "/material/file",
                          { method:"POST", credentials:"same-origin", body:fd });
      var data = null;
      try{ data = await r.json(); }catch(err){}
      if(!r.ok) throw new Error((data && data.detail) || "Upload failed");
      materials();
    }catch(e){ el("mFMsg").textContent = e.message; }
  };
}

/* ---------- routing ---------- */
/* go() opens a page in the live space; paint() draws one that is already
   chosen. Splitting them is what lets a space be redrawn — after a refresh,
   after a resize — without it stealing focus from the other one. */
function go(page, arg){
  PANES[LIVE] = { page:page, arg:arg, flex: PANES[LIVE].flex };
  VIEW.page = page;
  window.S.view = VIEW;
  DRAW = LIVE;
  var head = document.querySelector('[data-pick="' + LIVE + '"]');
  if(head && TOOL_NAMES[page]) head.value = page;
  paint(page, arg);
}

function paint(page, arg){
  var m = main();
  if(m) m.scrollTop = 0;
  /* Every branch RETURNS, so an async page's promise reaches drawPane and
     DRAW keeps pointing at this space until it has finished writing. */
  if(page === "home")           return home();
  else if(page === "activity")  return activity();
  else if(page === "sources")   return sources();
  else if(page === "inbox")     return inbox();
  else if(page === "materials") return materials();
  else if(page === "write")     return write();
  else if(page === "calc")      return calc();
  else if(page === "roll")      return roll();
  else if(page === "student")   return student(arg);
  else if(page === "roster")    return roster();
  else if(page === "assignment") return assignment(arg);
  else if(page === "review")    return review(arg && arg.aid, arg && arg.sid);
  else if(page === "board")     return board(arg);
  else if(page === "net"       && window.renderNet)      return window.renderNet();
  else if(page === "lab"       && window.renderLab)      return window.renderLab();
  else if(page === "sqlboard"  && window.renderSqlBoard) return window.renderSqlBoard();
  else if(page === "structure") return structure(arg);
  else if(page === "find")      return find(arg);
  else if(page === "phet")      return phet(arg);
  else if(page === "tracks")    return tracks();
  else if(page === "track")     return track(arg);
  else if(page === "lesson")    return lesson(arg);
  else if(page === "exam")      return exam(arg);
  else if(page === "scan" && window.renderScanner) return window.renderScanner();
  return home();
}
window.render = function(){ paint(VIEW.page, null); };

document.addEventListener("click", function(e){
  var t = e.target;
  if(!t.closest) return;
  var b;
  if((b = t.closest("[data-asg]")))    return go("assignment", b.dataset.asg);
  if((b = t.closest("[data-review]"))) return go("review",
      { aid:b.dataset.review, sid:b.dataset.student });
  if((b = t.closest("[data-teach]")))  return go("board", b.dataset.teach);
  if((b = t.closest("[data-go]")))     return go(b.dataset.go);
});

/* ---------- boot ---------- */
/* One place that knows what work exists, refreshed after anything that
   changes it. A page that painted its counts once and never again is a
   teacher who hands work back and still sees "3 waiting" until they reload,
   and then stops trusting the number. */
async function refreshMe(){
  if(!ME) return;
  if(isTeacher()){
    try{ ME.inbox = await api.get("/api/teacher/inbox"); }
    catch(e){ ME.inbox = { total:0, waiting:[] }; }
  }
  /* A teacher can also be enrolled somewhere as a learner, and a head
     teacher's own classes come back here too — so this runs for everybody
     rather than in an else. */
  try{ ME.standing = await api.get("/api/craxlearn/standing"); }
  catch(e){ ME.standing = null; }
  try{
    var mine = await api.get("/api/class/mine");
    var flat = [];
    (mine.classes || []).forEach(function(c){
      (c.assignments || []).forEach(function(a){
        flat.push(Object.assign({ class_name:c.name }, a));
      });
    });
    /* Not handed in first, then by due date. The list is a to-do list, so
       the thing that is still to do belongs at the top of it. */
    flat.sort(function(x, y){
      if(!!x.done !== !!y.done) return x.done ? 1 : -1;
      return String(x.due_date || "9999").localeCompare(String(y.due_date || "9999"));
    });
    ME.assignments = flat;
  }catch(e){ ME.assignments = []; }
}

async function boot(){
  try{
    ME = await api.get("/api/craxlearn/me");
  }catch(err){
    ME = null;
  }
  if(ME) await refreshMe();
  var signedIn = !!ME;
  el("gate").hidden = signedIn;
  el("app").hidden = !signedIn;
  if(!signedIn){
    el("who").innerHTML = "";
    /* The class code first, because it is the one most people arriving here
       are holding. An email box in front of a nine-year-old with a code in
       their hand is a wrong turn they take before they read the tabs. */
    tab("Code");
    return;
  }
  el("who").innerHTML = "<b>" + esc(ME.user.name) + "</b>" +
    esc(ME.institution ? ME.institution.name : (ME.role || "learner"));
  PANES = [{ page:"home", arg:null }];
  LIVE = 0;
  paintPanes();
}

function tab(which){
  ["Code","In","Up"].forEach(function(t){
    el("tab" + t).setAttribute("aria-selected", String(t === which));
  });
  el("gateMsg").textContent = "";
  if(which === "Code") codeForm();
  else gateForm(which === "Up" ? "up" : "in");
}
el("tabCode").onclick = function(){ tab("Code"); };
el("tabIn").onclick   = function(){ tab("In"); };
el("tabUp").onclick   = function(){ tab("Up"); };
el("homeBtn").onclick = function(){ go("home"); };
el("shotBtn").onclick = function(){ shoot(); };
/* One press adds a space, up to four; the fifth press goes back to one.
   A cycle rather than separate add and remove buttons, because a board is
   operated mid-sentence and one button you press again is easier to
   explain than two you have to choose between. The space that was live is
   the one kept when it wraps — it is what the teacher was working in. */
el("splitBtn").onclick = function(){
  if(PANES.length >= MAX_PANES){
    PANES = [{ page: PANES[LIVE].page, arg: PANES[LIVE].arg }];
    LIVE = 0;
  }else{
    PANES = PANES.map(function(p){
      return { page:p.page, arg:p.arg, flex:1 };
    });
    PANES.push({ page: PANES.length === 1 ? "write" : "home",
                 arg: null, flex: 1 });
    LIVE = PANES.length - 1;
  }
  el("splitBtn").title = PANES.length >= MAX_PANES
    ? "Back to one space" : "Open another space (" + PANES.length + " of 4)";
  paintPanes();
};
el("scaleBtn").onclick = function(){
  scale(document.documentElement.getAttribute("data-scale") === "board"
        ? "desk" : "board");
};
el("outBtn").onclick = async function(){
  try{ await api.post("/api/auth/logout"); }catch(e){}
  ME = null;
  boot();
};

/* Installable on the board itself. A browser only offers "install" for a
   page with a manifest AND a service worker, and an icon on the smart
   board's home screen is the difference between a teacher opening this and
   opening whatever was already on the screen.

   Registered last and failure is ignored: an install prompt is a nicety and
   nothing here should stop the app working without one. */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/craxlearn-sw.js").catch(function(){});
  });
}

/* Chromium hides its own install button on a smart board often enough that
   a teacher never finds it, so the prompt is offered on ours. */
var deferredInstall = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstall = e;
  var b = el("installBtn");
  if(b) b.hidden = false;
});
(function(){
  var b = el("installBtn");
  if(!b) return;
  b.onclick = async function(){
    if(!deferredInstall) return;
    deferredInstall.prompt();
    try{ await deferredInstall.userChoice; }catch(e){}
    deferredInstall = null;
    b.hidden = true;
  };
})();

scale();
boot();
})();
</script>
</body>
</html>
