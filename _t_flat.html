<!doctype html><meta charset="utf-8"><title>Flat layout</title>
<style>body{font-family:system-ui;max-width:700px;margin:20px auto}
.lbl{font-weight:600;margin:12px 0 4px}input{width:100%;padding:8px}</style>
<form id="f">
 <div class="lbl">Email Address*</div><input id="em">
 <div class="lbl">Address Line</div><input id="ad">
 <div class="lbl">Phone*</div><input id="ph">
 <div class="lbl">City</div><input id="ci">
 <div class="lbl">LinkedIn</div><input id="li">
 <div class="lbl">Emergency Contact Phone</div><input id="trap1">
 <div class="lbl">Confirm Email</div><input id="trap2">
 <button type="submit">Submit</button>
</form>
<script>window.__submitted=false;
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();window.__submitted=true;});</script>
