# Alembic configuration.
#
# There is deliberately NO sqlalchemy.url here. The connection string comes
# from DATABASE_URL at runtime (see migrations/env.py). A URL committed to
# this file is a credential in the repository and a second source of truth
# about which database is being migrated, and the second one is always the
# one somebody points at production by accident.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
